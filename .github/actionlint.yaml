# actionlint configuration for this repository.
#
# Self-hosted labels actionlint should accept in `runs-on:`. These are the
# runner pools in the InboxxHQ-CoderAxis org (inboxxhq-infra:
# ci-workflows-runner/runner-deployment.yaml today, modules/arc-runners scale
# sets next). The reusable workflow_call files here run in the org repositories
# that call them, so they target these pools by the single label; this
# repository's own workflows (ci.yaml, release.yaml) stay on ubuntu-latest.
#
# Both organizations run scale sets under these names (inboxxhq-infra
# modules/arc-runners: InboxxHQ-CoderAxis in arc-runners, CoderAxis in
# arc-runners-coderaxis), so a reusable workflow names the label plainly
# whichever owner calls it. The lanes that declare `services:` stay on
# ubuntu-latest until the pools run a container mode.
self-hosted-runner:
  labels:
    - inboxxhq-ci
    - inboxxhq-deploy
