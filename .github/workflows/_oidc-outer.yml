name: OIDC claims (outer)

# Diagnostic only, deleted once the question it answers is closed. See _oidc-claims.yml for why.
#
# This is the level a service repo calls directly, mirroring how a thin ci.yml calls service-ci.yml.
# It dumps its own claims and also calls _oidc-claims.yml, so a single run shows what
# `job_workflow_ref` reports for a job defined at the entry point versus one defined in a nested
# callee - the exact shape of service-ci.yml calling deploy-reusable.yml.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  direct:
    name: Claims at nesting depth 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Print selected OIDC claims
        env:
          LEVEL: "DEPTH 1 (job defined in _oidc-outer.yml, called by the service repo)"
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" > /tmp/idtok.json
          python3 - <<'PY'
          import base64, json, os
          tok = json.load(open("/tmp/idtok.json"))["value"]
          payload = tok.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          c = json.loads(base64.urlsafe_b64decode(payload))
          print(os.environ["LEVEL"])
          for k in ("sub", "aud", "repository", "repository_id", "repository_owner",
                    "repository_owner_id", "workflow_ref", "job_workflow_ref",
                    "job_workflow_sha", "event_name", "ref", "runner_environment"):
              print(f"  {k} = {c.get(k)!r}")
          PY
          rm -f /tmp/idtok.json

  nested:
    name: Delegate to the nested level
    uses: coderaxis/github-actions/.github/workflows/_oidc-claims.yml@v1
    permissions:
      contents: read
      id-token: write
