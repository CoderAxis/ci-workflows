name: Probe service-ci callability

# Diagnostic only, dispatch-only, deleted once the question it answers is closed.
#
# Established so far: auth-core's thin ci.yml and this probe both fail with startup_failure, so the
# fault is in service-ci.yml rather than any service repo's caller. Static validation is exhausted -
# every called workflow exists at v1, every required input and secret is supplied, the job graph and
# all needs/outputs references resolve, no duplicate keys, all inputs typed, all workflow_call
# outputs map to real job outputs, and actionlint with calls rewritten to local paths (which makes
# it validate the interfaces it skips for remote refs) is clean.
#
# So this bisects instead. deploy-reusable.yml is the prime suspect: it is the only nested callee
# with workflow-level outputs and more than one job, and it is the only one whose own graph
# service-ci cannot influence. Each job below calls one nested workflow directly, so the first
# dispatch that starts cleanly narrows the fault by elimination.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which nested workflow to probe"
        required: true
        type: choice
        options:
          - deploy-reusable
          - event-handling-compliance
          - seed-contract-check
          - schema-compatibility
          - dockerfile-standard
          - service-ci

permissions:
  contents: read

jobs:
  deploy-reusable:
    if: inputs.target == 'deploy-reusable'
    uses: coderaxis/github-actions/.github/workflows/deploy-reusable.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      service_name: auth-service
    secrets:
      CODERAXIS_APP_ID: ${{ secrets.CODERAXIS_APP_ID }}
      CODERAXIS_APP_PRIVATE_KEY: ${{ secrets.CODERAXIS_APP_PRIVATE_KEY }}

  event-handling-compliance:
    if: inputs.target == 'event-handling-compliance'
    uses: coderaxis/github-actions/.github/workflows/event-handling-compliance.yml@v1
    with:
      role: P

  seed-contract-check:
    if: inputs.target == 'seed-contract-check'
    uses: coderaxis/github-actions/.github/workflows/seed-contract-check.yml@v1

  schema-compatibility:
    if: inputs.target == 'schema-compatibility'
    uses: coderaxis/github-actions/.github/workflows/schema-compatibility.yml@v1

  dockerfile-standard:
    if: inputs.target == 'dockerfile-standard'
    uses: coderaxis/github-actions/.github/workflows/dockerfile-standard.yml@v1
    with:
      capabilities: http-api

  service-ci:
    if: inputs.target == 'service-ci'
    uses: coderaxis/github-actions/.github/workflows/service-ci.yml@v1
    permissions:
      contents: read
      security-events: write
      id-token: write
    secrets:
      CODERAXIS_APP_ID: ${{ secrets.CODERAXIS_APP_ID }}
      CODERAXIS_APP_PRIVATE_KEY: ${{ secrets.CODERAXIS_APP_PRIVATE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
