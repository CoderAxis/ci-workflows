name: Cascade reconcile (reusable)

# The repair half of the release cascade. module-release.yaml bumps a release's consumers ONCE, from
# the artifact graph, at release time; this finds every consumer that is still behind - from the
# go.mod and .frontend-core-ref actually committed on each default branch - and bumps it again with
# the same gates. scripts/cascade_reconcile.py says what it repairs and why each case happens.
#
# Called on a schedule by a thin caller of the same name in coderaxis/core-docs, the catalog's own
# repository. Not from here: this repository is public, and the self-hosted runner group the bump
# jobs need does not admit public repositories (the first dispatch from here failed at start-up).
# It is a reusable workflow, called at @v1, because the release bot's trust policy admits jobs by
# job_workflow_ref, which names the file a job is DEFINED in at the ref it was called with: a job
# defined here and called at v1 is "cascade-reconcile.yaml@refs/tags/v1", the exact string
# environments/management/ci-identity lists. Renaming this file revokes that grant.
#
# Gentle by design: the bump jobs run on the same self-hosted pool as every service's CI, so the
# matrix is capped (max_parallel) and a run never cancels another. A consumer whose bump fails its
# gates is retried on the next run; it fails loudly here until the core or the consumer is fixed.
#
# The same run also repairs the rest of every go.mod: scripts/vuln_reconcile.py looks the fleet's
# third-party module versions and Go versions up in the Go vulnerability database (one query, no
# clone, no build) and plans one bump per repository that moves each vulnerable module to the
# lowest release fixing it. Those bumps run through the same bump job and bump-module-pin, so the
# release bot's reach does not grow: the same writes, to the same consumers. Before this, a new
# advisory turned service-ci's vulnerabilities job red, the image was never built, and every
# repository waited for a person to bump it by hand (2026-10-09, 10-29, 11-07, 11-23).

on:
  workflow_call:
    inputs:
      catalog_owner:
        description: "Account owning the catalog repo."
        required: false
        type: string
        default: coderaxis
      catalog_repo:
        description: "Repository holding the artifact graph."
        required: false
        type: string
        default: coderaxis/core-docs
      catalog_ref:
        description: "Ref of the catalog repo."
        required: false
        type: string
        default: main
      consumer_owners:
        description: "Accounts whose repositories the graph names, for the read tokens."
        required: false
        type: string
        default: "InboxxHQ-CoderAxis"
      only:
        description: "Space-separated graph node names to limit the run to (blank = every consumer)."
        required: false
        type: string
        default: ""
      max_parallel:
        description: "Bump jobs at once. Each runs the consumer's build and unit/contract suites."
        required: false
        type: number
        default: 2
      dry_run:
        description: "Plan and report only; open no pull request and dispatch nothing."
        required: false
        type: boolean
        default: false
      fix_vulnerabilities:
        description: "Also plan a bump for every module or Go version with a known, released vulnerability fix."
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: cascade-reconcile
  cancel-in-progress: false

jobs:
  plan:
    name: Plan - who is behind
    runs-on: inboxxhq-ci
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      bumps: ${{ steps.merge.outputs.bumps }}
      frontends: ${{ steps.merge.outputs.frontends }}
    steps:
      - name: Mint read tokens for the catalog and every consumer owner
        id: read
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: ${{ inputs.catalog_owner }}
          extra-owners: ${{ inputs.consumer_owners }}

      - name: Check out the artifact graph
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.catalog_repo }}
          ref: ${{ inputs.catalog_ref }}
          token: ${{ steps.read.outputs.token }}
          path: .reconcile-catalog
          sparse-checkout: generated/artifact-graph

      - name: Check out the planner
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .reconcile-central
          sparse-checkout: scripts

      - name: Plan
        id: plan
        env:
          TOKENS_FILE: ${{ steps.read.outputs.tokens-file }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/reconcile"
          python3 .reconcile-central/scripts/cascade_reconcile.py \
            --graph .reconcile-catalog/generated/artifact-graph/artifact-graph.generated.json \
            --tokens "${TOKENS_FILE}" --out "${out}" --only "${ONLY}"
          cat "${out}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          echo '[]' > "${out}/vulns.json"
          echo "out=${out}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@v5
        if: ${{ inputs.fix_vulnerabilities }}
        with:
          go-version: stable
          cache: false

      # The same scanner service-ci's vulnerabilities job installs, so both read one database the
      # same way. Query mode needs no module source: the planner hands it module@version strings.
      - name: Plan vulnerability fixes
        if: ${{ inputs.fix_vulnerabilities }}
        env:
          TOKENS_FILE: ${{ steps.read.outputs.tokens-file }}
          ONLY: ${{ inputs.only }}
          OUT: ${{ steps.plan.outputs.out }}
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          python3 .reconcile-central/scripts/vuln_reconcile.py \
            --graph .reconcile-catalog/generated/artifact-graph/artifact-graph.generated.json \
            --tokens "${TOKENS_FILE}" --out "${OUT}" --only "${ONLY}" \
            --govulncheck "$(go env GOPATH)/bin/govulncheck"
          cat "${OUT}/vulns.md" >> "${GITHUB_STEP_SUMMARY}"

      # One matrix for both, because a matrix cannot be fed from two outputs. GitHub refuses a
      # matrix of more than 256 jobs outright, which would bump nothing at all, so a run takes the
      # first 250 rows (platform bumps first) and the next run, six hours later, takes the rest.
      - name: Hand the bumps to the bump job
        id: merge
        env:
          OUT: ${{ steps.plan.outputs.out }}
        run: |
          set -euo pipefail
          all="$(jq -c -s 'add' "${OUT}/bumps.json" "${OUT}/vulns.json")"
          n="$(jq length <<<"${all}")"
          if (( n > 250 )); then
            echo "::warning::${n} bumps planned; this run takes 250 and the next run the rest"
            all="$(jq -c '.[0:250]' <<<"${all}")"
          fi
          {
            echo "bumps=${all}"
            echo "frontends=$(cat "${OUT}/frontends.json")"
          } >> "${GITHUB_OUTPUT}"

  bump:
    name: Bump ${{ matrix.name }}
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.bumps != '[]' }}
    runs-on: inboxxhq-ci
    timeout-minutes: 90 # x3 for the self-hosted runners on the dev Docker host, as module-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bumps) }}
    steps:
      - name: Split the target into owner and repo
        id: t
        env:
          TARGET: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          { echo "owner=${TARGET%%/*}"; echo "repo=${TARGET##*/}"; } >> "${GITHUB_OUTPUT}"

      - name: Mint release-bot token for this target
        id: bottoken
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: publish
          owner: ${{ steps.t.outputs.owner }}
          repositories: ${{ steps.t.outputs.repo }}

      - name: Check out the consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          token: ${{ steps.bottoken.outputs.token }}
          path: consumer
          fetch-depth: 0

      - name: Bump every lagging pin and open the PR
        uses: coderaxis/ci-workflows/bump-module-pin@v1
        with:
          target-repository: ${{ matrix.repository }}
          target-path: consumer
          module: ${{ matrix.module }}
          version: ${{ matrix.version }}
          short: ${{ matrix.short }}
          companions: ${{ matrix.companions }}
          token: ${{ steps.bottoken.outputs.token }}
          service: ${{ matrix.service }}
          repo-kind: ${{ matrix.kind }}
          required-modules: ${{ toJSON(matrix.requires) }}
          note: ${{ matrix.note }}

  frontends:
    name: Re-announce frontend-core to ${{ matrix.name }}
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.frontends != '[]' }}
    runs-on: inboxxhq-ci
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.frontends) }}
    steps:
      - name: Split the target into owner and repo
        id: t
        env:
          TARGET: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          { echo "owner=${TARGET%%/*}"; echo "repo=${TARGET##*/}"; } >> "${GITHUB_OUTPUT}"

      - name: Mint release-bot token for this target
        id: bottoken
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: publish
          owner: ${{ steps.t.outputs.owner }}
          repositories: ${{ steps.t.outputs.repo }}

      # The same event content-fanout.yaml sends on every frontend-core push; the consumer's
      # bump-core-modules workflow moves .frontend-core-ref, builds, and auto-merges when green.
      - name: Dispatch frontend-core-updated at the current tip
        env:
          GH_TOKEN: ${{ steps.bottoken.outputs.token }}
          TARGET: ${{ matrix.repository }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          jq -n --arg sha "${SHA}" \
            '{event_type: "frontend-core-updated", client_payload: {artifact: "frontend-core", sha: $sha}}' \
          | gh api "repos/${TARGET}/dispatches" --method POST --input -
          echo "dispatched frontend-core-updated ${SHA:0:8} to ${TARGET}"

  report:
    name: Report
    needs: [plan, bump, frontends]
    if: always()
    runs-on: inboxxhq-ci
    timeout-minutes: 15
    steps:
      - name: Fail when a consumer could not be brought up to date
        env:
          PLAN: ${{ needs.plan.result }}
          BUMP: ${{ needs.bump.result }}
          FRONTENDS: ${{ needs.frontends.result }}
        run: |
          set -euo pipefail
          echo "plan=${PLAN} bump=${BUMP} frontends=${FRONTENDS}"
          for r in "${PLAN}" "${BUMP}" "${FRONTENDS}"; do
            if [[ "${r}" != "success" && "${r}" != "skipped" ]]; then
              echo "::error::at least one consumer is still behind the newest platform release or" \
                   "still pins a vulnerable module; the failed job names it and its gate output says why"
              exit 1
            fi
          done
