# Self-check for the App-token broker (ADR-0110).
#
# This guard exists because both failure modes are silent. If the trust policy
# stopped admitting central workflows, CI would fail loudly and someone would fix
# it. But if it started admitting ANYTHING — a wildcard widened, job_workflow_ref
# dropped, the tag condition removed — nothing would fail, and the platform's most
# powerful credential would be reachable from any workflow in the estate. So the
# negative case is asserted on every change, not just the positive one.
name: ci-app-token-guard

on:
  push:
    paths:
      - "ci-app-token/**"
      - ".github/workflows/ci-app-token-guard.yml"
  pull_request:
    paths:
      - "ci-app-token/**"
      - ".github/workflows/ci-app-token-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-app-token-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A job defined HERE carries job_workflow_ref of this guard workflow, which the
  # read role's allowlist covers (the whole central workflow directory at @v1).
  admits-central:
    name: Admits a job defined in a central workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Mint a read-scoped token
        id: tok
        uses: ./ci-app-token
        with:
          scope: read
          owner: coderaxis
          repositories: auth-core

      - name: The token must actually work
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail
          # Proves the credential is real and correctly scoped, rather than just
          # non-empty: a token minted for the wrong installation would still be a
          # plausible-looking string.
          slug=$(gh api /repos/coderaxis/auth-core --jq '.full_name')
          [ "$slug" = "coderaxis/auth-core" ] || { echo "::error::unexpected repo: $slug"; exit 1; }
          echo "read token works and resolves coderaxis/auth-core"

      - name: A read token must NOT be able to write
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -uo pipefail
          # The read App has no write scope. If this ever succeeds, the two Apps
          # have been conflated and the read/publish split is no longer real.
          if gh api -X POST /repos/coderaxis/auth-core/git/refs \
               -f ref=refs/heads/ci-app-token-guard-should-fail \
               -f sha=0000000000000000000000000000000000000000 >/dev/null 2>&1; then
            echo "::error::a read-scoped token was able to create a ref"
            exit 1
          fi
          echo "read token correctly cannot write"

  # The real negative case. This job requests the PUBLISH scope from a workflow
  # that is deliberately NOT on the publishing allowlist (only module-release and
  # module-bump are). It must be refused by AWS.
  refuses-unlisted-workflow:
    name: Refuses publish scope from a non-publishing workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Requesting publish from here must be denied
        id: attempt
        continue-on-error: true
        uses: ./ci-app-token
        with:
          scope: publish
          owner: coderaxis

      - name: Assert it was denied
        run: |
          set -euo pipefail
          if [ "${{ steps.attempt.outcome }}" = "success" ]; then
            echo "::error::this workflow is not on the publishing allowlist yet it obtained a publish token."
            echo "::error::job_workflow_ref scoping on inboxxhq-ci-app-token-publish is not being enforced."
            exit 1
          fi
          echo "publish scope correctly denied to a non-publishing workflow"
