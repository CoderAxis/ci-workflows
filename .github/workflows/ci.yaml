name: CI

# This repository's own self-tests, in the one lane WFC-0006 permits.
#
# Seven separate guard workflows used to live beside the eight reusable workflows this repository
# PUBLISHES. Only the published eight are exempt from the lane allowlist, and the exemption is a
# GitHub constraint rather than a concession: a reusable workflow resolves only at
# `<owner>/<repo>/.github/workflows/<file>@<ref>`, so it has to live where it is published from.
# A guard has no such constraint - it is an ordinary lane that happened to have its own file - so
# the seven are jobs here, and the platform repository now satisfies the control it enforces on the
# other 97 repositories rather than exempting itself from it.
#
# They stay SEPARATE JOBS on purpose. Each one is the executable form of a different control
# catalog, and folding them together would replace seven independent verdicts with one, so a red
# run would no longer say which control stopped holding.
#
# There are deliberately NO `paths:` filters. Each guard used to carry its own, which meant the
# centralization self-check ran only when the checker or its fixtures changed - so a workflow file
# added anywhere else in this directory would not have triggered the control written to catch
# exactly that. A self-test suite that can be skipped by editing the right file is the failure mode
# these guards exist to prevent, so the whole suite runs on every push and every pull request.

on:
  push: {}
  pull_request: {}
  # Daily, for the release-drift job below. Drift here is caused by something NOT happening, so it
  # is invisible to an event-driven trigger: no push means no run means nobody is told that the
  # fleet has been running week-old central logic.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # `head_ref || ref` collapses a pull request's push and pull_request events onto one group, so a
  # branch has a single in-flight run rather than two racing ones.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── central scripts (was central-scripts-guard.yaml) ────────────────────────────────────────
  # service-ci.yaml runs several checkers from scripts/ against every repository in the fleet, which
  # makes a bug in one of them a fleet-wide event in both directions: a false negative turns a gate
  # into decoration, and a false positive fails builds for a reason the owning team cannot act on.
  # Neither shows up in the checker's own repository, because nothing here is what it runs against.
  #
  # The scripts already covered elsewhere are deliberately not repeated:
  #   resolve_service_identity.py, check_module_pins.py -> release-cascade job
  #   check-delivery-model.py                           -> delivery-model job
  #   check-workflow-centralization.py                  -> workflow-centralization job
  # This job covers the rest, and new central checkers should arrive with a self-test here.
  central-scripts-uuid-policy:
    name: Central scripts - UUID version policy precision and recall
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install guard dependencies
        run: python3 -m pip install --upgrade PyYAML

      # Recall is pinned by control id AND line on the three defects that actually shipped: the
      # UUIDv5 supplied as an outbox event_id, the mustUUIDv7 stub that ignored its arguments, and
      # the v4 on an event id spelled `ID` that only its type's EventID() accessor identifies.
      # Precision is pinned harder: the conformant fixture must produce ZERO findings, because it is
      # a catalogue of the places a non-v7 UUID is legitimately fine (the ADR-0035 Idempotency-Key
      # header, ids the standard declines to version, vendor ids, seeded constants, a deriver with a
      # fresh fallback, a declared exception, a test file, and domain entity ids). A gate that cries
      # wolf gets switched off.
      - name: Fixtures pin both detection and the false-positive rate
        run: python3 scripts/test_uuid_version_policy.py

      # The analyser's own unit tests, and the negative case is the point of them: a plain `ID` field
      # on a domain struct must produce no sink fact at all. Adding `ID` as a sink field NAME instead
      # of inferring it from the type's EventID() accessor was measured at 613 findings across the
      # fleet, nearly all of them entity ids that no document versions.
      - name: The analyser's sink inference has unit tests
        run: GOWORK=off GOFLAGS=-mod=mod GOPROXY=off go test -C tools/uuidscan ./...

      # A checker that stops matching must not read as a pass. The violating fixture is known dirty,
      # so a zero exit here means the detector broke, and the specific control ids prove it is still
      # the RIGHT detector rather than something else failing the tree.
      - name: Mutation test - the checker still fails a dirty tree
        run: |
          set -euo pipefail
          GOWORK=off GOPROXY=off go build -C tools/uuidscan -o "$RUNNER_TEMP/uuidscan" .
          set +e
          out=$(UUIDSCAN_BIN="$RUNNER_TEMP/uuidscan" python3 scripts/check-uuid-version-policy.py \
            --repo-root fixtures/uuid-policy-violating 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [[ $code -eq 0 ]]; then
            echo "::error::the uuid-policy checker passed a fixture that is known to violate"
            exit 1
          fi
          for id in UUID-0001 UUID-0002 UUID-0003 UUID-0004 UUID-0006; do
            grep -q "\[$id\]" <<<"$out" || {
              echo "::error::$id no longer fires on the violating fixture"; exit 1; }
          done

  central-scripts-raw-sql:
    name: Central scripts - raw-SQL guard precision and recall
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Asserts both directions. Precision alone is not enough: the quickest way to stop the
      # false positives would be to require uppercase keywords, which would quietly stop detecting
      # real lowercase SQL, so the fixture pins a lowercase statement as well.
      - name: Fixture pins both false positives and detection
        run: python3 scripts/test_raw_sql_guard.py

      # A checker that crashes or finds nothing must not read as a pass. The fixture directory is
      # known to contain violations, so a zero exit here means the detector stopped matching.
      - name: Mutation test - the checker still fails a dirty tree
        run: |
          set +e
          (cd scripts/testdata/raw-sql && python3 "${GITHUB_WORKSPACE}/scripts/check_no_raw_sql.py")
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::the raw-sql fixture contains real SQL but the checker passed it"
            exit 1
          fi
          echo "checker fails the dirty fixture as expected (exit $rc)"

  # ── documentation-only fast path ───────────────────────────────────────────────────────────
  # service-ci.yaml now skips its expensive jobs when a push or pull request changed
  # documentation and nothing else. That decision is made once, by scripts/docs-only-diff.py, and
  # a wrong answer in the permissive direction means unreviewed code reaches main having been
  # examined by nothing - so this suite exists mainly to pin the ways a diff can be SHAPED to look
  # like documentation while carrying code: a rename out of .go, a markdown file under testdata/,
  # a markdown file compiled in by //go:embed, a merge that brings code in without listing it, and
  # a multi-commit push whose head commit alone is innocent.
  #
  # It also asserts the WIRING in service-ci.yaml job by job, which is the half a classifier test
  # would normally leave out and the half this repository keeps getting wrong: the operationId
  # guard that existed centrally and was connected to nothing, the undeclared lane that sat red
  # while releases went out past it. A correct classifier attached to the wrong `needs:` list
  # would skip every gate in the pipeline and then let `artifact` pin a GitOps digest from the
  # result.
  docs-only-fast-path:
    name: Documentation-only fast path - classifier and wiring self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install guard dependencies
        run: python3 -m pip install --upgrade PyYAML

      # Real git repositories in a temporary directory, not a list of filenames. The part most
      # likely to break is the range computation - what `before` means on a push, what it means
      # when there is no `before`, what a pull request's base is once main has moved under it -
      # and none of that is reachable without commits to diff.
      - name: Range computation and path classification, against real repositories
        run: python3 scripts/test_docs_only_diff.py

      # The second fast path, over the diff the release cascade generates. Its interesting
      # cases are inside go.mod rather than in the path list: a `toolchain` bump and a
      # `replace` directive arrive in the same file as a version pin and must not ride the
      # fast path, because the scanners it skips can legitimately answer differently after
      # either. The wiring half additionally asserts that the jobs whose subject IS the
      # dependency delta - vulnerabilities, dependency-review, build-test - are never skipped.
      - name: Dependency-pin classification and its wiring
        run: python3 scripts/test_pin_only_diff.py

  # ── org vocabulary (ORG-0001 broad, ORG-0002 identifiers) ──────────────────────────────────
  # Arrived without a job here, which is the omission this file's own header warns about: "new
  # central checkers should arrive with a self-test here". Added now, alongside ORG-0002.
  #
  # Both directions matter and they are not the same direction. ORG-0001 is broad and advisory, so
  # its risk is that a stage bug makes it block (it shipped once exiting non-zero at stage: warn).
  # ORG-0002 is narrow and meant to reach `enforce`, so its risk is the opposite: a pattern that
  # re-flags prose would put an error on 92 repositories for the name of a markdown file.
  org-vocabulary:
    name: Org vocabulary - stage behaviour, exception precision, identifier scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install guard dependencies
        run: python3 -m pip install --upgrade PyYAML

      - name: Stages, exceptions, harness exclusion and ORG-0002's identifier scope
        run: python3 scripts/test_org_vocabulary.py

      # A checker that stops matching must not read as a pass. This repository's own fixture tree
      # carries a tenant-named identifier on purpose, so ORG-0002 must still find it when the
      # exception that hides it from the fleet scan is not in the way.
      - name: Mutation test - ORG-0002 still detects a declaration
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          printf 'package p\n\ntype TenantService struct {\n\tTenantID string\n}\n' \
            > "${work}/handler.go"
          python3 - "${work}/control.yaml" <<'PY'
          import sys, yaml
          yaml.safe_dump({
              "version": 1,
              "domain": "org-vocabulary-policy",
              "policy_ssot": ["docs/standard.md"],
              "exceptions": [],
              "scan": {"skip_dirs": [], "skip_test_files": False},
              "controls": [{
                  "id": "ORG-0002", "title": "Identifier scope",
                  "owner": "platform-architecture", "scope": "identifiers",
                  "status": "active", "severity": "major", "stage": "enforce",
                  "policy": "No identifier may take the legacy term as its leading word.",
                  "rationale": "Identifiers are structural commitments.",
                  "remediation": "Rename the identifier so its leading word is org.",
                  "detector": "tenant_identifier_check",
                  "refs": ["docs/standard.md"],
              }],
          }, open(sys.argv[1], "w"))
          PY
          set +e
          out="$(python3 scripts/check-org-vocabulary.py \
                   --repo-root "${work}" --control "${work}/control.yaml" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "${out}"
          if [ "${rc}" -eq 0 ]; then
            echo "::error::ORG-0002 passed a file declaring TenantService and TenantID"
            exit 1
          fi
          grep -q 'ORG-0002' <<<"${out}" || {
            echo "::error::the failure was not attributed to ORG-0002"; exit 1; }

  # ── shared HTTP retry helper (ci-app-token, ci-slack-notify) ───────────────────────────────
  # scripts/lib/http_retry.py is what stands between a single flaky TLS handshake and a whole
  # job failing - see its module docstring for the 2026-08-11 bump-module-pin incident it fixes:
  # both credential brokers made a chain of single, unretried urlopen() calls with a flat 30s
  # timeout, so one timed-out handshake against GitHub's OIDC issuer failed the job exactly as
  # if the credential had been refused.
  #
  # A retry helper is dangerous in both directions at once, which is why this is asserted case
  # by case rather than as one smoke test: retrying too much (a blanket except-and-retry) would
  # turn a real 403 into a slow real 403 while burning the attempt budget; retrying too little
  # leaves the original bug in place. Both were confirmed to actually fail this suite by
  # mutating the implementation during development - removing the is_retryable guard, letting a
  # certificate-verification failure retry like an ordinary SSLError, widening the 5xx check to
  # all 4xx, degrading the exhaustion message, replaying a stale Request across attempts, and
  # dropping the backoff cap all reddened a specific, named case above, not just "some test".
  http-retry:
    name: HTTP retry helper - transient vs deterministic failure self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retry policy holds in both directions (no sockets, no real sleeping)
        run: python3 scripts/test_http_retry.py

  # ── App-token broker self-check (ADR-0110) ──────────────────────────────────────────────────
  # Called, not inlined, and the reason is the guard's own OIDC identity rather than tidiness.
  #
  # `job_workflow_ref` names the workflow a job is DEFINED in, together with the ref it was loaded
  # from, and the broker's read role admits `.../workflows/*@refs/tags/v1` — wildcard before the `@`,
  # so the claim must end in the literal v1 tag. Jobs defined HERE run on a branch and present
  # `ci.yaml@refs/heads/main`, which cannot match; that is why the positive assertion was denied on
  # every run for as long as it lived in this file. Calling the guard at `@v1` makes the claim
  # `app-token-selftest.yaml@refs/tags/v1`, which the existing policy already admits, so the guard
  # needs no trust-policy widening and exercises the broker by the route a real consumer takes.
  #
  # `permissions` is declared here because a called workflow cannot hold a permission its caller did
  # not grant, and the guard mints from AWS via OIDC (WFC-0004). Omitting `id-token` would surface as
  # the action reporting no OIDC token rather than as a policy failure.
  #
  # See app-token-selftest.yaml for what each direction asserts and why both are needed.
  ci-app-token:
    name: App token self-check
    permissions:
      contents: read
      id-token: write
    uses: coderaxis/ci-workflows/.github/workflows/app-token-selftest.yaml@v1

  # ── the app-token self-check's own event gate ───────────────────────────────────────────────
  # `admits-central` in the workflow above only asserts on caller shapes AWS is prepared to admit,
  # and it decides that with an `if:` expression. That expression is the one place the broker's
  # positive assertion can be switched off without anything going red, because a skipped job
  # reports exactly like a passing one: narrow it - drop the `pull_request` arm, or write
  # `github.ref == 'refs/tags/'` where a prefix test was meant - and the guard silently stops
  # running on the shapes it exists to cover. Widen or delete it and the feature-branch
  # `AccessDenied` comes back, which is the failure that was dismissed as "pre-existing" three
  # times before anyone traced it to `ci_caller_subs` being correctly scoped rather than to a bug.
  #
  # The test READS the gate out of app-token-selftest.yaml and EVALUATES it, and both halves are
  # load-bearing. A hand-copied expression would assert about the copy and drift from the file
  # GitHub actually reads the first time somebody edited one of them - while still passing, which
  # is the worst available outcome for a guard whose subject is a silent skip. And a substring
  # check for `refs/tags/` would pass against `github.ref == 'refs/tags/'`, against arms joined
  # with `&&`, and against the whole condition negated; only running it tells those apart.
  #
  # A SEPARATE JOB rather than a step, for the reason given at the top of this file: each guard
  # here is an independent verdict, and folding this into another one would mean a red run no
  # longer says which of the two stopped holding. `ci-app-token` above is the natural neighbour
  # and cannot host it in any case - a `uses:` job has no steps of its own.
  #
  # It is deliberately CREDENTIAL-FREE. This is a static test of an expression, so it gets no
  # `id-token: write` and inherits only the workflow-level `contents: read`; a check on the gate
  # that guards the broker has no business being able to reach the broker.
  #
  # WHAT IT CANNOT SEE, because the comment it makes true must not overclaim: `ci_caller_subs`
  # lives in inboxxhq-infra (environments/management/ci-identity/ci-app-token.tf) and nothing in
  # this repository reads it. This job proves the gate admits and skips the `sub` shapes it was
  # WRITTEN for; it cannot prove those are still the shapes AWS admits. If that policy is widened
  # or narrowed, this stays green while the gate drifts out of step with it, so realigning the two
  # remains a human obligation on any change to that file.
  app-token-gate:
    name: App token gate - the event gate matches the admitted sub shapes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      - name: The gate admits and skips exactly the caller shapes it is meant to
        run: python3 scripts/test_app_token_gate.py

  # ── delivery model (was delivery-model-guard.yaml) ──────────────────────────────────────────
  # Executable governance for the canonical reusable deploy workflow.
  #
  # Runs scripts/check-delivery-model.py against .github/workflows/deploy-reusable.yaml on every
  # change, so the build-once / promote-by-digest delivery model cannot silently regress - e.g.
  # someone adding a local image build, a second/per-variant build (incl. a swagger/docs image),
  # pinning a staging/preprod/prod overlay, widening permissions, swapping in a non-ci-build OIDC
  # role, or dropping the main-only guard.
  #
  # The catalog of controls (id, policy, severity) is declarative in controls/delivery-model.yaml;
  # the checker binds each control to a detector. critical/major controls fail CI; minor controls
  # are advisory. A machine-readable JSON report is uploaded as an artifact for dashboards /
  # compliance tooling.
  #
  # Policy SSOT: ADR-0051 (Artifact Promotion, Digest-Pinned Deployment) + RFC-0020 (Supply-Chain
  # Integrity and Artifact Promotion). This is the delivery-model twin of the seed-contract gate:
  # policy that used to live only in workflow comments is now machine-verified on this repo itself.
  delivery-model:
    name: Delivery model invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      - name: Verify control docs are in sync with the catalog
        run: python3 scripts/check-delivery-model.py --verify-docs README.md

      - name: Enforce delivery-model invariants (ADR-0051 / RFC-0020)
        run: |
          python3 scripts/check-delivery-model.py \
            .github/workflows/deploy-reusable.yaml \
            --report delivery-model-report.json

      - name: Upload delivery-model report (machine-readable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-model-report
          path: delivery-model-report.json
          if-no-files-found: warn

  # ── Dockerfile standard (was dockerfile-standard-guard.yaml) ────────────────────────────────
  # Governance for the Dockerfile-standard control catalog itself: validates the catalog schema,
  # keeps the checker's control docs in sync, and dry-runs the checker against its own canonical
  # template so a catalog/checker change that breaks the template is caught here, not fleet-wide.
  #
  # Policy SSOT: ADR-0072 (Enterprise Dockerfile Standard).
  dockerfile-standard:
    name: Dockerfile standard - catalog + template self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      - name: Validate control catalog schema
        run: |
          python3 scripts/check-dockerfile-standard.py --format markdown > /dev/null
          echo "control catalog schema OK"

      - name: Verify control docs are in sync with the catalog
        run: python3 scripts/check-dockerfile-standard.py --verify-docs README.md

      - name: Prepare a filled-in copy of the canonical template for a self-check
        run: |
          sed \
            -e 's/__SERVICE_NAME__/example/g' \
            -e 's/__REPO_NAME__/inboxxhq-example-service/g' \
            -e 's/__CAPABILITY_LIST__/http-api/g' \
            -e 's/__SERVICE_PORT__/4000/g' \
            templates/Dockerfile.service > /tmp/Dockerfile.instantiated

      - name: Self-check the instantiated template (http-api capability only)
        run: |
          python3 scripts/check-dockerfile-standard.py \
            /tmp/Dockerfile.instantiated \
            --capabilities http-api \
            --fail-on major

      # DS-0003 spent its whole life so far asserting nothing, and the step above could not
      # tell: the detector skipped any tag written as `${ARG}`, the template writes its tags
      # that way, so the self-check passed a Dockerfile it had declined to examine. It then
      # printed the matrix's EXPECTED tags in the success line, which is how a green result
      # came to read as confirmation.
      #
      # A positive fixture cannot catch that class of defect - it passes either way, which is
      # precisely the problem. So the template is mutated here and the control is REQUIRED to
      # fail. If someone reintroduces a skip, or points the checker at a tag the matrix does
      # not name, this goes red instead of going quiet.
      #
      # Both mutations matter. The wrong-value case proves the comparison happens at all. The
      # missing-default case proves an unresolvable ARG is rejected rather than waved through:
      # a tag with no default has no version to check, and treating "cannot tell" as "fine" is
      # the same mistake in a different costume.
      - name: Mutation test - DS-0003 must reject a base image the matrix does not name
        run: |
          set -euo pipefail

          assert_ds0003_fails() {
            local what="$1" file="$2"
            local out rc
            set +e
            out="$(python3 scripts/check-dockerfile-standard.py "$file" \
                     --capabilities http-api --fail-on major 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::$what: the checker passed. DS-0003 is not comparing base image"
              echo "::error::tags, so every service's bases are unverified while it reports green."
              echo "$out"
              exit 1
            fi
            if ! grep -q 'DS-0003' <<<"$out"; then
              echo "::error::$what: the run failed, but not on DS-0003 - so this proves nothing"
              echo "::error::about base-image pinning. Output follows."
              echo "$out"
              exit 1
            fi
            echo "  ok - $what rejected by DS-0003"
          }

          # 1. An ARG default the version matrix does not name.
          sed 's/^ARG BUILDER_IMAGE_TAG=.*/ARG BUILDER_IMAGE_TAG=1.20-alpine3.11/' \
            /tmp/Dockerfile.instantiated > /tmp/Dockerfile.wrongtag
          assert_ds0003_fails "an unpinned go/alpine pair (1.20-alpine3.11)" /tmp/Dockerfile.wrongtag

          # 2. An ARG with no default at all: nothing in the file says what gets built.
          sed 's/^ARG BUILDER_IMAGE_TAG=.*/ARG BUILDER_IMAGE_TAG/' \
            /tmp/Dockerfile.instantiated > /tmp/Dockerfile.nodefault
          assert_ds0003_fails "a BUILDER_IMAGE_TAG ARG with no default" /tmp/Dockerfile.nodefault

          # 3. And the literal spelling is still checked, so the fix did not narrow the control
          #    to only the ARG form.
          # \$ keeps ${BUILDER_IMAGE_TAG} literal: the pattern matches that text in the
          # Dockerfile and must not expand to this shell's (empty) value of it.
          sed "s|golang:\${BUILDER_IMAGE_TAG}|golang:1.21-alpine3.15|" \
            /tmp/Dockerfile.instantiated > /tmp/Dockerfile.literal
          assert_ds0003_fails "a literal non-matrix tag (1.21-alpine3.15)" /tmp/Dockerfile.literal

      # Capability gates must read INSTRUCTIONS, not the file as text. DS-0012 used to grep
      # df.all_text() for `cmd/seed`, and all_text() includes comments — so a Dockerfile that
      # merely mentioned the path in prose certified that the image ships a seed binary.
      # inboxxhq-event-gateway passed that way for real: `seed` declared, no cmd/seed anywhere,
      # green because an explanatory comment contained the string.
      #
      # DS-0013 is the paired assertion and had no `seed` case at all, so neither direction of
      # the mismatch was caught by anything. The omission direction is the worse one: a repo
      # that quietly ships a seeding binary without declaring the capability sits outside the
      # seeding standard's gates entirely, because those gates key off the declaration.
      - name: Mutation test - a comment must not satisfy a capability gate
        run: |
          set -euo pipefail
          work="$(mktemp -d)"

          # A minimal repo that DECLARES seed, mentions ./cmd/seed only in a comment, and has
          # no cmd/seed on disk. Under the old detector this passed.
          mkdir -p "$work/repo/cmd/server"
          printf 'module example\n\ngo 1.26\n' > "$work/repo/go.mod"
          sed -e 's/__SERVICE_NAME__/example/g' \
              -e 's/__REPO_NAME__/inboxxhq-example-service/g' \
              -e 's/__CAPABILITY_LIST__/http-api,seed/g' \
              -e 's/__SERVICE_PORT__/4000/g' \
              templates/Dockerfile.service > "$work/repo/Dockerfile"
          echo '# NOTE: this service intentionally has no ./cmd/seed binary.' >> "$work/repo/Dockerfile"

          set +e
          out="$(python3 scripts/check-dockerfile-standard.py "$work/repo/Dockerfile" \
                   --repo-root "$work/repo" --capabilities http-api,seed --fail-on major 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::a repo declaring 'seed' with no cmd/seed passed. A capability gate that"
            echo "::error::a comment can satisfy certifies nothing about what the image ships."
            echo "$out"
            exit 1
          fi
          grep -q 'DS-0013' <<<"$out" || {
            echo "::error::DS-0013 did not fire on 'seed declared but cmd/seed absent'."; echo "$out"; exit 1; }
          echo "  ok - a declared-but-absent seed capability is rejected"

          # The other direction: cmd/seed on disk, capability NOT declared.
          mkdir -p "$work/repo/cmd/seed"
          set +e
          out="$(python3 scripts/check-dockerfile-standard.py "$work/repo/Dockerfile" \
                   --repo-root "$work/repo" --capabilities http-api --fail-on major 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || ! grep -q 'DS-0013' <<<"$out"; then
            echo "::error::a repo shipping cmd/seed without declaring 'seed' was accepted. Such a"
            echo "::error::repo is outside the seeding standard's gates, which key off the declaration."
            echo "$out"
            exit 1
          fi
          echo "  ok - an undeclared seed binary is rejected"
          rm -rf "$work"

      # The matrix is only meaningful if the tags it names can actually be pulled. It named
      # `golang:1.26-alpine3.19` for days; that tag has never been published, so the control's
      # own primary remediation produced an image that 404s on its base. Nothing anywhere
      # checked, because every other gate reads the matrix as the source of truth rather than
      # as a claim about a registry.
      #
      # Advisory on purpose: this is the one step here that needs the network, and a registry
      # blip must not fail an unrelated pull request. It prints loudly enough to act on.
      - name: Do the pinned base images exist in the registry? (advisory)
        continue-on-error: true
        run: |
          set -uo pipefail
          check() {
            local repo="$1" tag="$2" tok code
            tok="$(curl -sf "https://public.ecr.aws/token/?scope=repository:docker/library/${repo}:pull" \
                   | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')" || {
              echo "  ?? could not obtain a registry token for ${repo}; skipping"; return 0; }
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" \
                     -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
                     "https://public.ecr.aws/v2/docker/library/${repo}/manifests/${tag}")"
            if [ "$code" = "200" ]; then
              echo "  ok - ${repo}:${tag} resolves"
            else
              echo "::warning::${repo}:${tag} returns HTTP ${code} - the pinned base image does not"
              echo "::warning::resolve. Any Dockerfile obeying DS-0003 literally cannot pull its base."
            fi
          }
          builder="$(python3 -c 'import re,pathlib;print(re.search(r"EXPECTED_BUILDER_TAG = \"([^\"]+)\"",pathlib.Path("scripts/check-dockerfile-standard.py").read_text()).group(1))')"
          runtime="$(python3 -c 'import re,pathlib;print(re.search(r"EXPECTED_RUNTIME_TAG = \"([^\"]+)\"",pathlib.Path("scripts/check-dockerfile-standard.py").read_text()).group(1))')"
          echo "matrix says builder=golang:${builder}, runtime=alpine:${runtime}"
          check golang "${builder}"
          check alpine "${runtime}"

  # ── docs governance (was docs-governance-guard.yaml) ────────────────────────────────────────
  # Governance for the docs-governance control catalog + checker themselves: validates the catalog
  # schema, keeps the README control table in sync with the catalog, and smoke-runs the checker
  # end-to-end against a minimal compliant fixture so a catalog/checker change that breaks
  # execution is caught here, not fleet-wide.
  #
  # Policy SSOT: ADR-0081.
  docs-governance:
    name: Docs governance - catalog + checker self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      - name: Validate control catalog schema
        run: |
          python3 scripts/check-docs-governance.py --format markdown > /dev/null
          echo "control catalog schema OK"

      - name: Verify control docs are in sync with the catalog
        run: python3 scripts/check-docs-governance.py --verify-docs README.md

      - name: Smoke-run the checker end-to-end against the compliant fixture
        run: |
          python3 scripts/check-docs-governance.py \
            scripts/testdata/docs-governance-fixture \
            --fail-on major

  # ── release cascade (was release-cascade-guard.yaml) ────────────────────────────────────────
  # Self-CI for the release cascade itself: the dependency-DAG derivation in
  # resolve_service_identity.py and the pin policy in check_module_pins.py.
  #
  # The arrangement these replaced failed silently. A hand-copied fan-out matrix in 65 core repos,
  # gated by a per-repo variable, meant a release either notified its consumers or did not, with
  # nothing reporting which; and a pin policy that named its modules literally checked nothing at
  # all in a repo whose modules it had not been updated to list. Both states looked green.
  #
  # So the two cases asserted here are the ones that hide: a fan-out that notifies nobody, and a
  # gate that blocks nothing. If either detector stops firing, this fails here rather than
  # fleet-wide.
  #
  # Policy SSOT: SHARED_CORE_RELEASE_AND_PROMOTION.md, ADR-0081.
  release-cascade:
    name: Release cascade - DAG derivation + pin policy self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --upgrade PyYAML

      - name: DAG derivation and pin policy mutation tests
        run: python3 scripts/test_release_cascade.py

      # The composite action is what the workflows actually call, so an output added to the script
      # but not surfaced by the action resolves to an empty string at runtime - and an empty
      # consumers list is a fan-out that notifies nobody, silently.
      - name: Every resolver output is exposed by the composite action
        run: |
          set -euo pipefail
          missing=0
          for key in service repo_kind module_path upstream_module consumers \
                     unorderable_consumers required_modules language archetype tier owner \
                     deployable owns_database seeds has_rest has_grpc has_events \
                     coverage_threshold role capabilities; do
            if ! grep -qE "^  ${key}:" resolve-service-identity/action.yaml; then
              echo "::error::resolver emits '${key}' but resolve-service-identity/action.yaml does not"
              echo "expose it as an output, so callers would silently receive an empty value."
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ] && echo "all resolver outputs are exposed by the action"

      # This step spent the whole `.yml` -> `.yaml` migration matching zero files and reporting
      # success, which is the same shape of silent pass the rest of this suite exists to catch:
      # a lint that lints nothing cannot fail. The comment recording that is not a fix, so the
      # count is now asserted here and the glob covers both spellings.
      - name: At least one workflow file is actually linted
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/workflows/*.yaml .github/workflows/*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the workflow lint matched no files, so it would report success without"
            echo "having checked anything. Either the glob is wrong or the workflows moved."
            exit 1
          fi
          echo "linting ${#files[@]} workflow file(s)"

      # No `files` glob on purpose. Supplying one is what caused the silent pass above, and the
      # input is comma-separated, so the obvious two-extension fix is easy to get subtly wrong.
      # With no glob, actionlint discovers `.github/workflows` itself and covers both spellings,
      # which makes that failure structurally impossible rather than corrected. Discovery is
      # scoped to that directory, so the deliberately-invalid fixtures under scripts/testdata
      # stay out of scope.
      #
      # Version pinned for the same reason service-ci.yaml pins its image by digest: an unpinned
      # linter turns a hard-fail gate red on an upstream release rather than on a change here,
      # and stops a developer's local run from reproducing CI. Keep this in step with the digest
      # pinned in service-ci.yaml so the fleet and this repo judge by the same rules.
      - name: Workflows lint clean
        uses: raven-actions/actionlint@v2
        with:
          version: "1.7.12"

  # ── workflow centralization (was workflow-centralization-guard.yaml) ────────────────────────
  # Governance for the workflow-centralization control catalog + checker themselves: validates the
  # catalog schema, confirms this repo is clean against its own controls, and - because a control
  # that only ever passes proves nothing - mutation-tests the checker against a fixture that
  # violates both controls. If either control stops firing, this fails here rather than letting the
  # drift it was written to catch slip through fleet-wide.
  #
  # Policy SSOT: ADR-0081, ADR-0051.
  workflow-centralization:
    name: Workflow centralization - catalog + checker self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      - name: Validate control catalog schema
        run: |
          python3 scripts/check-workflow-centralization.py --format json > /dev/null
          echo "control catalog schema OK"

      - name: Verify control docs are in sync with the catalog
        run: python3 scripts/check-workflow-centralization.py --verify-docs README.md

      - name: This repo upholds its own controls
        run: python3 scripts/check-workflow-centralization.py . --fail-on major

      - name: Compliant fixture passes
        run: |
          python3 scripts/check-workflow-centralization.py \
            scripts/testdata/workflow-centralization-fixture \
            --fail-on major

      # A control catalog is only worth its detectors. Assert the violating fixture actually fails,
      # and that each control is named in the output, so a detector that silently stops matching
      # cannot masquerade as a clean fleet.
      - name: Mutation test - violating fixture must fail every control
        run: |
          set +e
          out="$(python3 scripts/check-workflow-centralization.py \
                   scripts/testdata/workflow-centralization-violation-fixture \
                   --fail-on major 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::violating fixture passed; the centralization detectors are not firing"
            exit 1
          fi
          for control in WFC-0001 WFC-0002 WFC-0004; do
            if ! echo "$out" | grep -q "::error::\[$control\]"; then
              echo "::error::$control did not fire against the violating fixture"
              exit 1
            fi
          done
          echo "all controls fired as expected (exit $rc)"

      # WFC-0004 compares two files, so its detector has a failure mode the fixtures cannot show:
      # treating an absent `permissions:` block as "grants nothing" rather than as the repository
      # default token. That reads every permissionless caller of a `contents: read` workflow as
      # broken - 4 of the 5 findings on its first fleet run were this false positive, against
      # callers that pass in CI today. A control that cries wolf gets switched off, so the
      # distinction is pinned here rather than left to the reviewer.
      - name: Unit test - WFC-0004 models the default token, not the empty set
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location(
              "wfc", pathlib.Path("scripts/check-workflow-centralization.py"))
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          gaps = m.permission_gaps
          cases = [
              # (granted, declared, declared_present, expected_gap_count, why)
              (None, {"contents": "read"}, False, 0, "no block anywhere still carries contents: read"),
              (None, {"contents": "read", "id-token": "write"}, False, 1, "id-token is never implicit"),
              ({"contents": "read"}, {"contents": "read", "id-token": "write"}, True, 1,
               "declaring a block drops unlisted scopes to none - the service-ci artifact bug"),
              ({"contents": "read", "id-token": "write"}, {"contents": "read", "id-token": "write"},
               True, 0, "exact grant covers the callee"),
              ({"contents": "write"}, {"contents": "read"}, True, 0, "write satisfies read"),
              ({"contents": "read"}, {"contents": "write"}, True, 1, "read does not satisfy write"),
              ("write-all", {"id-token": "write"}, True, 0, "blanket grant covers everything"),
              ({"contents": "read"}, None, True, 0, "callee declaring nothing asks for nothing"),
          ]
          bad = 0
          for granted, declared, present, want, why in cases:
              got = len(gaps(granted, declared, present))
              if got != want:
                  print(f"::error::expected {want} gap(s), got {got}: {why}"); bad += 1
          if bad: sys.exit(1)
          print(f"{len(cases)} permission-model cases hold")
          PY

  # ── CI identity (GitHub-OIDC sub patterns in the AWS trust policies) ─────────────────────────
  # This catalog exists because the same defect reached production four times: a trust policy that
  # lists only GitHub's older name-based `sub` spelling stops admitting a repository the moment
  # somebody renames it, and nothing anywhere says so until an unrelated repo's CI fails days later.
  #
  # The mutation tests below are the load-bearing part. Rather than only asserting against a
  # hand-written violation fixture, they replay the two real defects out of inboxxhq-infra's git
  # history - the classic-only state that refused five renamed repositories, and the state where the
  # widening was written with the pin inverted. A detector that stops matching therefore fails here
  # against the actual code that caused the outage, not against a fixture somebody might quietly
  # weaken alongside it. The inverted-pin case matters most: it was written while following the
  # correct precedent commit, which is the clearest evidence available that review does not catch
  # this class and a machine has to.
  #
  # Policy SSOT: ADR-0051, ADR-0110.
  ci-identity:
    name: CI identity - catalog + checker self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      - name: Validate control catalog schema
        run: |
          python3 scripts/check-ci-identity.py scripts/testdata/ci-identity-fixture \
            --format json > /dev/null
          echo "control catalog schema OK"

      - name: Verify control docs are in sync with the catalog
        run: python3 scripts/check-ci-identity.py --verify-docs README.md

      - name: Compliant fixture passes
        run: |
          python3 scripts/check-ci-identity.py scripts/testdata/ci-identity-fixture \
            --fail-on major

      - name: Mutation test - violating fixture must fail every control
        run: |
          set +e
          out="$(python3 scripts/check-ci-identity.py \
                   scripts/testdata/ci-identity-violation-fixture --fail-on major 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::violating fixture passed; the ci-identity detectors are not firing"
            exit 1
          fi
          for control in CID-0001 CID-0002 CID-0003 CID-0004; do
            if ! echo "$out" | grep -q "::error::\[$control\]"; then
              echo "::error::$control did not fire against the violating fixture"
              exit 1
            fi
          done
          echo "all controls fired as expected (exit $rc)"

      # Regression test for a bug the fixtures structurally could not catch, and which the first real
      # consumer run found immediately.
      #
      # The reusable workflow checks the central repository out INSIDE the caller's workspace, because
      # actions/checkout cannot place it anywhere else. Scanning the caller's whole repository
      # therefore also reached this repository's violation fixture, and the job failed reporting five
      # defects that belonged to the fixture. Every local test passed; the fixtures pass by
      # construction, and no fixture contains the checker.
      #
      # Narrowing the workflow's roots would have hidden it and left the trap for the next caller, so
      # the exclusion lives in the checker and this asserts the layout that exposed it.
      - name: Regression - a nested checkout of this repo is not mistaken for the caller's code
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -r scripts/testdata/ci-identity-fixture "$work/infra"
          # The runner layout: caller's code at the root, this repository nested inside it.
          mkdir -p "$work/.ci-identity-tools"
          cp -r scripts controls "$work/.ci-identity-tools/"
          if ! python3 "$work/.ci-identity-tools/scripts/check-ci-identity.py" "$work" \
                 --controls "$work/.ci-identity-tools/controls/ci-identity.yaml" \
                 --fail-on major; then
            echo "::error::a nested checkout of this repository was scanned as if it were the"
            echo "::error::caller's Terraform, so every consumer's run fails on our own fixtures."
            exit 1
          fi
          # And the exclusion must not be so broad that naming a fixture explicitly stops working -
          # that would silently disable the mutation tests above.
          if python3 "$work/.ci-identity-tools/scripts/check-ci-identity.py" \
               "$work/.ci-identity-tools/scripts/testdata/ci-identity-violation-fixture" \
               --controls "$work/.ci-identity-tools/controls/ci-identity.yaml" \
               --fail-on major > /dev/null 2>&1; then
            echo "::error::the exclusion swallowed an explicitly named root; the violation fixture"
            echo "::error::is no longer being checked and the mutation tests above prove nothing."
            exit 1
          fi
          echo "nested checkout excluded; explicitly named roots still checked"

      # A fixture proves the detector matches something. Only the real history proves it matches the
      # thing that actually broke. Both trees are reconstructed from inboxxhq-infra's own commits, so
      # this cannot drift away from what happened.
      - name: Unit test - the four rename defects are decomposed correctly
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location(
              "cid", pathlib.Path("scripts/check-ci-identity.py"))
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          # (pattern, expected owner, expected repository, why it matters)
          cases = [
              ("repo:${var.org}/*:ref:refs/heads/main", "${var.org}", "*",
               "classic owner-wide: no id anywhere"),
              ("repo:${var.org}@${var.org_id}/*:ref:refs/heads/main",
               "${var.org}@${var.org_id}", "*", "immutable owner-wide"),
              ("repo:${var.org}@${var.org_id}/*@${var.repo_id}:environment:production",
               "${var.org}@${var.org_id}", "*@${var.repo_id}", "the correct repo-scoped form"),
              ("repo:${var.org}@${var.org_id}/${var.repo}@*:environment:production",
               "${var.org}@${var.org_id}", "${var.repo}@*", "the inverted pin, found in review"),
              # An interpolation holding a `:` or `/` must not be mistaken for a delimiter, or the
              # segments silently mis-attribute and every later judgement is wrong on clean-looking
              # input.
              ("repo:${var.org}@${var.org_id}/*@${var.repo_id}:environment:${var.prefix}*",
               "${var.org}@${var.org_id}", "*@${var.repo_id}", "interpolation in the subject"),
          ]
          bad = 0
          for raw, want_owner, want_repo, why in cases:
              got = m.decompose(raw, "t.tf", 1)
              if got is None:
                  print(f"::error::failed to decompose {raw}: {why}"); bad += 1; continue
              if got.owner != want_owner or got.repository != want_repo:
                  print(f"::error::{why}: owner={got.owner!r} repository={got.repository!r}")
                  bad += 1
          if bad: sys.exit(1)
          print(f"{len(cases)} claim-grammar cases hold")
          PY

  # ---------------------------------------------------------------------------
  # The API-contract gate judges 38 service repositories, so its own catalog, docs table and
  # detectors have to be held to the same standard as the fleet it polices.
  #
  # The contract-vintage checks (API-0007 + controls/module-floors.yaml) carry an extra
  # obligation the other controls do not: they compare services against a generated reference
  # artifact that lives in this repository but is produced in platform-shared-go. If the floor
  # is raised and the artifact is not regenerated, the two disagree about which proto vintage is
  # canonical - and every service would then be measured against a version nothing is required
  # to pin. That pair is asserted here because it is the one inconsistency no service-side run
  # could ever surface.
  #
  # Policy SSOT: ADR-0048, ADR-0067, RFC-0001.
  api-contract:
    name: API contract - catalog + reference artifact self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      - name: Validate control catalog schema
        run: |
          python3 scripts/check-api-contract.py --format json > /dev/null
          echo "control catalog schema OK"

      - name: Verify control docs are in sync with the catalog
        run: python3 scripts/check-api-contract.py --verify-docs README.md

      # RFC-0038 (HTTP protocol semantics) added eight detectors - API-0008..API-0015 - at once.
      # Each gets at least one fixture that MUST be counted as a violation and one that MUST
      # NOT, built with tempfile rather than real repo state, because a real repo gets fixed
      # over time and would silently make the test vacuous. See the module docstring for the
      # specific false positives (a getter mistaken for a client construction, a switch-case
      # label mistaken for a response write, a query parameter mistaken for a header) each
      # fixture was built to catch.
      - name: RFC-0038 detectors discriminate (API-0008..API-0015)
        run: python3 scripts/test_api_contract_controls.py

      # Mutation test - the eight new detectors must still fail a dirty tree. This is the same
      # shape as the DS-0003 / WFC-0001..0004 mutation tests elsewhere in this file: a positive
      # fixture proves a detector matches something, but only a required failure on a KNOWN-BAD
      # tree proves the wiring (registration in DETECTORS, applies_when, the catalog entry
      # itself) is intact end to end, not just the detector function in isolation.
      - name: Mutation test - the RFC-0038 catalog must still fail a dirty tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          tmp = pathlib.Path("/tmp/rfc0038-dirty-fixture")
          (tmp / "docs").mkdir(parents=True, exist_ok=True)
          spec = {
              "openapi": "3.1.0",  # API-0013
              "info": {"title": "dirty", "version": "1.0.0"},
              "paths": {
                  "/widgets/{id}": {  # API-0008 (no ETag)
                      "get": {"responses": {"200": {"description": "OK"}}},
                      "patch": {"responses": {"200": {"description": "OK"}},  # API-0011
                               "requestBody": {"content": {"application/json": {"schema": {}}}}},
                  },
                  "/widgets": {"post": {"responses": {"200": {"description": "OK"}}}},
              },
          }
          (tmp / "docs" / "openapi.json").write_text(json.dumps(spec))
          (tmp / "internal" / "handlers").mkdir(parents=True, exist_ok=True)
          (tmp / "internal" / "handlers" / "h.go").write_text(
              'package handlers\n\n'
              'func Handle(c *Context) {\n'
              '\t_ = c.GetHeader("Idempotency-Key")\n'  # API-0012
              # API-0009. MUST stay `private`, not `public`: RFC-0038 section 2 exempts a
              # genuinely public response, which has no per-caller cache key to declare, so a
              # `public` fixture stops firing and this mutation test passes vacuously.
              '\tc.Header("Cache-Control", "private, max-age=60")\n'
              '\tc.Header("X-RateLimit-Limit", "100")\n'  # API-0010
              '\tclient := &http.Client{Timeout: 5 * time.Second}\n'  # API-0014
              '\t_ = client\n'
              '\tc.JSON(200, nil)\n'
              '}\n'
          )
          PY

          set +e
          out="$(python3 scripts/check-api-contract.py /tmp/rfc0038-dirty-fixture --fail-on major 2>&1)"
          rc=$?
          set -e
          echo "$out"
          rm -rf /tmp/rfc0038-dirty-fixture
          if [ "$rc" -eq 0 ]; then
            echo "::error::the RFC-0038 dirty fixture passed; the eight new detectors are not firing"
            exit 1
          fi
          for control in API-0008 API-0009 API-0010 API-0011 API-0012 API-0013 API-0014 API-0015; do
            if ! echo "$out" | grep -q "::error::\[$control\]"; then
              echo "::error::$control did not fire against the RFC-0038 dirty fixture"
              exit 1
            fi
          done
          echo "all eight RFC-0038 controls fired as expected (exit $rc)"

      - name: The module floor and the reference artifact name the same proto vintage
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, yaml
          module = "github.com/coderaxis/platform-contracts-go"
          floors = yaml.safe_load(pathlib.Path("controls/module-floors.yaml").read_text())["floors"]
          floor = str(floors[module]["min"])
          ref = json.loads(pathlib.Path("controls/common-v1-components.json").read_text())
          got = ref["source"]["version"]
          if got != floor:
              print(f"::error::controls/module-floors.yaml requires {module} {floor}, but "
                    f"controls/common-v1-components.json was projected from {got}. Regenerate the "
                    "artifact from platform-shared-go with `go run "
                    "./platform/openapicontract/commonv1policy/cmd/emit-canonical-components`.")
              sys.exit(1)
          print(f"floor and reference artifact agree on {floor}")
          PY

      - name: Mutation test - API-0007 must fail a spec on a stale proto vintage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, shutil
          fixture = pathlib.Path("/tmp/api007-fixture")
          shutil.rmtree(fixture, ignore_errors=True)
          (fixture / "docs").mkdir(parents=True)
          ref = json.loads(pathlib.Path("controls/common-v1-components.json").read_text())
          components = dict(ref["components"])
          # Drop one enum value: exactly what an older platform-contracts-go pin produces.
          stale = json.loads(json.dumps(components["common.v1.ErrorCode"]))
          stale["enum"] = stale["enum"][:-1]
          components["common.v1.ErrorCode"] = stale
          (fixture / "docs" / "openapi.json").write_text(json.dumps(
              {"openapi": "3.0.3", "info": {"title": "fixture", "version": "1"}, "paths": {},
               "components": {"schemas": components}}))
          PY
          set +e
          out="$(python3 scripts/check-api-contract.py /tmp/api007-fixture --fail-on major 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ] || ! echo "$out" | grep -q "::error::\[API-0007\]"; then
            echo "::error::API-0007 did not fire against a spec built on a stale proto vintage"
            exit 1
          fi
          echo "API-0007 fired as expected (exit $rc)"

      - name: Mutation test - a missing reference artifact must fail, never pass
        run: |
          set -euo pipefail
          cp controls/common-v1-components.json /tmp/ref-backup.json
          rm controls/common-v1-components.json
          set +e
          python3 scripts/check-api-contract.py . --fail-on major > /tmp/out.txt 2>&1
          rc=$?
          set -e
          mv /tmp/ref-backup.json controls/common-v1-components.json
          cat /tmp/out.txt
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit 2 for a missing reference artifact, got $rc"
            exit 1
          fi
          echo "missing reference artifact fails loudly (exit $rc)"

      - name: Unit test - the version floor comparison
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location(
              "pins", pathlib.Path("scripts/check_module_pins.py"))
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          mod = "github.com/coderaxis/platform-contracts-go"
          floors = {mod: "v0.4.0"}
          cases = [
              # (pinned, mode, expect_error, expect_warning, why)
              ("v0.4.0", "prod", False, False, "at the floor passes"),
              ("v0.5.0", "prod", False, False, "above the floor passes"),
              ("v0.3.0", "prod", True, False, "below the floor blocks on prod"),
              ("v0.3.0", "dev", False, True, "below the floor only warns on dev"),
              ("v0.10.0", "prod", False, False, "compared numerically, not lexically"),
          ]
          bad = 0
          for pinned, mode, want_err, want_warn, why in cases:
              go_mod = pathlib.Path("/tmp/floor-case/go.mod")
              go_mod.parent.mkdir(parents=True, exist_ok=True)
              go_mod.write_text(f"module x\n\ngo 1.24\n\nrequire {mod} {pinned}\n")
              errors, warnings, _ = m.check(go_mod, [], mode, "github.com/coderaxis/", floors)
              if bool(errors) != want_err or bool(warnings) != want_warn:
                  print(f"::error::{why}: errors={errors} warnings={warnings}"); bad += 1
          if bad: sys.exit(1)
          print(f"{len(cases)} floor-comparison cases hold")
          PY

  # ---------------------------------------------------------------------------
  # The gateway security baseline gate (GW-0001..GW-0008) judges every deployable in the fleet, so
  # it earns the same self-check the API-contract gate above gets: the catalog, the detector and
  # the two fixtures are held to the standard they police.
  #
  # WHY TWO FIXTURES AND NOT ONE. A conformant fixture proves the detector can say yes and a
  # violating one proves it can say no, and a detector that cannot do both is not a control. This
  # pair has already caught the failure in both directions during development: GW-0002 reported 175
  # findings on a gateway where 5 were real, and GW-0007 could report pass or cannot-tell but never
  # fail, so the fleet census it exists to produce was unreachable.
  #
  # The fixtures are committed trees rather than tempfile-built ones, unlike the RFC-0038 fixtures
  # above, because these controls read whole-repository shape - a go.mod pin, a service contract, a
  # config layer layout and Go source in the same tree - and building that per-test is what makes a
  # test unreadable rather than robust. The mutation test below is what keeps them honest.
  #
  # Policy SSOT: ADR-0095, ADR-0096, RFC-0039.
  gateway-baseline:
    name: Gateway baseline - catalog + detector self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      # Catalog shape, detector binding and reference hygiene. Asserts among other things that
      # every implemented detector is named by some control - dead detector code reads as
      # enforcement to anyone auditing the script - and that every control cites RFC-0039.
      - name: Control catalog and detector wiring hold
        run: python3 scripts/test_gateway_baseline_controls.py

      # The positive half. A control set that fails a clean tree is worse than no control set,
      # because the only way to get a green run is to stop believing the gate.
      - name: The conformant fixture must pass all eight controls
        run: |
          set -euo pipefail
          out="$(python3 scripts/check-gateway-baseline.py fixtures/gateway-baseline-conformant \
            --controls controls/gateway-baseline.yaml 2>&1)"
          echo "$out"
          for control in GW-0001 GW-0002 GW-0003 GW-0004 GW-0005 GW-0006 GW-0007 GW-0008; do
            if ! echo "$out" | grep -q "\[ok\] $control "; then
              echo "::error::$control did not pass against the conformant fixture; a control that"
              echo "::error::cannot return a clean verdict cannot be satisfied by fixing anything"
              exit 1
            fi
          done
          echo "all eight controls pass a conformant gateway"

      # The negative half, and the one that proves the WIRING rather than the detector functions:
      # a fixture only reddens if the catalog entry, the applies_when scope, the detector-name
      # binding and the severity threshold are all intact end to end.
      - name: Mutation test - the violating fixture must fail every control
        run: |
          set -euo pipefail
          set +e
          out="$(python3 scripts/check-gateway-baseline.py fixtures/gateway-baseline-violating \
            --controls controls/gateway-baseline.yaml --fail-on major 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::the violating fixture passed; the gateway detectors are not firing"
            exit 1
          fi
          for control in GW-0001 GW-0002 GW-0003 GW-0004 GW-0005 GW-0006 GW-0007 GW-0008; do
            if ! echo "$out" | grep -q "::error::\[$control\]"; then
              echo "::error::$control did not fire against the violating fixture"
              exit 1
            fi
          done
          echo "all eight controls fired as expected (exit $rc)"

      # WHY DETECTOR PARITY IS NOT A STEP HERE, since RFC-0039 requires it and its absence would
      # otherwise look like an oversight. scripts/check-detector-parity.py compares this detector
      # against the second implementation in `ihq validate gateway`, which lives in
      # coderaxis/inboxxhq-cli. Running it here would need a checkout of another private repository
      # and a Go build of it, and the default GITHUB_TOKEN is scoped to this repository alone - so
      # the step would need a credential the OIDC model does not issue. That is the same shape as
      # the cross-repository reference described in service-ci.yaml's contract gate, and enabling a
      # check that cannot resolve its own inputs produces a red nobody can fix or a green that
      # means nothing.
      #
      # So parity is a monorepo gate, run where both implementations are present, and it is the
      # release of this repository - not a run of it - that the CLI is compared against. The two
      # halves above are what CI can prove alone: the detector discriminates in both directions,
      # and it is wired to the catalog end to end.

  # ── log record kinds (Core ADR-0104) ─────────────────────────────────────────────────────────
  # This checker exists because its sibling could not fail. `check-log-schema.py` compares the
  # control file, the Go registry and the standard's frontmatter - three DESCRIPTIONS of the
  # schema - and stayed green for the life of schema v1 while nine of eleven declared record kinds
  # had no emitter and six undeclared kinds were being written under the key `event`. So a
  # self-test that only proved this one runs would repeat the original mistake at one remove.
  #
  # Hence both directions, and a third case the other checkers in this file do not have: the
  # checker is pointed at a tree with no Go in it and must exit 2 rather than 0. That is the exact
  # failure this whole ADR is about - a gate that reads nothing reporting what a clean repository
  # reports - and it is reachable by a plain mistake, because service-ci runs the checker with
  # `--repo-root .` against a repository layout the script has to be told about.
  log-record-kinds:
    name: Log record kinds - catalogue detector self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      # The positive half. Also pins the layout behaviour, which is the part most likely to regress
      # unnoticed: the adoption ratchet asks whether a kind is emitted ANYWHERE, which one
      # repository cannot answer, so it must report itself skipped rather than fail a service for
      # the eleven kinds it does not happen to emit.
      - name: The conformant fixture must pass
        run: |
          set -euo pipefail
          out="$(python3 scripts/check-log-record-kinds.py \
            --repo-root fixtures/log-record-kinds-conformant \
            --layout repo --control controls/log-schema.yaml 2>&1)"
          echo "$out"
          if ! echo "$out" | grep -q "Adoption ratchet skipped"; then
            echo "::error::the adoption ratchet ran against a single repository. It asks whether a"
            echo "::error::kind is emitted anywhere in the fleet, which one repo cannot answer, so"
            echo "::error::every service would fail on the kinds it does not emit."
            exit 1
          fi

      # The negative half, asserted rule by rule. A single "it failed" would pass while two of the
      # three rules had stopped matching, and the copied-middleware rule is the one most likely to
      # go quiet, because it is the only one that fires on a declaration nobody calls.
      - name: Mutation test - the violating fixture must fail every rule
        run: |
          set -euo pipefail
          set +e
          out="$(python3 scripts/check-log-record-kinds.py \
            --repo-root fixtures/log-record-kinds-violating \
            --layout repo --control controls/log-schema.yaml 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::the violating fixture passed; the record-kind detectors are not firing"
            exit 1
          fi
          while IFS='|' read -r rule anchor; do
            if ! echo "$out" | grep -qF "$anchor"; then
              echo "::error::$rule did not fire against the violating fixture"
              exit 1
            fi
          done <<'RULES'
          rule 1 (one discriminator)|is not a record-kind discriminator
          rule 2 (reached through a constructor)|event_name is set by hand
          rule 4 (one access-log implementation)|re-implements the http_request_completed emitter
          rule 5 (one logger interface)|re-declares the logger interface
          RULES
          echo "all four file-reading rules fired as expected (exit $rc)"

      # The third direction. Distinct exit code, because "could not run" and "ran and found
      # violations" call for different responses and a shared code makes the first look like the
      # second until someone reads the log.
      - name: Mutation test - an empty tree must be unrunnable, not clean
        run: |
          set -euo pipefail
          empty="$(mktemp -d)"
          set +e
          out="$(python3 scripts/check-log-record-kinds.py \
            --repo-root "$empty" --layout repo --control controls/log-schema.yaml 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 2 ]; then
            echo "::error::a tree with no Go files exited $rc, expected 2. A gate that reads"
            echo "::error::nothing must not be indistinguishable from one that found nothing."
            exit 1
          fi

  # ── run triage (a refused job against a gate verdict) ────────────────────────────────────────
  # Asserts that the one signal distinguishing "GitHub would not start this job" from "this gate
  # ran and failed" still works, because for 28 minutes on 2026-08-11 nothing did.
  #
  # The organisation's Actions budget was reached with `prevent_further_usage: true`, and GitHub
  # refused 121 jobs across 24 repositories between 07:33:15Z and 08:01:11Z. Eight port-drift pull
  # requests opened inside that window each reported `Resolve service identity` as the failing
  # step and each passed on rerun. That is not flakiness and it is not a resolver defect: the
  # resolve job is the root of service-ci.yaml's graph, so on a fresh run it is the only job that
  # attempts to start, and every other job is then marked `skipped` for a "failed" dependency.
  # Eight identical failures therefore argued for a code bug while being evidence of a hard stop.
  #
  # There is deliberately no retry anywhere in this change. A refusal happens before a runner
  # claims the job, so no step-level retry, `continue-on-error` or in-workflow loop can reach it -
  # and `Notify on failure` is refused by the same budget, so the alert does not fire either.
  # Nothing addable to service-ci.yaml prevents this; only the budget does. What this job protects
  # is the ability to TELL, so the next window is not spent looking for a race that is not there.
  #
  # Both fixtures are captured verbatim from the incident rather than written by hand, because the
  # discriminator is a field GitHub populates and a synthetic fixture would only assert this
  # repository's belief about its shape.
  run-triage:
    name: Run triage - refusal against gate verdict self-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ci-workflows
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      # The positive half, and the one that would have saved the eight misdiagnoses: the real
      # refused attempt must be reported as carrying no verdict, with the distinct exit code.
      - name: A refused attempt must be classified as carrying no verdict
        run: |
          set -euo pipefail
          set +e
          out="$(python3 scripts/classify-run-failure.py \
            --bundle fixtures/run-triage-refused/bundle.json \
            --controls controls/run-triage.yaml 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 75 ]; then
            echo "::error::the refused attempt exited $rc, expected 75. A job GitHub never"
            echo "::error::dispatched must not share an exit code with a gate that ran and failed:"
            echo "::error::the first calls for a billing fix, the second for a code fix."
            exit 1
          fi
          # Asserted per control rather than as "it exited 75", because the resolve job is the one
          # the incident misattributed and the notify job is the reason nobody was told.
          for job in "Resolve service identity" "Notify on failure"; do
            if ! echo "$out" | grep -qF "[refused] RT-0001 ci / $job"; then
              echo "::error::RT-0001 did not fire on '$job'; the billing signature is not matching"
              exit 1
            fi
          done
          if echo "$out" | grep -q "::error::"; then
            echo "::error::a refused attempt reported a gate error; refusals carry no verdict"
            exit 1
          fi

      # The negative half, and the one that keeps the triage from becoming a laundering route: a
      # job the runner actually ran must stay a failure no matter what its annotation says. The
      # fixture's failing job carries an `exit code 1` annotation AND a Node deprecation warning,
      # so this is a real red run rather than a synthetic one.
      - name: Mutation test - a gate that ran must never be excused
        run: |
          set -euo pipefail
          out="$(python3 scripts/classify-run-failure.py \
            --bundle fixtures/run-triage-genuine/bundle.json \
            --controls controls/run-triage.yaml 2>&1)"
          echo "$out"
          if ! echo "$out" | grep -qF "::error::[RT-0003] ci / Repository structure"; then
            echo "::error::RT-0003 did not fire on a job that ran 20 steps and failed. The step"
            echo "::error::array is the only evidence a misleading annotation cannot forge, so if"
            echo "::error::this stops matching, every real violation becomes excusable as billing."
            exit 1
          fi
          if echo "$out" | grep -q "\[refused\]"; then
            echo "::error::a job that ran steps was classified as refused"
            exit 1
          fi
          # The verdict must also COUNT the steps it saw. Classifying correctly while reporting
          # "ran 0 steps" for a 20-step job is a reader-facing lie in the one line a reader uses to
          # decide whether to rerun or read logs, and it is reachable by a fallthrough that keeps
          # the classification right and the evidence wrong.
          if ! echo "$out" | grep -qF "ran 20 step(s)"; then
            echo "::error::RT-0003 fired but did not report the real step count. The evidence line"
            echo "::error::is the whole product here; a correct verdict with invented evidence"
            echo "::error::sends the reader looking in the wrong place."
            exit 1
          fi

      # The fail-closed direction, which no captured fixture exercises because both of them are
      # recognised. GitHub has reworded these annotations before, and the moment it does the
      # refusal arrives in a shape this catalog does not know. Whichever way that unknown is
      # resolved becomes the default for a message nobody has read yet, so it must resolve towards
      # "believe the red X": a wrong "needs fixing" costs an investigation, a wrong "infrastructure,
      # just rerun" costs a merged violation.
      - name: Mutation test - an unrecognised refusal shape must not be excused
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          refused = json.loads(
              pathlib.Path("fixtures/run-triage-refused/bundle.json").read_text())
          for anns in refused["annotations"].values():
              for a in anns:
                  a["message"] = "The job was not started for a reason GitHub has not used before."
          pathlib.Path("/tmp/unknown-bundle.json").write_text(json.dumps(refused))
          PY
          set +e
          out="$(python3 scripts/classify-run-failure.py --bundle /tmp/unknown-bundle.json \
            --controls controls/run-triage.yaml 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ] || echo "$out" | grep -q "\[refused\]"; then
            echo "::error::a zero-step job with an annotation this catalog does not recognise was"
            echo "::error::excused as a refusal. Then any reworded message becomes an automatic"
            echo "::error::'just rerun it', which is how a real failure gets merged. Unknown shapes"
            echo "::error::must fall through to RT-0003 and be reported as needing a human."
            exit 1
          fi
          if ! echo "$out" | grep -qF "::error::[RT-0003]"; then
            echo "::error::the unrecognised shape produced no gate error at all, so it would read"
            echo "::error::as a clean run rather than as something nobody has classified yet"
            exit 1
          fi

      # The step array is what makes RT-0003 true, and the fixtures alone do not pin it: the
      # genuine fixture's annotations contain no billing wording, so deleting the step check from
      # RT-0001 leaves both fixtures classified exactly as before. Mutation testing found that
      # while this job was being written. The hole is not hypothetical - a failing test in
      # inboxxhq-billing-service or inboxxhq-payment-service puts those words in an annotation on
      # a job that really ran - so the guard is asserted directly, against a job carrying twenty
      # steps AND the verbatim refusal text.
      - name: Mutation test - billing wording must not excuse a job that ran steps
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          genuine = json.loads(
              pathlib.Path("fixtures/run-triage-genuine/bundle.json").read_text())
          refused = json.loads(
              pathlib.Path("fixtures/run-triage-refused/bundle.json").read_text())
          billing = next(a for anns in refused["annotations"].values() for a in anns)
          ran = next(j for j in genuine["jobs"] if j["conclusion"] == "failure" and j["steps"])
          # The same job, still red, still 20 steps, now wearing the refusal's annotation.
          genuine["annotations"][str(ran["id"])] = [billing]
          pathlib.Path("/tmp/disguised-bundle.json").write_text(json.dumps(genuine))
          PY
          out="$(python3 scripts/classify-run-failure.py --bundle /tmp/disguised-bundle.json \
            --controls controls/run-triage.yaml 2>&1)"
          echo "$out"
          if echo "$out" | grep -q "\[refused\]"; then
            echo "::error::a job that ran 20 steps was excused as a refusal because its annotation"
            echo "::error::carried billing wording. The step array is the only evidence the runner"
            echo "::error::writes and an annotation cannot forge; if RT-0001 stops consulting it,"
            echo "::error::any red job can be relabelled infrastructure by its own output."
            exit 1
          fi
          if ! echo "$out" | grep -qF "::error::[RT-0003] ci / Repository structure"; then
            echo "::error::RT-0003 did not fire on the disguised job"
            exit 1
          fi

      # The third direction, which neither fixture alone covers and which the incident actually
      # produced: run 31469306219 resolved identity, failed Go formatting for real, and had ten
      # further jobs refused. A triage tool that reports "no verdict" there would tell someone to
      # rerun a run whose formatting failure no rerun can clear.
      - name: Mutation test - a mixed attempt must not be excused as a refusal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          bundle = json.loads(
              pathlib.Path("fixtures/run-triage-refused/bundle.json").read_text())
          genuine = json.loads(
              pathlib.Path("fixtures/run-triage-genuine/bundle.json").read_text())
          ran = next(j for j in genuine["jobs"]
                     if j["conclusion"] == "failure" and j["steps"])
          bundle["jobs"].append(ran)
          bundle["annotations"][str(ran["id"])] = genuine["annotations"][str(ran["id"])]
          pathlib.Path("/tmp/mixed-bundle.json").write_text(json.dumps(bundle))
          PY
          set +e
          out="$(python3 scripts/classify-run-failure.py --bundle /tmp/mixed-bundle.json \
            --controls controls/run-triage.yaml 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::a mixed attempt exited $rc, expected 0. One genuine failure outranks"
            echo "::error::any number of refusals: there is something to fix, so the caller must"
            echo "::error::not be told the run carried no verdict."
            exit 1
          fi
          if ! echo "$out" | grep -q "::warning::mixed attempt"; then
            echo "::error::a mixed attempt was not reported as mixed, so the refused jobs would"
            echo "::error::read as gate verdicts and the genuine one as something a rerun clears"
            exit 1
          fi

  # ── release drift (the major tag against main) ───────────────────────────────────────────────
  # Consumers pin `@v1`, a MOVING major tag. So the fleet does not run what main says; it runs
  # whatever v1 last pointed at, and the two are only equal because somebody moved the tag.
  #
  # Nothing checked that. On 2026-07-29 v1 was seven commits behind main, and one of those commits
  # fixed a control that had been failing this repository's own CI for days. Every consumer kept
  # running the broken version while main was green, because a fix that is merged but not released
  # is indistinguishable from a fix that was never written.
  #
  # This is drift caused by something NOT happening, which is why it needs a check of its own: no
  # commit introduces it, no diff shows it, and no event fires when it gets worse. It runs on the
  # schedule above for that reason, and on main so that the gap is reported at the moment it opens.
  #
  # It fails rather than warns. An unreleased change to central logic is not a housekeeping item -
  # it means the fleet's actual behaviour is undocumented, and the longer it holds the larger the
  # release becomes and the less anyone can reason about what a rollback would restore.
  release-drift:
    name: Release drift - the v1 tag matches main
    runs-on: ubuntu-latest
    # No longer on push. release.yaml now cuts a release for every commit that lands on main, so on
    # push this job asserts something that is false by construction until that release runs - and
    # gating the release on CI while CI contains this job deadlocks: CI cannot pass until the
    # release happens, and the release will not start until CI passes.
    #
    # It keeps the schedule, where its meaning has changed rather than weakened. It used to ask
    # whether a person remembered to move the tag; it now asks whether the automation is working,
    # which is the failure nobody would otherwise notice.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags and full history: the comparison is between two refs, so a shallow clone cannot
          # answer it and would silently report no drift.
          fetch-depth: 0
          fetch-tags: true

      - name: main must not be ahead of the released major tag
        shell: bash
        run: |
          set -uo pipefail
          if ! git rev-parse -q --verify refs/tags/v1 >/dev/null; then
            echo "::error::no v1 tag exists, yet every consumer pins @v1. Cut v1.0.0 and point v1 at it."
            exit 1
          fi
          # Peel both sides to a COMMIT. `v1` may be a lightweight tag (ref points straight at the
          # commit) or an annotated one (ref points at a tag object that wraps it), and which one you
          # get depends on how the tag was last moved: `git tag -f v1 <sha>` produces the former,
          # `git tag -f v1 v1.2.3` the latter, because naming an annotated tag copies the tag object
          # rather than the commit under it. Comparing unpeeled refs therefore reported drift against
          # a correctly released v1 the first time someone moved the tag by version name instead of
          # by sha - the natural way to do it. A guard that cries wolf gets muted, so it resolves what
          # a consumer's `@v1` actually checks out rather than which object the ref happens to hold.
          v1="$(git rev-parse 'refs/tags/v1^{commit}')"
          main="$(git rev-parse 'refs/heads/main^{commit}' 2>/dev/null || git rev-parse 'HEAD^{commit}')"
          if [ "$v1" = "$main" ]; then
            echo "v1 and main agree at ${main:0:7}; the fleet is running what main says."
            exit 0
          fi
          behind="$(git rev-list --count "$v1..$main")"
          ahead="$(git rev-list --count "$main..$v1")"
          if [ "$ahead" -ne 0 ]; then
            echo "::error::v1 (${v1:0:7}) is $ahead commit(s) NOT on main. The tag points at code that" \
                 "main does not contain, so the fleet is running something unreviewable."
            exit 1
          fi
          echo "::error::v1 (${v1:0:7}) is $behind commit(s) behind main (${main:0:7}). Consumers pin" \
               "@v1, so none of these is in effect anywhere:"
          git log --oneline "$v1..$main" | sed 's/^/  /'
          latest="$(git tag -l 'v1.*' | sort -V | tail -1)"
          echo ""
          echo "Release them by cutting the next tag after ${latest:-v1.0.0} and moving the major tag:"
          echo "  git tag -a vX.Y.Z <sha> -m '...' && git push origin vX.Y.Z"
          echo "  git tag -f v1 <sha> && git push --force origin v1"
          exit 1
