name: Reusable Deploy (canonical build + dev pin)

# Central, single-source delivery workflow for the InboxxHQ GitOps platform.
# Consumed by every service/gateway/frontend repo via a ~12-line caller:
#
#   jobs:
#     deploy:
#       uses: coderaxis/ci-workflows/.github/workflows/deploy-reusable.yaml@v1
#       with: { service_name: auth-service }
#
# The caller passes NO secrets — see the `workflow_call` note below. This example used to end in
# `secrets: inherit`, and four callers copied it into an explicit `CROSS_REPO_TOKEN:` forward when
# the secrets block was removed here. Naming a secret this workflow does not declare fails the
# caller's run at startup, so their Deploy had been dead since, in one second and with no log.
#
# Model (RFC-0020 / ADR-0051 — build once, deploy the digest):
#   CI does NOT build. The self-hosted runners have no Docker daemon and are not
#   a publish identity. CI orchestrates the single central build executor
#   (inboxxhq-build CodeBuild): it uploads the immutable source revision, starts
#   the build, and reads back the signed image DIGEST. The build pushes ONCE to
#   the central immutable registry (SBOM + provenance + cosign attestations).
#
#   Dev is merely the FIRST CONSUMER of that digest (pinned into the dev overlay
#   in the infra repo). staging / preprod / prod are NEVER built here — the
#   Promotion Controller promotes the identical digest, gated on Argo CD health.
#   There is no per-environment rebuild path anywhere.
#
#   Single artifact, no variants: the SAME image is promoted to every env. There is
#   no "with-swagger"/"without-swagger" build — swagger is never compiled into the
#   canonical image (GO_BUILD_TAGS=""); developer docs come from local `-tags swagger`
#   builds and the central contract registry, not the deployed service.
#
# DECLARED INPUTS (ADR-0051 §8 — an artifact is a function of its declared, immutable
# inputs). Almost every repo's image is built from that repo alone, and for those
# NOTHING below changes. A repo whose image also composes another repository declares
# that in `.platform/build-inputs.json` (inputs.build_inputs_manifest); this workflow
# then checks each declared input out INSIDE the primary source tree at a pinned ref,
# resolves it to a concrete commit SHA, and reports the complete resolved input set to
# the canonical build as SOURCE_INPUTS. That is what makes the build hermetic — the
# uploaded source revision contains every input, and the Dockerfile never fetches
# anything — and it is what lets the build's cache key and its provenance be functions
# of ALL the inputs rather than of one of them.
#
# This workflow stays generic: it knows "there may be declared inputs", never what any
# of them are.
#
# Versioning: consumers pin @v1 (moving major tag). Breaking changes bump @v2. The
# workflow also exposes a `contract_version` output so callers can assert the behavioral
# contract they built against.
#
# Enforcement (executable governance, not just documentation): the delivery-model
# invariants above — orchestrate-not-build, build once (no per-env/per-variant image),
# dev-only pin, least privilege, main-only, ci-build OIDC role — are machine-verified by
# scripts/check-delivery-model.py via the delivery-model-guard workflow on every change
# to this file. Controls (id/policy/severity) are declared in controls/delivery-model.yaml.
# Policy SSOT is ADR-0051 + RFC-0020; changing the model here without updating the ADR/RFC
# and the catalog fails the guard. Consumer/maintainer guide: README.md ("Delivery model").

on:
  workflow_call:
    inputs:
      service_name:
        description: "Logical service name (overlay dir + image repo suffix), e.g. auth-service."
        required: true
        type: string
      # Named api_ deliberately: build-and-pin already outputs `contract_version`, meaning the
      # behavioural contract version of THIS WORKFLOW. Two unrelated things called the same name
      # in one file is how the wrong one gets wired up.
      api_contract_version:
        description: >-
          Registry version of the API contract this build serves, recorded in the release
          catalogue so an environment can say which contract it is running: the version the
          caller published this run, or the one its unchanged spec already is byte for byte.
          Empty means the caller could not verify one; the field is then omitted rather than
          guessed, because a wrong pointer here is worse than an absent one - it would be
          followed.
        required: false
        type: string
        default: ""
      contract_publication_enabled:
        description: >-
          Whether this service's pipeline is permitted to publish to the contract registry.
          The breaking-change gate needs it because a baseline that CI may never refresh is
          not a contract anyone is serving; it is a document frozen at whatever was last
          written by hand. Enforcing against such a baseline can only block, never protect,
          so the gate reports the comparison as skipped rather than failed. Defaults to true,
          which keeps the strict behaviour for any caller that does not pass it.
        required: false
        type: boolean
        default: true
      aws_region:
        description: "AWS region of the canonical build + central registry."
        required: false
        type: string
        default: us-east-1
      ci_build_role_arn:
        description: "GitHub-OIDC ci-build orchestrator role (start CodeBuild, upload source, read digest). No image push, no cluster, no deploy role."
        required: false
        type: string
        default: arn:aws:iam::063088900996:role/inboxxhq-ci-build
      build_project:
        description: "Canonical build CodeBuild project (environments/management/build). The sole publish identity."
        required: false
        type: string
        default: inboxxhq-build
      infra_repo:
        description: "GitOps infra repo whose dev overlay this pins (owner/name)."
        required: false
        type: string
        default: InboxxHQ-CoderAxis/inboxxhq-infra
      contract_repo:
        description: "API contract registry used by the deploy-time breaking-change gate (owner/name)."
        required: false
        type: string
        default: InboxxHQ-CoderAxis/inboxxhq-api-contracts
      module_release_env:
        description: "Environment name passed to scripts/check_core_module_versions.sh (strictest env the artifact is promoted to)."
        required: false
        type: string
        default: prod
      runner:
        description: "runs-on labels as a JSON array string."
        required: false
        type: string
        default: '["inboxxhq-deploy"]'
      build_inputs_manifest:
        description: >-
          Path, relative to the calling repo, of the declared build-inputs manifest. When the file
          is absent the build has exactly one input (the calling repo) and behaves identically to
          before this input existed — which is the case for every repo that has not opted in.
        required: false
        type: string
        default: .platform/build-inputs.json
    outputs:
      # The reusable workflow is a public API for ~40 consuming repos: version its
      # behavioral contract explicitly. Bump on any breaking change to inputs/outputs
      # or the delivery model (see ADR-0051). Consumers pin @v1 and MAY assert this.
      contract_version:
        description: "Delivery-workflow contract version (e.g. v1). Identifies the behavioral contract independent of the moving @v1 tag."
        value: ${{ jobs.build-and-pin.outputs.contract_version }}
      image_digest:
        description: "Immutable @sha256 digest of the canonical artifact pinned into the dev overlay (the deployment identity promoted unchanged to staging/preprod/prod)."
        value: ${{ jobs.build-and-pin.outputs.image_digest }}
    # No secrets. Delivery now mints every credential it needs from this job's own OIDC identity
    # through ci-app-token, so a caller forwards nothing and holds nothing.
    #
    # This block used to declare CROSS_REPO_TOKEN and GH_PAT, and their removal is the fix for a
    # real outage rather than tidying. service-ci.yaml calls this workflow with no `secrets:`
    # block by design — the platform decides what a caller may mint rather than each caller
    # holding the credential that decides it — so those secrets were always empty, and a preflight
    # step failed every deploy on the absence of something that was never going to arrive.
    #
    # Worse, the contract breaking-change gate treated the same absence as a reason to SKIP with a
    # warning. Since the token was always absent, that gate had never run: a breaking API change
    # would have shipped with the job green.
    #
    # What replaced them, and why three rather than one: `read` for the contract registry and the
    # builder's private modules, and `gitops` for the digest pin. A single credential broad enough
    # for all of them is what a PAT was, and rebuilding that with a shorter lifetime would have
    # missed the point.

permissions:
  contents: read
  id-token: write # GitHub OIDC — assume the ci-build orchestrator role (no long-lived keys)

concurrency:
  group: inboxxhq-${{ github.repository }}-build-${{ github.ref }}
  # Queue the newer run; do NOT cancel the older one. Cancelling here does not cancel what the run
  # has already started — the canonical build is a CodeBuild job launched by an API call, and it
  # keeps running to completion after GitHub stops watching it. So cancel-in-progress produced the
  # exact overlap the group exists to prevent, only with the surviving build now unsupervised:
  #
  #   web-docs, 2026-08-02. A push and a core-docs-updated dispatch fired two minutes apart for one
  #   revision. GitHub cancelled the push run at 2m16s; its build ran on and published the shared
  #   content-addressed tag at 13:38:30. The dispatch run had already probed for that tag before it
  #   existed, so it built for twelve minutes and had its push rejected as immutable at 13:40:49.
  #
  # Waiting costs a queued run. The buildspec's build-once probe then finds the tag the first run
  # published and skips the rebuild entirely, so the second run is short rather than duplicated.
  cancel-in-progress: false

# The pool's runner image ships Debian's python, which refuses `pip install` into the system
# site-packages (PEP 668, "externally-managed-environment"). The lanes install small pure-python
# tools per job on an ephemeral runner, which is exactly the case the flag exists for.
env:
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  # Identity is derived here, not accepted. Inside a reusable workflow GITHUB_REPOSITORY_ID is
  # the ORIGINAL caller, so calling this workflow directly gains nothing: a repo always resolves
  # to its own catalog-bound identity and cannot publish as another service.
  resolve:
    name: Resolve service identity
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    outputs:
      service: ${{ steps.id.outputs.service }}
      deployable: ${{ steps.id.outputs.deployable }}
    steps:
      - name: Derive identity from the immutable repository id
        id: id
        uses: coderaxis/ci-workflows/resolve-service-identity@v1
        with:
          assert-service: ${{ inputs.service_name }}

      - name: Refuse to build a non-deployable repository
        if: steps.id.outputs.deployable != 'true'
        shell: bash
        run: |
          echo "::error::${{ steps.id.outputs.service }} resolved to a non-deployable repository"
          echo "::error::(a core module). Delivery only publishes service, gateway and bff repos."
          exit 1

  contract-gate:
    needs: resolve
    name: Contract Gate (breaking-change detection)
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      - name: Preflight (is a contract owed?)
        id: preflight
        shell: bash
        env:
          CONTRACT_REPO: ${{ inputs.contract_repo }}
        run: |
          set -euo pipefail

          # The registry slug is split here rather than in the `with:` block below because
          # GitHub's expression language has no split(): `owner/name` can only be taken apart
          # by a shell.
          echo "registry_owner=${CONTRACT_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "registry_name=${CONTRACT_REPO##*/}" >> "$GITHUB_OUTPUT"
          # The gate only applies to OpenAPI services. Gateways/frontends without a
          # committed spec are skipped rather than failed.
          #
          # Token availability used to be the other half of this condition, and a missing token
          # downgraded the gate to a warning. That is the fail-open shape: a breaking API change
          # would ship while the job reported success, and the only trace was a warning nobody
          # reads. The token is now minted from this job's own OIDC identity, so it is either
          # there or the step fails — there is no state in which the gate silently does nothing.
          if [[ ! -f docs/openapi.json ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No docs/openapi.json — not an OpenAPI service; skipping contract gate"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Scoped to the registry alone. The gate reads one published contract, so an
      # installation-wide token would be broader than the one call it makes.
      - name: Mint a token for the contract registry
        id: registry_token
        if: steps.preflight.outputs.run == 'true'
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: ${{ steps.preflight.outputs.registry_owner }}
          repositories: ${{ steps.preflight.outputs.registry_name }}

      # Which contract dev is serving right now, from the release catalogue. This job pins dev,
      # so dev is the environment whose consumers a breaking change would reach.
      - name: Mint a token for the release catalogue
        id: infra_token
        if: steps.preflight.outputs.run == 'true'
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: InboxxHQ-CoderAxis
          repositories: inboxxhq-infra

      - name: Resolve the contract released in dev
        id: released
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        env:
          INFRA_TOKEN: ${{ steps.infra_token.outputs.token }}
          SERVICE: ${{ needs.resolve.outputs.service }}
        run: |
          set -euo pipefail
          # Sparse and blobless: the catalogue is a few hundred small files in a repository that
          # also carries every environment's Terraform, and this job needs one directory of it.
          #
          # Retry on failure: freshly minted GitHub App installation tokens are eventually
          # consistent and can 404 on git operations for a few seconds while propagating to all
          # edge cache sites. GitHub returns 404 (not 403) for private repos to avoid disclosing
          # existence, so propagation lag and permission denial are indistinguishable from exit
          # code alone. 3 attempts with backoff (3s, 6s) - tight enough that a genuine permanent
          # 404 still fails fast, long enough to absorb the observed propagation window.
          ATTEMPT=1
          MAX_ATTEMPTS=3
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if git clone --quiet --depth 1 --filter=blob:none --sparse \
              "https://x-access-token:${INFRA_TOKEN}@github.com/InboxxHQ-CoderAxis/inboxxhq-infra.git" /tmp/infra 2>/tmp/clone-error.txt; then
              break
            fi
            CLONE_ERROR=$(cat /tmp/clone-error.txt)
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              BACKOFF=$((3 * ATTEMPT))
              echo "::warning::git clone failed (attempt $ATTEMPT/$MAX_ATTEMPTS): $CLONE_ERROR"
              echo "::warning::Retrying in ${BACKOFF}s (App token propagation can take a few seconds)..."
              sleep $BACKOFF
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "::error::Failed to clone InboxxHQ-CoderAxis/inboxxhq-infra after $MAX_ATTEMPTS attempts: $CLONE_ERROR"
              echo "::error::A 404 from an authenticated App token means either:"
              echo "::error::  1. Token propagation delay (if this is the first attempt after minting)"
              echo "::error::  2. Missing Contents:Read permission (check the 'Mint installation token' step above)"
              echo "::error::If 'permissions:' shows 'contents:read', this is propagation or an outage, not permissions."
              echo "::error::If 'permissions:' shows only 'metadata:read', the App installation needs to accept updated permissions."
              exit 1
            fi
          done
          git -C /tmp/infra sparse-checkout set releases >/dev/null

          # Most recently promoted release of this service that dev actually has. `last_promoted_at`
          # rather than file order, because promotion rewrites entries in place and a rollback moves
          # an older release forward.
          #
          # Releases with no recorded version are skipped rather than treated as "unknown, give up",
          # and that is correct rather than merely convenient: once publication is enabled, a build
          # records no version precisely when it published nothing, and it publishes nothing exactly
          # when the spec did not change. So the last recorded version is still what dev serves. The
          # case this would get wrong is a service whose publication was switched off midway, which
          # is a configuration change rather than something a deploy can infer.
          version="$(jq -rs '
            map(select(.service == $svc and (.deployed_envs // [] | index("dev"))))
            | map(select(.contract_version))
            | sort_by(.last_promoted_at // .created_at)
            | last // {}
            | .contract_version // ""' --arg svc "${SERVICE}" /tmp/infra/releases/*.json 2>/dev/null || echo "")"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [ -n "${version}" ]; then
            echo "dev is serving ${SERVICE} contract ${version}"
          else
            echo "No contract version recorded for ${SERVICE} in dev."
          fi

      - name: Fetch the baseline to compare against
        id: baseline
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ steps.registry_token.outputs.token }}
          RELEASED: ${{ steps.released.outputs.version }}
          PUBLISHED_THIS_RUN: ${{ inputs.api_contract_version }}
          PUBLICATION_ENABLED: ${{ inputs.contract_publication_enabled }}
          SERVICE: ${{ needs.resolve.outputs.service }}
        run: |
          set -euo pipefail
          # Which document is a fair baseline depends on whether this run just moved latest.json.
          #
          #  - dev has a recorded contract  -> compare against exactly that. The question a deploy
          #    asks is whether it breaks what THIS environment's consumers see.
          #  - it does not, this run published nothing, and publication is DISABLED -> latest.json
          #    is a baseline no environment serves and no run may refresh, so it can only drift
          #    further from the code. Nothing can be protected by comparing against it.
          #  - it does not, and this run published nothing -> latest.json is still someone else's
          #    document and remains a real comparison, which is the behaviour that existed before
          #    any of this and is worth keeping while the catalogue fills up.
          #  - it does not, and this run DID publish -> latest.json is now a copy of the very spec
          #    being judged. Comparing them would pass for every possible change. Report that the
          #    comparison did not happen instead of reporting that it passed.
          # `dangling` separates the two reasons the fetch below can come back empty-handed, which
          # are not the same failure and must not share a verdict. A version the catalogue names
          # is a promise the registry is supposed to keep, so its absence is a genuine
          # disagreement. latest.json is not promised by anything: publication is opt-in per
          # service, so a service that never had it enabled has no baseline to be missing.
          if [ -n "${RELEASED}" ]; then
            path="${SERVICE}/${RELEASED}.json"
            label="the contract released in dev (${RELEASED})"
            dangling=true
          elif [ -z "${PUBLISHED_THIS_RUN}" ] && [ "${PUBLICATION_ENABLED}" != "true" ]; then
            # Nothing recorded for dev AND this pipeline may not publish. latest.json is then a
            # document that no environment serves and that no run is permitted to replace, so it
            # can only ever go further out of date. Enforcing against it does not protect a
            # consumer - there is none - it just prevents the spec from ever changing again.
            # Deliberately narrow: the moment dev records a contract the branch above takes over
            # and compares strictly, and the moment publication is enabled the branch below does.
            echo "compare=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${SERVICE} has no contract recorded for dev and contract publication is disabled for it, so ${SERVICE}/latest.json is a baseline nothing serves and no run may refresh. The breaking-change comparison is SKIPPED, not passed; it starts working once publication is enabled or dev has one recorded deploy."
            exit 0
          elif [ -z "${PUBLISHED_THIS_RUN}" ]; then
            path="${SERVICE}/latest.json"
            label="the published contract (nothing released recorded for dev yet)"
            dangling=false
          else
            echo "compare=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${SERVICE} has no contract recorded for dev, and this spec is ${PUBLISHED_THIS_RUN} in the registry (published this run or already there), so latest.json is this same document. The breaking-change comparison is SKIPPED, not passed; it starts working once dev has one recorded deploy."
            exit 0
          fi

          # Read the status rather than using --fail, because --fail collapses "the registry does
          # not have this document" and "the registry did not answer" into one exit code. They
          # need opposite handling: an absent baseline can be a legitimate state, an unusable
          # registry never is, and reporting a revoked token as a missing contract sends whoever
          # reads the run to the wrong repository.
          status="$(curl -sSL -o /tmp/published-contract.json -w '%{http_code}' \
                      -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
                      -H "Accept: application/vnd.github.raw" \
                      "https://api.github.com/repos/${{ inputs.contract_repo }}/contents/${path}")" \
                    || status="000"

          if [ "${status}" = "200" ]; then
            echo "compare=true" >> "${GITHUB_OUTPUT}"
            echo "Comparing against ${label} ($(wc -c < /tmp/published-contract.json) bytes)"
            exit 0
          fi

          if [ "${status}" != "404" ]; then
            echo "::error::Reading ${path} from ${{ inputs.contract_repo }} returned HTTP ${status}. The registry is unreachable or this job's token cannot read it; that is not a verdict on the contract, so the gate fails rather than assuming either answer."
            exit 1
          fi

          if [ "${dangling}" = "true" ]; then
            echo "::error::${path} is recorded as released in dev but is not in the registry. A release pointer that resolves to nothing means the catalogue and the registry disagree."
            exit 1
          fi

          echo "compare=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::${SERVICE} has never published a contract to ${{ inputs.contract_repo }}, so there is no baseline to compare against and nothing this deploy can break for an existing consumer. The comparison is SKIPPED, not passed; it starts working on the first published spec."

      - name: Set up Go (for oasdiff)
        if: steps.baseline.outputs.compare == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: false

      - name: Install oasdiff
        if: steps.baseline.outputs.compare == 'true'
        run: |
          go install github.com/oasdiff/oasdiff@v1.11.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # What contract this deploy carries, so the step below can tell a break that was
      # declared from one that was not. api_contract_version names the version this spec is
      # in the registry (published this run, or already there byte for byte); when the caller
      # could not verify one, the version on file in the registry is still the best answer.
      - name: Resolve the contract version being deployed
        id: deploying
        if: steps.baseline.outputs.compare == 'true'
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ steps.registry_token.outputs.token }}
          PUBLISHED_THIS_RUN: ${{ inputs.api_contract_version }}
          SERVICE: ${{ needs.resolve.outputs.service }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLISHED_THIS_RUN}" ]; then
            echo "version=${PUBLISHED_THIS_RUN}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          version="$(curl -sSL \
                       -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
                       -H "Accept: application/vnd.github.raw" \
                       "https://api.github.com/repos/${{ inputs.contract_repo }}/contents/${SERVICE}/VERSION" \
                     | tr -d '[:space:]')" || version=""
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Detect breaking changes
        if: steps.baseline.outputs.compare == 'true'
        shell: bash
        env:
          BASELINE_VERSION: ${{ steps.released.outputs.version }}
          DEPLOYING_VERSION: ${{ steps.deploying.outputs.version }}
          SERVICE: ${{ needs.resolve.outputs.service }}
        run: |
          set -euo pipefail
          if oasdiff breaking \
               /tmp/published-contract.json \
               docs/openapi.json \
               --fail-on ERR; then
            echo "No breaking changes detected — safe to deploy"
            exit 0
          fi

          # A break under the same major is what this gate is for: nothing declared it, so
          # it reaches dev's consumers unannounced. A break across a major boundary is the
          # opposite case. The publish gate refuses a breaking spec outright and names its
          # one remedy - a major bump of the registry VERSION - so a contract that arrives
          # here with a higher major has already been through that refusal and been
          # deliberately released as a break. Failing it again does not add a review; it
          # makes the remedy the other gate demands impossible to complete, because the
          # environment can never take the version that carries it.
          #
          # So the findings are still printed, and still on the record. What changes is
          # only whether an already-declared break may reach the environment it was
          # declared for.
          major() { printf '%s' "${1#v}" | cut -d. -f1; }
          base_major="$(major "${BASELINE_VERSION}")"
          new_major="$(major "${DEPLOYING_VERSION}")"

          if [ -n "${base_major}" ] && [ -n "${new_major}" ] \
             && [ "${new_major}" -gt "${base_major}" ] 2>/dev/null; then
            echo "::warning::${SERVICE} ${DEPLOYING_VERSION} breaks ${BASELINE_VERSION}, which dev is serving. The major bump declares it, so the deploy proceeds — consumers of ${BASELINE_VERSION} must be migrated."
            exit 0
          fi

          echo "::error::${SERVICE} ${DEPLOYING_VERSION:-(unknown)} breaks ${BASELINE_VERSION:-(unknown)}, which dev is serving, without a major bump to declare it. An intentional break needs a major bump of ${SERVICE}/VERSION in ${{ inputs.contract_repo }}; an unintentional one needs the spec fixed here."
          exit 1

  build-and-pin:
    name: Build canonical artifact + pin dev
    needs: [resolve, contract-gate]
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      contract_version: ${{ steps.contract.outputs.version }}
      image_digest: ${{ steps.build.outputs.image_digest }}
    steps:
      # Behavioral contract version of this reusable workflow (surfaced as a
      # workflow_call output). Bump when inputs/outputs or the delivery model change.
      - name: Declare delivery contract version
        id: contract
        shell: bash
        run: echo "version=v1" >> "$GITHUB_OUTPUT"

      - name: Validate deployment source branch
        shell: bash
        run: |
          set -euo pipefail
          # Trunk-based, single-main: the canonical artifact is built from main.
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::builds must run from main (single-branch trunk); got ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout service repo
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}

      # --- declared build inputs -------------------------------------------------------------
      # Read + schema-validate the calling repo's manifest. Kept inline rather than in a script
      # under scripts/: only the CALLING repo is checked out here, so a script in this repo would
      # not be on disk. No manifest => count=0 => every step below is a no-op and the build is
      # exactly the single-input build it has always been.
      - name: Read declared build inputs
        id: declared
        shell: bash
        env:
          MANIFEST_REL: ${{ inputs.build_inputs_manifest }}
        run: |
          set -euo pipefail
          MANIFEST="${{ github.event.repository.name }}/${MANIFEST_REL}"
          if [[ ! -f "${MANIFEST}" ]]; then
            {
              echo "count=0"
              echo "plan=[]"
              echo "owner="
            } >> "${GITHUB_OUTPUT}"
            echo "No ${MANIFEST_REL} in this repo — single-input build (the case for every repo that has not opted in)."
            exit 0
          fi
          echo "Declared build inputs: ${MANIFEST}"
          python3 - "${MANIFEST}" <<'PY' >> "${GITHUB_OUTPUT}"
          import json, re, sys
          from pathlib import PurePosixPath

          path = sys.argv[1]
          try:
              doc = json.loads(open(path, encoding="utf-8").read())
          except Exception as exc:
              sys.exit(f"::error::declared build inputs: {path} is not valid JSON: {exc}")
          if not isinstance(doc, dict) or doc.get("version") != 1:
              sys.exit(f"::error::declared build inputs: {path}: 'version' must be 1")
          entries = doc.get("inputs")
          if not isinstance(entries, list) or not entries:
              sys.exit(f"::error::declared build inputs: {path}: 'inputs' must be a non-empty list")

          repo_re = re.compile(r"^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$")
          plan, owners, seen = [], set(), set()
          for i, entry in enumerate(entries):
              where = f"{path}: inputs[{i}]"
              if not isinstance(entry, dict):
                  sys.exit(f"::error::declared build inputs: {where} must be an object")
              repo, ref, dest = entry.get("repo"), entry.get("ref"), entry.get("path")
              if not isinstance(repo, str) or not repo_re.match(repo):
                  sys.exit(f"::error::declared build inputs: {where}.repo must be 'owner/name'; got {repo!r}")
              if not isinstance(ref, str) or not ref.strip():
                  sys.exit(f"::error::declared build inputs: {where}.ref must be a non-empty string")
              if not isinstance(dest, str) or not dest.strip():
                  sys.exit(f"::error::declared build inputs: {where}.path must be a non-empty string")
              # The checkout must land INSIDE the primary source tree, so the existing tar step
              # picks it up unchanged and the uploaded revision really is the whole build context.
              parts = PurePosixPath(dest).parts
              if dest.startswith("/") or ".." in parts or dest.strip() in (".", "./"):
                  sys.exit(f"::error::declared build inputs: {where}.path must be relative and inside the repo; got {dest!r}")
              if dest in seen:
                  sys.exit(f"::error::declared build inputs: {where}.path {dest!r} is declared twice")
              seen.add(dest)
              owners.add(repo.split("/", 1)[0])
              plan.append({"repo": repo, "ref": ref, "path": dest})

          # A GitHub App is installed per account, so inputs spanning N owners need N installation
          # tokens. `owner` stays the PRIMARY owner so the single-owner path below is byte-for-byte
          # what it has always been; `extra_owners` is non-empty only for a genuinely cross-owner
          # manifest, which is the only case that takes the additional-mint path.
          ordered = sorted(owners)
          print(f"count={len(plan)}")
          print(f"owner={ordered[0]}")
          print("extra_owners=" + ",".join(ordered[1:]))
          print("plan=" + json.dumps(plan, separators=(",", ":"), sort_keys=True))
          PY

      # Short-lived (~1h) App installation token, minted only when something is actually declared.
      # This is the platform's cross-org READ credential (module-auth/action.yaml wraps the same
      # action for private Go modules); the underlying action is used directly here because this
      # job needs a token for a clone, not a global `git config url.insteadOf` rewrite left behind
      # on a shared self-hosted runner.
      - name: Mint a read token for the declared inputs
        id: input_token
        if: steps.declared.outputs.count != '0'
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: ${{ steps.declared.outputs.owner }}

      # Only a manifest whose inputs span more than one owner reaches this step. A GitHub App is
      # installed per account, so a second owner is a second installation and therefore a second
      # token. The broker mints all of them from this job's own OIDC identity and writes them to a
      # 0600 file, so no App private key is handled here — this block used to sign the App JWT
      # itself from a forwarded key.
      - name: Mint read tokens for additional owners
        id: extra_tokens
        if: steps.declared.outputs.extra_owners != ''
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: ${{ steps.declared.outputs.owner }}
          extra-owners: ${{ steps.declared.outputs.extra_owners }}

      # Always runs: even a single-input build declares its input set, so provenance can state it
      # rather than leave it implied. `ref` is the input SPECIFICATION (a branch is fine); the
      # resolved SHA is what identity and provenance are built from.
      - name: Resolve declared build inputs to immutable revisions
        id: inputs
        shell: bash
        env:
          APP_TOKEN: ${{ steps.input_token.outputs.token }}
          PRIMARY_OWNER: ${{ steps.declared.outputs.owner }}
          EXTRA_TOKEN_FILE: ${{ steps.extra_tokens.outputs.tokens-file }}
          PLAN: ${{ steps.declared.outputs.plan }}
        run: |
          set -euo pipefail
          SERVICE_DIR="${{ github.event.repository.name }}"
          RESOLVED="${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # Each input is fetched with the token for ITS owner. With one owner that is the primary
          # token for every input, exactly as before.
          token_for() {
            local owner="${1}"
            if [[ "${owner}" == "${PRIMARY_OWNER}" || -z "${EXTRA_TOKEN_FILE}" ]]; then
              printf '%s' "${APP_TOKEN}"
            else
              jq -re --arg o "${owner}" '.[$o]' "${EXTRA_TOKEN_FILE}"
            fi
          }
          while IFS=$'\t' read -r repo ref dest; do
            [[ -n "${repo}" ]] || continue
            target="${GITHUB_WORKSPACE}/${SERVICE_DIR}/${dest}"
            rm -rf "${target}"
            mkdir -p "${target}"
            git init --quiet "${target}"
            token="$(token_for "${repo%%/*}")"
            git -C "${target}" remote add origin "https://x-access-token:${token}@github.com/${repo}.git"
            # One fetch form for all three kinds of ref (branch, tag, full SHA).
            git -C "${target}" fetch --quiet --depth 1 origin "${ref}"
            git -C "${target}" checkout --quiet FETCH_HEAD
            sha="$(git -C "${target}" rev-parse HEAD)"
            # The git metadata is not a build input, and it holds the token we just used. Dropping
            # it also leaves the existing tar step below completely untouched.
            rm -rf "${target}/.git"
            echo "  ${repo}@${ref} -> ${sha}  (${SERVICE_DIR}/${dest})"
            RESOLVED="${RESOLVED} ${repo}@${sha}"
          done < <(printf '%s' "${PLAN}" | jq -r '.[] | [.repo, .ref, .path] | @tsv')
          # Sorted, so the same input set always serialises identically no matter what order it was
          # declared or resolved in. Pipe-separated because the AWS CLI splits shorthand structures
          # on whitespace.
          SOURCE_INPUTS="$(printf '%s' "${RESOLVED}" | tr ' ' '\n' | LC_ALL=C sort | paste -sd'|' -)"
          echo "source_inputs=${SOURCE_INPUTS}" >> "${GITHUB_OUTPUT}"
          echo "Declared input set: ${SOURCE_INPUTS}"

      - name: Enforce core module release policy
        shell: bash
        working-directory: ${{ github.event.repository.name }}
        # The canonical artifact is promoted to prod unchanged, so it must satisfy
        # the strictest (prod) module-release policy at build time. Skipped for repos
        # without the check (e.g. frontends).
        run: |
          set -euo pipefail
          if [[ -x ./scripts/check_core_module_versions.sh ]]; then
            ./scripts/check_core_module_versions.sh "${{ inputs.module_release_env }}"
          else
            echo "No scripts/check_core_module_versions.sh — skipping core module release policy"
          fi

      # OIDC (no long-lived keys): assume the ci-build ORCHESTRATOR identity
      # (environments/management/ci-identity). It may only upload the source
      # tarball and start/read the canonical build — it cannot push images,
      # touch clusters, or assume any deploy/terraform role.
      - name: Configure AWS credentials (OIDC — ci-build)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ci_build_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-${{ needs.resolve.outputs.service }}-build

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then aws --version; exit 0; fi
          python3 -m pip install --user --upgrade awscli
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/aws" --version

      - name: Package + upload immutable source revision
        id: source
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          SERVICE_DIR="${{ github.event.repository.name }}"
          TMP_TARBALL="/tmp/${SERVICE_DIR}-${GITHUB_RUN_ID}.tgz"
          # Unchanged by the declared-inputs work, and that is the point: inputs are checked out
          # INSIDE ${SERVICE_DIR} with their .git removed, so this command already captures every
          # one of them. What goes to S3 is the complete build context — the build fetches nothing.
          tar -czf "${TMP_TARBALL}" \
            --exclude="${SERVICE_DIR}/.git" \
            --exclude="${SERVICE_DIR}/node_modules" \
            --exclude="${SERVICE_DIR}/coverage.out" \
            --exclude="${SERVICE_DIR}/.tmp" \
            -C "${GITHUB_WORKSPACE}" "${SERVICE_DIR}"
          BUCKET="inboxxhq-terraform-ci-artifacts-$(aws sts get-caller-identity --query Account --output text)"
          if ! aws s3 ls "s3://${BUCKET}" >/dev/null 2>&1; then
            aws s3 mb "s3://${BUCKET}" --region "${AWS_REGION}" >/dev/null
            aws s3api put-public-access-block --bucket "${BUCKET}" --public-access-block-configuration '{"BlockPublicAcls":true,"IgnorePublicAcls":true,"BlockPublicPolicy":true,"RestrictPublicBuckets":true}' >/dev/null 2>&1 || true
          fi
          # Content-addressed by commit so the canonical build is idempotent.
          SOURCE_URI="s3://${BUCKET}/canonical-build/${SERVICE_DIR}/${GITHUB_SHA}/source.tgz"
          aws s3 cp "${TMP_TARBALL}" "${SOURCE_URI}" >/dev/null
          echo "source_uri=${SOURCE_URI}" >> "${GITHUB_OUTPUT}"

      # The image build resolves private github.com/coderaxis modules, so the builder needs a
      # read credential. This is minted separately from the declared-inputs token above because
      # that one only exists when a build-inputs manifest declares something, which most services
      # do not — the modules, by contrast, are fetched by every Go build there is.
      - name: Mint module-read token for the builder
        id: module_token
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read

      - name: Run canonical build (build once -> central registry -> signed digest)
        id: build
        shell: bash
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          BUILD_PROJECT: ${{ inputs.build_project }}
          SERVICE_NAME: ${{ needs.resolve.outputs.service }}
          GITHUB_TOKEN: ${{ steps.module_token.outputs.token }}
          # Enough to carry a Docker build's failing step and its output, which is what the tail
          # usually has to show; small enough that the step log stays readable.
          BUILD_LOG_TAIL_LINES: "120"
        run: |
          set -euo pipefail
          SERVICE_DIR="${{ github.event.repository.name }}"
          # SOURCE_INPUTS declares the complete, resolved input set. It is a FACT this job is the
          # only one able to establish, because this job performs the checkouts. It is deliberately
          # NOT accompanied by an IMAGE_TAG: the cache key is derived by the buildspec, which is the
          # only component that knows the other things the key must cover (its own BUILDER_VERSION
          # and the build args it passes). Splitting it any other way would mean two components
          # having to agree on a formula, which is exactly how a cache key silently goes wrong.
          BUILD_ID="$(aws codebuild start-build \
            --region "${AWS_REGION}" \
            --project-name "${BUILD_PROJECT}" \
            --environment-variables-override \
              "name=SERVICE_NAME,value=${SERVICE_NAME},type=PLAINTEXT" \
              "name=SERVICE_DIR,value=${SERVICE_DIR},type=PLAINTEXT" \
              "name=SOURCE_TARBALL_S3_URI,value=${{ steps.source.outputs.source_uri }},type=PLAINTEXT" \
              "name=SOURCE_COMMIT,value=${GITHUB_SHA},type=PLAINTEXT" \
              "name=SOURCE_INPUTS,value=${{ steps.inputs.outputs.source_inputs }},type=PLAINTEXT" \
              "name=GITHUB_TOKEN,value=${GITHUB_TOKEN},type=PLAINTEXT" \
            --query 'build.id' --output text)"
          echo "Canonical build started: ${BUILD_ID}"
          describe() { aws codebuild batch-get-builds --region "${AWS_REGION}" --ids "${BUILD_ID}"; }
          DEEPLINK="$(describe | jq -r '.builds[0].logs.deepLink // empty')"
          if [[ -n "${DEEPLINK}" ]]; then
            echo "CodeBuild: ${DEEPLINK}"
          fi
          BUILD_JSON=""
          while :; do
            BUILD_JSON="$(describe)"
            STATUS="$(printf '%s' "${BUILD_JSON}" | jq -r '.builds[0].buildStatus // empty')"
            case "${STATUS}" in
              SUCCEEDED) echo "Canonical build SUCCEEDED"; break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "::error::canonical build ${STATUS}"
                # Everything below is the failure report. Without it this step's entire account of
                # a failed build is the status word above and a console deeplink, and reading that
                # deeplink needs AWS credentials for the management account — so the person looking
                # at the red run is usually not the person who can find out why it is red.
                #
                # None of it may fail the step: the build has already failed and exit 1 below is the
                # outcome. A missing permission or a rotated-away log stream must degrade to less
                # detail, never to a different error than the real one.
                printf '%s' "${BUILD_JSON}" | jq -r '
                  .builds[0].phases[]?
                  | select(.phaseStatus != null and .phaseStatus != "SUCCEEDED")
                  | "failed phase: \(.phaseType) (\(.phaseStatus))"
                    + (if (.contexts[0].message // "") != "" then "\n\(.contexts[0].message)" else "" end)
                ' || true
                LOG_GROUP="$(printf '%s' "${BUILD_JSON}" | jq -r '.builds[0].logs.groupName // empty')"
                LOG_STREAM="$(printf '%s' "${BUILD_JSON}" | jq -r '.builds[0].logs.streamName // empty')"
                if [[ -n "${LOG_GROUP}" && -n "${LOG_STREAM}" ]]; then
                  echo "--- last ${BUILD_LOG_TAIL_LINES} lines of ${LOG_GROUP}/${LOG_STREAM} ---"
                  # No --start-from-head, so this is the tail. The build's own error is the last
                  # thing it printed, which is the part that names a broken step or a rejected push.
                  aws logs get-log-events \
                    --region "${AWS_REGION}" \
                    --log-group-name "${LOG_GROUP}" \
                    --log-stream-name "${LOG_STREAM}" \
                    --limit "${BUILD_LOG_TAIL_LINES}" \
                    --no-cli-pager \
                    --query 'events[].message' \
                    --output text 2>&1 \
                    || echo "(build log unreadable from here; the deploy role may lack logs:GetLogEvents)"
                fi
                exit 1
                ;;
              *) sleep 15 ;;
            esac
          done
          IMAGE_REF="$(printf '%s' "${BUILD_JSON}" | jq -r '.builds[0].exportedEnvironmentVariables[]? | select(.name=="IMAGE_REF") | .value')"
          IMAGE_DIGEST="$(printf '%s' "${BUILD_JSON}" | jq -r '.builds[0].exportedEnvironmentVariables[]? | select(.name=="IMAGE_DIGEST") | .value')"
          if [[ -z "${IMAGE_REF}" || -z "${IMAGE_DIGEST}" ]]; then
            echo "::error::canonical build did not export IMAGE_REF/IMAGE_DIGEST"
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"
          echo "image_digest=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Canonical artifact: ${IMAGE_REF}"

      # Same reason as the registry slug above: the expression language cannot split `owner/name`.
      - name: Split the infra repository slug
        id: infra
        shell: bash
        env:
          INFRA_REPO: ${{ inputs.infra_repo }}
        run: |
          set -euo pipefail
          echo "owner=${INFRA_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${INFRA_REPO##*/}" >> "$GITHUB_OUTPUT"

      # The one write this pipeline performs outside its own repository, and it has an identity of
      # its own rather than borrowing one. The obvious alternative was the release bot, which can
      # already write across the estate — and that is exactly why it was not used: a deploy that
      # can tag releases and open pull requests anywhere is a much larger thing to have subverted
      # than a deploy that can commit a digest to one overlay.
      #
      # The bound is enforced twice over. Terraform decides who may READ this App's key, and only
      # this workflow may; the App's own installation decides what the key is GOOD FOR, and it
      # selects inboxxhq-infra alone. Narrowing `repositories` here is the third, weakest layer -
      # useful, but it is not what makes this safe.
      #
      # environments/management/ci-identity must list this workflow in gitops_workflows_v1 or the
      # mint fails with AccessDenied, and renaming this file revokes the grant silently.
      - name: Mint a token that may pin the digest
        id: pin_token
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: gitops
          owner: ${{ steps.infra.outputs.owner }}
          repositories: ${{ steps.infra.outputs.name }}

      - name: Pin digest into dev overlay (first consumer)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.pin_token.outputs.token }}
          SERVICE_NAME: ${{ needs.resolve.outputs.service }}
          INFRA_REPO: ${{ inputs.infra_repo }}
        run: |
          set -euo pipefail
          # Retried because the token is seconds old, and a freshly minted installation token is not
          # yet honoured by every GitHub replica that might serve this clone. The denial arrives as
          # "Repository not found" -- byte for byte the 404 returned for a repository the App was
          # never granted -- so a race reads as a misconfiguration and sends you looking at the App.
          #
          # web-docs, 2026-08-02: this step 404'd 0.24s after the mint, and an identical re-run
          # eleven minutes later cloned first try, same slug, same App, same one-repo scope, nothing
          # changed in between. What made it expensive is where it sits: the image was already built,
          # pushed and signed, so a blip discarded the whole run and left the overlay unpinned for a
          # build that had succeeded. The push below has been retried against races all along; the
          # clone that has to happen first was the one unguarded call in the step.
          cloned=""
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPO}.git" /tmp/platform-infra; then
              cloned="yes"; break
            fi
            # A partial clone would make the next attempt fail on a non-empty target for a reason
            # that has nothing to do with why this one failed.
            rm -rf /tmp/platform-infra
            if [ "${attempt}" -lt 5 ]; then sleep $(( attempt * 3 )); fi
          done
          if [ -z "${cloned}" ]; then
            echo "::error::cannot clone ${INFRA_REPO} with the minted gitops token (5 attempts over 30s)"
            # Worth stating what this is NOT, because the 404 invites the wrong search. The mint
            # above already asked for a token scoped to this one repository, and GitHub refuses that
            # request outright if the repository is not in the installation -- so reaching this line
            # means the App does hold the grant. What is left is Contents dropped to read or revoked,
            # the repository renamed or transferred out from under inputs.infra_repo, or an org IP
            # allow list that does not admit GitHub-hosted runners.
            echo "The grant itself is intact (the mint would have failed otherwise). Check Contents: write on the"
            echo "inboxxhq-gitops-pin App, that ${INFRA_REPO} still resolves, and the org IP allow list."
            exit 1
          fi
          cd /tmp/platform-infra
          git config user.email "ci-bot@inboxxhq.com"
          git config user.name "inboxxhq-ci"
          # Many services can pin concurrently; only this service's own overlay
          # file changes, so retry against the freshest main with jittered backoff.
          pushed=""
          deadline=$(( $(date +%s) + 600 ))
          attempt=0
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            attempt=$((attempt + 1))
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            bash scripts/gitops-set-image.sh "${SERVICE_NAME}" dev "${{ steps.build.outputs.image_ref }}"
            CONTRACT_VERSION="${{ inputs.api_contract_version }}" \
              bash scripts/write-release-metadata.sh "${SERVICE_NAME}" dev "${{ steps.build.outputs.image_ref }}" "${GITHUB_SHA}"
            git add -A
            if git diff --cached --quiet; then
              echo "dev already pinned to ${{ steps.build.outputs.image_digest }}; nothing to commit"
              pushed="noop"; break
            fi
            git commit -q -m "deploy(${SERVICE_NAME}/dev): ${{ steps.build.outputs.image_digest }}"
            if git push --quiet origin HEAD:main 2>/dev/null; then
              echo "Pinned ${SERVICE_NAME}/dev -> ${{ steps.build.outputs.image_ref }} (attempt ${attempt})"
              pushed="yes"; break
            fi
            echo "push race lost (attempt ${attempt}); rebasing on latest main"
            sleep $(( (RANDOM % 6) + 2 ))
          done
            test -n "${pushed}" || { echo "::error::failed to pin dev overlay within deadline"; exit 1; }
            echo "Argo CD reconciles dev; on Synced+Healthy it triggers promotion of this exact digest to staging."

  # Delivery had no failure notification of any kind, across every repository that calls this
  # workflow. A failed deploy simply left the previous digest pinned and said nothing, so the fleet
  # degraded to "somebody eventually notices the site is stale". The recorded instance is web-docs
  # on 2026-07-29: the canonical build failed, the run went red, nobody was told, and the documentation
  # site silently served the previous day's content until an unrelated commit rebuilt it.
  #
  # It lives here rather than in each caller for the ordinary reason everything else does — one
  # change, rolled out by moving @v1 — but also because a caller CANNOT hold this credential. Slack
  # is reached through ci-slack-notify, which proves the job's identity with GitHub OIDC and lets AWS
  # decide whether that identity may read the bot token, so no repository forwards a secret and no
  # repository needs a Slack lane of its own to get alerted.
  notify-failure:
    name: Report a failed delivery
    needs: [resolve, contract-gate, build-and-pin]
    # `always()` so this runs even though the jobs it watches failed, and the explicit result test so
    # it stays silent on success and on a cancellation. A cancelled deploy is somebody's deliberate
    # act; paging for it trains people to ignore the channel.
    if: >-
      always()
      && (needs.resolve.result == 'failure'
          || needs.contract-gate.result == 'failure'
          || needs.build-and-pin.result == 'failure')
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    steps:
      - name: Name the stage that failed
        id: stage
        shell: bash
        env:
          RESOLVE: ${{ needs.resolve.result }}
          CONTRACT: ${{ needs.contract-gate.result }}
          BUILD: ${{ needs.build-and-pin.result }}
        run: |
          set -euo pipefail
          # Report the earliest failure rather than every downstream skip: the later stages did not
          # fail, they never ran, and listing them sends the reader looking for a second fault.
          if [[ "${RESOLVE}" == "failure" ]]; then
            stage="resolving the service identity"
          elif [[ "${CONTRACT}" == "failure" ]]; then
            stage="the contract gate (breaking-change detection)"
          else
            stage="the canonical build / dev pin"
          fi
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"

      - uses: coderaxis/ci-workflows/ci-slack-notify@v1
        with:
          status: failure
          # Forwarded because the action cannot reach `vars` itself, and in a reusable workflow
          # these resolve against the CALLER, so a repository may route its own deploy alerts
          # without the central workflow knowing anything about it.
          alerts-channel: ${{ vars.SLACK_ALERTS_CHANNEL }}
          notifications-channel: ${{ vars.SLACK_NOTIFICATIONS_CHANNEL }}
          title: Deploy failed
          text: >-
            ${{ needs.resolve.outputs.service || github.repository }} did not deploy: failed at
            ${{ steps.stage.outputs.stage }}. dev is still pinned to the previous digest.
          fields: |
            [
              {"title": "Service", "value": "${{ needs.resolve.outputs.service || github.repository }}", "short": true},
              {"title": "Trigger", "value": "${{ github.event_name }}", "short": true},
              {"title": "Commit", "value": "${{ github.sha }}", "short": true},
              {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
            ]
