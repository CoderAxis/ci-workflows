name: Documentation Governance Guard

# Self-CI governance for the docs-governance control catalog + checker themselves:
# validates the catalog schema, keeps the README control table in sync with the catalog,
# and smoke-runs the checker end-to-end against a minimal compliant fixture so a
# catalog/checker change that breaks execution is caught here, not fleet-wide.
#
# Policy SSOT: ADR-0081. This is the docs-governance twin of delivery-model-guard.yml and
# dockerfile-standard-guard.yml.

on:
  push:
    paths:
      - "scripts/check-docs-governance.py"
      - "controls/docs-governance.yaml"
      - ".github/workflows/docs-governance.yml"
      - ".github/workflows/docs-governance-guard.yml"
      - "scripts/testdata/docs-governance-fixture/**"
      - "README.md"
  pull_request:
    paths:
      - "scripts/check-docs-governance.py"
      - "controls/docs-governance.yaml"
      - ".github/workflows/docs-governance.yml"
      - ".github/workflows/docs-governance-guard.yml"
      - "scripts/testdata/docs-governance-fixture/**"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docs-governance-guard:
    name: Catalog + checker self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: python3 -m pip install --upgrade PyYAML

      - name: Validate control catalog schema
        run: |
          python3 scripts/check-docs-governance.py --format markdown > /dev/null
          echo "control catalog schema OK"

      - name: Verify control docs are in sync with the catalog
        run: python3 scripts/check-docs-governance.py --verify-docs README.md

      - name: Smoke-run the checker end-to-end against the compliant fixture
        run: |
          python3 scripts/check-docs-governance.py \
            scripts/testdata/docs-governance-fixture \
            --fail-on major
