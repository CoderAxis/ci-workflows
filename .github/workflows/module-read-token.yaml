name: Module read token

# Mints a short-lived private-module read token for a caller whose job is NOT defined in a
# central workflow, and hands it back as a workflow output.
#
# WHY THIS INDIRECTION IS NEEDED. inboxxhq-ci-app-token-read's trust policy admits an OIDC
# job_workflow_ref of `coderaxis/github-actions/.github/workflows/*@refs/tags/v1` (plus a short
# named-exception list) - see infra's ci-app-token.tf and app-token-selftest.yaml's header for the
# same reasoning applied to this repository's own guard. job_workflow_ref names the workflow the
# JOB IS DEFINED IN, not the entry point, together with the ref that definition was loaded from.
# A job defined directly in a CONSUMER repository's own ci.yaml therefore presents
# `<repo>/ci.yaml@refs/heads/main` (or `@refs/pull/N/merge`), which the wildcard cannot match -
# and that is deliberate: a service repo must not be able to reach the broker by writing its own
# workflow.
#
# The fleet's normal answer is to not have a local ci.yaml at all: a thin caller of
# service-ci.yaml puts the actual mint inside a job DEFINED in this repository, so its claim
# carries `@refs/tags/v1` and matches. That answer does not fit every repository. service-ci.yaml
# resolves `repo_kind` from the service catalog and only knows the deployable/core/schema shapes,
# each built around a service or a Go module published for other repos to import; a platform tool
# with no service.contract.yaml and nothing to deploy has no shape there to resolve to, and
# forcing it into the catalog to borrow a shape that does not describe it would be a worse fix
# than the problem.
#
# This workflow is the same trick app-token-selftest.yaml already uses: put ONLY the mint in a
# reusable workflow published from here, so a caller's job_workflow_ref becomes
# `module-read-token.yaml@refs/tags/v1` regardless of what its own ci.yaml looks like. No change
# to the trust policy, because the wildcard already admits any workflow file in this directory at
# `@refs/tags/v1`.
#
# Scope is fixed at `read`. A caller that needs the write-scoped identities (publish, gitops,
# contracts) is a different problem with a deliberately narrower allowlist; see ci-app-token.tf.
#
# WHY THE TOKEN CROSSES AS A ONE-TIME-PAD CIPHERTEXT, NOT AS BASE64. ci-app-token add-masks the
# token so it cannot leak through THIS job's own logs. GitHub separately, and silently, drops
# any job output whose value it judges to contain a masked secret - "Skip output '...' since it
# may contain secret", verified against a real run - so the raw token cannot cross the job
# boundary as an output at all; the caller sees an empty string with no error. Plain base64 does
# NOT clear this: it was tried and still triggered the same drop, which only makes sense if
# GitHub's masker also matches common reversible encodings of a registered secret (base64/URL/
# JSON-escaped), not only the literal string - so any deterministic, keyless transform of the
# token is a transform GitHub can also compute and match.
#
# Encrypting with a passphrase GENERATED FRESH INSIDE THIS JOB and never itself add-masked
# defeats that: the ciphertext has no fixed relationship to the token that GitHub could
# precompute without the passphrase, and the passphrase alone is a random 32-byte value that
# reveals nothing. Both halves travel as ordinary (unmasked) job outputs; only together, in the
# caller's own job, do they reconstitute the token - which the caller must then re-mask itself
# with `::add-mask::` before using it, since this job's masking does not extend to the caller's.

on:
  workflow_call:
    inputs:
      extra-owners:
        description: >-
          Passed through to ci-app-token's `extra-owners`. Space- or comma-separated account
          names beyond the default `coderaxis` to also mint for.
        required: false
        type: string
        default: ""
      repositories:
        description: >-
          Passed through to ci-app-token's `repositories`, narrowing the token to specific repos
          rather than the whole installation.
        required: false
        type: string
        default: ""
    outputs:
      ciphertext:
        description: >-
          The module-read token, AES-256-CBC encrypted under `passphrase` and base64-framed.
          Meaningless without it. Decrypt with:
          `openssl enc -aes-256-cbc -pbkdf2 -d -salt -base64 -A -k "$passphrase"`.
        value: ${{ jobs.mint.outputs.ciphertext }}
      passphrase:
        description: "One-time passphrase for `ciphertext`, generated fresh per run. Not a secret on its own."
        value: ${{ jobs.mint.outputs.passphrase }}

permissions:
  contents: read

jobs:
  mint:
    name: Mint module-read token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      ciphertext: ${{ steps.encrypt.outputs.ciphertext }}
      passphrase: ${{ steps.encrypt.outputs.passphrase }}
    steps:
      - name: Mint module-read token
        id: modauth
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: read
          extra-owners: ${{ inputs.extra-owners }}
          repositories: ${{ inputs.repositories }}

      - name: Encrypt the token for transit across the job boundary
        id: encrypt
        shell: bash
        env:
          RAW_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          [[ -n "${RAW_TOKEN}" ]] || { echo "::error::ci-app-token returned no token"; exit 1; }
          # Not masked, deliberately: it is fresh, single-use, and useless without the
          # ciphertext, so registering it as a secret would only reintroduce the exact
          # problem it exists to route around.
          passphrase="$(openssl rand -hex 32)"
          ciphertext="$(printf '%s' "${RAW_TOKEN}" \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -base64 -A -k "${passphrase}")"
          {
            echo "passphrase=${passphrase}"
            echo "ciphertext=${ciphertext}"
          } >> "$GITHUB_OUTPUT"
