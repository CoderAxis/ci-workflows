name: Module release

# The single release pipeline for every versioned Go module in the fleet: the `*-core`
# libraries and the `*-core-postgres` schema adapters.
#
# A core repository contains ONE workflow, and it declares nothing about itself:
#
#   jobs:
#     release:
#       uses: coderaxis/github-actions/.github/workflows/module-release.yaml@v1
#       secrets: inherit
#
# WHAT REPLACED WHAT. Each core repo carried three local workflows: release.yaml (version,
# build, tag, release), sbom.yml (a second, separate SBOM run), and
# reusable-notify-consumers.yml (a hand-maintained fan-out matrix). Sixty-five repositories
# held sixty-five copies, and they disagreed:
#
#   - The fan-out was gated on a repo variable, ENABLE_CORE_RELEASE_AUTOMATION. Across the
#     65 core modules it was true in 38, false in 15 and unset in 12. A release therefore
#     either notified its consumers or silently did not, decided by a variable outside the
#     reviewed code. That is an opt-out, not a gate.
#   - In five families (announcement, billing, communication, compliance, notification) the
#     core and its own adapter disagreed on that variable. The adapter would release and
#     never tell the service, so the service kept an old adapter pin against a new core -
#     manufacturing precisely the version skew SHARED_CORE_RELEASE_AND_PROMOTION.md §8
#     warns about.
#   - The matrices named repositories in an organisation the catalog does not model, so the
#     platform's own model of "who consumes this" and the thing actually doing the
#     notifying had diverged with nothing to detect it.
#
# So the fan-out is DERIVED from the catalog's dependency direction and is unconditional.
# There is no enable variable. A module that is released always notifies everything the
# catalog says depends on it, because a release whose consumers are optional is not a
# release - it is a tag nobody hears about.
#
# THE GATES. Ordering is the correctness property here: the dependency direction is
# core <- core-postgres <- deployable, so a module must never be published ahead of what it
# pins. Two gates enforce that, and they run before the tag is created because a tag cannot
# be withdrawn once consumers have fetched it:
#
#   1. No pseudo-version pins (§8). A pseudo-version means "an untagged commit", so
#      releasing against one publishes a version whose own dependency cannot be resolved by
#      anyone else.
#   2. The upstream pin must already be released. An adapter tagged against an unreleased
#      core is the documented auth failure: the adapter claims a core version that does not
#      exist for consumers.
#
# Policy SSOT: SHARED_CORE_RELEASE_AND_PROMOTION.md (release/bump ordering),
# VERSIONING_STRATEGY.md (conventional-commit versioning), RFC-0020 (supply-chain
# integrity), ADR-0081 (central workflow + thin caller pattern).

on:
  workflow_call:
    inputs:
      catalog_owner:
        description: >-
          Account owning the catalog repo. Kept separate from catalog_repo because GitHub
          expressions have no string-split function and the App token is minted per owner.
        required: false
        type: string
        default: coderaxis
      catalog_repo:
        description: "Repository holding the service catalog (the SSOT for the dependency graph)."
        required: false
        type: string
        default: coderaxis/core-docs
      catalog_ref:
        description: "Ref of the catalog repo to resolve against."
        required: false
        type: string
        default: main
      version:
        description: >-
          Explicit version, with or without the leading v. Left blank the version is computed
          from conventional commits since the last tag, which is the normal path.
        required: false
        type: string
        default: ""

# No `secrets:` block, deliberately. Every credential this workflow needs - the module-reader App
# key, the release bot that dispatches into consumer repositories, and the Slack bot token - is
# read from AWS Secrets Manager against this job's own OIDC identity. A caller forwards nothing,
# so adding a credential here no longer means editing every repository that calls it, and the
# release bot is reachable only from this workflow and module-bump.yml rather than from anything
# holding a copy of the key.

permissions:
  contents: read

concurrency:
  # Serialised, never cancelled: a cancelled run can leave a pushed tag with no GitHub Release
  # and no consumer notification, which is the one state that needs a human to untangle.
  group: module-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ── identity ──────────────────────────────────────────────────────────────────────────────
  resolve:
    name: Resolve module identity
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      service: ${{ steps.id.outputs.service }}
      repo_kind: ${{ steps.id.outputs.repo_kind }}
      module_path: ${{ steps.id.outputs.module_path }}
      upstream_module: ${{ steps.id.outputs.upstream_module }}
      consumers: ${{ steps.id.outputs.consumers }}
      unorderable_consumers: ${{ steps.id.outputs.unorderable_consumers }}
    steps:
      - name: Derive identity from the immutable repository id
        id: id
        uses: coderaxis/github-actions/resolve-service-identity@v1
        with:
          catalog-owner: ${{ inputs.catalog_owner }}
          catalog-repo: ${{ inputs.catalog_repo }}
          catalog-ref: ${{ inputs.catalog_ref }}

      # A deployable is an image, not a module: it is published by service-ci.yaml and pinned by
      # digest. If one reaches this workflow it has been wired to the wrong pipeline, and the
      # failure says so rather than tagging a repo that nothing can `go get`.
      #
      # shared-library belongs here with core and schema. The catalog models four kinds and three of
      # them are tagged Go modules; omitting this one rejected platform-shared-go, the module with
      # the largest consumer set in the graph, under an error message about images. It surfaced only
      # once that repo stopped carrying its own release workflow, so the gap had been invisible for
      # as long as the local implementations existed.
      - name: Reject a repo that is not a releasable module
        env:
          KIND: ${{ steps.id.outputs.repo_kind }}
          MODULE: ${{ steps.id.outputs.module_path }}
        run: |
          set -euo pipefail
          case "${KIND}" in
            core|schema|shared-library) ;;
            *)
              echo "::error::repo_kind=${KIND} is not a releasable Go module. Deployables publish an" \
                   "image through service-ci.yaml and are pinned by digest, not tagged as modules."
              exit 1
              ;;
          esac
          [[ -n "${MODULE}" ]] || { echo "::error::catalog bound this repo but declares no module path"; exit 1; }

  # ── release ───────────────────────────────────────────────────────────────────────────────
  release:
    name: Verify, tag, and publish
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the tag, create the release
      id-token: write # keyless provenance
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      releasable: ${{ steps.ver.outputs.releasable }}
    env:
      GOPRIVATE: github.com/coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
      GONOSUMCHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # conventional-commit versioning needs the full history and all tags

      - name: Resolve version (tag, explicit input, or conventional commits)
        id: ver
        env:
          EXPLICIT: ${{ inputs.version }}
          MODULE: ${{ needs.resolve.outputs.module_path }}
          # Required: the recovery probe below asks whether a Release already exists, and an
          # unauthenticated gh exits non-zero for that question too. Without a token the probe
          # cannot distinguish "no release" from "could not ask", and it would answer "no release"
          # every time - re-publishing and re-dispatching bumps on every run whose tag is at HEAD.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # Pushing a tag by hand stays supported: the tag IS the decision, so it is validated
          # and used as-is rather than recomputed.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${GITHUB_REF_NAME}"
            [[ "${V}" =~ ${semver} ]] || { echo "::error::tag ${V} is not vMAJOR.MINOR.PATCH"; exit 1; }
            { echo "version=${V}"; echo "releasable=true"; echo "createtag=false"; } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"

          if [[ -n "${EXPLICIT}" ]]; then
            V="v${EXPLICIT#v}"
            [[ "${V}" =~ ${semver} ]] || { echo "::error::version ${EXPLICIT} is not MAJOR.MINOR.PATCH"; exit 1; }
            # Forward-only: re-releasing an existing tag would change what a pinned consumer
            # resolves to, which is the one thing a version must never do.
            if git rev-parse -q --verify "refs/tags/${V}" >/dev/null; then
              echo "::error::${V} already exists; versions are immutable once published"; exit 1
            fi
            { echo "version=${V}"; echo "releasable=true"; echo "createtag=true"; } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${latest}" ]]; then range="HEAD"; base="0.0.0"; else range="${latest}..HEAD"; base="${latest#v}"; fi
          msgs="$(git log --no-merges --format='%s%n%b' "${range}" 2>/dev/null || true)"

          # Recovery: a prior run pushed the tag but failed before creating the Release, which is
          # the one state a re-run cannot reach any other way - the tag already exists, so the
          # explicit-version path refuses it as immutable and the commit-scan path sees an empty
          # range and reports "nothing to publish". The module is then fetchable by Go while no
          # consumer was ever notified, which is precisely the silent skew this pipeline exists to
          # prevent.
          #
          # The existence probe must be able to fail loudly. `gh release view` returns non-zero
          # both for "no such release" and for "could not reach the API", and treating those the
          # same means an API blip re-publishes a release and re-dispatches every consumer bump.
          if [[ -n "${latest}" ]] && [[ "$(git rev-parse "refs/tags/${latest}^{commit}" 2>/dev/null || true)" == "$(git rev-parse HEAD)" ]]; then
            if gh release view "${latest}" >/dev/null 2>&1; then
              echo "::notice::${latest} is already released at HEAD; nothing to publish"
              echo "releasable=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            # Distinguish "absent" from "unreachable" before acting on it.
            if ! gh api "repos/${GITHUB_REPOSITORY}" --jq '.id' >/dev/null 2>&1; then
              echo "::error::cannot reach the GitHub API to determine whether ${latest} is released."
              echo "Refusing to guess: re-publishing would re-dispatch a bump to every consumer."
              exit 1
            fi
            echo "::notice::tag ${latest} exists at HEAD with no Release; finalizing that version"
            { echo "version=${latest}"; echo "releasable=true"; echo "createtag=false"; } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Quoted: `patch` and `major` are also real commands, so an unquoted assignment reads as a
          # command substitution to shellcheck (SC2209) and is a genuine footgun in other contexts.
          bump=""
          if grep -qiE '^[a-z]+(\([^)]+\))?!:' <<<"${msgs}" || grep -qE 'BREAKING[ -]CHANGE' <<<"${msgs}"; then
            bump="major"
          elif grep -qE '^feat(\([^)]+\))?:' <<<"${msgs}"; then
            bump="minor"
          elif grep -qE '^(fix|perf|refactor)(\([^)]+\))?:' <<<"${msgs}"; then
            bump="patch"
          fi

          # ci/chore/docs/test commits are deliberately not releasable, so a docs-only merge does
          # not fan a no-op bump PR across every consumer.
          if [[ -z "${bump}" ]]; then
            echo "::notice::no releasable commits since ${latest:-the beginning}; nothing to publish"
            echo "releasable=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          IFS=. read -r MA MI PA <<< "${base}"
          case "${bump}" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          { echo "version=v${MA}.${MI}.${PA}"; echo "releasable=true"; echo "createtag=true"; } >> "${GITHUB_OUTPUT}"
          echo "::notice::${MODULE}: ${bump} bump, ${latest:-none} -> v${MA}.${MI}.${PA}"

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.releasable == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Mint module-read token
        id: modauth
        if: steps.ver.outputs.releasable == 'true'
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Configure private module access
        if: steps.ver.outputs.releasable == 'true'
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          [[ -n "${MOD_TOKEN}" ]] || { echo "::error::no module-read token minted"; exit 1; }
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"

      # ── ordering gates: both run BEFORE the tag, because a tag cannot be withdrawn ─────────
      - name: Gate - no pseudo-version pins
        if: steps.ver.outputs.releasable == 'true'
        run: |
          set -euo pipefail
          # A pseudo-version (v0.0.0-20260518192409-9f39cdd313ed) names an UNTAGGED commit. Publish
          # against one and the release is unresolvable for anyone who does not already have that
          # commit, so the pin must be a real tag before this module can claim a version of its own.
          if pseudo="$(grep -nE 'github\.com/coderaxis/[^ ]+ v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{14}-[0-9a-f]{12}' go.mod)"; then
            echo "::error::go.mod pins a platform module at a pseudo-version, so this module cannot be released:"
            awk '{ print "  " $0 }' <<<"${pseudo}"
            echo "Re-pin to a released tag first (SHARED_CORE_RELEASE_AND_PROMOTION.md §8)."
            exit 1
          fi
          echo "no pseudo-version pins on platform modules"

      - name: Gate - upstream module is already released
        if: steps.ver.outputs.releasable == 'true' && needs.resolve.outputs.upstream_module != ''
        env:
          UPSTREAM: ${{ needs.resolve.outputs.upstream_module }}
        run: |
          set -euo pipefail
          # This adapter pins its core directly and the deployable pins BOTH, so the two must agree
          # on one core version. Tagging the adapter against a core tag that was never published is
          # the documented auth skew: the adapter advertises a dependency consumers cannot fetch.
          pin="$(awk -v m="${UPSTREAM}" '$1 == m { print $2; exit }' go.mod)"
          if [[ -z "${pin}" ]]; then
            echo "::error::catalog says ${UPSTREAM} is upstream of this module, but go.mod does not require it."
            echo "Either the catalog's dependency direction or this go.mod is wrong; they must agree."
            exit 1
          fi
          echo "pinned ${UPSTREAM} at ${pin}"
          if ! git ls-remote --exit-code --tags "https://${UPSTREAM}.git" "refs/tags/${pin}" >/dev/null 2>&1; then
            echo "::error::${UPSTREAM} ${pin} is not a published tag. Release the upstream module first;"
            echo "releases flow bottom-up (SHARED_CORE_RELEASE_AND_PROMOTION.md §1)."
            exit 1
          fi
          echo "upstream ${UPSTREAM} ${pin} is published"

      - name: Verify module tidy
        if: steps.ver.outputs.releasable == 'true'
        run: |
          set -euo pipefail
          GOWORK=off go mod tidy
          # A go.mod that changes under tidy means the committed dependency set is not the one that
          # actually builds, so the published version would not reproduce.
          git diff --exit-code -- go.mod go.sum

      - name: Build
        if: steps.ver.outputs.releasable == 'true'
        run: |
          set -euo pipefail
          # Both target architectures, because the consuming images run on arm64 as well and a
          # core that only compiles for amd64 breaks them at their build, not here.
          GOWORK=off GOOS=linux GOARCH=amd64 go build ./...
          GOWORK=off GOOS=linux GOARCH=arm64 go build ./...

      - name: Test
        if: steps.ver.outputs.releasable == 'true'
        run: GOWORK=off go test -race -count=1 ./...

      - name: Create tag
        if: steps.ver.outputs.releasable == 'true' && steps.ver.outputs.createtag == 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
          SERVICE: ${{ needs.resolve.outputs.service }}
        run: |
          set -euo pipefail
          git config user.name "coderaxis-release-bot[bot]"
          git config user.email "coderaxis-release-bot[bot]@users.noreply.github.com"
          git tag -a "${V}" -m "${GITHUB_REPOSITORY##*/} ${V} (${SERVICE})"
          git push origin "${V}"

      - name: Generate SBOM (SPDX)
        if: steps.ver.outputs.releasable == 'true'
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Generate SBOM (CycloneDX)
        if: steps.ver.outputs.releasable == 'true'
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true

      # GitHub Attestations API availability is a platform constraint, not an auth one. The App
      # mints valid tokens and attestations: write is granted, but GitHub still rejects persistence
      # for user-owned private repositories. Authentication stays on the App; attestation posture
      # is tiered by repo owner type. Deployable images continue to get cosign/SLSA in CodeBuild.
      - name: Detect GitHub Attestations availability
        id: attest
        if: steps.ver.outputs.releasable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner_type="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.owner.type')"
          is_private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          if [[ "${owner_type}" == "User" && "${is_private}" == "true" ]]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GitHub Attestations API is unavailable for user-owned private repos."
            echo "SBOMs attach to this release; image provenance uses CodeBuild cosign/SLSA."
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Attest build provenance (GitHub Attestations)
        if: steps.ver.outputs.releasable == 'true' && steps.attest.outputs.available == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            sbom.spdx.json
            sbom.cyclonedx.json

      - name: Write module provenance record
        if: steps.ver.outputs.releasable == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MODULE: ${{ needs.resolve.outputs.module_path }}
          ATTEST: ${{ steps.attest.outputs.available }}
        run: |
          set -euo pipefail
          if [[ "${ATTEST}" == "true" ]]; then
            note="GitHub Attestations predicate stored by GitHub for this release."
          else
            note="GitHub Attestations API unavailable for user-owned private repositories; deployable images use CodeBuild cosign/SLSA (RFC-0020)."
          fi
          jq -n \
            --arg module "${MODULE}" \
            --arg version "${VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg builder "coderaxis/github-actions/.github/workflows/module-release.yaml@v1" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg api "${ATTEST}" \
            --arg note "${note}" \
            '{
              _type: "https://inboxxhq.com/provenance/module-release/v1",
              module: $module,
              version: $version,
              materials: [{ uri: ("git+https://github.com/" + $repo + "@" + $commit), digest: { gitCommit: $commit } }],
              builder: { id: $builder },
              invocation: { url: $run },
              github_attestations_api: $api,
              note: $note
            }' > provenance.module.json

      - name: Create GitHub Release
        if: steps.ver.outputs.releasable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            sbom.spdx.json
            sbom.cyclonedx.json
            provenance.module.json
          body: |
            ## ${{ needs.resolve.outputs.module_path }} ${{ steps.ver.outputs.version }}

            Released Go module for `${{ needs.resolve.outputs.service }}` consumers.
            SPDX and CycloneDX SBOMs are attached.

            **Provenance:** ${{ steps.attest.outputs.available == 'true' && 'GitHub Attestations (SLSA predicate stored by GitHub).' || 'GitHub Attestations unavailable on user-owned private repos; `provenance.module.json` is attached. Deployable images use CodeBuild cosign/SLSA (RFC-0020).' }}

  # ── fan-out ───────────────────────────────────────────────────────────────────────────────
  # Unconditional by design. The only condition is "was anything released", never "is this repo
  # allowed to notify" - that second question is what ENABLE_CORE_RELEASE_AUTOMATION answered
  # differently in 65 repos.
  bump-consumers:
    name: Bump ${{ matrix.kind }} ${{ matrix.repository }}
    needs: [resolve, release]
    if: needs.release.outputs.releasable == 'true' && needs.resolve.outputs.consumers != '[]'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One unreachable consumer must not suppress the others; a partial fan-out is recoverable
      # by re-running, whereas a cancelled fan-out hides which targets were reached.
      fail-fast: false
      # platform-shared-go reaches 80 consumers. Unthrottled that is 80 concurrent jobs, each
      # cloning a repository and running a Go build, which exhausts the runner pool and trips
      # secondary rate limits - and a rate-limited bump looks identical to a broken one.
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.consumers) }}
    steps:
      - name: Split the target into owner and repo
        id: t
        env:
          TARGET: ${{ matrix.repository }}
          MODULE: ${{ needs.resolve.outputs.module_path }}
        run: |
          set -euo pipefail
          {
            echo "owner=${TARGET%%/*}"
            echo "repo=${TARGET##*/}"
            echo "short=${MODULE##*/}"
          } >> "${GITHUB_OUTPUT}"

      # Scoped to the single target repository, so a release holds write on exactly the consumer
      # it is bumping and not on the fleet.
      - name: Mint release-bot token for this target
        id: bottoken
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: publish
          owner: ${{ steps.t.outputs.owner }}
          repositories: ${{ steps.t.outputs.repo }}

      - name: Check out the consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          token: ${{ steps.bottoken.outputs.token }}
          path: consumer
          fetch-depth: 0

      # The bump happens here rather than in the consumer repository. Previously this step fired
      # a repository_dispatch, whose only effect was to wake a 41-line workflow in the consumer
      # that immediately called back into this same central repository - a round trip through the
      # consumer to reach code that started here. The list of consumers, the dependency order and
      # a write token for the target are all already resolved in this job, so the round trip
      # bought nothing and cost 138 files across the fleet.
      - name: Bump the pin and open the PR
        uses: coderaxis/github-actions/bump-module-pin@v1
        with:
          target-repository: ${{ matrix.repository }}
          target-path: consumer
          module: ${{ needs.resolve.outputs.module_path }}
          version: ${{ needs.release.outputs.version }}
          short: ${{ steps.t.outputs.short }}
          token: ${{ steps.bottoken.outputs.token }}
          service: ${{ needs.resolve.outputs.service }}
          repo-kind: ${{ matrix.kind }}
          required-modules: ${{ toJSON(matrix.requires) }}

  # A bump that silently fails to land is how a consumer ends up a major version behind without
  # anyone noticing, so an incomplete fan-out is surfaced rather than left in the log.
  fan-out-report:
    name: Report fan-out result
    needs: [resolve, release, bump-consumers]
    if: always() && needs.release.outputs.releasable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any consumer was not bumped
        env:
          RESULT: ${{ needs.bump-consumers.result }}
          CONSUMERS: ${{ needs.resolve.outputs.consumers }}
          WITHHELD: ${{ needs.resolve.outputs.unorderable_consumers }}
          VERSION: ${{ needs.release.outputs.version }}
          MODULE: ${{ needs.resolve.outputs.module_path }}
        run: |
          set -euo pipefail
          echo "released ${MODULE} ${VERSION}"
          echo "consumers: ${CONSUMERS}"

          # A consumer sitting in a dependency cycle has no release order, so the cascade declined
          # to bump it rather than pick an arbitrary first. That is a defect in the module graph,
          # not in this run, and it stays visible until the cycle is broken.
          if [[ -n "${WITHHELD}" ]]; then
            echo "::warning::withheld from the cascade because they sit in a dependency cycle:" \
                 "${WITHHELD}. They will not receive ${MODULE} ${VERSION} until the cycle is broken."
          fi

          if [[ "${RESULT}" != "success" ]]; then
            echo "::error::fan-out result was '${RESULT}'. ${MODULE} ${VERSION} is published but at" \
                 "least one consumer was not bumped, so it will keep building against the old" \
                 "version. Re-run this job to retry the bump."
            exit 1
          fi
          echo "every consumer the artifact graph declares was bumped"
