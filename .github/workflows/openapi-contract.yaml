name: OpenAPI contract

# Structural validation of a service's committed OpenAPI document, plus that service's own
# contract tests. Moved here from InboxxHQ-CoderAxis/inboxxhq-api-contracts.
#
# WHY IT MOVED. service-ci.yaml called the contracts-repo copy directly, and that call could not
# resolve from any repository:
#   - the reference named `reusable-openapi-contract.yaml`, but the file there is `.yml` - the
#     extension sweep reached the caller and not the callee.
#   - it pinned `@v1` to satisfy WFC-0002, and that repository carries no tags at all.
#   - it is private and owned by a different organisation, which GitHub does not accept as a
#     reusable-workflow source whatever the extension and tag say.
# GitHub resolves the entire reusable-workflow graph when it LOADS a workflow, before any `if:` is
# evaluated. So this one unreachable job rejected central CI for every repository in the fleet,
# including library repos whose `contract` job would have been skipped anyway. It presented as a
# run with no job, no log and no annotation - the shape WFC-0004's rationale already describes.
#
# WHAT DID NOT MOVE. Each omission is deliberate:
#   generate-drift    regenerated the spec with `swag` from Go annotations. Superseded: the
#                     platform generates OpenAPI from the Go reflection engine with authored
#                     operationIds, so porting the annotation scanner would reinstate the approach
#                     that replaced it.
#   publish-sdk       a stub whose only step printed "not implemented".
#
# WHAT CAME BACK, 2026-07-31. breaking-change and publish-contract were held back because they
# read and write a private repository in another organisation, which the OIDC model could not
# reach. It can now: `contracts` is a dedicated App installed on inboxxhq-api-contracts alone
# with contents:write, mintable only from this workflow.
#
# They return together, and that pairing is the load-bearing part. Publishing on merge moves the
# published baseline automatically, and the deploy-time Contract Gate compares a service's spec
# against that baseline - so auto-publishing alone would leave the gate comparing the new spec to
# a baseline just refreshed from it, green for every possible change. The gate has to move
# EARLIER than the thing that moves the baseline, which is why oasdiff runs on the pull request
# and publication only on main.
#
# The absence of these stages is what let auth-service document a response envelope it had
# stopped returning for two weeks: the registry only changed when a human remembered
# `make publish-contract PUSH=1`, and nothing anywhere went red when they did not.
#
# CREDENTIALS. The original took coderaxis-app-id / coderaxis-app-private-key as forwarded
# secrets, which the OIDC migration had already deleted - so every caller was passing a secret
# that no longer existed. The token is minted here from the job's own OIDC identity, and callers
# forward nothing.

on:
  workflow_call:
    inputs:
      spec-file:
        description: Path to the OpenAPI document in the calling repository.
        required: true
        type: string
      pre-test-command:
        description: Optional shell command that prepares the caller repo before contract tests.
        required: false
        type: string
        default: ""
      contract-test-command:
        description: >-
          Optional shell command running the caller's contract tests. The route-coverage gate
          belongs here rather than centrally, because only the service knows which routes it
          mounts.
        required: false
        type: string
        default: ""
      runner:
        description: JSON-encoded runs-on value.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      service-name:
        description: >-
          The service's directory in the contract registry. Supply the catalog-derived name
          rather than a literal: hand-written names are how a repository rename silently
          pointed a service at another service's registry directory. Empty disables both
          registry stages, and says so in the log rather than passing quietly.
        required: false
        type: string
        default: ""
      publish-contract:
        description: >-
          Publish the validated spec to the registry on pushes to the default branch. Opt-in
          per service while this rolls out. Has no effect on a pull request, where publishing
          would move the baseline the breaking-change gate compares against.
        required: false
        type: boolean
        default: false
    outputs:
      published-version:
        description: >-
          The registry version this run allocated, or empty if nothing was published. Empty
          means "unknown", not "unchanged": publication is opt-in, so most callers get empty.
        value: ${{ jobs.registry.outputs.published-version }}

permissions:
  contents: read

jobs:
  validate-contract:
    name: Validate and test contract
    # id-token because ci-app-token below exchanges this job's OIDC token for the App key. A
    # caller that does not grant it fails at load time with no log (WFC-0004).
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4

      - name: Ensure the spec exists
        shell: bash
        env:
          SPEC_FILE: ${{ inputs['spec-file'] }}
        run: |
          set -euo pipefail
          # Explicit, because swagger-cli reports a missing document as a load error naming a
          # resolved temp path rather than the input, which reads as a tooling fault.
          if [[ ! -f "${SPEC_FILE}" ]]; then
            echo "::error::Spec file not found: ${SPEC_FILE}"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenAPI validation tools
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @stoplight/spectral-cli@6.11.1 swagger-cli@4.0.4

      - name: Validate the OpenAPI document
        shell: bash
        env:
          SPEC_FILE: ${{ inputs['spec-file'] }}
        run: |
          set -euo pipefail
          swagger-cli validate "${SPEC_FILE}"
          # The lint half is conditional on the repo shipping a ruleset. Announce the difference:
          # silently running structural validation only, under a step named "validate", is how a
          # repository ends up believing it is linted when it is not.
          if [[ -f .spectral.yaml ]]; then
            spectral lint "${SPEC_FILE}" --ruleset .spectral.yaml --fail-severity error
          else
            echo "::notice::No .spectral.yaml in this repository; structural validation only."
          fi

      # Deliberately unconditional, and deliberately without a caller input to disable it.
      # Every other gate here is opt-in via a caller-supplied command, which is why the fleet
      # could satisfy this workflow while shipping a Swagger UI, a bespoke envelope, and a
      # hand-rolled copy of the shared conformance suite. The checker and its catalog are
      # checked out from this repository, so a service cannot weaken the policy it is judged
      # by; check-workflow-centralization.py separately forbids forking this workflow, so a
      # service cannot escape by keeping its own copy either.
      - name: Check out the central API-contract guard (SSOT)
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .api-contract-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install guard dependencies
        shell: bash
        run: python3 -m pip install --upgrade PyYAML

      - name: Enforce API-contract controls (ADR-0048, ADR-0067, RFC-0001)
        shell: bash
        run: |
          set -euo pipefail
          python3 .api-contract-tools/scripts/check-api-contract.py . \
            --controls .api-contract-tools/controls/api-contract.yaml \
            --report api-contract-report.json

      - name: Upload API-contract report (machine-readable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-report
          path: api-contract-report.json
          if-no-files-found: ignore

      - name: Set up Go
        if: inputs['pre-test-command'] != '' || inputs['contract-test-command'] != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Mint module-read token
        id: modauth
        if: inputs['pre-test-command'] != '' || inputs['contract-test-command'] != ''
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Prepare the contract test environment
        if: inputs['pre-test-command'] != ''
        shell: bash
        env:
          CROSS_REPO_TOKEN: ${{ steps.modauth.outputs.token }}
        run: ${{ inputs['pre-test-command'] }}

      - name: Run contract tests
        if: inputs['contract-test-command'] != ''
        shell: bash
        env:
          CROSS_REPO_TOKEN: ${{ steps.modauth.outputs.token }}
        run: ${{ inputs['contract-test-command'] }}

  # ── the registry stages ───────────────────────────────────────────────────────────────────
  # Split from validation so that publication cannot run ahead of the checks that qualify it,
  # and so a caller reading the run can see which of the two happened.
  registry:
    name: Contract registry (baseline + publish)
    needs: validate-contract
    if: inputs['service-name'] != ''
    outputs:
      # Which version this run allocated, so the deploy side can record what an environment is
      # about to serve. Empty when nothing was published, which callers must treat as "unknown"
      # rather than "unchanged": publication is opt-in, so empty is the common case.
      published-version: ${{ steps.publish.outputs.published_version }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 15
    env:
      REGISTRY_REPO: InboxxHQ-CoderAxis/inboxxhq-api-contracts
      SERVICE: ${{ inputs['service-name'] }}
      SPEC_FILE: ${{ inputs['spec-file'] }}
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4

      - name: Mint a token that may read the registry
        id: regread
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: InboxxHQ-CoderAxis

      - name: Fetch the published baseline
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ steps.regread.outputs.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${REGISTRY_REPO}/contents/${SERVICE}/latest.json" \
               -H "Accept: application/vnd.github.raw" > baseline.json 2>/dev/null; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "Baseline fetched: $(wc -c < baseline.json) bytes"
          else
            # A service publishing for the first time has nothing to be compared against. That
            # is not a pass: oasdiff against an absent baseline reports zero breaking changes
            # for every possible change, which is the green-on-nothing result this whole file
            # exists to avoid. Say which of the two it was.
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${SERVICE} has no published baseline yet; the breaking-change comparison is skipped for this first publication, not passed."
          fi

      - name: Set up Go
        if: steps.baseline.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install oasdiff
        if: steps.baseline.outputs.present == 'true'
        shell: bash
        run: go install github.com/oasdiff/oasdiff@v1.11.7

      # The gate. It runs on pull requests as well as main, and it must: publication below moves
      # the baseline, so main-only enforcement would compare a spec against a baseline refreshed
      # from that same spec and pass unconditionally.
      - name: Breaking-change check against the published baseline
        if: steps.baseline.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if oasdiff breaking baseline.json "${SPEC_FILE}" --fail-on ERR; then
            echo "No breaking changes against the published ${SERVICE} baseline."
            exit 0
          fi
          echo "::error::${SPEC_FILE} breaks the published ${SERVICE} contract. An intentional break needs a major bump of ${SERVICE}/VERSION in ${REGISTRY_REPO}; an unintentional one needs the spec fixed here."
          exit 1

      - name: Mint a token that may write the registry
        id: regwrite
        if: >-
          inputs['publish-contract'] &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: contracts
          owner: InboxxHQ-CoderAxis

      # Keyed off the mint's outcome rather than repeating its condition: two copies of the same
      # three-part expression is how one of them ends up stale, and a publish step guarded by a
      # condition that no longer matches its token step either fails on an empty token or, worse,
      # runs when it should not.
      - name: Publish the validated contract
        id: publish
        if: steps.regwrite.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.regwrite.outputs.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Captured before the retry loop: a value regenerated per attempt would make the
          # published timestamp report when the push finally won a race rather than when the
          # contract was built.
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export PUBLISHED_AT
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REGISTRY_REPO}.git" /tmp/registry
          spec="$(pwd)/${SPEC_FILE}"
          cd /tmp/registry
          git config user.email "ci-bot@inboxxhq.com"
          git config user.name "inboxxhq-ci"

          svc_dir="${SERVICE}"
          [[ -d "${svc_dir}" ]] || { echo "::error::${SERVICE} has no directory in ${REGISTRY_REPO}. Create it with a VERSION file before enabling publish-contract."; exit 1; }

          # Every service publishes into one repository, so two merges landing together race on
          # the same push. Only this service's own files change, so rebasing on the freshest main
          # and retrying is safe - the alternative is a lost publication reported as success.
          pushed=""
          deadline=$(( $(date +%s) + 300 ))
          attempt=0
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            attempt=$((attempt + 1))
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            # Nothing to do if the published document already is this document. Checked before
            # allocating a version so that a re-run, or a merge that did not touch the spec,
            # cannot consume a version number for an identical document.
            if [ -f "${svc_dir}/latest.json" ] && cmp -s "${spec}" "${svc_dir}/latest.json"; then
              echo "${SERVICE} baseline already matches this spec; nothing to publish."
              pushed="noop"; break
            fi

            current=""
            [ -f "${svc_dir}/VERSION" ] && current="$(tr -d '[:space:]' < "${svc_dir}/VERSION")"
            [ -n "${current}" ] || current="v1.0.0"
            case "${current}" in v*) ;; *) current="v${current}" ;; esac

            # Validated before it is used for anything, not inside the bump branch. A malformed
            # VERSION whose snapshot happens not to exist would otherwise skip the check entirely
            # and be published under its own malformed name.
            num="${current#v}"
            IFS=. read -r major minor patch extra <<<"${num}"
            # The part count is checked separately from the digits. Splitting with ${x%%.*} alone
            # accepts "v1.2", because the patch field re-reads the minor and the digit test then
            # passes on a version that has no patch at all.
            if [ -z "${patch}" ] || [ -n "${extra}" ] ||
               { case "${major}${minor}${patch}" in *[!0-9]*) true ;; *) false ;; esac; }; then
              echo "::error::${svc_dir}/VERSION is '${current}', which is not vMAJOR.MINOR.PATCH."
              exit 1
            fi

            # The document changed, so it needs a version no published document already owns.
            # Reusing the VERSION file as-is would overwrite v<X.Y.Z>.json with different bytes,
            # which silently destroys the immutability the released-contract pointer depends on:
            # an environment recorded as serving v1.0.0 would follow that pointer to whatever
            # v1.0.0.json was last overwritten with. Allocation is automatic because the
            # alternative is a manual bump in another repository, and a manual step in another
            # repository is the exact thing whose omission started this.
            #
            # Minor, never major: a breaking change cannot reach here, because the pull-request
            # gate above refuses it. So every published change is additive by construction, which
            # is what a minor bump means.
            if [ -e "${svc_dir}/${current}.json" ]; then
              version="v${major}.$((minor + 1)).0"
            else
              # The VERSION on file was never published under that name, so it is free.
              version="${current}"
            fi
            snap="${version}.json"
            [ -e "${svc_dir}/${snap}" ] && { echo "::error::${svc_dir}/${snap} already exists; refusing to overwrite a published snapshot."; exit 1; }

            printf '%s\n' "${version}" > "${svc_dir}/VERSION"
            cp "${spec}" "${svc_dir}/latest.json"
            cp "${spec}" "${svc_dir}/${snap}"

            # Which commit produced these bytes. index.json already carries a sha256 of the
            # published document, which answers "did this change"; it cannot answer "what
            # produced it", so a contract that disagrees with a running service can only be
            # traced by matching timestamps against merge history by hand - which is how the
            # auth-service drift stayed unexplained as long as it did.
            # jq rather than a heredoc'd script: a `<<EOF` body inside a YAML block keeps the
            # block's indentation, and `<<-` strips only tabs, so an indentation-sensitive
            # language would fail here at runtime and nowhere else.
            jq -n \
              --arg version "${version}" \
              --arg spec_digest "sha256:$(sha256sum "${spec}" | cut -d' ' -f1)" \
              --arg source_repo "${GITHUB_REPOSITORY}" \
              --arg source_sha "${COMMIT_SHA}" \
              --arg source_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg published_at "${PUBLISHED_AT}" \
              '{version: $version, spec_digest: $spec_digest, source_repo: $source_repo,
                source_sha: $source_sha, source_run: $source_run, published_at: $published_at}' \
              > "${svc_dir}/provenance.json"

            # index.json carries every service's published version and a digest of its
            # latest.json, and the registry's own CI gates it with `generate_index.py --check`.
            # Regenerating it here is not tidiness: without it this commit is one the registry
            # refuses. Seven of the seven bot publications before this was added left the index
            # untouched and turned the registry red on push, while every hand publication updated
            # it -- so the gate was, in effect, only ever satisfied by the publisher that did the
            # work manually. A stale index is also read by things that cannot tell it is stale:
            # release.yaml regenerates it in memory for the mirror, so the portals served the new
            # version while the committed index still named the old one, and anything reading the
            # index from a git checkout got the wrong answer with nothing to indicate it.
            #
            # Failing rather than warning if the generator is absent, for the reason the version
            # allocation above is careful: this loop's whole purpose is to leave the registry in a
            # state it accepts, and a publish that silently skips the index is exactly the
            # half-finished push this replaces.
            if [ ! -f tools/generate_index.py ]; then
              echo "::error::${REGISTRY_REPO} has no tools/generate_index.py, so this publish" \
                   "cannot refresh index.json and would push a commit its own CI rejects."
              exit 1
            fi
            python3 tools/generate_index.py --output index.json

            git add -A
            if git diff --cached --quiet; then
              # Unreachable via the spec: an identical document breaks out above, and a differing
              # one always allocates a new version. Kept so that a future edit which stops writing
              # something cannot turn into an empty commit loop that never terminates.
              echo "Nothing staged for ${SERVICE} despite a changed spec; treating as published."
              pushed="noop"; break
            fi
            git commit -q -m "contracts(${SERVICE}): publish ${version} from ${COMMIT_SHA}"
            if git push --quiet origin HEAD:main 2>/dev/null; then
              echo "Published ${SERVICE}/latest.json and ${svc_dir}/${snap} (attempt ${attempt})."
              echo "published_version=${version}" >> "${GITHUB_OUTPUT}"
              pushed="yes"; break
            fi
            echo "push race lost (attempt ${attempt}); rebasing on latest main"
            sleep $(( (RANDOM % 5) + 2 ))
          done
          test -n "${pushed}" || { echo "::error::could not publish ${SERVICE} within the deadline"; exit 1; }
          echo "The registry push triggers the mirror publish, which every API portal reads."
