name: Reusable Schema Compatibility

# Central, single-source schema-compatibility + canonical-outbox-conformance gate
# for the coderaxis platform. Every *-core-postgres repo reaches it the same way
# every other central check is reached — through service-ci, which its ci.yaml
# already calls. It needs no per-repo wiring and no inputs:
#
#   jobs:
#     ci:
#       uses: coderaxis/ci-workflows/.github/workflows/service-ci.yaml@v1
#
# The header here used to document a thin per-repo caller passing `table:` and
# `secrets: inherit`. No such caller existed in any of the 27 core-postgres
# repos, and neither input is needed now: the outbox table is discovered from
# the migrated schema, and the token is minted from the job's own OIDC identity.
#
# What it does (single source of truth — change here, roll the @v1 tag, never
# edit ~27 core-postgres repos):
#   1. On pull requests, refuse any change that rewrites a migration the base branch
#      already has (scripts/check-migration-immutability.py). Editing an applied
#      migration cannot change the database that ran it — it only makes the two
#      disagree, and dbmigrate then fails the PreSync hook by checksum, which leaves
#      the app unhealthy and silently stops it promoting out of dev. A 2026-07-24
#      sweep did this to fourteen repos' baselines at once.
#   2. Spin an ephemeral postgres:18 and mint a short-lived GitHub-App module-read
#      token (private-module fetch), exactly like the per-repo gate used to.
#   3. Apply the repo's migrations to HEAD via the shared, auto-detecting ladder in
#      scripts/schema-compat.sh (goose round-trip test -> schema.GooseUpDSN ->
#      embedded schema.Migrate baseline -> static SQL lint). This fixes the
#      long-standing "goose gap" where pure-goose repos silently fell through to a
#      static lint and never actually migrated.
#   4. Discover every *_outbox table the migrated schema owns and run the shared
#      canonical-outbox verifier (RFC-0032 / ADR-0069) against each, failing closed
#      on ANY semantic drift (columns/types/defaults/domain/PK/unique/checks/
#      partitioning). Discovery replaced an opt-in `table` input that no caller ever
#      set, which meant this step had never verified a single table. The verifier
#      version is pinned HERE (outbox_verify_version), so the contract is tightened
#      fleet-wide from one place with zero per-repo go.mod churn.
#
# The checker logic lives ONCE in this repo (SSOT). Service repos vendor nothing:
# the reusable checks this repo out alongside the caller and runs the pinned script.
#
# Versioning: consumers pin @v1 (moving major tag). Breaking changes bump @v2.

on:
  workflow_call:
    inputs:
      table:
        description: "Escape hatch: verify exactly this table instead of discovering. Leave empty — every *_outbox table in the migrated schema is discovered and verified, so conformance cannot be skipped by omission."
        required: false
        type: string
        default: ""
      outbox_verify_version:
        description: "platform-shared-go version providing cmd/outbox-verify (the canonical contract). Pinned centrally; bump to tighten the contract fleet-wide."
        required: false
        type: string
        default: v1.10.0
      migrate_cmd:
        description: "Optional override for the migrate step (a repo that doesn't fit the auto-ladder). Must leave the DB at HEAD using $TEST_DATABASE_URL/$DATABASE_URL."
        required: false
        type: string
        default: ""
      go_version_file:
        description: "Path to the go.mod that pins the Go toolchain."
        required: false
        type: string
        default: go.mod
      actions_ref:
        description: "Ref of coderaxis/ci-workflows providing the SSOT script (defaults to the moving major tag)."
        required: false
        type: string
        default: v1
      runs_on:
        description: >-
          runs-on label for the job. Defaults to a hosted runner because the job declares
          `services:` (Postgres), which the runner starts through Docker, and the org's scale sets
          run without a container mode; on the pool it fails before applying a single migration.
        required: false
        type: string
        default: ubuntu-latest
    # No secrets. This workflow mints its own module-read token from the job's OIDC identity
    # through ci-app-token, which takes no app-id or private-key input at all, so the failure
    # this previously guarded against ("Input required and not supplied: app-id") cannot occur.
    # The CODERAXIS_APP_* secrets it declared were deleted fleet-wide by the OIDC migration and
    # no caller passes them, so declaring them only implied a credential path that no longer
    # exists.

permissions:
  contents: read

jobs:
  schema-compatibility:
    name: Schema compatibility
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schema_compat_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Both accounts, matching every other Go job in service-ci. This job had only
      # coderaxis, which is latent rather than broken today (inboxxhq-coderaxis appears
      # as auth-service's and identity-service's OWN module path, never as a dependency,
      # and a main module is resolved from the checkout rather than fetched) — but it
      # would bite silently the first time a module crosses accounts.
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      # Full history: the immutability guard below compares each migration against
      # the base branch. A shallow clone cannot see the base, and it fails loudly
      # rather than reporting "no violations" from a checkout that cannot look.
      - name: Checkout service (caller)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout central SSOT (schema-compat script)
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: ${{ inputs.actions_ref }}
          path: .coderaxis-ci

      # Cheap and first: needs neither Postgres nor Go, and an edited migration is
      # not worth spending a schema round-trip to discover. Pull requests only —
      # the guard asks "does this change rewrite history the base already has",
      # which has no meaning once the merge has happened.
      - name: Applied migrations are immutable
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 .coderaxis-ci/scripts/check-migration-immutability.py \
            --base-ref "origin/${{ github.base_ref }}"

      - name: Resolve Postgres connection URL
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ job.services.postgres.ports['5432'] }}"
          URL="postgres://postgres:postgres@127.0.0.1:${PORT}/schema_compat_test?sslmode=disable"
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=${PORT}"
            echo "POSTGRES_PORT=${PORT}"
            echo "TEST_DATABASE_URL=${URL}"
            echo "DATABASE_URL=${URL}"
          } >> "$GITHUB_ENV"

      - name: Set up Go
        if: hashFiles(inputs.go_version_file) != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: false

      - name: Mint module-read token (GitHub App)
        if: hashFiles(inputs.go_version_file) != ''
        id: modauth
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Configure private module access
        if: hashFiles(inputs.go_version_file) != ''
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -n "${MOD_TOKEN}" ]]; then
            git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          GOWORK=off go mod download

      - name: Schema compatibility + canonical outbox conformance
        shell: bash
        env:
          OUTBOX_TABLE: ${{ inputs.table }}
          OUTBOX_VERIFY_VERSION: ${{ inputs.outbox_verify_version }}
          MIGRATE_CMD: ${{ inputs.migrate_cmd }}
          DB_USERNAME: postgres
          DB_USER: postgres
          POSTGRES_USER: postgres
          DB_PASSWORD: postgres
          POSTGRES_PASSWORD: postgres
          DB_NAME: schema_compat_test
          POSTGRES_DB: schema_compat_test
          DB_SSLMODE: disable
          ENVIRONMENT: test
        run: bash .coderaxis-ci/scripts/schema-compat.sh
