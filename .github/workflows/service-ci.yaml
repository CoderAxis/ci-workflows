name: Service CI

# The single CI pipeline for every service and core module in the fleet.
#
# A consumer repository contains ONE workflow, and it declares nothing about itself:
#
#   jobs:
#     ci:
#       uses: coderaxis/ci-workflows/.github/workflows/service-ci.yaml@v1
#       secrets: inherit
#
# WHY THE CALLER PASSES NOTHING. Anything a repo states about itself is a claim the platform
# would have to trust — its name, its language, whether it owns a database, whether it seeds.
# Those are exactly the facts that decide which gates run, so a repo that misstates them (or
# quietly stops stating them) selects its own enforcement. Identity is therefore DERIVED: the
# calling repository's name is set by GitHub and cannot be forged from inside the repo, and
# everything else is read from the service catalog in core-docs, which the DevOps team owns.
# `service_name` is resolved here and handed to the build; the service never asserts it.
#
# WHAT REPLACED WHAT. This absorbs the per-repo workflows that were copied across the fleet and
# then drifted — most starkly scripts/validate_docs.py, which existed in 91 repositories as 91
# byte-different files, each repo passing its own private definition of "valid". Shared logic
# lives here; per-repo data lives in the catalog; nothing lives in the service repo.
#
# WHAT IS DELIBERATELY NOT HERE:
#   - Deployment. CI ends when the immutable digest is written to the GitOps repo; Argo CD pulls
#     from there (ADR-0049). No kubectl, no rollout, no environment logic in Actions.
#   - Scheduled fleet operations (dependency bumps, periodic re-scans). Those are fleet-wide jobs
#     and belong to a scheduled workflow in this repository, not to 90 copies of a cron.
#
# Policy SSOT: ADR-0051 (artifact promotion), ADR-0049 (GitOps delivery), ADR-0064 (archetypes),
# ADR-0081 (central workflow + thin caller pattern), RFC-0020 (supply-chain integrity).

on:
  workflow_call:
    inputs:
      catalog_owner:
        description: >-
          Account owning the catalog repo. Kept separate from catalog_repo because GitHub
          expressions have no string-split function and the App token is minted per owner.
        required: false
        type: string
        default: coderaxis
      catalog_repo:
        description: "Repository holding the service catalog (the platform's SSOT for what a service is)."
        required: false
        type: string
        default: coderaxis/core-docs
      catalog_ref:
        description: "Ref of the catalog repo to resolve against."
        required: false
        type: string
        default: main
      coverage_threshold:
        description: >-
          Escape hatch for a tier the standard does not yet cover. Left unset, the threshold is
          derived from the service tier, so a repo cannot lower its own gate — the previous
          per-repo CI set COVERAGE_THRESHOLD to 0 and passed unconditionally.
        required: false
        type: string
        default: ""
      go_build_tags:
        description: >-
          Build tags for the unit/coverage run, as `go test -tags` takes them. A repo must set this
          when its Dockerfile builds with a tag, because the tag selects which files compile: with
          the wrong set, CI compiles and measures code the image does not contain, and never
          compiles the code it does.

          communication-service is the case that prompted this. Its Dockerfile builds `-tags twilio`
          unconditionally, so every shipping binary carried the twilio files, while CI ran the
          default set — the entire telephony surface, its authorization grants included, went
          untested for as long as that was true. Worse than untested: two of its packages could not
          COMPILE under the tag, and CI reported success throughout, because a build error in files
          CI never builds is not a build error CI can see.

          `integration` must stay in whatever a repo passes; the coverage run depends on it.
        required: false
        type: string
        default: integration

# No `secrets:` block, deliberately. Every token this pipeline uses is minted from the job's own
# OIDC identity via ci-app-token and ci-slack-notify, so a repository forwards nothing: the
# platform decides what a caller may mint, rather than each caller holding the credential that
# decides it.
#
# A caller that passes a secret the callee does not declare is a hard startup error, so the
# callers were cleaned up before this block was removed rather than after.

permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── identity ────────────────────────────────────────────────────────────────────────────────
  # Everything downstream is conditioned on this job's outputs. It fails closed: a repository the
  # catalog does not describe gets no pipeline rather than a permissive default, because a silent
  # pass is indistinguishable from a repo that opted itself out.
  resolve:
    name: Resolve service identity
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    outputs:
      service: ${{ steps.id.outputs.service }}
      language: ${{ steps.id.outputs.language }}
      archetype: ${{ steps.id.outputs.archetype }}
      tier: ${{ steps.id.outputs.tier }}
      owner: ${{ steps.id.outputs.owner }}
      deployable: ${{ steps.id.outputs.deployable }}
      repo_kind: ${{ steps.id.outputs.repo_kind }}
      owns_database: ${{ steps.id.outputs.owns_database }}
      seeds: ${{ steps.id.outputs.seeds }}
      has_rest: ${{ steps.id.outputs.has_rest }}
      has_events: ${{ steps.id.outputs.has_events }}
      coverage_threshold: ${{ steps.id.outputs.coverage_threshold }}
      role: ${{ steps.id.outputs.role }}
      allowed_topics: ${{ steps.id.outputs.allowed_topics }}
      capabilities: ${{ steps.id.outputs.capabilities }}
    steps:
      # One shared implementation, used identically by deploy-reusable.yaml. Two copies of
      # security-critical resolution logic is the drift this whole change exists to remove.
      - name: Derive identity from the immutable repository id
        id: id
        uses: coderaxis/ci-workflows/resolve-service-identity@v1
        with:
          catalog-owner: ${{ inputs.catalog_owner }}
          catalog-repo: ${{ inputs.catalog_repo }}
          catalog-ref: ${{ inputs.catalog_ref }}
          coverage-override: ${{ inputs.coverage_threshold }}

  # ── documentation-only fast path ────────────────────────────────────────────────────────────
  # 111 of the 120 callers declare no `paths:` filter, so a one-word README fix runs build, vet,
  # unit and integration tests, CodeQL, gitleaks, dependency review, schema compatibility, the
  # artifact build and the GitOps pin. The bill got large enough that ~107 repositories were
  # sitting on documentation commits nobody would push, which is the worst outcome available to a
  # fleet whose documentation is itself gated.
  #
  # WHY NOT `paths-ignore:` AT WORKFLOW LEVEL, which is the obvious fix and is wrong. A workflow
  # skipped by a path filter reports NO status. A required status check then waits forever for a
  # check that will never arrive: the pull request is permanently unmergeable and there is nothing
  # to click. So the workflow always runs, this job decides ONCE whether the diff is documentation,
  # and each expensive job carries an `if:` on the answer. A job skipped by `if:` reports a real
  # `skipped` conclusion, which branch protection accepts as satisfied and which the
  # `!contains(needs.*.result, 'failure')` aggregation in `artifact` does not mistake for a
  # failure - the same tolerance the conditional `integration` and `e2e` jobs already rely on.
  #
  # THIS JOB IS IN `artifact`'s AND `notify`'s NEEDS, and that is not decoration. Every gated job
  # depends on this one, so if this job fails they are all skipped - and a skip is tolerated by the
  # deploy aggregation. Without this job named there, a crash here would skip every gate and then
  # pin a digest from an ungated tree. Named there, its `failure` blocks the deploy and alerts.
  #
  # No `needs:`, deliberately: this is pure git and does not depend on catalog identity, so it runs
  # alongside `resolve` rather than after it and adds nothing to the critical path.
  docs-only:
    name: Documentation-only change
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history. The classifier diffs a RANGE, and the before-SHA of a push is exactly the
      # object a shallow clone does not have. It deepens as a fallback, but paying for the clone
      # once here is cheaper than a fetch that may not reach.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the central classifier
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .docs-only-tools
          sparse-checkout: scripts

      # Degrades to `false`, which is today's behaviour, rather than failing. Every other central
      # checker fails loudly when it cannot run, and that is right for a gate whose job is to
      # REFUSE things. This one's job is to SKIP things, so the two directions are not symmetric:
      # an unreachable classifier that turns the fleet red costs more than one that quietly runs
      # the full pipeline it was trying to shorten. The annotation is there so it cannot be silent.
      - name: Classify the diff
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .docs-only-tools/scripts/docs-only-diff.py ]]; then
            echo "::warning::the central documentation-only classifier is not present in this"
            echo "::warning::checkout of ci-workflows; running every gate, as before."
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 .docs-only-tools/scripts/docs-only-diff.py --repo-root .

      - name: Remove the central checkout
        if: always()
        shell: bash
        run: rm -rf .docs-only-tools

  # The second fast path, for the diff the release cascade generates rather than the one a
  # human writes. ADR-0082 fans a released version out to every consumer -- 53 of them for
  # platform-contracts-go, 90 for platform-shared-go -- and each fan-out is a pull request
  # containing two lines of go.mod and the matching go.sum rows. Because service CI runs on
  # both pull_request and push:main, one platform-shared-go release bills ~180 runs of this
  # 28-job pipeline to answer a question about a version string.
  #
  # Most of these jobs cannot answer differently: structure reads the repository layout,
  # uuid-policy and org-vocabulary scan Go source, source-invariants scans the checkout, and
  # under a pin-only diff every one of those inputs is byte-identical to the run that already
  # passed on the base commit.
  #
  # What is NOT skipped is the point. build-test, integration and e2e still run, because a
  # library change is a behaviour change; vulnerabilities and dependency-review still run,
  # because a bump is exactly when a CVE arrives and the dependency delta is their whole
  # subject; openapi-generator still runs, because the generator library comes FROM
  # platform-shared-go and a bump can legitimately change the generated spec; and artifact
  # still runs, because a merged bump needs an image. That is what makes this a saving rather
  # than a hole, and test_pin_only_diff.py asserts every line of it.
  pin-only:
    name: Dependency-pin-only change
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pin_only: ${{ steps.classify.outputs.pin_only }}
    steps:
      # Full history, for the same reason as docs-only: the before-SHA of a push is exactly
      # the object a shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the central classifier
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .pin-only-tools
          sparse-checkout: scripts

      # Degrades to `false`, which is the behaviour before this job existed, rather than
      # failing. Same asymmetry as docs-only: this job's purpose is to SKIP things, so an
      # unreachable classifier must quietly run the full pipeline it was trying to shorten.
      - name: Classify the diff
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .pin-only-tools/scripts/pin-only-diff.py ]]; then
            echo "::warning::the central dependency-pin classifier is not present in this"
            echo "::warning::checkout of ci-workflows; running every gate, as before."
            echo "pin_only=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 .pin-only-tools/scripts/pin-only-diff.py --repo-root .

      - name: Remove the central checkout
        if: always()
        shell: bash
        run: rm -rf .pin-only-tools

  # The language-specific jobs below are necessarily conditional, which means an unrecognised
  # language would skip build, test, coverage and CodeQL and still report the pipeline green.
  # Every repo in the fleet is Go today, so this guard costs nothing now and is the difference
  # between "the first non-Go service is unbuilt and nobody notices" and "the first non-Go
  # service fails loudly until this workflow learns its toolchain".
  supported-language:
    name: Language is supported
    needs: resolve
    runs-on: inboxxhq-ci
    timeout-minutes: 2
    steps:
      - name: Refuse a language this pipeline cannot build
        shell: bash
        env:
          LANGUAGE: ${{ needs.resolve.outputs.language }}
        run: |
          set -euo pipefail
          case "${LANGUAGE}" in
            go) echo "language ${LANGUAGE}: build, test, coverage and CodeQL apply" ;;
            *)
              echo "::error::the catalog reports runtime.language=${LANGUAGE} for this repository,"
              echo "::error::which service-ci.yaml has no toolchain for. Build, test, coverage and"
              echo "::error::CodeQL would all be skipped and this pipeline would still pass. Add"
              echo "::error::the toolchain centrally before onboarding this repo."
              exit 1 ;;
          esac

  # ── universal standards ─────────────────────────────────────────────────────────────────────
  # Applies to every repository regardless of language or archetype. Nothing here reads a script
  # from the repository being checked; that is the whole point.
  standards:
    name: Repository standards
    needs: [resolve, pin-only]
    if: needs.pin-only.outputs.pin_only != 'true'
    runs-on: inboxxhq-ci
    timeout-minutes: 15
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned by digest, not `:latest`. This one step is the workflow-lint gate for 97
      # repositories, so a floating tag means an upstream release can turn the entire fleet red
      # with no change in any repository, and means a developer's local actionlint cannot
      # reproduce what CI decided. Measured 2026-07-30: 1.7.7/shellcheck-0.10.0 reports 18
      # findings in inboxxhq-infra where 1.7.12/shellcheck-0.11.0 reports 15, on identical
      # source. Digest, not tag, because a tag can be re-pushed onto different content.
      #
      # Bumping this is a deliberate act: raise the pin, run the fleet scan, fix what the new
      # version finds, then land both together.
      - name: Lint workflow definitions
        # Binary release, not the docker:// container action: the self-hosted pool
        # has no Docker daemon. Same actionlint 1.7.12 + shellcheck 0.11.0 the pinned
        # image carried, pinned by version + sha256 of each release tarball, per arch.
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256_AMD64: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ACTIONLINT_SHA256_ARM64: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256_X86_64: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          SHELLCHECK_SHA256_AARCH64: "12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  al_arch=amd64; al_sha="${ACTIONLINT_SHA256_AMD64}"; sc_arch=x86_64;  sc_sha="${SHELLCHECK_SHA256_X86_64}" ;;
            aarch64) al_arch=arm64; al_sha="${ACTIONLINT_SHA256_ARM64}"; sc_arch=aarch64; sc_sha="${SHELLCHECK_SHA256_AARCH64}" ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          bin="${RUNNER_TEMP}/lint-bin"; mkdir -p "${bin}"
          al="actionlint_${ACTIONLINT_VERSION}_linux_${al_arch}.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${al}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
          echo "${al_sha}  ${RUNNER_TEMP}/${al}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${al}" -C "${bin}" actionlint
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.${sc_arch}.tar.xz"
          curl -sSfL -o "${RUNNER_TEMP}/${sc}" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc}"
          echo "${sc_sha}  ${RUNNER_TEMP}/${sc}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${sc}" -C "${bin}" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          PATH="${bin}:${PATH}" "${bin}/actionlint" -color

      # The scanner binary, not the Action wrapper. gitleaks itself is MIT and has no licence
      # gate; gitleaks-action has been licence-gated for organization-owned repos since v2.0.0,
      # which made every InboxxHQ-CoderAxis repository fail this step with "missing gitleaks
      # license" while coderaxis (a personal account) scanned free. No licence key covers 48
      # org repos on the free tier, and buying one to run an MIT scanner through a proprietary
      # wrapper is the wrong trade.
      #
      # Pinned by version + sha256. A floating "latest" would let an upstream release change the
      # gate under the fleet with nothing to review — the same reason actionlint is pinned by
      # digest above. The binary reads each repo's .gitleaks.toml automatically.
      #
      # This is the only scanner watching for committed credentials: Trivy's secret scanner is
      # switched off below because it cannot read .gitleaks.toml and re-flags what that file
      # deliberately allowlists.
      - name: Scan for committed secrets
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_${VERSION}_linux_{x64,arm64}.tar.gz from the release checksums file.
          GITLEAKS_SHA256_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_SHA256_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  arch=x64;   GITLEAKS_SHA256="${GITLEAKS_SHA256_X64}" ;;
            aarch64) arch=arm64; GITLEAKS_SHA256="${GITLEAKS_SHA256_ARM64}" ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          archive="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          # Full history (fetch-depth: 0 above). A shallow scan cannot see a secret that was
          # committed and later deleted, which is exactly the case a secret scan exists to catch.
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner

  # ── language pipeline ───────────────────────────────────────────────────────────────────────
  build-test:
    name: Build and test (${{ needs.resolve.outputs.language }})
    # `docs-only` joins the needs of every job below that reads source, and the added clause is
    # always the same: run unless the whole diff was documentation. The reasoning, and why this is
    # an `if:` rather than a `paths-ignore:`, is on the docs-only job above.
    needs: [resolve, docs-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.language == 'go'
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 45
    # Started for every Go repo, not only the ones that need it, because `services:` is resolved
    # before `needs` is available and so cannot be made conditional. The alternative — a second
    # coverage job for adapter repos, with the threshold evaluated in whichever ran — puts the gate
    # in two places. An idle Postgres costs a container start; a gate in two places costs a repo
    # that passes in one and was never checked by the other.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: service_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Mint module-read token
        id: modauth
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Download private modules
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          [[ -n "${MOD_TOKEN}" ]] || { echo "::error::module token required for private Go modules"; exit 1; }
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          GOWORK=off go mod download

      - name: Lint
        shell: bash
        # GOWORK is set for the whole step rather than on the fallback command alone. `make lint`
        # runs a repository's own Makefile, and no repository's Makefile sets it, so the one branch
        # of this step that the fleet actually takes was the branch not pinned to CI's resolution.
        # A runner has no workspace to find today, which is why nothing broke -- but that made the
        # guarantee incidental, resting on the checkout's shape instead of being stated. Setting it
        # here holds for make, for anything make shells out to, and for a runner that one day has a
        # workspace on it.
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          # `make lint` is the fleet convention; fall back to vet so a repo without a Makefile
          # target is still linted rather than silently skipped.
          if grep -qE '^lint:' Makefile 2>/dev/null; then make lint; else go vet ./...; fi

      - name: Point the tests at the throwaway database
        shell: bash
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          # One name, because all 41 integration test files in the fleet read this one. The tests
          # apply their own migrations through schema.GooseUpDSN, so the database only has to exist.
          echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:${PG_PORT}/service_test?sslmode=disable" \
            >> "${GITHUB_ENV}"

      - name: Tests with coverage
        shell: bash
        env:
          # Through env, not inline `${{ }}`: a run block interpolates before bash sees it, so a
          # caller's string would be shell, not an argument.
          GO_TAGS: ${{ inputs.go_build_tags }}
        run: |
          set -euo pipefail
          # WHY THE INTEGRATION TAG IS ALWAYS ON.
          #
          # The 27 *-core-postgres repos keep every test behind `//go:build integration`, because a
          # repository whose entire job is talking to Postgres has almost nothing to assert without
          # one. Measuring them untagged compiled no tests at all and reported 0.0%, so the tier-0
          # threshold failed on repos that are, in fact, tested — and the only lane that ran those
          # tests was the integration job, which is gated on repo_kind == 'deployable' and therefore
          # never ran for an adapter. The tag was doing the opposite of its purpose: hiding the
          # tests from the gate rather than the gate from a missing database.
          #
          # Unconditional, because a conditional would have to be told which repos qualify, and the
          # fleet has already shown what happens to lists that must be kept in step. For a repo with
          # no tagged files the tag selects nothing extra and the run is unchanged; every repo that
          # does have them needs only Postgres, which is now present. tests/integration stays out of
          # the package list below and remains the integration job's, so nothing runs twice.
          #
          # A repo whose Dockerfile builds with a tag of its own adds it through go_build_tags, and
          # keeps `integration` when it does, for everything above. The default is `integration`
          # alone, so this is the same run it has always been for every caller that says nothing.
          #
          # WHAT IS MEASURED, AND WHY IT IS NOT `./...`.
          #
          # The threshold is only meaningful if the denominator is code that this repo's own
          # tests could plausibly execute. Two kinds of package are in `./...` and can never be,
          # so leaving them in charges a repo for coverage it has no way to earn:
          #
          #   package main   — entrypoints and dependency wiring. Exercised by running the
          #                    binary, not by unit tests.
          #   imports testing — a package that imports `testing` outside a _test.go file IS a
          #                    test suite, published as a library so OTHER modules can run it
          #                    against their adapters. auth-core/contracttest/* is the example:
          #                    381 statements that execute in auth-core-postgres's test run and
          #                    are therefore, by construction, 0% covered where they are defined.
          #
          # Detected rather than named. A path allowlist here would be a second place to edit
          # every time a repo adds a suite, and the fleet has already shown what happens to
          # per-repo lists that must be kept in step. Both properties come from `go list`, which
          # reads the source, so a package cannot opt itself out by being renamed.
          #
          # These only ever REMOVE near-zero-coverage packages, so no repo that passes today
          # starts failing. On auth-core it moves a true 52.1% to a true 57.8%; the gap to the
          # tier threshold is real and stays real.
          #
          # mapfile rather than an unquoted command substitution: a package path containing a space
          # would otherwise split into two arguments and go test would fail on a path that does not
          # exist, reported as a test failure rather than a quoting bug.
          mapfile -t pkgs < <(
            GOWORK=off go list -tags="${GO_TAGS}" \
              -f '{{.ImportPath}} {{.Name}} {{range .Imports}}{{if eq . "testing"}}T{{end}}{{end}}' ./... \
              | grep -Ev '/tests/(contracts|integration)' \
              | awk '$2 != "main" && $3 != "T" { print $1 }'
          )
          [[ ${#pkgs[@]} -gt 0 ]] || { echo "::error::no packages left to measure — the filter is wrong, not the repo"; exit 1; }

          # -coverpkg over the same list, because by default Go credits a test only for statements
          # in its own package. An adapter repo's tests live in the root package and drive
          # internal/db, so that work was invisible: internal/db counted 270 statements toward the
          # denominator and was reported at 0.0% while being executed on every run. Attribution
          # across the set can only add covered statements to a denominator that was already this
          # list, so no repo's number falls.
          list="$(IFS=,; echo "${pkgs[*]}")"
          GOWORK=off go test -tags="${GO_TAGS}" -coverpkg="${list}" "${pkgs[@]}" \
            -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -5

      - name: Check out the central checkers
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .central
          sparse-checkout: scripts

      - name: Enforce the tier's coverage threshold
        shell: bash
        env:
          THRESHOLD: ${{ needs.resolve.outputs.coverage_threshold }}
        run: |
          set -euo pipefail
          # Missing coverage is a failure, not a warning: "no coverage file" was previously an
          # automatic pass, which is the same outcome as having no tests at all.
          [[ -s coverage.out ]] || { echo "::error::coverage.out missing — the gate cannot be evaluated"; exit 1; }
          PCT="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          [[ -n "${PCT}" ]] || { echo "::error::could not parse coverage total"; exit 1; }
          echo "coverage ${PCT}% (tier ${{ needs.resolve.outputs.tier }} requires >= ${THRESHOLD}%)"

          # Compared against the threshold AND against the repo's own recorded floor. Comparing
          # only against the target constrains nothing in a repo that is far below it: the number
          # was already failing, so it is free to keep falling. The ratchet makes the current
          # position the thing that cannot be lost, while the target stays the thing being aimed at.
          python3 .central/scripts/check_coverage_ratchet.py --pct "${PCT}" --threshold "${THRESHOLD}"

      - name: Contract tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests/contracts ]]; then GOWORK=off go test ./tests/contracts/... -count=1; \
          else echo "no tests/contracts directory"; fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          retention-days: 14

  codeql:
    name: CodeQL
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.language == 'go' && needs.pin-only.outputs.pin_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      security-events: write
      # analyze@v3 reads the workflow run via the REST API to attach results to the right commit.
      # Without this it fails on "Resource not accessible by integration" AFTER extraction and
      # autobuild have already succeeded, so the cost of omitting it is a full CodeQL build.
      actions: read
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Autobuild compiles the module, so it needs the same private-module access the test job has.
      # The workflow this job absorbed did mint a token; centralizing dropped it, and autobuild then
      # failed with "could not read Username for https://github.com" - a git credential error that
      # says nothing about CodeQL. Analysis cannot run on a repo whose dependencies will not resolve,
      # so this must fail loudly rather than degrade to scanning a subset.
      - name: Mint module-read token
        id: modauth
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Configure private module access
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          [[ -n "${MOD_TOKEN}" ]] || { echo "::error::module token required for private Go modules"; exit 1; }
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3

      # Code scanning (the API analyze uploads to) is a paid GitHub feature. Extraction and autobuild
      # still prove the code compiles under analysis; failing the job for a platform entitlement the
      # App cannot buy would make CI red for a reason nobody in the repo can fix. When the upload is
      # refused for that reason we record it and move on; any other analyze failure still fails.
      #
      # Ask the API whether an upload would be accepted instead of inferring it from repository
      # shape. The previous proxy - "user-owned AND private" - called every org-owned private repo
      # entitled, so the upload ran and failed while the no-entitlement path below was skipped: the
      # fallback existed but could not be reached, which is why CodeQL was red fleet-wide.
      #
      # Probing is also what the job can actually authorize. security_and_analysis.code_security is
      # returned only to admins, so it is absent under GITHUB_TOKEN, whereas the alerts endpoint is
      # readable with the security-events scope this job already holds. Asking the same API that
      # rejects the upload means the answer cannot disagree with it, and the check self-heals: the
      # day Code Security is enabled, uploads resume with no change here.
      - name: Detect Code scanning availability
        id: codescan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if probe="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1" 2>&1)"; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          case "${probe}" in
            # A repo with the feature on but nothing analysed yet is entitled, not blocked.
            *"no analysis found"*|*"No analysis found"*)
              echo "available=true" >> "${GITHUB_OUTPUT}"
              ;;
            # Three phrasings for one condition, because GitHub has changed the wording and the
            # older forms still appear. The current message names neither "Advanced Security"
            # nor "must be enabled":
            #
            #   Code scanning is not enabled for this repository.
            #   Please enable code scanning in the repository settings.
            #
            # so it fell through to the catch-all below and failed the job - correctly by the
            # rule as written, and wrongly in fact, since this IS the unentitled case. Matching
            # only the vocabulary of the day makes this gate red fleet-wide on a GitHub copy edit,
            # which is what happened here.
            *"must be enabled"*|*"Advanced Security"*|*"advanced security"*|*"ode scanning is not enabled"*)
              echo "available=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::Code scanning is not enabled for ${GITHUB_REPOSITORY}; CodeQL analysis runs but results are not uploaded. Enabling Code Security is an org admin action, tracked as EX-0013 in the standard exception register."
              ;;
            # An unrecognised failure must not be read as "unentitled". That would silence uploads
            # for a token or outage problem and quietly retire the gate across the fleet.
            *)
              echo "::error::could not determine Code scanning availability for ${GITHUB_REPOSITORY}: ${probe}"
              exit 1
              ;;
          esac

      - name: Upload CodeQL results
        if: steps.codescan.outputs.available == 'true'
        uses: github/codeql-action/analyze@v3

      - name: Analyze without upload (no Code scanning entitlement)
        if: steps.codescan.outputs.available == 'false'
        uses: github/codeql-action/analyze@v3
        with:
          upload: false

  # ── contract gates, selected by what the catalog says the service exposes ────────────────────
  # These run for EVERY repository, deliberately unconditioned.
  #
  # Gating them on catalog facts looked tidy and was wrong: schema-compatibility runs in 91 repos
  # today and event-handling-compliance in 60, so gating on `owns_database` / `has_events` would
  # have silently switched them off for roughly half the fleet — the checks would have kept
  # reporting green while enforcing nothing, which is worse than deleting them outright.
  #
  # Running them unconditionally also makes each check assert the NEGATIVE rather than assume it.
  # role=E is derived for a service the catalog says has no events, and the compliance check then
  # verifies that claim against the code, catching a service that grew a Kafka producer without
  # ever declaring it. A skipped job can never catch that.
  events:
    name: Event handling compliance
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.pin-only.outputs.pin_only != 'true'
    uses: coderaxis/ci-workflows/.github/workflows/event-handling-compliance.yaml@v1
    with:
      role: ${{ needs.resolve.outputs.role }}
      # Required whenever the role sanctions a direct producer, and passing it is what makes
      # Hybrid reachable at all. The gate has always taken this input and the catalog has always
      # been able to declare the role, but nothing carried the topics between them -- so a
      # service in exactly the situation Hybrid describes (owns Postgres AND one latency-critical
      # stream) could only ever fail, first for producing directly, then for producing to an
      # undeclared topic. Empty for every other role, which is what the gate expects.
      allowed_topics: ${{ needs.resolve.outputs.allowed_topics }}

  seeding:
    name: Seeding contract
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.pin-only.outputs.pin_only != 'true'
    uses: coderaxis/ci-workflows/.github/workflows/seed-contract-check.yaml@v1

  schema:
    name: Schema compatibility
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.pin-only.outputs.pin_only != 'true'
    permissions:
      contents: read
      # The called workflow mints a module-read token from its own OIDC identity, and a called
      # job is capped by what the caller grants. Enforced by WFC-0004, which caught the omission
      # here as a startup_failure with no logs.
      id-token: write
    uses: coderaxis/ci-workflows/.github/workflows/schema-compatibility.yaml@v1
    # No secrets and no inputs, both deliberate. The called workflow mints its own module-read
    # token from its OIDC identity through ci-app-token, and it discovers the outbox tables to
    # verify from the migrated schema. It used to take a `table` input naming the one table to
    # check, which no caller ever passed — this job is the only caller — so outbox conformance
    # silently verified nothing in all 27 core-postgres repos while reporting green.

  dockerfile:
    name: Dockerfile standard
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.deployable == 'true' && needs.pin-only.outputs.pin_only != 'true'
    uses: coderaxis/ci-workflows/.github/workflows/dockerfile-standard.yaml@v1
    with:
      capabilities: ${{ needs.resolve.outputs.capabilities }}

  # ── repository structure ────────────────────────────────────────────────────────────────────
  # Absorbed from the per-repo quality-check.yml. Entirely generic: it asserts the shape every
  # Go service is required to have, so there was never a reason for each repo to carry its own.
  structure:
    name: Repository structure
    # Its README.md and docs/ presence checks look like documentation gates, but the `docs` job
    # below grades the whole required documentation tree against the central standard and still
    # runs, so a documentation commit that deletes README.md is caught there rather than here.
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.language == 'go' && needs.pin-only.outputs.pin_only != 'true'
    permissions:
      contents: read
      # The architecture-check step mints a module-read token from this job's OIDC identity to
      # check out the private coderaxis/inboxxhq-architecture-check repo. A called/composite
      # action is capped by what the job grants; without id-token: write, ci-app-token fails with
      # "No OIDC token available" and the gate never runs. Same omission, same failure mode, that
      # WFC-0004 already caught on the schema job.
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Required files, directories and Make targets
        shell: bash
        env:
          REPO_KIND: ${{ needs.resolve.outputs.repo_kind }}
        run: |
          set -euo pipefail
          rc=0
          # Three repo kinds, three shapes. The old per-repo quality-check.yml only ever encoded
          # the deployable one, and applying that set to the modules fails 27 of them on absences
          # that are CORRECT: auth-core has no internal/ because it exports its packages by
          # design, no schema module has a Makefile or a cmd/ at all, and neither kind has
          # build/run/ci targets because there is nothing to build or run. Each set below is the
          # intersection of what that kind actually has across the fleet, so it asserts a real
          # standard instead of being a permanently red gate people learn to ignore.
          case "${REPO_KIND}" in
            deployable)
              files="README.md Makefile go.mod Dockerfile service.contract.yaml"
              dirs="cmd internal scripts tests docs"
              targets="build run clean test lint fmt ci" ;;
            core)
              # Absorbed from the per-repo core-guard.yml. Measured against the fleet before being
              # required here: all 32 core modules carry a Makefile, an application/ directory and
              # at least one of domain/ports/adapters, and 31 of 32 define all nine targets. So this
              # asserts the hexagonal shape a core actually has rather than the deployable shape it
              # does not.
              files="README.md Makefile go.mod"
              dirs="docs application"
              targets="test test-pkg test-one test-race test-cover fmt vet lint tidy clean" ;;
            schema)
              # sqlc.yaml + schema/ + sql/ are what MAKE it a schema module, so requiring them is
              # stronger than the generic set it used to be checked against.
              files="README.md go.mod sqlc.yaml"
              dirs="schema sql internal"
              targets="" ;;
            shared-library)
              # A library is consumed as packages, not run: it has no cmd/ to build, no internal/
              # because hiding its packages would defeat the point, and no Makefile, so it defines
              # none of the nine targets a core does.
              #
              # Deliberately the thinnest set of the four. The other three were measured across 32
              # cores, 27 deployables and every schema module, so their intersections describe a
              # real convention. The Go shared-library population is one repo, and an intersection
              # over one member is not a standard - it is that repo's accidents written down and
              # then enforced on the next library to arrive. So this requires only what makes it a
              # documented Go module, and should be tightened once there is a fleet to measure.
              files="README.md go.mod"
              dirs="docs"
              targets="" ;;
            *)
              echo "::error::repo_kind=${REPO_KIND} is not a shape this gate knows how to check"
              exit 1 ;;
          esac
          for f in ${files}; do
            [[ -f "${f}" ]] || { echo "::error::missing required file: ${f}"; rc=1; }
          done
          for d in ${dirs}; do
            [[ -d "${d}" ]] || { echo "::error::missing required directory: ${d}"; rc=1; }
          done
          for t in ${targets}; do
            make -n "${t}" >/dev/null 2>&1 || { echo "::error::missing required Make target: ${t}"; rc=1; }
          done

          # A core exports its behaviour through ports and adapters, so it must have at least one of
          # them. Requiring all three would be wrong - a core with no inbound adapter is legitimate -
          # which is why this is a one-of rather than another entry in the dirs list above.
          if [[ "${REPO_KIND}" == "core" ]]; then
            found=0
            for d in domain ports adapters; do
              [[ -d "${d}" ]] && found=$((found + 1))
            done
            if [[ "${found}" -eq 0 ]]; then
              echo "::error::a core module must expose at least one of domain/, ports/ or adapters/"
              rc=1
            fi
          fi
          exit "${rc}"

      - name: Go formatting
        shell: bash
        run: |
          set -euo pipefail
          # gofmt -l walks directories, unlike the ./... package patterns every other Go step here
          # uses, so it is the one Go step that can see a tool checkout: this job places
          # inboxxhq-architecture-check at .archcheck/ and service-ci puts ci-workflows at
          # .central/, .uuid-tools/ and .gateway-tools/ in its other jobs. Today only the step
          # ORDER keeps this green — the checkouts happen below. Filtering dot-directories makes
          # that independent of ordering, and costs no coverage: the Go toolchain ignores them, so
          # nothing under one is part of the module this repo builds.
          unformatted="$(gofmt -l . | grep -v -e '^vendor/' -e '^\.' || true)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt would rewrite these files; run 'make fmt'"
            echo "${unformatted}"
            exit 1
          fi

      # ── architecture conformance ──────────────────────────────────────────────────────────
      # The steps above assert that a directory exists. This asserts that the import graph agrees
      # with it, which is what a directory listing cannot see: a repository can have a textbook
      # tree and a graph that ignores it, and that is the failure the layout standards exist to
      # catch.
      #
      # The engine is coderaxis/inboxxhq-architecture-check, not a script in this repository and
      # not a command in ihq. CI and `ihq arch` run the same binary from the same tag, so a green
      # run on a workstation means a green gate here. The last time this platform had one gate
      # with two implementations, the second silently destroyed the first's baseline data.
      #
      # Pinned to @v1 exactly as this repository is pinned by its callers. Tracking main would
      # change the gate under every service with nothing to review.
      - name: Mint checker-read token
        id: archauth
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read

      - name: Check out the architecture checker
        uses: actions/checkout@v4
        with:
          repository: coderaxis/inboxxhq-architecture-check
          ref: v1
          path: .archcheck
          token: ${{ steps.archauth.outputs.token }}

      - name: Architecture conformance
        shell: bash
        run: |
          set -euo pipefail
          # Built in its own module directory so the service's go.mod and go.sum are untouched.
          # A gate that mutates the repository it is checking cannot be trusted to report on it.
          ( cd .archcheck && go build -o "${RUNNER_TEMP}/architecture-check" ./cmd/architecture-check )

          # Ratchet, not a cliff. Frozen counts live under the `arch` key of
          # .api-contract-baseline.json; a count that rises fails, a count that falls passes and
          # prints the gain. A repository with no baseline is held to zero, which is where most
          # of the fleet already is.
          #
          # Exit 2 means the checker could not run and is deliberately not swallowed: a gate that
          # cannot run must not be indistinguishable from one that found nothing.
          "${RUNNER_TEMP}/architecture-check" --repo . --details

      - name: Remove the checker checkout
        if: always()
        shell: bash
        # The checker is not part of the repository under test. Leaving it behind would put its
        # sources in reach of any later step that walks the tree.
        run: rm -rf .archcheck

      # ── log record kinds (Core ADR-0104) ──────────────────────────────────────────────────
      # The gate that had no fleet-facing half. `check-log-schema.py` runs in platform-shared-go
      # and compares the control file, the Go registry and the standard's frontmatter - three
      # DESCRIPTIONS of the schema. It passed for the life of schema v1 while nine of eleven
      # declared record kinds had no emitter at all and six undeclared kinds were being written
      # under the key `event`, because nothing in CI had ever read a service. This step is the
      # half that reads services, so it belongs here rather than beside its sibling.
      #
      # From this repository at the moving major tag, like the guards below: a service must not be
      # able to weaken the vocabulary it is judged by, nor to allowlist its own file.
      - name: Check out the record-kind catalogue (SSOT)
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .log-record-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install guard dependencies
        shell: bash
        run: python3 -m pip install --upgrade PyYAML

      # --layout repo is explicit rather than detected. Detection keys on the presence of the
      # monorepo's top-level trees, and a service repo that happens to hold a `services/` or
      # `tools/` directory would be silently scanned as if it were the fleet - which would skip
      # most of its own files and run the adoption ratchet against one repository. Naming the
      # layout costs one line and removes the guess.
      #
      # Exit 2 means the checker could not run and is deliberately not swallowed, for the same
      # reason it is not swallowed on the architecture step above: an empty scan reports exactly
      # what a conforming repository reports.
      - name: One record-kind vocabulary, reached through its constructors (ADR-0104)
        shell: bash
        run: |
          set -euo pipefail
          python3 .log-record-tools/scripts/check-log-record-kinds.py \
            --repo-root . \
            --layout repo \
            --control .log-record-tools/controls/log-schema.yaml

      - name: Remove the catalogue checkout
        if: always()
        shell: bash
        run: rm -rf .log-record-tools

  # ── workflow lanes (WFC-0006) ────────────────────────────────────────────────────────────────
  # Absorbed from the per-repo pipeline-policy.yml, which asserted that thirteen named workflow
  # files EXISTED in the repository - quality-check.yml, security-scan.yml, codeql.yml,
  # gitleaks.yml, actionlint.yaml, deploy.yaml, post-deploy.yaml, preview-env.yml and others.
  #
  # That check encoded the decentralised model as a requirement, so it actively fought
  # centralisation: deleting a workflow whose logic had moved here turned the gate red, and the
  # only way to keep it green was to keep the copies. Governance was pinning the fleet to the
  # shape it was supposed to be moving away from.
  #
  # Inverted here. The lane set required is the thin-caller set, derived from repo_kind, and the
  # absorbed names are asserted ABSENT - because a repo that keeps a local copy alongside the
  # central call runs both, and the local one silently decides the result.
  lanes:
    name: Required workflow lanes
    needs: resolve
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Required and forbidden workflow lanes
        shell: bash
        env:
          REPO_KIND: ${{ needs.resolve.outputs.repo_kind }}
          HAS_REST: ${{ needs.resolve.outputs.has_rest }}
        run: |
          set -euo pipefail
          rc=0
          wf=".github/workflows"

          # Every repo calls central CI. A core or schema module also publishes a version, so it
          # owns a release lane. A deployable publishes nothing and receives its pins from the
          # cascade, so ci.yaml is the whole of its surface.
          required="${wf}/ci.yaml"
          case "${REPO_KIND}" in
            core)       required="${required} ${wf}/release.yaml" ;;
            schema)     required="${required} ${wf}/release.yaml" ;;
            # Same reason as core and schema: it publishes a version its consumers pin, so it owns
            # a release lane. Its artifact node sets cascade, which makes that lane the thing the
            # fan-out triggers from.
            shared-library) required="${required} ${wf}/release.yaml" ;;
            deployable) ;;
            *) echo "::error::repo_kind=${REPO_KIND} has no defined lane set"; exit 1 ;;
          esac

          for f in ${required}; do
            [[ -f "${f}" ]] || { echo "::error::missing required workflow lane: ${f}"; rc=1; }
          done

          # An ALLOWLIST, not a list of known-bad names. The previous version enumerated the
          # workflows the platform had absorbed, which meant it could only ever catch a file someone
          # had already thought to forbid: a repo could add build-extra.yml, run its own unpinned
          # actions and its own thresholds, and pass. Every drift this migration removed - 91 copies
          # of validate_docs.py, nine variants of one integration harness, one contract gate under
          # two filenames - entered the fleet as a file nobody had listed yet.
          #
          # So the rule is inverted: two names are permitted and everything else fails. Adding a lane
          # now means adding it here, in one place, with a reason.
          allowed="ci.yaml release.yaml"

          # Retained only to explain a failure, never to decide one. A file caught by the allowlist
          # that also appears here gets told where its logic went, rather than just that it is
          # unexpected.
          absorbed="actionlint gitleaks codeql quality-check security-scan dependency-review
                    docs-lint stale-docs-check schema-compatibility event-handling-compliance
                    seed-contract-check sqlc-guard core-guard sbom deploy post-deploy
                    reusable-notify-consumers reusable-module-auth pipeline-policy
                    adr-validation openapi-validation dockerfile-standard docs-governance
                    integration-tests contract-check openapi-contract contract-tests
                    bump-shared-modules"
          # The cascade stopped dispatching to consumers when module-release.yaml began writing pins
          # directly with bump-module-pin, so a surviving listener opens a second, competing PR for
          # a bump that has already landed.
          listeners="bump-core-modules bump-engine-core"

          shopt -s nullglob
          for path in "${wf}"/*.yml "${wf}"/*.yaml; do
            f="$(basename "${path}")"

            # Globbed under both spellings on purpose: matching only *.yaml would mean the check
            # cannot SEE a .yml file, so the extension rule would be unenforceable by the thing
            # meant to enforce it.
            if [[ "${f}" == *.yml ]]; then
              echo "::error file=${path}::${f} must use the .yaml extension."
              echo "Both spellings are valid YAML and valid to GitHub, so a mixed fleet fails"
              echo "nothing and stays mixed - and a glob or CODEOWNERS pattern written for one"
              echo "spelling silently skips every file using the other."
              rc=1
              continue
            fi

            case " ${allowed} " in *" ${f} "*) continue ;; esac

            stem="${f%.*}"
            rc=1
            if [[ " ${absorbed} " == *" ${stem} "* ]]; then
              echo "::error file=${path}::${f} is absorbed by central CI but still present here."
              echo "Running both means the local copy decides the result. Delete it."
            elif [[ " ${listeners} " == *" ${stem} "* ]]; then
              echo "::error file=${path}::${f} is a bump listener. The cascade no longer dispatches"
              echo "to consumers - module-release.yaml writes the pin directly - so this would open a"
              echo "second, competing PR for a bump that has already landed. Delete it."
            else
              echo "::error file=${path}::${f} is not a permitted workflow lane."
              echo "A repository may hold ci.yaml and, if it publishes a version, release.yaml."
              echo "Everything else runs as a job in coderaxis/ci-workflows service-ci.yaml, so a"
              echo "local lane is a second implementation that will drift from it. If this genuinely"
              echo "cannot be a central job, add it to the allowlist in service-ci.yaml with a reason."
            fi
          done
          shopt -u nullglob

          # Kept from pipeline-policy.yml, but conditioned on the catalog instead of assumed: only
          # a service that actually declares a REST interface owes a committed contract.
          #
          # The helper this used to call was never defined, so the check ran as `command not found`
          # inside `if !`, which is indistinguishable from "no contract found". Every REST-declaring
          # deployable failed the lane, auth-service among them while docs/openapi.json sat committed
          # in the tree. Spelled out here so the condition is the file test it claims to be.
          if [[ "${HAS_REST}" == "true" && "${REPO_KIND}" == "deployable" ]]; then
            found=""
            for candidate in docs/openapi.json docs/openapi.yaml docs/openapi.yml \
                             api/openapi.json api/openapi.yaml api/openapi.yml; do
              if [[ -f "${candidate}" ]]; then found="${candidate}"; break; fi
            done
            if [[ -z "${found}" ]]; then
              echo "::error::catalog declares a REST interface but no OpenAPI contract is committed"
              rc=1
            else
              echo "OpenAPI contract present at ${found}"
            fi
          fi
          exit "${rc}"

  # ── vulnerabilities ─────────────────────────────────────────────────────────────────────────
  # Absorbed from the per-repo security-scan.yml, with one behavioural change: it blocks.
  # That workflow read SECURITY_BLOCKING from a repo variable and DEFAULTED IT TO 'false', so
  # across the fleet vulnerability findings were reported and then ignored, and a repo could
  # keep it that way by doing nothing. Severity is a platform decision, not a repo setting.
  vulnerabilities:
    name: Vulnerabilities
    # Skipped for a documentation diff even though a CVE can be disclosed without anyone pushing.
    # This pipeline is not the fleet's vulnerability radar and never was: it scans the dependency
    # set a commit carries, and a documentation commit carries the same set the previous run
    # already scanned. Periodic re-scanning is a scheduled fleet job, as the header of this file
    # says, and shifting that duty onto whoever next edits a README is not a control.
    needs: [resolve, docs-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.language == 'go'
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 45
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - uses: actions/checkout@v4

      - name: High-signal secret scan
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|xox[baprs]-[0-9A-Za-z-]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
          if git grep -nIE "${PATTERN}" -- ':!go.sum' ':!**/*.md' ':!docs/**' ':!testdata/**'; then
            echo "::error::high-signal secret pattern detected"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Mint module-read token
        id: modauth
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Known vulnerabilities in dependencies
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOWORK=off "$(go env GOPATH)/bin/govulncheck" ./...

      # Carried over from the per-repo core-guard.yml at its existing posture, deliberately.
      # Making it blocking here would tighten the fleet inside the same change that centralises
      # it, so a real regression and a pre-existing baseline would be indistinguishable. Promoting
      # it to blocking is its own decision, taken once the baseline is known to be clean.
      - name: Static analysis (advisory)
        continue-on-error: true
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go install honnef.co/go/tools/cmd/staticcheck@latest
          GOWORK=off "$(go env GOPATH)/bin/staticcheck" ./... \
            || echo "::warning::staticcheck findings are advisory until the fleet baseline is clean"

      # This repo tags releases as `vX.Y.Z`; `0.28.0` has no `v` and does not resolve, so the job
      # failed on "unable to find version" before scanning anything.
      #
      # `scanners: vuln` is deliberate. Current Trivy also runs a secret scanner by default, which
      # does not read .gitleaks.toml and so re-reports what that file deliberately allowlists - its
      # first finding here was the example GitHub token published in GitHub's own docs, which the
      # allowlist exists to permit. Secret scanning is owned by gitleaks in the `standards` job,
      # where the allowlist lives; two scanners for one concern, only one of which can be taught
      # about a false positive, means the other can only be silenced wholesale.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ── UUID version policy ─────────────────────────────────────────────────────────────────────
  # Executable form of the "UUIDv7 everywhere, deterministic v3/v5 only where a documented reason
  # exists" rule in ADR-0071 and outbox-ddl-standard §2.1. Until this job existed the rule had no
  # gate at all: the DDL's DEFAULT uuidv7() never fires because the shared INSERT names event_id,
  # outboxverify reads the catalog and never a value, and outboxwritepath samples rows but checks no
  # version. A caller supplying a v5 event_id passed all three, which is what shipped.
  #
  # It runs here rather than in platform-shared-go on purpose. The equivalent runtime guard would be
  # four lines in outbox.resolveEventID and would be strictly more complete, but it lands in a module
  # with ~86 consumers and buys nothing for the mustUUIDv7 shape, which never reaches the outbox at
  # all. This job ships to the whole fleet by moving the v1 tag on this repository, with no Go module
  # bump anywhere. The runtime guard is still worth doing; it should ride an already-planned
  # shared-go bump rather than force one.
  #
  # No module-read token and no `go mod download`: uuidscan is stdlib-only and parses with
  # go/parser, so it needs neither the repo's dependencies nor a build that succeeds. That is what
  # makes it cheap enough to run on every repository.
  uuid-policy:
    name: UUID version policy
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.language == 'go' && needs.pin-only.outputs.pin_only != 'true'
    permissions:
      contents: read
    runs-on: inboxxhq-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check out the central checker and control catalog
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .uuid-tools
          sparse-checkout: |
            scripts
            controls
            tools

      - name: Install guard dependencies
        shell: bash
        run: python3 -m pip install --upgrade PyYAML

      - name: UUID version policy
        shell: bash
        run: |
          set -euo pipefail
          # Built once, out of tree, with the proxy off: the scanner has no
          # requires, so a network fetch here could only be a supply-chain
          # surprise.
          GOWORK=off GOFLAGS=-mod=mod GOPROXY=off \
            go build -C .uuid-tools/tools/uuidscan -o "$RUNNER_TEMP/uuidscan" .
          UUIDSCAN_BIN="$RUNNER_TEMP/uuidscan" \
            python3 .uuid-tools/scripts/check-uuid-version-policy.py \
              --repo-root . \
              --control .uuid-tools/controls/uuid-policy.yaml \
              --report uuid-policy-report.json

      - name: Upload the finding report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uuid-policy-report
          path: uuid-policy-report.json
          if-no-files-found: ignore

      - name: Remove the central checkout
        if: always()
        shell: bash
        run: rm -rf .uuid-tools

  # ── org vocabulary enforcement ──────────────────────────────────────────────────────────────
  org-vocabulary:
    name: Org vocabulary policy
    needs: [resolve, pin-only]
    if: needs.pin-only.outputs.pin_only != 'true'
    permissions:
      contents: read
    runs-on: inboxxhq-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out the central checker and control catalog
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .org-tools
          sparse-checkout: |
            scripts
            controls

      - name: Install guard dependencies
        shell: bash
        run: python3 -m pip install --upgrade PyYAML

      - name: Org vocabulary policy
        shell: bash
        run: |
          set -euo pipefail
          python3 .org-tools/scripts/check-org-vocabulary.py \
            --repo-root . \
            --control .org-tools/controls/org-vocabulary.yaml

      - name: Remove the central checkout
        if: always()
        shell: bash
        run: rm -rf .org-tools

  # ── generated-code and query drift ──────────────────────────────────────────────────────────
  sqlc:
    name: SQLC drift and raw-SQL guard
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.language == 'go' && needs.pin-only.outputs.pin_only != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Mint module-read token
        id: modauth
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      # The guard used to be scripts/check-no-raw-sql.py inside each repo. Two repos carried it
      # and the copies had already diverged, so it now lives here as one implementation.
      - name: Check out the central checkers
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .central
          sparse-checkout: scripts

      - name: Verify sqlc generated code is current
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          if [[ ! -f sqlc.yaml && ! -f sqlc.yml ]]; then
            echo "no sqlc.yaml in this repo; nothing to verify"
            exit 0
          fi
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          "$(go env GOPATH)/bin/sqlc" generate

          # Diffed against the directories sqlc was configured to write, not two names guessed in
          # advance. The check used to compare `sqlc` and `rootsqlc`, which no repository in the
          # fleet uses — every one of them sets out: internal/db. git diff tolerates a pathspec
          # matching nothing, so the comparison succeeded without reading a single generated file
          # and the gate passed on every repo whatever its output contained.
          mapfile -t outs < <(python3 .central/scripts/sqlc_output_dirs.py)
          if [[ ${#outs[@]} -eq 0 ]]; then
            echo "::error::sqlc.yaml declares no Go output directory; the drift check has nothing to compare"
            exit 1
          fi
          echo "comparing generated output in: ${outs[*]}"
          git diff --exit-code -- "${outs[@]}" \
            || { echo "::error::sqlc generated code drift; run 'sqlc generate' and commit"; exit 1; }

      - name: Raw SQL guard
        shell: bash
        run: python3 .central/scripts/check_no_raw_sql.py

  # ── contracts ───────────────────────────────────────────────────────────────────────────────
  # Absorbs the per-repo adr-validation.yml and openapi-validation.yml, which existed in 91
  # repositories each and could not fail. Every finding in adr-validation.yml was emitted as
  # `::warning` and the script ended in `exit 0`; openapi-validation.yml returned 0 when the spec
  # was absent. Both therefore reported success on a repository with no ADRs, no contract, and no
  # index - 182 workflow files whose only effect was to make the checks list look longer.
  #
  # Here the same checks block. Whether they APPLY is decided by the catalog rather than by what
  # the repository happens to contain, which is the part that made the old versions vacuous: a
  # service that had lost its OpenAPI spec passed the OpenAPI gate precisely because it had lost it.
  contracts:
    name: ADR and API contract validation
    needs: [resolve, pin-only]
    if: needs.pin-only.outputs.pin_only != 'true'
    runs-on: inboxxhq-ci
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out the central checkers
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .central
          sparse-checkout: scripts

      - name: ADR structure
        shell: bash
        run: |
          set -euo pipefail
          [[ -d docs/adr ]] || { echo "no docs/adr in this repo"; exit 0; }
          mapfile -t adrs < <(find docs/adr -maxdepth 1 -type f -name 'ADR-*.md' | sort)
          rc=0
          for adr in "${adrs[@]}"; do
            base="$(basename "${adr}")"
            [[ "${base}" =~ ^ADR-[0-9]{4}-.+\.md$ ]] \
              || { echo "::error file=${adr}::ADR filenames must match ADR-0001-title.md"; rc=1; }
            [[ -s "${adr}" ]] || { echo "::error file=${adr}::ADR file is empty"; rc=1; }
            grep -Eq '^# .+' "${adr}" \
              || { echo "::error file=${adr}::ADR must have a top-level markdown heading"; rc=1; }
          done
          # An unindexed ADR is invisible to every reader who starts at the index, which is all of
          # them. The old check warned about this and 91 repos accumulated the drift.
          if [[ -f docs/adr/ADR_INDEX.md ]]; then
            for adr in "${adrs[@]}"; do
              base="$(basename "${adr}")"
              grep -Fq "${base}" docs/adr/ADR_INDEX.md \
                || { echo "::error file=docs/adr/ADR_INDEX.md::${base} is not listed"; rc=1; }
            done
          elif [[ ${#adrs[@]} -gt 0 ]]; then
            echo "::error::docs/adr contains ADRs but has no ADR_INDEX.md"
            rc=1
          fi
          exit "${rc}"

      - name: OpenAPI contract
        shell: bash
        env:
          HAS_REST: ${{ needs.resolve.outputs.has_rest }}
          REPO_KIND: ${{ needs.resolve.outputs.repo_kind }}
        run: |
          set -euo pipefail
          spec=""
          for c in docs/openapi.json docs/openapi.yaml docs/openapi.yml \
                   api/openapi.json api/openapi.yaml api/openapi.yml; do
            [[ -f "${c}" ]] && { spec="${c}"; break; }
          done

          # The catalog decides whether a contract is owed. Keying this off the file's presence -
          # what the old workflow did - means deleting the spec is how you pass the check.
          if [[ -z "${spec}" ]]; then
            if [[ "${HAS_REST}" == "true" && "${REPO_KIND}" == "deployable" ]]; then
              echo "::error::the catalog declares a REST interface but no OpenAPI contract is committed"
              exit 1
            fi
            echo "no REST interface declared and no spec committed; nothing to validate"
            exit 0
          fi

          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - "${spec}" <<'PY'
          import json, sys, pathlib
          import yaml
          p = pathlib.Path(sys.argv[1])
          raw = p.read_text(encoding="utf-8")
          spec = json.loads(raw) if p.suffix == ".json" else yaml.safe_load(raw)
          errs = []
          if not isinstance(spec, dict):
              errs.append("spec is not a mapping")
              spec = {}
          if spec.get("openapi") is None and spec.get("swagger") is None:
              errs.append("spec must declare an openapi or swagger version")
          if not (spec.get("info") or {}).get("version"):
              errs.append("spec must declare info.version")
          if not spec.get("paths"):
              errs.append("spec declares no paths")
          for e in errs:
              print(f"::error file={p}::{e}")
          sys.exit(1 if errs else 0)
          PY

      # ADR-0006: operationIds are semver-governed public identifiers that generated SDKs, API
      # catalogs and observability keys depend on. The guard existed centrally and was wired into
      # nothing, so the governance it defines had never once been enforced.
      - name: OperationId governance
        shell: bash
        env:
          HAS_REST: ${{ needs.resolve.outputs.has_rest }}
        run: |
          set -euo pipefail
          spec=""
          for c in docs/openapi.json docs/openapi.yaml docs/openapi.yml; do
            [[ -f "${c}" ]] && { spec="${c}"; break; }
          done

          if [[ -z "${spec}" ]]; then
            echo "no committed OpenAPI contract; operationId governance does not apply"
            exit 0
          fi

          # The catalog decides whether these identifiers are governed, exactly as it decides for
          # the `contract` and `openapi-generator` jobs. operationIds are public identifiers only
          # where HTTP is a published contract; for a gRPC-only service the document is an artefact
          # of the generator, nothing consumes the names, and ADR-0093 rule 4 says the document
          # should not be there at all.
          #
          # Keying this off the file alone made the gate demand a governance lock from services
          # that owe no HTTP contract, and this job blocks `artifact` -- so those services could
          # not deploy. ledger-service last reached dev on 2026-07-05 for this reason. Governing
          # names nobody may call is not a safety property worth a stalled release train.
          #
          # This is not the "deleting the spec is how you pass" hole the OpenAPI contract step
          # above guards against, because the answer comes from the catalog rather than the working
          # tree: a service that declares REST is still required to commit a spec by that step, and
          # declaring REST while publishing no operationIds still fails here. Removing the
          # declaration is a CODEOWNERS-guarded catalog edit, not a file deletion.
          if [[ "${HAS_REST}" != "true" ]]; then
            echo "${spec} is committed but the catalog declares no REST interface, so its"
            echo "operationIds are not public identifiers and are not governed."
            echo "Per ADR-0093 rule 4 this document should be pruned rather than governed."
            exit 0
          fi

          python3 .central/scripts/check_operation_ids.py --check

  # ── integration ─────────────────────────────────────────────────────────────────────────────
  # Absorbs the per-repo integration-tests.yml: 35 copies, of which 21 were byte-identical and the
  # other 14 had drifted into nine variants of the same harness. All 35 authenticated with
  # `secrets.CODERAXIS_APP_ID`, which the OIDC migration deleted - so every one of them had been
  # unable to download a private module since that change, and the fleet's only real end-to-end
  # coverage was failing or vacuously passing in 35 places at once.
  #
  # The selection rule is the substantive change. The old harness looked for
  # tests/integration/*_test.go and set run=false when it found none, which made deleting your
  # integration tests the way to pass the integration gate. Here the catalog decides who owes
  # coverage, so an empty tests/integration directory is a failure for a service that owns data
  # rather than a silent skip.
  integration:
    name: Integration tests
    needs: [resolve, docs-only]
    if: >-
      needs.docs-only.outputs.docs_only != 'true'
      && needs.resolve.outputs.repo_kind == 'deployable'
      && needs.resolve.outputs.language == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: service_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: false

      - name: Resolve service endpoints
        shell: bash
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          set -euo pipefail
          dsn="postgres://postgres:postgres@localhost:${PG_PORT}/service_test?sslmode=disable"
          {
            echo "DATABASE_URL=${dsn}"
            echo "POSTGRES_DSN=${dsn}"
            echo "REDIS_ADDR=localhost:${REDIS_PORT}"
          } >> "${GITHUB_ENV}"

      # The catalog, not the working tree, decides whether this service owes integration coverage.
      - name: Decide whether integration coverage is owed
        id: selection
        shell: bash
        env:
          OWNS_DATABASE: ${{ needs.resolve.outputs.owns_database }}
          HAS_EVENTS: ${{ needs.resolve.outputs.has_events }}
        run: |
          set -euo pipefail
          present=false
          find tests/integration -name '*_test.go' -print -quit 2>/dev/null | grep -q . && present=true

          owed=false
          [[ "${OWNS_DATABASE}" == "true" || "${HAS_EVENTS}" == "true" ]] && owed=true

          if [[ "${owed}" == "true" && "${present}" == "false" ]]; then
            echo "::error::the catalog declares this service owns a database and/or publishes events,"
            echo "but tests/integration contains no Go test files. The behaviour that crosses a"
            echo "process boundary is exactly the behaviour unit tests cannot cover."
            exit 1
          fi
          echo "run=${present}" >> "${GITHUB_OUTPUT}"
          [[ "${present}" == "true" ]] \
            || echo "service owes no integration coverage and ships none" >> "${GITHUB_STEP_SUMMARY}"

      - name: Mint module-read token
        if: steps.selection.outputs.run == 'true'
        id: modauth
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Download private modules
        if: steps.selection.outputs.run == 'true'
        shell: bash
        run: GOWORK=off go mod download

      # Only started for a service the catalog says publishes or consumes events. The old harness
      # paid for a Redpanda broker on every deployable regardless.
      - name: Start Redpanda
        if: steps.selection.outputs.run == 'true' && needs.resolve.outputs.has_events == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name redpanda -p 9092:9092 -p 9644:9644 \
            redpandadata/redpanda:v24.3.6 \
            redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
              --node-id 0 --check=false \
              --kafka-addr PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr PLAINTEXT://127.0.0.1:9092
          echo "KAFKA_BROKERS=localhost:9092" >> "${GITHUB_ENV}"

      # TDD-NO-SKIP-GUARD, kept verbatim in intent from the workflow this replaces. A t.Skip() in an
      # integration test is indistinguishable from a passing one in the check list, and the runner
      # supplies Postgres, Redis and Kafka, so there is no legitimate reason to skip.
      - name: Run integration tests
        if: steps.selection.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(GOWORK=off go list ./tests/integration/... 2>/dev/null)
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "::error::integration test files exist but no Go packages resolved under ./tests/integration/..."
            exit 1
          fi

          status=0
          GOWORK=off go test "${pkgs[@]}" -count=1 -v -json | tee integration-tests.jsonl \
            || status="${PIPESTATUS[0]}"
          [[ "${status}" -eq 0 ]] || { echo "::error::integration tests failed"; exit "${status}"; }

          ran=$(grep -c '"Action":"run"' integration-tests.jsonl || true)
          skipped=$(grep '"Action":"skip"' integration-tests.jsonl | grep -c '"Test":' || true)
          echo "integration tests: executed=${ran} skipped=${skipped}"

          if [[ "${ran}" -eq 0 ]]; then
            echo "::error::no integration tests executed; the gate would have passed on an empty run"
            exit 1
          fi
          if [[ "${skipped}" -gt 0 ]]; then
            echo "::error::${skipped} integration test(s) called t.Skip(). Postgres, Redis and Kafka"
            echo "are supplied by this job (DATABASE_URL/POSTGRES_DSN/REDIS_ADDR/KAFKA_BROKERS)."
            grep '"Action":"skip"' integration-tests.jsonl | grep '"Test":' \
              | sed 's/.*"Test":"\([^"]*\)".*/  skipped: \1/' | sort -u
            exit 1
          fi

  # ── API contract lifecycle ──────────────────────────────────────────────────────────────────
  # Absorbs contract-check.yml (33 repos) and openapi-contract.yml (5). Those two filenames held
  # the same workflow calling the same registry pipeline, so the fleet ran one gate under two names
  # and neither WFC nor a reader grepping for one of them would find the other.
  #
  # Three things were wrong with the per-repo form beyond the duplication:
  #   - every copy pinned `@main`, so the contract gate changed under all 38 services with no
  #     version bump. WFC-0002 did not catch it because it only checks refs into
  #     coderaxis/ci-workflows, and this workflow was published by another org.
  #   - every copy passed coderaxis-app-id, which the OIDC migration deleted.
  #   - service-name was hand-written in each file, so a rename silently pointed a service at
  #     another service's registry directory.
  #
  # The gate now calls openapi-contract.yaml in this repository. It previously called the contracts
  # repo's copy across an organisation boundary, and that reference could not resolve from anywhere:
  # wrong extension, no `v1` tag in that repository, and a private cross-org source GitHub does not
  # accept at all. Because the reusable-workflow graph is resolved at LOAD time, before any `if:`
  # runs, it rejected central CI for the whole fleet - not only the services this job applies to.
  # That is why the reference lives here now rather than being repaired in place: WFC-0002 cannot
  # see refs into other organisations, so nothing would have caught it happening again.
  #
  # What this gate proves is unchanged: structural validation plus the caller's contract tests. The
  # drift, oasdiff and registry-publication stages did not move, because all 38 callers had left
  # them off and they need a credential into a private repository in another organisation that the
  # OIDC model does not issue. See openapi-contract.yaml for what each would need. Enabling oasdiff
  # with no published baseline produces a green check that means nothing, which is the failure mode
  # this whole migration exists to remove.
  # ── contract classification ─────────────────────────────────────────────────────────────────
  # The gate that decides whether the two jobs below should have run at all, and the only job in
  # this file that must NOT be gated on has_rest.
  #
  # Everything downstream keys off the catalog's interfaces.rest. `contract` and
  # `openapi-generator` both carry `has_rest == 'true'`, which reads as "not applicable" when the
  # answer is false - so a repository that publishes an OpenAPI document while declaring no REST
  # interface has that document validated by nothing, regenerated by nothing and drift-checked by
  # nothing. Nothing anywhere went red, because from CI's point of view there was no HTTP service
  # to check.
  #
  # Fourteen repositories were in that state when this job was written, and the two worst were
  # platform-bff and org-bff: the most customer-facing repos in the fleet, publishing 128 and 185
  # paths between them, with no lane. Regenerating those two documents moved 584 and 5373 lines
  # respectively, so they had drifted for as long as nobody was looking. That is the precise
  # failure mode ADR-0093 rule 8 exists to prevent, and it is invisible to every check that starts
  # by asking whether the repo has a spec.
  #
  # WHY NOT FOLD IT INTO check-api-contract.py. That script's controls gate on
  # `applies_when: http-api`, which it defines as "the repo carries docs/openapi.json". That is a
  # second classification mechanism, derived from the filesystem rather than declared, and it
  # disagrees with this one by construction: a gRPC-only service holding a stale spec is an HTTP
  # service to that rule and a gRPC service to this workflow. It is also escapable in the
  # direction that matters, since deleting the file silently retires the controls. The catalog is
  # the declared answer, it is reviewable, and CI already resolves identity from it.
  contract-classification:
    name: Contract classification
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.repo_kind == 'deployable' && needs.pin-only.outputs.pin_only != 'true'
    permissions:
      contents: read
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4

      # From this repository, like the API-contract guard above and for the same reason: a
      # service must not be able to weaken the policy it is judged by, nor to allowlist itself.
      - name: Check out the classification guard (SSOT)
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .classification-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install guard dependencies
        shell: bash
        run: python3 -m pip install --upgrade PyYAML

      - name: The published contracts must match the declared transport (ADR-0093)
        shell: bash
        run: |
          set -euo pipefail
          python3 .classification-tools/scripts/check-contract-classification.py \
            --repo . \
            --service "${{ needs.resolve.outputs.service }}" \
            --has-rest "${{ needs.resolve.outputs.has_rest }}" \
            --allowlist .classification-tools/controls/contract-classification-allowlist.yaml

  # ── gateway security baseline ───────────────────────────────────────────────────────────────
  # GW-0001..GW-0008, the RFC-0039 controls. Until this job existed the control set was normative
  # and measurable on demand while blocking nothing, which is the state RFC-0039 named as an
  # obligation precisely so it could not be quietly left that way.
  #
  # UNGATED ON PURPOSE, like contract-classification above and for the reason that job's comment
  # spells out at length: a control set whose applicability comes from a field a repository
  # declares about itself is retired by declaring the field differently, and nothing goes red.
  # The detector decides scope from the repository's own service contract - seven controls need a
  # gateway or BFF, and grpc_server_auth_interceptors needs a declared gRPC port - and reports
  # `skipped` for a control that does not apply, so running everywhere costs a few seconds on a
  # repository the controls have nothing to say about and removes the gate that could hide one.
  #
  # This is not a hypothetical failure mode. The CLI implementation of these same controls
  # decided gateway scope from the DIRECTORY NAME alone, so a repository declaring `type: gateway`
  # was skipped by all eight and reported clean - not failing, not out of scope, but a clean
  # verdict for a gateway nobody had checked.
  #
  # Policy SSOT: ADR-0095 (protocol ingress termination), ADR-0096 (embedded shared baseline),
  # RFC-0039 (the normative control definitions).
  gateway-baseline:
    name: Gateway security baseline
    needs: [resolve, docs-only, pin-only]
    if: needs.docs-only.outputs.docs_only != 'true' && needs.resolve.outputs.repo_kind == 'deployable' && needs.pin-only.outputs.pin_only != 'true'
    permissions:
      contents: read
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4

      # From this repository at the moving major tag, like the classification guard above and for
      # the same reason: a gateway must not be able to weaken the security baseline it is judged
      # by, and the catalog plus detector are one unit that has to move together.
      - name: Check out the gateway baseline controls (SSOT)
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .gateway-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install guard dependencies
        shell: bash
        run: python3 -m pip install --upgrade PyYAML

      # --fail-on major, the script's default, so a critical or major control blocks and a minor
      # one reports. The per-repository baseline the detector reads is a ratchet: an existing
      # count is frozen and cannot rise, which is what lets the control set land on a fleet with
      # known gaps without turning six gateways red on the same morning.
      - name: Gateways enforce the shared security baseline (RFC-0039)
        shell: bash
        run: |
          set -euo pipefail
          python3 .gateway-tools/scripts/check-gateway-baseline.py . \
            --controls .gateway-tools/controls/gateway-baseline.yaml \
            --report gateway-baseline-report.json

      # The report is kept even when the step above fails, because the counts are what a reader
      # needs to tell a new violation from a frozen one, and re-running a red job to find out is
      # the workflow this exists to remove.
      - name: Upload the baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-baseline-report
          path: gateway-baseline-report.json
          if-no-files-found: ignore
          retention-days: 14

  contract:
    name: API contract
    # Skipping this also skips contract PUBLICATION, and that is correct rather than a side
    # effect: the spec lives at docs/openapi.json, which this gate's own classifier counts as
    # code, so a diff that reaches here as documentation-only cannot have changed the contract.
    needs: [resolve, docs-only]
    if: >-
      needs.docs-only.outputs.docs_only != 'true'
      && needs.resolve.outputs.repo_kind == 'deployable'
      && needs.resolve.outputs.has_rest == 'true'
    permissions:
      contents: read
      id-token: write
    uses: coderaxis/ci-workflows/.github/workflows/openapi-contract.yaml@v1
    with:
      spec-file: docs/openapi.json
      contract-test-command: GOWORK=off go test ./tests/contracts/... -count=1 -v
      # Two switches rather than one, because the two stages carry different risk. The
      # breaking-change comparison only reads, but turning it on fleet-wide would redden every
      # service whose spec has already drifted from its published baseline - which is worth
      # knowing and is not worth learning as 38 simultaneous failures. Publication writes, and
      # a service should have passed the comparison for a while before it moves its own baseline.
      #
      # The name is taken from the catalog rather than written here. Hand-written service names
      # are why the per-repo contract workflows this replaced could point a service at another
      # service's registry directory after a rename.
      service-name: ${{ vars.CONTRACT_REGISTRY_ENABLED == 'true' && needs.resolve.outputs.service || '' }}
      publish-contract: ${{ vars.CONTRACT_PUBLISH_ENABLED == 'true' }}

  # ── openapi generator ───────────────────────────────────────────────────────────────────────
  # The gate that did not exist. `contract` above validates the COMMITTED document; nothing in
  # this fleet has ever run the thing that PRODUCES it, which is why every generator in the fleet
  # was broken and no run went red:
  #
  #   - eleven repos sourced "${SCRIPT_DIR}/../../../scripts/lib/swagger.sh", resolving to
  #     services/scripts/lib/swagger.sh, a file that has never existed. Under `set -euo pipefail`
  #     the failed source aborted before swag ran, so those repos generated NOTHING and their
  #     committed spec was whatever someone last produced by hand.
  #   - six repos vendored the library, in three byte-different variants, and all six resolved the
  #     shared normalizer to a directory not containing it. The caller discarded that with
  #     `2>/dev/null` and `|| true`, so swag and swagger2openapi ran and only normalization was
  #     skipped - silently, which is why it lasted.
  #
  # THE GATE IS IN TWO HALVES, and it needs both. The static half refuses the wiring that caused
  # each shape, so neither can be reintroduced. The dynamic half RUNS the generator, because only
  # running it proves it runs - a static check would have passed all six Category B repos, whose
  # scripts were syntactically fine and simply did not do one of the things they claimed to.
  #
  # And it asserts that NORMALIZATION ACTUALLY EXECUTED, not merely that the script exited 0. That
  # distinction is the entire lesson here: every Category B repo exited 0 for months while quietly
  # skipping the step that decides field naming and the response envelope. A gate that accepts an
  # exit code accepts exactly the failure this replaces.
  #
  # WHY NO PINNED CHECKOUT OF platform-shared-go. The generator resolves the library through the
  # module graph, so the service is judged against the normalizer version it actually ships with,
  # which is the version its users get. platform-shared-go carries no moving major tag to pin to,
  # and how old a shared module a repo may pin is already governed centrally by
  # controls/module-floors.yaml rather than re-decided here.
  openapi-generator:
    name: OpenAPI generator
    needs: [resolve, docs-only]
    if: >-
      needs.docs-only.outputs.docs_only != 'true'
      && needs.resolve.outputs.repo_kind == 'deployable'
      && needs.resolve.outputs.has_rest == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 25
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4

      # Checked out from this repository, not run from the service, so a repo cannot weaken the
      # policy it is judged by - the same reasoning as the api-contract guard above.
      - name: Check out the central generator guard (SSOT)
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: v1
          path: .central

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generator wiring (static)
        shell: bash
        run: python3 .central/scripts/check-openapi-generator.py .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # swagger2openapi runs through npx.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Mint module-read token
        id: modauth
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Download private modules
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          [[ -n "${MOD_TOKEN}" ]] || { echo "::error::module token required for private Go modules"; exit 1; }
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          GOWORK=off go mod download

      # ── the packaging preflight ──────────────────────────────────────────────────────────
      # The canonical library reaches a lone-repo checkout through the Go module graph, and
      # that mechanism is sound: a module zip ships non-Go files, so platform-shared-go's
      # tooling/*.sh arrive in the module cache alongside cmd/openapi-normalize.
      #
      # But it only works for a pin whose RELEASE actually contains the library. A repo pinned
      # to a version cut before it was added resolves the module fine, finds no library at
      # tooling/openapi/lib/swagger.sh, and dies on the `source` line with bash's own
      # "No such file or directory" - which reads as a broken script rather than a stale pin.
      #
      # This is the workstation/CI split that started the whole incident, in a new costume: a
      # developer with a go.work resolves to the live checkout and sees the library, CI resolves
      # to the pinned zip and does not. So it is asserted BEFORE the generator runs, and the
      # failure names the pin, the resolved directory, and the fix.
      - name: Preflight — the pinned platform-shared-go must carry the generator library
        shell: bash
        run: |
          set -euo pipefail
          [[ -f scripts/swagger.sh ]] || { echo "::notice::no scripts/swagger.sh; nothing to preflight."; exit 0; }

          MOD=github.com/coderaxis/platform-shared-go
          LIB_REL=tooling/openapi/lib/swagger.sh

          # GOWORK=off deliberately: it reproduces what CI resolves rather than what a
          # workstation would, so this step cannot pass here for a reason that will not hold.
          pinned="$(GOWORK=off go list -m -f '{{.Version}}' "${MOD}" 2>/dev/null || true)"
          dir="$(GOWORK=off go list -m -f '{{.Dir}}' "${MOD}" 2>/dev/null || true)"

          if [[ -z "${pinned}" ]]; then
            echo "::error::this repo runs scripts/swagger.sh but does not require ${MOD}, so the generator library cannot be resolved. Add the dependency, or generate via the openapicontract engine."
            exit 1
          fi
          if [[ -z "${dir}" || ! -d "${dir}" ]]; then
            echo "::error::${MOD}@${pinned} is required but was not downloaded into the module cache."
            exit 1
          fi

          if [[ ! -f "${dir}/${LIB_REL}" ]]; then
            echo "::error::${MOD}@${pinned} does not contain ${LIB_REL}, so the generator cannot run in a single-repo checkout. The library is present on platform-shared-go's default branch but was not in this release. Cut a platform-shared-go release that includes it and bump this repo's pin to at least that version. Resolved module dir: ${dir}"
            exit 1
          fi
          echo "Generator library present in ${MOD}@${pinned}."

      - name: Run the generator and require normalization to execute
        id: generate
        shell: bash
        env:
          DRIFT_BLOCKING: ${{ vars.OPENAPI_DRIFT_BLOCKING == 'true' }}
        run: |
          set -euo pipefail

          if [[ ! -f scripts/swagger.sh ]]; then
            # Category C: the openapicontract engine. The static guard above established that
            # such an engine positively EXISTS here; it could not establish that anything runs
            # it, and nothing did. `openapi-contract-check` was named by a notice on this line
            # and invoked by no job in the fleet, so a change to the typed operation registry
            # or to an example fixture merged alongside a docs/openapi.json generated before
            # it, and every check stayed green - a step that did not happen looking identical
            # to one that passed, which is the shape this file refuses everywhere else.
            #
            # The target regenerates the document in memory and byte-compares it against the
            # committed one, so running it IS the drift gate for this engine, and it is the
            # whole gate: there is no working tree to diff afterwards, which is why the two
            # steps below stay keyed to the swagger.sh path via ran=false.
            rc=0
            make openapi-contract-check || rc=$?
            echo "ran=false" >> "${GITHUB_OUTPUT}"

            if [[ "${rc}" -eq 0 ]]; then
              echo "The committed document is what the typed registry generates."
              exit 0
            fi

            # Blocking is opt-in per repo, on the same variable and for the same reason as the
            # committed-spec drift step below: this gate has never run anywhere, so making it
            # hard fleet-wide would redden repos for a backlog rather than for a regression.
            # Unlike that step it always EXECUTES, because the failure being repaired here is
            # a check that was never reached at all.
            if [[ "${DRIFT_BLOCKING}" == "true" ]]; then
              echo "::error::docs/openapi.json is not what the typed registry generates. Run 'make openapi-contract' and commit the result."
              exit 1
            fi
            echo "::notice::docs/openapi.json is not what the typed registry generates; run 'make openapi-contract' and commit it. Not blocking: set the OPENAPI_DRIFT_BLOCKING repo variable to 'true' to enforce."
            exit 0
          fi

          # The generator writes into the working tree. That is fine and deliberate: the checkout
          # is ephemeral, and it lets the drift step below compare against what is committed.
          rc=0
          bash scripts/swagger.sh > generator.log 2>&1 || rc=$?
          # Echoed in full before any assertion, so a failure is diagnosable from this log alone.
          cat generator.log

          if [[ "${rc}" -ne 0 ]]; then
            echo "::error::the OpenAPI generator failed (exit ${rc}). The committed spec cannot be reproduced from the source it claims to be generated from."
            exit 1
          fi

          # Exit 0 is NOT sufficient, and this is the point of the whole job. Every Category B
          # repo exited 0 while skipping normalization. Require the normalizer's own success line.
          if ! grep -q '^Normalized ' generator.log; then
            echo "::error::the generator succeeded but normalization did not run. -protojson sets field naming and -fix-envelope sets the response envelope, so an un-normalized document describes a different wire format from the one the service serves, and the frontends generate their clients from it."
            exit 1
          fi

          # The library's local escape hatch must never be how CI goes green.
          if grep -q 'PROCEEDING WITHOUT NORMALIZATION' generator.log; then
            echo "::error::OPENAPI_ALLOW_UNNORMALIZED is set. That switch exists for an offline workstation and must not be used in CI."
            exit 1
          fi

          echo "ran=true" >> "${GITHUB_OUTPUT}"
          echo "Generator ran and normalization executed."

      # Wholesale loss is NOT drift, and is refused whatever OPENAPI_DRIFT_BLOCKING says.
      #
      # The drift step below is deliberately non-blocking during the staged rollout, and that
      # tolerance was hiding a different failure entirely. authz-service committed 150 operations
      # across 113 paths; `scripts/swagger.sh` there regenerated 3, exiting 0 with normalization
      # reporting success, because every handler is implemented in authz-core and swag cannot see
      # across a module boundary - so there was nothing to find and it faithfully emitted nothing.
      # CI ran that, saw the 147-operation diff, and printed a notice.
      #
      # The trapdoor is what makes this worth its own gate: the remedy for drift is "regenerate and
      # commit the result", so the very act of turning the drift gate on would have demanded the
      # 3-operation spec be committed as the corrected one. A measured sweep found the same shape
      # in six more repos - call-routing, configuration, ledger, notification, payment and
      # voice-ai-agent all commit specs their sources carry no annotations for.
      #
      # Half is the threshold rather than any loss, because legitimate regeneration does remove
      # operations: a retired route, or a normalizer that stops emitting a path it should never
      # have. Losing most of the document is a different claim, and it is always the same one -
      # this generator cannot see the handlers, so the spec is authored and the repo needs a
      # route-coverage gate instead (see check-openapi-generator.py, which accepts an
      # openapi-contract-check make target as an alternative engine).
      - name: Refuse wholesale operation loss
        if: steps.generate.outputs.ran == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -f docs/openapi.json ]] || { echo "::notice::no docs/openapi.json; nothing to compare."; exit 0; }
          git show HEAD:docs/openapi.json > /tmp/committed-openapi.json 2>/dev/null || {
            echo "::notice::docs/openapi.json is not committed at HEAD; nothing to compare."; exit 0; }
          python3 - <<'PY'
          import json, sys

          def ops(path):
              try:
                  doc = json.load(open(path))
              except Exception as exc:
                  print(f"::notice::could not parse {path}: {exc}")
                  return None
              methods = {"get", "put", "post", "delete", "patch", "head", "options", "trace"}
              return sum(1 for item in doc.get("paths", {}).values()
                         for verb in item if verb.lower() in methods)

          before, after = ops("/tmp/committed-openapi.json"), ops("docs/openapi.json")
          if before is None or after is None:
              sys.exit(0)
          print(f"committed {before} operations, generated {after}")
          if before >= 4 and after * 2 < before:
              print(
                  f"::error::the generator produced {after} operations from a committed spec of "
                  f"{before}. That is not drift: a generator that emits under half the document "
                  f"cannot see the handlers it claims to describe, which happens when they live "
                  f"in a core module across a boundary swag does not cross. Do NOT commit this "
                  f"output. Either point the generator at the sources, or - if the spec is "
                  f"authored, which zero @Router annotations in the repo would confirm - delete "
                  f"scripts/swagger.sh and add an `openapi-contract-check` make target that runs "
                  f"a bidirectional route-coverage test against the live router."
              )
              sys.exit(1)
          PY

      # Drift is REPORTED here, and blocking is opt-in per repo. The generators have only just
      # been repaired, so every committed spec in the fleet predates working normalization and a
      # blocking drift gate would redden all 17 repos at once for a backlog rather than for a
      # regression. Each repo turns this on once its spec has been regenerated and the
      # operationId and component-name churn reviewed - the same staged rollout, and for the same
      # reason, as CONTRACT_REGISTRY_ENABLED on the contract job above.
      #
      # It is a `notice` rather than a silent skip: the state this fleet just came out of is one
      # where a step that did not happen looked identical to one that passed.
      - name: Committed spec drift
        if: steps.generate.outputs.ran == 'true'
        shell: bash
        env:
          DRIFT_BLOCKING: ${{ vars.OPENAPI_DRIFT_BLOCKING == 'true' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/; then
            echo "Committed spec matches a fresh generation."
            exit 0
          fi
          echo "Committed spec differs from a fresh generation:"
          git diff --stat -- docs/
          if [[ "${DRIFT_BLOCKING}" == "true" ]]; then
            echo "::error::docs/ is out of date with respect to the generator. Run scripts/swagger.sh and commit the result."
            exit 1
          fi
          echo "::notice::docs/ is out of date with respect to the generator. Not blocking: set the OPENAPI_DRIFT_BLOCKING repo variable to 'true' once this repo's spec has been regenerated and its operationId churn reviewed."

      - name: Remove the guard checkout
        if: always()
        shell: bash
        run: rm -rf .central

  # ── end-to-end (RFC-0037 stage 3) ───────────────────────────────────────────────────────────
  # The tier the platform did not have. inboxxhq-platform-bff and inboxxhq-org-bff both ship a
  # tests/e2e directory, and neither has ever executed: each test skips unless E2E=1, and no
  # workflow has ever set E2E=1. Both suites also address a deployed environment and expect an
  # operator to have provisioned an account, so neither could gate a merge even if it did run.
  #
  # A conforming suite (ADR-0086) is gated by the `e2e` BUILD TAG rather than an environment
  # variable, so "did not run" cannot present as "passed" - without the tag the package does not
  # compile. That is why nothing here passes an enable flag: the tag is the switch, and this job
  # either runs the suite or fails.
  #
  # The suite owns its own stack. TestMain brings compose up and tears it down, so this job runs
  # `go test` and nothing else - there is no sequence of compose commands here that could drift
  # from what a developer runs through `ihq e2e`.
  #
  # Sibling checkouts are made by TestMain from the repository's own tests/e2e/dependencies.yaml,
  # not by this job. That is a deliberate correction: this workflow used to parse the manifest and
  # clone from a shell step, which meant the stack a developer got and the stack CI got were two
  # implementations of one rule - free to disagree, and certain to eventually.
  #
  # What remains here is credentials and cache location, which genuinely are properties of the
  # runner. Everything about what the stack CONTAINS lives in the repository under test, so a
  # service that gains a dependency edits one file in its own repo, and a failure here reproduces
  # on a workstation because the same code produced the checkout.
  e2e:
    name: End-to-end
    needs: [resolve, docs-only]
    if: >-
      needs.docs-only.outputs.docs_only != 'true'
      && needs.resolve.outputs.repo_kind == 'deployable'
      && needs.resolve.outputs.language == 'go'
    runs-on: ubuntu-latest
    # Image builds dominate: two Go services compiled from source. The auth suite measures ~70s
    # of test execution against roughly four minutes of build, so this ceiling is several times
    # the observed cost rather than a budget to grow into. It is set deliberately tight: a
    # ceiling is what a hung container costs the author, and a suite that legitimately
    # approaches this number has outgrown the merge gate and belongs on a schedule (RFC-0037 §4).
    timeout-minutes: 20
    permissions:
      contents: read
      # Sibling repositories are private, and both Dockerfiles resolve private
      # github.com/coderaxis modules at build time, so this job mints a read token the same way
      # the structure job does. Without id-token: write, ci-app-token fails with "No OIDC token
      # available" and the gate never runs.
      id-token: write
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
    steps:
      - uses: actions/checkout@v4
        with:
          # The selection step below diffs against the base commit, which a depth-1 checkout
          # does not contain. Service repositories are small; the extra fetch costs seconds and
          # buys the ability to skip a job measured in minutes.
          fetch-depth: 0

      - name: Decide whether an end-to-end suite is owed
        id: selection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Gate one: does this service own a suite at all?
          #
          # Not every service does. A service with no external dependencies is covered by its
          # integration and contract tiers, and an E2E tier over a single process is integration
          # testing with a longer name (RFC-0037 §1).
          if [[ ! -f tests/e2e/docker-compose.yaml ]]; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "no tests/e2e/docker-compose.yaml; this service owns no end-to-end suite"
            exit 0
          fi

          # Gate two: can this change alter runtime behaviour?
          #
          # This is the cost control, and it is deliberately the only one. The obvious
          # alternative - run a cheap subset on pull requests and the real suite after merge -
          # buys nothing here and costs correctness: the wall-clock is dominated by compiling
          # two Go services into images, not by executing the tests, so a suite trimmed to a
          # third still pays nine tenths of the bill. Worse, a subset gate lets a defect through
          # the merge button and discovers it on main, where it blocks everyone rather than the
          # author. So the suite is never trimmed. It is either owed in full or not owed.
          #
          # It is not owed when nothing executable changed. A prose-only pull request cannot
          # break a behavioural test, and on a platform that reviews as many documents as this
          # one that is a large share of all pull requests.
          #
          # The classification errs toward running: an unrecognised path is treated as code, and
          # any failure to compute a diff runs the suite. A gate that skips when it is confused
          # is the fail-open shape this pipeline exists to eliminate.
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "${GITHUB_EVENT_NAME}: running the full suite without change analysis"
            exit 0
          fi

          if [[ -z "${BASE_SHA}" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "base commit unavailable; running the suite rather than guessing"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE_SHA}...HEAD")" || {
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "could not diff against the base; running the suite"
            exit 0
          }

          # docs/openapi.json is emphatically not documentation. It is the published contract,
          # and a change to it is a change to what clients are promised, so it counts as code.
          inert='^(docs/(?!openapi\.json)|\.github/ISSUE_TEMPLATE/|[^/]*\.md$|LICENSE|CODEOWNERS)'
          if [[ -n "${changed}" ]] && ! grep -qvP "${inert}" <<<"${changed}"; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "documentation-only change; no executable path can differ:"
            while IFS= read -r path; do echo "  ${path}"; done <<<"${changed}"
            exit 0
          fi

          echo "present=true" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@v5
        if: steps.selection.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: false

      # Compiling the services into images is the larger half of this job's cost, and a runner
      # starts with nothing, so without this every run pays for every dependency to be fetched
      # and built from scratch. Measured on one workstation: a cold stack is ~163s of build
      # against ~60s of start-up and tests; with the layer cache restored the build falls to
      # ~42s, taking the whole suite from ~223s to ~102s.
      #
      # Two things follow from that measurement and are worth stating, because both contradict
      # what seems obvious. Caching this is worth more than any amount of tuning the suite. And
      # once it is cached, EXECUTION is the larger half - so whoever optimises next should be
      # looking at container start-up, not at the compiler.
      #
      # The default docker driver cannot export build cache, only buildx's container driver can,
      # which is the whole reason this step exists.
      - name: Set up a builder that can export layer cache
        if: steps.selection.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      # Keyed on the dependency manifests rather than the commit, which is deliberate. The layer
      # this cache exists to preserve is `go mod download`, and that layer is invalidated by
      # go.sum and by the Dockerfile - never by a source edit. Keying on the commit instead would
      # write a fresh gigabyte on every push to preserve a layer that had not changed.
      #
      # The final build layer is not cacheable in any useful sense: it contains the source that
      # just changed, so it misses by definition. That is expected, and it is why the cached
      # build is ~42s rather than ~0s.
      - name: Restore the image layer cache
        if: steps.selection.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/e2e-build-cache
          key: e2e-build-${{ runner.os }}-${{ hashFiles('go.sum', 'Dockerfile') }}
          restore-keys: |
            e2e-build-${{ runner.os }}-

      # Two owners, because an end-to-end stack spans two kinds of input. The images resolve
      # private Go modules from `coderaxis`, and the sibling services the stack builds from source
      # live beside this repository — a different GitHub account, so a different App installation
      # and therefore a different token.
      #
      # Minting only the first is what the first run of this job did, and it failed on
      # `git clone ... exit status 128`, which names the repository and not the reason. The extra
      # owner is derived rather than written down, so this holds for whichever account a service
      # repository lives in.
      - name: Mint module-read token
        id: e2eauth
        if: steps.selection.outputs.present == 'true'
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          extra-owners: ${{ github.repository_owner }}
          configure-git: "true"

      - name: Run the end-to-end suite
        if: steps.selection.outputs.present == 'true'
        shell: bash
        env:
          # Serves two purposes, both TestMain's: it is written into the compose build secret so
          # the images can resolve private modules, and it is what clones the sibling repositories
          # the manifest declares. Neither is exposed to the running containers.
          GH_TOKEN: ${{ steps.e2eauth.outputs.token }}
          # Where the layer cache lives. TestMain turns this into a compose override; unset, as
          # it is on a workstation, the build behaves exactly as it did before. The workflow
          # states the location and nothing else - it does not know that a cache becomes
          # cache_from, or that compose is involved at all.
          E2E_BUILD_CACHE: local:${{ runner.temp }}/e2e-build-cache
        run: |
          set -euo pipefail
          # The identical command `ihq e2e` runs. The stack is brought up and torn down by
          # TestMain, so a failure here reproduces locally with no extra setup.
          GOWORK=off go test -tags e2e -count=1 -timeout 15m -v ./tests/e2e/...

  # ── source invariants ───────────────────────────────────────────────────────────────────────
  # The invariants that declare mechanism: [static-analysis] can only be kept by reading source.
  # check_source_invariants.py owns those checks, and until --service-root existed it required a
  # services/ tree that no CI job has - the fleet is ~40 separate repositories. Each job now
  # scans its own checkout; the fleet is covered by the union. Dual checkout mirrors the docs
  # job: the standard lives in core-docs, the subject is the repository under test.
  source-invariants:
    name: Source invariants
    needs: [resolve, docs-only, pin-only]
    # Go deployables and cores carry the callback/signature checks; schema repos carry the
    # forwarding SQL checks (C6/C7). Other languages have no scanner yet and must not get a
    # green tick for checks nobody ran.
    #
    # The documentation clause is parenthesised around the existing `||`, not appended to it.
    # Appended, `&&` binds tighter and the schema-repo arm would have escaped the fast path
    # entirely - the kind of precedence slip that reads correct and gates nothing.
    if: >-
      needs.docs-only.outputs.docs_only != 'true'
      && needs.pin-only.outputs.pin_only != 'true'
      && (needs.resolve.outputs.language == 'go'
          || needs.resolve.outputs.repo_kind == 'schema')
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name || 'service' }}

      - name: Mint a catalog-read token
        id: catalog_token
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: ${{ inputs.catalog_owner }}
          repositories: ${{ inputs.catalog_repo }}

      - name: Check out the source-invariant standard
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.catalog_repo }}
          ref: ${{ inputs.catalog_ref }}
          token: ${{ steps.catalog_token.outputs.token }}
          path: core-docs

      - name: Scan this checkout against the central controls
        shell: bash
        run: |
          set -euo pipefail
          python3 core-docs/scripts/check_source_invariants.py \
            --service-root "${{ github.event.repository.name || 'service' }}"
          # RFC-0001's response envelope has one implementation
          # (shared/platform-shared-go/httpresponse); this is what stops a handler from
          # answering outside it. Same checkout, same --service-root shape as the call
          # above - no second job needed for one more static-analysis pass over source
          # already on disk. Baseline lives in core-docs, not this repository, for the
          # same reason check_source_invariants.py's does: a debt list a service could
          # edit itself would not be a gate.
          python3 core-docs/scripts/check_response_envelope_conformance.py \
            --service-root "${{ github.event.repository.name || 'service' }}"

  # ── documentation ───────────────────────────────────────────────────────────────────────────
  # Replaces the per-repo docs-lint.yml and stale-docs-check.yml, which both ran
  # scripts/validate_docs.py from the repository being checked. That file existed in 91
  # repositories as 91 byte-different files - every repo validated its docs against its own
  # private definition of valid, and passing meant nothing comparable. core-docs already owns
  # check_service_docs.py, so the standard is read from the platform, not from the subject.
  docs:
    name: Service documentation
    needs: [resolve, pin-only]
    if: needs.pin-only.outputs.pin_only != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: inboxxhq-ci
    timeout-minutes: 15
    steps:
      # Checked out under the repository's real name, not a fixed "service" directory.
      # check_service_docs.py chooses between two required trees by looking at the name of
      # the directory it is given: a 22-item library profile for a `*-core` module, and the
      # full 119-item deployable-service tree for everything else. A fixed path meant that
      # name was always literally "service", so the library profile could never be selected
      # for any repository in the fleet - it was unreachable code, and every domain core was
      # being graded against runbooks, on-call procedures and SLOs it will never have.
      - uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name || 'service' }}

      - name: Mint a catalog-read token
        id: catalog_token
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: ${{ inputs.catalog_owner }}
          repositories: ${{ inputs.catalog_repo }}

      - name: Check out the documentation standard
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.catalog_repo }}
          ref: ${{ inputs.catalog_ref }}
          token: ${{ steps.catalog_token.outputs.token }}
          path: core-docs

      - name: Validate against the central standard
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          # The kind is passed rather than inferred. check_service_docs.py otherwise reads it off
          # a `*-core` name suffix, which silently graded edge-gateway-foundation - a shared
          # library - against the 119-item deployable tree, demanding runbooks, SLOs and on-call
          # procedures for a package with no runtime.
          python3 core-docs/scripts/check_service_docs.py \
            --service-dir "${{ github.event.repository.name || 'service' }}" \
            --repo-kind "${{ needs.resolve.outputs.repo_kind }}"

  dependency-review:
    name: Dependency review
    # Provably vacuous on a documentation diff rather than merely expensive: this action reviews
    # the change to the dependency graph, and that graph is derived from go.mod and go.sum, both
    # of which the classifier counts as code. A diff that reaches here as documentation-only
    # cannot have moved a dependency, so the review would compare a set against itself.
    needs: [resolve, docs-only]
    if: github.event_name == 'pull_request' && needs.docs-only.outputs.docs_only != 'true'
    runs-on: inboxxhq-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Same entitlement problem as Code scanning, and the same answer. The action hard-fails on a
      # repository without Dependency graph and Advanced Security, so this gate was red for reasons
      # a contributor cannot fix and unrelated to the diff in front of it.
      #
      # It stayed hidden because this job is pull_request-only and the module repositories are
      # pushed to directly. The first pull request any of them saw was an automated dependency bump
      # opened by the release fan-out, which is where it surfaced -- a gate nobody could have been
      # failing until the moment it blocked a release.
      #
      # Probe rather than assume, for the reason recorded on the Code scanning check: entitlement is
      # not readable from the settings API under GITHUB_TOKEN, so ask the endpoint the action itself
      # uses and let the answers agree by construction. It self-heals the day the feature is enabled.
      - name: Detect Dependency graph availability
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if probe="$(gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE}...${HEAD}" 2>&1)"; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          case "${probe}" in
            # 403 is the real answer for an unentitled private repository, and it arrives with no
            # explanatory body at all - just "Forbidden". The prose forms are matched too because
            # the Code scanning probe went red fleet-wide when GitHub reworded its message, and
            # matching only the vocabulary of the day is what caused that.
            #
            # A 403 cannot be told apart from a token that lacks the scope. Neither can the action:
            # it reads this same response and reports "not supported", so deferring to that reading
            # leaves the gate no weaker than the tool it is guarding. What it does cost is the
            # ability to notice a permissions regression here, which is why the warning names the
            # entitlement explicitly rather than saying the check was skipped.
            *"403"*|*"Forbidden"*|*"not supported"*|*"Advanced Security"*|*"advanced security"*|*"ependency graph is"*)
              echo "available=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::Dependency graph is not enabled for ${GITHUB_REPOSITORY} (or this token cannot read it), so dependency review cannot run. Enabling Advanced Security on a private repository is an org admin action. The Vulnerabilities job still scans this commit, so the dependency surface is not unexamined."
              ;;
            # An unrecognised failure is not evidence of being unentitled. Reading it that way would
            # retire this gate across the fleet on a token problem or an outage.
            *)
              echo "::error::could not determine Dependency graph availability for ${GITHUB_REPOSITORY}: ${probe}"
              exit 1
              ;;
          esac

      - uses: actions/dependency-review-action@v4
        if: steps.depgraph.outputs.available == 'true'
        with:
          fail-on-severity: high

  # ── artifact ────────────────────────────────────────────────────────────────────────────────
  # Only on trunk, only for a deployable, and only once every gate above is green. The service
  # name comes from the catalog, not from the repo. This job ends at the GitOps digest pin —
  # Argo CD reconciles from there, so nothing below this line touches a cluster.
  artifact:
    name: Canonical build and GitOps pin
    # `contract` joins this list for two reasons. It carries the version the registry allocated,
    # which the deploy records as what the environment will serve - and a value read from a job
    # that has not finished is empty, which the catalog cannot distinguish from "not published".
    # It also closes a gap that predates any of this: `contracts` (the ADR guard) blocked a
    # deploy while `contract` (structural validation and the service's own contract tests) did
    # not, so a service could ship with an OpenAPI document that fails to parse.
    # `openapi-generator` joins this list, and being IN this list is the whole point of it.
    # A job that is not needed here still colours the run, but `artifact` runs anyway and writes
    # the GitOps digest pin, so the release proceeds from a tree whose gate was red. That is the
    # shape platform-shared-go already hit once, where an undeclared lane sat red while ci was
    # green and releases went out past it - and the reason its ci.yaml now calls generated-files
    # as a job rather than leaving it a lane of its own.
    #
    # `lanes`, `integration` and `e2e` join for that same reason, and their absence was the same
    # defect this comment already describes - three more instances of it sitting directly beneath
    # the paragraph explaining why it is wrong. A service could fail its integration suite, fail
    # its end-to-end suite, and still have this job pin a digest for deploy.
    #
    # Adding them is safe because both suites are self-selecting rather than universal.
    # `integration` and `e2e` run only for deployable Go repositories, and `e2e` additionally
    # skips a service that owns no tests/e2e/docker-compose.yaml; a job that does not run reports
    # `skipped`, which the failure check below tolerates. So this blocks the services that have a
    # suite and are failing it, which is the entire point, and changes nothing for the rest.
    #
    # `dependency-review` is deliberately NOT here, and its absence is not the same defect. It
    # runs only on `pull_request` while this job runs only on `push`, so on every run where
    # `artifact` executes it is already skipped. Listing it would imply a protection that cannot
    # exist rather than adding one.
    #
    # `docs-only` joins for a reason that is the mirror image of all of the above. Every gated job
    # depends on it, so a crash there skips all of them at once - and this job tolerates `skipped`,
    # by design, for the conditional gates. Unnamed here, one broken classifier would therefore
    # skip every gate in the pipeline and then pin a digest from a tree nothing examined: the
    # single largest hole this change could have opened. Named here, its `failure` stops the
    # deploy, and the explicit docs_only clause below stops the deploy on the ordinary path too,
    # because on a documentation-only push the gates are skipped rather than failed and this job
    # would otherwise sail through its own aggregation.
    needs: [resolve, docs-only, supported-language, standards, build-test, codeql, events, seeding,
            schema, dockerfile, structure, vulnerabilities, sqlc, docs, contracts, contract,
            openapi-generator, lanes, integration, e2e]
    # workflow_dispatch counts alongside push, and deliberately so. A central pipeline change
    # ships by moving @v1, which raises no event in a service repo, and `gh run rerun` replays
    # the workflow definition the original run resolved rather than the current one. Without
    # this, the only way to pick up a central fix in the deploy path was an empty commit to
    # main - which is exactly what the manual trigger was added to every repo to avoid, and it
    # left thirty repositories able to re-run their tests but never their delivery.
    #
    # It grants nothing new: the ref guard below still restricts this to main, dispatching
    # requires write access, and the commit delivered is the same one a push of that ref would
    # have delivered. pull_request stays excluded.
    if: |
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.resolve.outputs.deployable == 'true'
      && needs.docs-only.outputs.docs_only != 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    # Required, not optional hygiene. deploy-reusable.yaml declares `id-token: write` at workflow
    # level for the AWS OIDC role assumption, and a called workflow cannot hold a permission its
    # caller did not grant. Omitting this block made the job inherit the `contents: read` declared
    # at the top of this file, so GitHub rejected the whole workflow at load time - which surfaces
    # as a startup_failure with no job, no log and no annotation to read.
    permissions:
      contents: read
      id-token: write
    uses: coderaxis/ci-workflows/.github/workflows/deploy-reusable.yaml@v1
    with:
      # Resolved from the immutable repository id, never from anything the service repo says.
      # Previously each repo passed this literal in its own deploy.yaml, so a one-line edit to
      # `service_name:` was enough to publish one service's code under another's identity.
      service_name: ${{ needs.resolve.outputs.service }}
      # What this deploy will make the environment serve. Empty whenever nothing was published -
      # publication is opt-in, and a spec that did not change publishes nothing - so the release
      # record omits the field rather than asserting a version it did not verify.
      api_contract_version: ${{ needs.contract.outputs.published-version }}
      # Same switch the contract job is gated on above. When it is off the registry job is
      # skipped, so no run can move latest.json and the breaking-change gate would be judging
      # every future spec against a baseline frozen at whatever was last written there by hand.
      contract_publication_enabled: ${{ vars.CONTRACT_PUBLISH_ENABLED == 'true' }}

  # ── notification ────────────────────────────────────────────────────────────────────────────
  # Centralised here, and this job is a REPLACEMENT rather than an addition. Each per-repo ci.yaml
  # carried its own Slack step; absorbing them into this pipeline dropped it, so the migration was
  # quietly making failures less visible, not more. The old steps were guarded by
  # `if: env.SLACK_BOT_TOKEN != ''`, which meant a repository that never configured the secret had
  # been posting nothing for its entire life and reported success while doing so.
  #
  # The bot token is read from Secrets Manager against this job's OIDC identity, so no caller
  # forwards a Slack credential and there is no "unconfigured" state left to fail silently.
  notify:
    name: Notify on failure
    # `e2e` was the one gate nothing watched. That mattered less while it could not block a
    # deploy; now that it can, its omission would mean a release stopped by a suite nobody was
    # told had failed.
    #
    # contract-classification and gateway-baseline were both missing when gateway-baseline was
    # added, which is the same omission in the same list: each is ungated and so runs on every
    # deployable, and each can fail a run that nobody would be told about. Adding one and leaving
    # the other would have left the newer gate watched and the older one silent.
    #
    # `docs-only` is here so that a classifier that crashes is reported rather than merely
    # inferred from a pipeline in which nothing ran.
    needs: [resolve, docs-only, supported-language, standards, build-test, codeql, events, seeding,
            schema, dockerfile, structure, lanes, vulnerabilities, sqlc, docs, contracts,
            dependency-review, integration, e2e, contract-classification, contract,
            gateway-baseline, openapi-generator, artifact]
    # always() rather than failure(): several gates above are conditional, and a plain failure()
    # does not run once any needed job has been skipped - which is the normal shape here, so the
    # alert would have fired only on the subset of runs where every gate happened to be relevant.
    if: always() && contains(needs.*.result, 'failure')
    runs-on: inboxxhq-ci
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      # Naming the failed gates makes the message actionable on its own. A bare "CI failed" costs
      # the reader a round trip to the run just to learn whether it was coverage or a CVE.
      - name: Summarise which gates failed
        id: summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(python3 -c 'import json,os; n=json.loads(os.environ["NEEDS"]); print(", ".join(k for k,v in n.items() if v.get("result") == "failure") or "unknown")')"
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

      - uses: coderaxis/ci-workflows/ci-slack-notify@v1
        with:
          status: failure
          # See the note at the deploy-reusable call site: the action cannot read `vars`, and
          # these resolve against the calling repository rather than this one.
          alerts-channel: ${{ vars.SLACK_ALERTS_CHANNEL }}
          notifications-channel: ${{ vars.SLACK_NOTIFICATIONS_CHANNEL }}
          title: CI failed
          text: "Failed gates: ${{ steps.summary.outputs.failed }}"
          fields: |
            [
              {"title": "Service", "value": "${{ needs.resolve.outputs.service || github.repository }}", "short": true},
              {"title": "Branch", "value": "${{ github.ref_name }}", "short": true}
            ]
