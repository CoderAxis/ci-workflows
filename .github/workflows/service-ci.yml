name: Service CI

# The single CI pipeline for every service and core module in the fleet.
#
# A consumer repository contains ONE workflow, and it declares nothing about itself:
#
#   jobs:
#     ci:
#       uses: coderaxis/github-actions/.github/workflows/service-ci.yml@v1
#       secrets: inherit
#
# WHY THE CALLER PASSES NOTHING. Anything a repo states about itself is a claim the platform
# would have to trust — its name, its language, whether it owns a database, whether it seeds.
# Those are exactly the facts that decide which gates run, so a repo that misstates them (or
# quietly stops stating them) selects its own enforcement. Identity is therefore DERIVED: the
# calling repository's name is set by GitHub and cannot be forged from inside the repo, and
# everything else is read from the service catalog in core-docs, which the DevOps team owns.
# `service_name` is resolved here and handed to the build; the service never asserts it.
#
# WHAT REPLACED WHAT. This absorbs the per-repo workflows that were copied across the fleet and
# then drifted — most starkly scripts/validate_docs.py, which existed in 91 repositories as 91
# byte-different files, each repo passing its own private definition of "valid". Shared logic
# lives here; per-repo data lives in the catalog; nothing lives in the service repo.
#
# WHAT IS DELIBERATELY NOT HERE:
#   - Deployment. CI ends when the immutable digest is written to the GitOps repo; Argo CD pulls
#     from there (ADR-0049). No kubectl, no rollout, no environment logic in Actions.
#   - Scheduled fleet operations (dependency bumps, periodic re-scans). Those are fleet-wide jobs
#     and belong to a scheduled workflow in this repository, not to 90 copies of a cron.
#
# Policy SSOT: ADR-0051 (artifact promotion), ADR-0049 (GitOps delivery), ADR-0064 (archetypes),
# ADR-0081 (central workflow + thin caller pattern), RFC-0020 (supply-chain integrity).

on:
  workflow_call:
    inputs:
      catalog_owner:
        description: >-
          Account owning the catalog repo. Kept separate from catalog_repo because GitHub
          expressions have no string-split function and the App token is minted per owner.
        required: false
        type: string
        default: coderaxis
      catalog_repo:
        description: "Repository holding the service catalog (the platform's SSOT for what a service is)."
        required: false
        type: string
        default: coderaxis/core-docs
      catalog_ref:
        description: "Ref of the catalog repo to resolve against."
        required: false
        type: string
        default: main
      coverage_threshold:
        description: >-
          Escape hatch for a tier the standard does not yet cover. Left unset, the threshold is
          derived from the service tier, so a repo cannot lower its own gate — the previous
          per-repo CI set COVERAGE_THRESHOLD to 0 and passed unconditionally.
        required: false
        type: string
        default: ""

# No `secrets:` block, deliberately. Every token this pipeline uses is minted from the job's own
# OIDC identity via ci-app-token and ci-slack-notify, so a repository forwards nothing: the
# platform decides what a caller may mint, rather than each caller holding the credential that
# decides it.
#
# A caller that passes a secret the callee does not declare is a hard startup error, so the
# callers were cleaned up before this block was removed rather than after.

permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── identity ────────────────────────────────────────────────────────────────────────────────
  # Everything downstream is conditioned on this job's outputs. It fails closed: a repository the
  # catalog does not describe gets no pipeline rather than a permissive default, because a silent
  # pass is indistinguishable from a repo that opted itself out.
  resolve:
    name: Resolve service identity
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      service: ${{ steps.id.outputs.service }}
      language: ${{ steps.id.outputs.language }}
      archetype: ${{ steps.id.outputs.archetype }}
      tier: ${{ steps.id.outputs.tier }}
      owner: ${{ steps.id.outputs.owner }}
      deployable: ${{ steps.id.outputs.deployable }}
      repo_kind: ${{ steps.id.outputs.repo_kind }}
      owns_database: ${{ steps.id.outputs.owns_database }}
      seeds: ${{ steps.id.outputs.seeds }}
      has_rest: ${{ steps.id.outputs.has_rest }}
      has_events: ${{ steps.id.outputs.has_events }}
      coverage_threshold: ${{ steps.id.outputs.coverage_threshold }}
      role: ${{ steps.id.outputs.role }}
      capabilities: ${{ steps.id.outputs.capabilities }}
    steps:
      # One shared implementation, used identically by deploy-reusable.yml. Two copies of
      # security-critical resolution logic is the drift this whole change exists to remove.
      - name: Derive identity from the immutable repository id
        id: id
        uses: coderaxis/github-actions/resolve-service-identity@v1
        with:
          catalog-owner: ${{ inputs.catalog_owner }}
          catalog-repo: ${{ inputs.catalog_repo }}
          catalog-ref: ${{ inputs.catalog_ref }}
          coverage-override: ${{ inputs.coverage_threshold }}

  # The language-specific jobs below are necessarily conditional, which means an unrecognised
  # language would skip build, test, coverage and CodeQL and still report the pipeline green.
  # Every repo in the fleet is Go today, so this guard costs nothing now and is the difference
  # between "the first non-Go service is unbuilt and nobody notices" and "the first non-Go
  # service fails loudly until this workflow learns its toolchain".
  supported-language:
    name: Language is supported
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse a language this pipeline cannot build
        shell: bash
        env:
          LANGUAGE: ${{ needs.resolve.outputs.language }}
        run: |
          set -euo pipefail
          case "${LANGUAGE}" in
            go) echo "language ${LANGUAGE}: build, test, coverage and CodeQL apply" ;;
            *)
              echo "::error::the catalog reports runtime.language=${LANGUAGE} for this repository,"
              echo "::error::which service-ci.yml has no toolchain for. Build, test, coverage and"
              echo "::error::CodeQL would all be skipped and this pipeline would still pass. Add"
              echo "::error::the toolchain centrally before onboarding this repo."
              exit 1 ;;
          esac

  # ── universal standards ─────────────────────────────────────────────────────────────────────
  # Applies to every repository regardless of language or archetype. Nothing here reads a script
  # from the repository being checked; that is the whole point.
  standards:
    name: Repository standards
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint workflow definitions
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ── language pipeline ───────────────────────────────────────────────────────────────────────
  build-test:
    name: Build and test (${{ needs.resolve.outputs.language }})
    needs: resolve
    if: needs.resolve.outputs.language == 'go'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - name: Check out the service repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Mint module-read token
        id: modauth
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Download private modules
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          [[ -n "${MOD_TOKEN}" ]] || { echo "::error::module token required for private Go modules"; exit 1; }
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          GOWORK=off go mod download

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          # `make lint` is the fleet convention; fall back to vet so a repo without a Makefile
          # target is still linted rather than silently skipped.
          if grep -qE '^lint:' Makefile 2>/dev/null; then make lint; else GOWORK=off go vet ./...; fi

      - name: Unit tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          # mapfile rather than an unquoted command substitution: a package path containing a space
          # would otherwise split into two arguments and go test would fail on a path that does not
          # exist, reported as a test failure rather than a quoting bug.
          mapfile -t pkgs < <(GOWORK=off go list ./... | grep -Ev '/tests/(contracts|integration)')
          GOWORK=off go test "${pkgs[@]}" \
            -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -5

      - name: Enforce the tier's coverage threshold
        shell: bash
        env:
          THRESHOLD: ${{ needs.resolve.outputs.coverage_threshold }}
        run: |
          set -euo pipefail
          # Missing coverage is a failure, not a warning: "no coverage file" was previously an
          # automatic pass, which is the same outcome as having no tests at all.
          [[ -s coverage.out ]] || { echo "::error::coverage.out missing — the gate cannot be evaluated"; exit 1; }
          PCT="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          [[ -n "${PCT}" ]] || { echo "::error::could not parse coverage total"; exit 1; }
          echo "coverage ${PCT}% (tier ${{ needs.resolve.outputs.tier }} requires >= ${THRESHOLD}%)"
          awk -v p="${PCT}" -v t="${THRESHOLD}" 'BEGIN { exit (p+0 < t+0) }' \
            || { echo "::error::coverage ${PCT}% is below the ${THRESHOLD}% required for this tier"; exit 1; }

      - name: Contract tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests/contracts ]]; then GOWORK=off go test ./tests/contracts/... -count=1; \
          else echo "no tests/contracts directory"; fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          retention-days: 14

  codeql:
    name: CodeQL
    needs: resolve
    if: needs.resolve.outputs.language == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      security-events: write
      # analyze@v3 reads the workflow run via the REST API to attach results to the right commit.
      # Without this it fails on "Resource not accessible by integration" AFTER extraction and
      # autobuild have already succeeded, so the cost of omitting it is a full CodeQL build.
      actions: read
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Autobuild compiles the module, so it needs the same private-module access the test job has.
      # The workflow this job absorbed did mint a token; centralizing dropped it, and autobuild then
      # failed with "could not read Username for https://github.com" - a git credential error that
      # says nothing about CodeQL. Analysis cannot run on a repo whose dependencies will not resolve,
      # so this must fail loudly rather than degrade to scanning a subset.
      - name: Mint module-read token
        id: modauth
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Configure private module access
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          [[ -n "${MOD_TOKEN}" ]] || { echo "::error::module token required for private Go modules"; exit 1; }
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3

      # Code scanning (the API analyze uploads to) is a GitHub Advanced Security feature. It is not
      # available for user-owned private repositories, which is exactly where the core modules live
      # today. Extraction and autobuild still prove the code compiles under analysis; failing the
      # job for a platform entitlement the App cannot buy would make every core-module CI red for a
      # reason nobody in the repo can fix. When the upload is refused for that reason we record it
      # and move on; any other analyze failure still fails the job.
      - name: Detect Code scanning availability
        id: codescan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner_type="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.owner.type')"
          is_private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          if [[ "${owner_type}" == "User" && "${is_private}" == "true" ]]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Code scanning is unavailable for user-owned private repos; analysis runs but results are not uploaded."
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload CodeQL results
        if: steps.codescan.outputs.available == 'true'
        uses: github/codeql-action/analyze@v3

      - name: Analyze without upload (no Code scanning entitlement)
        if: steps.codescan.outputs.available == 'false'
        uses: github/codeql-action/analyze@v3
        with:
          upload: false

  # ── contract gates, selected by what the catalog says the service exposes ────────────────────
  # These run for EVERY repository, deliberately unconditioned.
  #
  # Gating them on catalog facts looked tidy and was wrong: schema-compatibility runs in 91 repos
  # today and event-handling-compliance in 60, so gating on `owns_database` / `has_events` would
  # have silently switched them off for roughly half the fleet — the checks would have kept
  # reporting green while enforcing nothing, which is worse than deleting them outright.
  #
  # Running them unconditionally also makes each check assert the NEGATIVE rather than assume it.
  # role=E is derived for a service the catalog says has no events, and the compliance check then
  # verifies that claim against the code, catching a service that grew a Kafka producer without
  # ever declaring it. A skipped job can never catch that.
  events:
    name: Event handling compliance
    needs: resolve
    uses: coderaxis/github-actions/.github/workflows/event-handling-compliance.yml@v1
    with:
      role: ${{ needs.resolve.outputs.role }}

  seeding:
    name: Seeding contract
    needs: resolve
    uses: coderaxis/github-actions/.github/workflows/seed-contract-check.yml@v1

  schema:
    name: Schema compatibility
    needs: resolve
    permissions:
      contents: read
      # The called workflow mints a module-read token from its own OIDC identity, and a called
      # job is capped by what the caller grants. Enforced by WFC-004, which caught the omission
      # here as a startup_failure with no logs.
      id-token: write
    uses: coderaxis/github-actions/.github/workflows/schema-compatibility.yml@v1
    # Explicit, because `secrets: inherit` does not cross the org boundary between a service repo
    # and this workflow. Without them the App token step failed on "Input required and not

  dockerfile:
    name: Dockerfile standard
    needs: resolve
    if: needs.resolve.outputs.deployable == 'true'
    uses: coderaxis/github-actions/.github/workflows/dockerfile-standard.yml@v1
    with:
      capabilities: ${{ needs.resolve.outputs.capabilities }}

  # ── repository structure ────────────────────────────────────────────────────────────────────
  # Absorbed from the per-repo quality-check.yml. Entirely generic: it asserts the shape every
  # Go service is required to have, so there was never a reason for each repo to carry its own.
  structure:
    name: Repository structure
    needs: resolve
    if: needs.resolve.outputs.language == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Required files, directories and Make targets
        shell: bash
        env:
          REPO_KIND: ${{ needs.resolve.outputs.repo_kind }}
        run: |
          set -euo pipefail
          rc=0
          # Three repo kinds, three shapes. The old per-repo quality-check.yml only ever encoded
          # the deployable one, and applying that set to the modules fails 27 of them on absences
          # that are CORRECT: auth-core has no internal/ because it exports its packages by
          # design, no schema module has a Makefile or a cmd/ at all, and neither kind has
          # build/run/ci targets because there is nothing to build or run. Each set below is the
          # intersection of what that kind actually has across the fleet, so it asserts a real
          # standard instead of being a permanently red gate people learn to ignore.
          case "${REPO_KIND}" in
            deployable)
              files="README.md Makefile go.mod Dockerfile service.contract.yaml"
              dirs="cmd internal scripts tests docs"
              targets="build run clean test lint fmt ci" ;;
            core)
              # Absorbed from the per-repo core-guard.yml. Measured against the fleet before being
              # required here: all 32 core modules carry a Makefile, an application/ directory and
              # at least one of domain/ports/adapters, and 31 of 32 define all nine targets. So this
              # asserts the hexagonal shape a core actually has rather than the deployable shape it
              # does not.
              files="README.md Makefile go.mod"
              dirs="docs application"
              targets="test test-pkg test-one test-race test-cover fmt vet lint tidy clean" ;;
            schema)
              # sqlc.yaml + schema/ + sql/ are what MAKE it a schema module, so requiring them is
              # stronger than the generic set it used to be checked against.
              files="README.md go.mod sqlc.yaml"
              dirs="schema sql internal"
              targets="" ;;
            *)
              echo "::error::repo_kind=${REPO_KIND} is not a shape this gate knows how to check"
              exit 1 ;;
          esac
          for f in ${files}; do
            [[ -f "${f}" ]] || { echo "::error::missing required file: ${f}"; rc=1; }
          done
          for d in ${dirs}; do
            [[ -d "${d}" ]] || { echo "::error::missing required directory: ${d}"; rc=1; }
          done
          for t in ${targets}; do
            make -n "${t}" >/dev/null 2>&1 || { echo "::error::missing required Make target: ${t}"; rc=1; }
          done

          # A core exports its behaviour through ports and adapters, so it must have at least one of
          # them. Requiring all three would be wrong - a core with no inbound adapter is legitimate -
          # which is why this is a one-of rather than another entry in the dirs list above.
          if [[ "${REPO_KIND}" == "core" ]]; then
            found=0
            for d in domain ports adapters; do
              [[ -d "${d}" ]] && found=$((found + 1))
            done
            if [[ "${found}" -eq 0 ]]; then
              echo "::error::a core module must expose at least one of domain/, ports/ or adapters/"
              rc=1
            fi
          fi
          exit "${rc}"

      - name: Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt would rewrite these files; run 'make fmt'"
            echo "${unformatted}"
            exit 1
          fi

  # ── workflow lanes (WFC-003) ────────────────────────────────────────────────────────────────
  # Absorbed from the per-repo pipeline-policy.yml, which asserted that thirteen named workflow
  # files EXISTED in the repository - quality-check.yml, security-scan.yml, codeql.yml,
  # gitleaks.yml, actionlint.yml, deploy.yml, post-deploy.yml, preview-env.yml and others.
  #
  # That check encoded the decentralised model as a requirement, so it actively fought
  # centralisation: deleting a workflow whose logic had moved here turned the gate red, and the
  # only way to keep it green was to keep the copies. Governance was pinning the fleet to the
  # shape it was supposed to be moving away from.
  #
  # Inverted here. The lane set required is the thin-caller set, derived from repo_kind, and the
  # absorbed names are asserted ABSENT - because a repo that keeps a local copy alongside the
  # central call runs both, and the local one silently decides the result.
  lanes:
    name: Required workflow lanes
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Required and forbidden workflow lanes
        shell: bash
        env:
          REPO_KIND: ${{ needs.resolve.outputs.repo_kind }}
          HAS_REST: ${{ needs.resolve.outputs.has_rest }}
        run: |
          set -euo pipefail
          rc=0
          wf=".github/workflows"

          # Every repo calls central CI. A core or schema module also publishes a version, so it
          # owns a release lane. A deployable publishes nothing and receives its pins from the
          # cascade, so ci.yml is the whole of its surface.
          required="${wf}/ci.yml"
          case "${REPO_KIND}" in
            core)       required="${required} ${wf}/release.yml" ;;
            schema)     required="${required} ${wf}/release.yml" ;;
            deployable) ;;
            *) echo "::error::repo_kind=${REPO_KIND} has no defined lane set"; exit 1 ;;
          esac

          for f in ${required}; do
            [[ -f "${f}" ]] || { echo "::error::missing required workflow lane: ${f}"; rc=1; }
          done

          # An ALLOWLIST, not a list of known-bad names. The previous version enumerated the
          # workflows the platform had absorbed, which meant it could only ever catch a file someone
          # had already thought to forbid: a repo could add build-extra.yml, run its own unpinned
          # actions and its own thresholds, and pass. Every drift this migration removed - 91 copies
          # of validate_docs.py, nine variants of one integration harness, one contract gate under
          # two filenames - entered the fleet as a file nobody had listed yet.
          #
          # So the rule is inverted: two names are permitted and everything else fails. Adding a lane
          # now means adding it here, in one place, with a reason.
          allowed="ci.yml release.yml"

          # Retained only to explain a failure, never to decide one. A file caught by the allowlist
          # that also appears here gets told where its logic went, rather than just that it is
          # unexpected.
          absorbed="actionlint gitleaks codeql quality-check security-scan dependency-review
                    docs-lint stale-docs-check schema-compatibility event-handling-compliance
                    seed-contract-check sqlc-guard core-guard sbom deploy post-deploy
                    reusable-notify-consumers reusable-module-auth pipeline-policy
                    adr-validation openapi-validation dockerfile-standard docs-governance
                    integration-tests contract-check openapi-contract contract-tests
                    bump-shared-modules"
          # The cascade stopped dispatching to consumers when module-release.yml began writing pins
          # directly with bump-module-pin, so a surviving listener opens a second, competing PR for
          # a bump that has already landed.
          listeners="bump-core-modules bump-engine-core"

          shopt -s nullglob
          for path in "${wf}"/*.yml "${wf}"/*.yaml; do
            f="$(basename "${path}")"
            case " ${allowed} " in *" ${f} "*) continue ;; esac

            stem="${f%.*}"
            rc=1
            if [[ " ${absorbed} " == *" ${stem} "* ]]; then
              echo "::error file=${path}::${f} is absorbed by central CI but still present here."
              echo "Running both means the local copy decides the result. Delete it."
            elif [[ " ${listeners} " == *" ${stem} "* ]]; then
              echo "::error file=${path}::${f} is a bump listener. The cascade no longer dispatches"
              echo "to consumers - module-release.yml writes the pin directly - so this would open a"
              echo "second, competing PR for a bump that has already landed. Delete it."
            else
              echo "::error file=${path}::${f} is not a permitted workflow lane."
              echo "A repository may hold ci.yml and, if it publishes a version, release.yml."
              echo "Everything else runs as a job in coderaxis/github-actions service-ci.yml, so a"
              echo "local lane is a second implementation that will drift from it. If this genuinely"
              echo "cannot be a central job, add it to the allowlist in service-ci.yml with a reason."
            fi
          done
          shopt -u nullglob

          # Kept from pipeline-policy.yml, but conditioned on the catalog instead of assumed: only
          # a service that actually declares a REST interface owes a committed contract.
          if [[ "${HAS_REST}" == "true" && "${REPO_KIND}" == "deployable" ]]; then
            if ! any_of docs/openapi.json docs/openapi.yaml docs/openapi.yml \
                        api/openapi.json api/openapi.yaml api/openapi.yml; then
              echo "::error::catalog declares a REST interface but no OpenAPI contract is committed"
              rc=1
            fi
          fi
          exit "${rc}"

  # ── vulnerabilities ─────────────────────────────────────────────────────────────────────────
  # Absorbed from the per-repo security-scan.yml, with one behavioural change: it blocks.
  # That workflow read SECURITY_BLOCKING from a repo variable and DEFAULTED IT TO 'false', so
  # across the fleet vulnerability findings were reported and then ignored, and a repo could
  # keep it that way by doing nothing. Severity is a platform decision, not a repo setting.
  vulnerabilities:
    name: Vulnerabilities
    needs: resolve
    if: needs.resolve.outputs.language == 'go'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - uses: actions/checkout@v4

      - name: High-signal secret scan
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]{16,}|xox[baprs]-[0-9A-Za-z-]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
          if git grep -nIE "${PATTERN}" -- ':!go.sum' ':!**/*.md' ':!docs/**' ':!testdata/**'; then
            echo "::error::high-signal secret pattern detected"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Mint module-read token
        id: modauth
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Known vulnerabilities in dependencies
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOWORK=off "$(go env GOPATH)/bin/govulncheck" ./...

      # Carried over from the per-repo core-guard.yml at its existing posture, deliberately.
      # Making it blocking here would tighten the fleet inside the same change that centralises
      # it, so a real regression and a pre-existing baseline would be indistinguishable. Promoting
      # it to blocking is its own decision, taken once the baseline is known to be clean.
      - name: Static analysis (advisory)
        continue-on-error: true
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go install honnef.co/go/tools/cmd/staticcheck@latest
          GOWORK=off "$(go env GOPATH)/bin/staticcheck" ./... \
            || echo "::warning::staticcheck findings are advisory until the fleet baseline is clean"

      # This repo tags releases as `vX.Y.Z`; `0.28.0` has no `v` and does not resolve, so the job
      # failed on "unable to find version" before scanning anything.
      #
      # `scanners: vuln` is deliberate. Current Trivy also runs a secret scanner by default, which
      # does not read .gitleaks.toml and so re-reports what that file deliberately allowlists - its
      # first finding here was the example GitHub token published in GitHub's own docs, which the
      # allowlist exists to permit. Secret scanning is owned by gitleaks in the `standards` job,
      # where the allowlist lives; two scanners for one concern, only one of which can be taught
      # about a false positive, means the other can only be silenced wholesale.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ── generated-code and query drift ──────────────────────────────────────────────────────────
  sqlc:
    name: SQLC drift and raw-SQL guard
    needs: resolve
    if: needs.resolve.outputs.language == 'go'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Mint module-read token
        id: modauth
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Verify sqlc generated code is current
        shell: bash
        env:
          MOD_TOKEN: ${{ steps.modauth.outputs.token }}
        run: |
          set -euo pipefail
          if [[ ! -f sqlc.yaml && ! -f sqlc.yml ]]; then
            echo "no sqlc.yaml in this repo; nothing to verify"
            exit 0
          fi
          git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- sqlc rootsqlc \
            || { echo "::error::sqlc generated code drift; run 'sqlc generate' and commit"; exit 1; }

      # The guard used to be scripts/check-no-raw-sql.py inside each repo. Two repos carried it
      # and the copies had already diverged, so it now lives here as one implementation.
      - name: Check out the central checkers
        uses: actions/checkout@v4
        with:
          repository: coderaxis/github-actions
          ref: v1
          path: .central
          sparse-checkout: scripts

      - name: Raw SQL guard
        shell: bash
        run: python3 .central/scripts/check_no_raw_sql.py

  # ── contracts ───────────────────────────────────────────────────────────────────────────────
  # Absorbs the per-repo adr-validation.yml and openapi-validation.yml, which existed in 91
  # repositories each and could not fail. Every finding in adr-validation.yml was emitted as
  # `::warning` and the script ended in `exit 0`; openapi-validation.yml returned 0 when the spec
  # was absent. Both therefore reported success on a repository with no ADRs, no contract, and no
  # index - 182 workflow files whose only effect was to make the checks list look longer.
  #
  # Here the same checks block. Whether they APPLY is decided by the catalog rather than by what
  # the repository happens to contain, which is the part that made the old versions vacuous: a
  # service that had lost its OpenAPI spec passed the OpenAPI gate precisely because it had lost it.
  contracts:
    name: ADR and API contract validation
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out the central checkers
        uses: actions/checkout@v4
        with:
          repository: coderaxis/github-actions
          ref: v1
          path: .central
          sparse-checkout: scripts

      - name: ADR structure
        shell: bash
        run: |
          set -euo pipefail
          [[ -d docs/adr ]] || { echo "no docs/adr in this repo"; exit 0; }
          mapfile -t adrs < <(find docs/adr -maxdepth 1 -type f -name 'ADR-*.md' | sort)
          rc=0
          for adr in "${adrs[@]}"; do
            base="$(basename "${adr}")"
            [[ "${base}" =~ ^ADR-[0-9]{4}-.+\.md$ ]] \
              || { echo "::error file=${adr}::ADR filenames must match ADR-0001-title.md"; rc=1; }
            [[ -s "${adr}" ]] || { echo "::error file=${adr}::ADR file is empty"; rc=1; }
            grep -Eq '^# .+' "${adr}" \
              || { echo "::error file=${adr}::ADR must have a top-level markdown heading"; rc=1; }
          done
          # An unindexed ADR is invisible to every reader who starts at the index, which is all of
          # them. The old check warned about this and 91 repos accumulated the drift.
          if [[ -f docs/adr/ADR_INDEX.md ]]; then
            for adr in "${adrs[@]}"; do
              base="$(basename "${adr}")"
              grep -Fq "${base}" docs/adr/ADR_INDEX.md \
                || { echo "::error file=docs/adr/ADR_INDEX.md::${base} is not listed"; rc=1; }
            done
          elif [[ ${#adrs[@]} -gt 0 ]]; then
            echo "::error::docs/adr contains ADRs but has no ADR_INDEX.md"
            rc=1
          fi
          exit "${rc}"

      - name: OpenAPI contract
        shell: bash
        env:
          HAS_REST: ${{ needs.resolve.outputs.has_rest }}
          REPO_KIND: ${{ needs.resolve.outputs.repo_kind }}
        run: |
          set -euo pipefail
          spec=""
          for c in docs/openapi.json docs/openapi.yaml docs/openapi.yml \
                   api/openapi.json api/openapi.yaml api/openapi.yml; do
            [[ -f "${c}" ]] && { spec="${c}"; break; }
          done

          # The catalog decides whether a contract is owed. Keying this off the file's presence -
          # what the old workflow did - means deleting the spec is how you pass the check.
          if [[ -z "${spec}" ]]; then
            if [[ "${HAS_REST}" == "true" && "${REPO_KIND}" == "deployable" ]]; then
              echo "::error::the catalog declares a REST interface but no OpenAPI contract is committed"
              exit 1
            fi
            echo "no REST interface declared and no spec committed; nothing to validate"
            exit 0
          fi

          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - "${spec}" <<'PY'
          import json, sys, pathlib
          import yaml
          p = pathlib.Path(sys.argv[1])
          raw = p.read_text(encoding="utf-8")
          spec = json.loads(raw) if p.suffix == ".json" else yaml.safe_load(raw)
          errs = []
          if not isinstance(spec, dict):
              errs.append("spec is not a mapping")
              spec = {}
          if spec.get("openapi") is None and spec.get("swagger") is None:
              errs.append("spec must declare an openapi or swagger version")
          if not (spec.get("info") or {}).get("version"):
              errs.append("spec must declare info.version")
          if not spec.get("paths"):
              errs.append("spec declares no paths")
          for e in errs:
              print(f"::error file={p}::{e}")
          sys.exit(1 if errs else 0)
          PY

      # ADR-0006: operationIds are semver-governed public identifiers that generated SDKs, API
      # catalogs and observability keys depend on. The guard existed centrally and was wired into
      # nothing, so the governance it defines had never once been enforced.
      - name: OperationId governance
        shell: bash
        run: |
          set -euo pipefail
          for c in docs/openapi.json docs/openapi.yaml docs/openapi.yml; do
            if [[ -f "${c}" ]]; then
              python3 .central/scripts/check_operation_ids.py --check
              exit $?
            fi
          done
          echo "no committed OpenAPI contract; operationId governance does not apply"

  # ── integration ─────────────────────────────────────────────────────────────────────────────
  # Absorbs the per-repo integration-tests.yml: 35 copies, of which 21 were byte-identical and the
  # other 14 had drifted into nine variants of the same harness. All 35 authenticated with
  # `secrets.CODERAXIS_APP_ID`, which the OIDC migration deleted - so every one of them had been
  # unable to download a private module since that change, and the fleet's only real end-to-end
  # coverage was failing or vacuously passing in 35 places at once.
  #
  # The selection rule is the substantive change. The old harness looked for
  # tests/integration/*_test.go and set run=false when it found none, which made deleting your
  # integration tests the way to pass the integration gate. Here the catalog decides who owes
  # coverage, so an empty tests/integration directory is a failure for a service that owns data
  # rather than a silent skip.
  integration:
    name: Integration tests
    needs: resolve
    if: needs.resolve.outputs.repo_kind == 'deployable' && needs.resolve.outputs.language == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: service_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
      GONOSUMDB: github.com/coderaxis/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: false

      - name: Resolve service endpoints
        shell: bash
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          set -euo pipefail
          dsn="postgres://postgres:postgres@localhost:${PG_PORT}/service_test?sslmode=disable"
          {
            echo "DATABASE_URL=${dsn}"
            echo "POSTGRES_DSN=${dsn}"
            echo "REDIS_ADDR=localhost:${REDIS_PORT}"
          } >> "${GITHUB_ENV}"

      # The catalog, not the working tree, decides whether this service owes integration coverage.
      - name: Decide whether integration coverage is owed
        id: selection
        shell: bash
        env:
          OWNS_DATABASE: ${{ needs.resolve.outputs.owns_database }}
          HAS_EVENTS: ${{ needs.resolve.outputs.has_events }}
        run: |
          set -euo pipefail
          present=false
          find tests/integration -name '*_test.go' -print -quit 2>/dev/null | grep -q . && present=true

          owed=false
          [[ "${OWNS_DATABASE}" == "true" || "${HAS_EVENTS}" == "true" ]] && owed=true

          if [[ "${owed}" == "true" && "${present}" == "false" ]]; then
            echo "::error::the catalog declares this service owns a database and/or publishes events,"
            echo "but tests/integration contains no Go test files. The behaviour that crosses a"
            echo "process boundary is exactly the behaviour unit tests cannot cover."
            exit 1
          fi
          echo "run=${present}" >> "${GITHUB_OUTPUT}"
          [[ "${present}" == "true" ]] \
            || echo "service owes no integration coverage and ships none" >> "${GITHUB_STEP_SUMMARY}"

      - name: Mint module-read token
        if: steps.selection.outputs.run == 'true'
        id: modauth
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: read
          configure-git: "true"

      - name: Download private modules
        if: steps.selection.outputs.run == 'true'
        shell: bash
        run: GOWORK=off go mod download

      # Only started for a service the catalog says publishes or consumes events. The old harness
      # paid for a Redpanda broker on every deployable regardless.
      - name: Start Redpanda
        if: steps.selection.outputs.run == 'true' && needs.resolve.outputs.has_events == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name redpanda -p 9092:9092 -p 9644:9644 \
            redpandadata/redpanda:v24.3.6 \
            redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
              --node-id 0 --check=false \
              --kafka-addr PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr PLAINTEXT://127.0.0.1:9092
          echo "KAFKA_BROKERS=localhost:9092" >> "${GITHUB_ENV}"

      # TDD-NO-SKIP-GUARD, kept verbatim in intent from the workflow this replaces. A t.Skip() in an
      # integration test is indistinguishable from a passing one in the check list, and the runner
      # supplies Postgres, Redis and Kafka, so there is no legitimate reason to skip.
      - name: Run integration tests
        if: steps.selection.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(GOWORK=off go list ./tests/integration/... 2>/dev/null)
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "::error::integration test files exist but no Go packages resolved under ./tests/integration/..."
            exit 1
          fi

          status=0
          GOWORK=off go test "${pkgs[@]}" -count=1 -v -json | tee integration-tests.jsonl \
            || status="${PIPESTATUS[0]}"
          [[ "${status}" -eq 0 ]] || { echo "::error::integration tests failed"; exit "${status}"; }

          ran=$(grep -c '"Action":"run"' integration-tests.jsonl || true)
          skipped=$(grep '"Action":"skip"' integration-tests.jsonl | grep -c '"Test":' || true)
          echo "integration tests: executed=${ran} skipped=${skipped}"

          if [[ "${ran}" -eq 0 ]]; then
            echo "::error::no integration tests executed; the gate would have passed on an empty run"
            exit 1
          fi
          if [[ "${skipped}" -gt 0 ]]; then
            echo "::error::${skipped} integration test(s) called t.Skip(). Postgres, Redis and Kafka"
            echo "are supplied by this job (DATABASE_URL/POSTGRES_DSN/REDIS_ADDR/KAFKA_BROKERS)."
            grep '"Action":"skip"' integration-tests.jsonl | grep '"Test":' \
              | sed 's/.*"Test":"\([^"]*\)".*/  skipped: \1/' | sort -u
            exit 1
          fi

  # ── API contract lifecycle ──────────────────────────────────────────────────────────────────
  # Absorbs contract-check.yml (33 repos) and openapi-contract.yml (5). Those two filenames held
  # the same workflow calling the same registry pipeline, so the fleet ran one gate under two names
  # and neither WFC nor a reader grepping for one of them would find the other.
  #
  # Three things were wrong with the per-repo form beyond the duplication:
  #   - every copy pinned `@main`, so the contract gate changed under all 38 services with no
  #     version bump. WFC-002 did not catch it because it only checks refs into
  #     coderaxis/github-actions, and this workflow is published by another org.
  #   - every copy passed coderaxis-app-id, which the OIDC migration deleted.
  #   - service-name was hand-written in each file, so a rename silently pointed a service at
  #     another service's registry directory. It is now read from the catalog.
  #
  # A note on what this gate currently proves: all 38 callers left `generate`, `breaking-change`
  # and `publish-on-main` at their defaults, so the drift gate, the oasdiff breaking-change check
  # and registry publication have never run for any service. What survives is structural validation
  # plus the caller's contract tests. Turning the other stages on needs a published baseline to
  # diff against, which cannot exist while publication is off - tracked rather than silently
  # enabled here, because enabling oasdiff with no baseline produces a green check that means
  # nothing, which is the failure mode this whole migration exists to remove.
  contract:
    name: API contract
    needs: resolve
    if: needs.resolve.outputs.repo_kind == 'deployable' && needs.resolve.outputs.has_rest == 'true'
    permissions:
      contents: read
      id-token: write
    uses: InboxxHQ-CoderAxis/inboxxhq-api-contracts/.github/workflows/reusable-openapi-contract.yml@v1
    with:
      service-name: ${{ needs.resolve.outputs.service }}
      spec-file: docs/openapi.json
      contract-test-command: GOWORK=off go test ./tests/contracts/... -count=1 -v

  # ── documentation ───────────────────────────────────────────────────────────────────────────
  # Replaces the per-repo docs-lint.yml and stale-docs-check.yml, which both ran
  # scripts/validate_docs.py from the repository being checked. That file existed in 91
  # repositories as 91 byte-different files - every repo validated its docs against its own
  # private definition of valid, and passing meant nothing comparable. core-docs already owns
  # check_service_docs.py, so the standard is read from the platform, not from the subject.
  docs:
    name: Service documentation
    needs: resolve
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: service

      - name: Mint a catalog-read token
        id: catalog_token
        uses: coderaxis/github-actions/ci-app-token@v1
        with:
          scope: read
          owner: ${{ inputs.catalog_owner }}
          repositories: ${{ inputs.catalog_repo }}

      - name: Check out the documentation standard
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.catalog_repo }}
          ref: ${{ inputs.catalog_ref }}
          token: ${{ steps.catalog_token.outputs.token }}
          path: core-docs

      - name: Validate against the central standard
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 core-docs/scripts/check_service_docs.py --service-dir service

  dependency-review:
    name: Dependency review
    needs: resolve
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── artifact ────────────────────────────────────────────────────────────────────────────────
  # Only on trunk, only for a deployable, and only once every gate above is green. The service
  # name comes from the catalog, not from the repo. This job ends at the GitOps digest pin —
  # Argo CD reconciles from there, so nothing below this line touches a cluster.
  artifact:
    name: Canonical build and GitOps pin
    needs: [resolve, supported-language, standards, build-test, codeql, events, seeding, schema,
            dockerfile, structure, vulnerabilities, sqlc, docs, contracts]
    if: |
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.resolve.outputs.deployable == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    # Required, not optional hygiene. deploy-reusable.yml declares `id-token: write` at workflow
    # level for the AWS OIDC role assumption, and a called workflow cannot hold a permission its
    # caller did not grant. Omitting this block made the job inherit the `contents: read` declared
    # at the top of this file, so GitHub rejected the whole workflow at load time - which surfaces
    # as a startup_failure with no job, no log and no annotation to read.
    permissions:
      contents: read
      id-token: write
    uses: coderaxis/github-actions/.github/workflows/deploy-reusable.yml@v1
    with:
      # Resolved from the immutable repository id, never from anything the service repo says.
      # Previously each repo passed this literal in its own deploy.yml, so a one-line edit to
      # `service_name:` was enough to publish one service's code under another's identity.
      service_name: ${{ needs.resolve.outputs.service }}

  # ── notification ────────────────────────────────────────────────────────────────────────────
  # Centralised here, and this job is a REPLACEMENT rather than an addition. Each per-repo ci.yml
  # carried its own Slack step; absorbing them into this pipeline dropped it, so the migration was
  # quietly making failures less visible, not more. The old steps were guarded by
  # `if: env.SLACK_BOT_TOKEN != ''`, which meant a repository that never configured the secret had
  # been posting nothing for its entire life and reported success while doing so.
  #
  # The bot token is read from Secrets Manager against this job's OIDC identity, so no caller
  # forwards a Slack credential and there is no "unconfigured" state left to fail silently.
  notify:
    name: Notify on failure
    needs: [resolve, supported-language, standards, build-test, codeql, events, seeding, schema,
            dockerfile, structure, lanes, vulnerabilities, sqlc, docs, contracts, dependency-review,
            integration, contract, artifact]
    # always() rather than failure(): several gates above are conditional, and a plain failure()
    # does not run once any needed job has been skipped - which is the normal shape here, so the
    # alert would have fired only on the subset of runs where every gate happened to be relevant.
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      # Naming the failed gates makes the message actionable on its own. A bare "CI failed" costs
      # the reader a round trip to the run just to learn whether it was coverage or a CVE.
      - name: Summarise which gates failed
        id: summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(python3 -c 'import json,os; n=json.loads(os.environ["NEEDS"]); print(", ".join(k for k,v in n.items() if v.get("result") == "failure") or "unknown")')"
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

      - uses: coderaxis/github-actions/ci-slack-notify@v1
        with:
          status: failure
          title: CI failed
          text: "Failed gates: ${{ steps.summary.outputs.failed }}"
          fields: |
            [
              {"title": "Service", "value": "${{ needs.resolve.outputs.service || github.repository }}", "short": true},
              {"title": "Branch", "value": "${{ github.ref_name }}", "short": true}
            ]
