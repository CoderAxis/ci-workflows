name: Service Ports (RFC-0007 §10)

# The required lane RFC-0007 §10 has always asked for and never had.
#
# WHAT WAS MISSING. §10 lists four checks CI "MUST verify" and calls a checker for them "a
# required lane, not advisory". Measured 2026-08-21, check 3 - no *_SERVICE_URL /
# *_GRPC_ENDPOINT - was already built in BOTH halves, and checks 1, 2 and 4 were not:
#
#   3, code       ARCH-0010 in inboxxhq-architecture-check, run per repository by service-ci.yaml
#   3, manifests  inboxxhq-infra scripts/check-service-addressing.py, run by its own workflow
#
# So this job covers 1, 2 and 4 and cross-checks 3 without re-enforcing it. RFC-0007 §12's
# stated evidence for withdrawing the PREVIOUS port scheme is that its collision guard "does
# not exist" and "the enforcement the registry depended on was never built". The replacement
# scheme then specified four checks and shipped three of them unbuilt. This is those three.
#
# WHY IT NEEDS A MULTI-REPO WORKSPACE. The facts are in three repositories and every defect
# worth catching is a disagreement BETWEEN them: manifests in inboxxhq-infra, Dockerfiles and
# service contracts in the service repos, and the registry every caller resolves through in
# platform-shared-go. A per-repo gate can only confirm a repository agrees with itself, which
# is the one thing that was never wrong - all 44 services are internally consistent today, and
# 39 are consistent about a number the standard withdrew.
#
# WHY CENTRAL RATHER THAN IN THE CALLER. The same reason platform-governance.yaml and
# fleet-governance.yaml are central: most of the fleet is private, so assembling it needs an
# App token, and ci-app-token can only be reached by a job DEFINED in a central workflow at
# the released tag - the trust policy conditions on job_workflow_ref precisely so a repository
# cannot mint by editing its own workflow (ADR-0110).
#
# WHY ONLY THE DEPLOYABLES ARE FETCHED. This gate reads Dockerfiles and service.contract.yaml,
# which exist in deployables and not in the *-core or *-core-postgres modules. Planning those
# too would triple the assembly for trees no detector opens. The plan asserts what it fetched
# matches what the catalog named, because a gate run over half a fleet reports on the half it
# was given and still exits 0.

on:
  workflow_call:
    inputs:
      caller_path:
        description: >-
          Where to place the CALLING repository inside the assembled workspace, which is also
          how this lane learns which of the three subject trees the caller already is.
          Whichever tree the caller supplies is not fetched again, so the run is about the
          commit under review rather than about that repository's default branch.

          This is the layout contract, not a preference: check-service-ports.py resolves the
          service catalog at <workspace>/docs/core-docs/catalog/services, the manifests at
          infra/inboxxhq-infra/services and the registry at
          shared/platform-shared-go/platform/servicediscovery, so a tree in the wrong place is
          a tree no detector opens - which reads exactly like a tree with nothing to report.

          Only three values do anything: docs/core-docs, infra/inboxxhq-infra and
          shared/platform-shared-go. Anything else assembles all three from their default
          branches and checks the caller out somewhere no detector reads, which is a valid way
          for an unrelated repository to run the fleet-wide report.
        required: false
        type: string
        default: docs/core-docs
      docs_path:
        description: >-
          Deprecated alias for caller_path, kept so existing callers keep working. Setting both
          is a configuration error and fails the run rather than picking one.
        required: false
        type: string
        default: ""
      docs_repo:
        description: >-
          The service catalog, holding each service's `canonical_port`. Fetched only when the
          caller is not core-docs itself; SP-0005 states outright when the catalog was not in
          the workspace rather than treating its absence as agreement.
        required: false
        type: string
        default: coderaxis/core-docs
      fleet_owner:
        description: >-
          The account holding the brand-neutral half of the fleet. A GitHub App is installed
          per account, so the accounts are named here to be minted for, while WHICH
          repositories are fetched stays a property of the catalog.
        required: false
        type: string
        default: coderaxis
      brand_owner:
        description: "The account holding the deployables."
        required: false
        type: string
        default: InboxxHQ-CoderAxis
      infra_repo:
        description: >-
          The manifests. SP-0001 through SP-0004 all read services/*/base/service.yaml and
          services/*/overlays/*/deployment.yaml; without this tree every one of them reports
          INDETERMINATE rather than passing, which is loud but useless.
        required: false
        type: string
        default: InboxxHQ-CoderAxis/inboxxhq-infra
      shared_repo:
        description: >-
          Holds servicediscovery/ports.generated.go, which is what every caller resolves
          through and therefore what SP-0002 compares the manifests against.
        required: false
        type: string
        default: coderaxis/platform-shared-go
      fail_on:
        description: "Lowest severity that fails the lane (critical|major|minor)."
        required: false
        type: string
        default: major
      actions_ref:
        description: "Ref of coderaxis/ci-workflows to assemble (defaults to the moving major tag)."
        required: false
        type: string
        default: v1

permissions:
  contents: read

jobs:
  service-ports:
    name: Service ports agree across manifests, images and the registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required by ci-app-token: the OIDC token IS the proof of identity, and without this
      # the action fails with a clear message rather than a confusing denial.
      id-token: write

    steps:
      # Assembled layout, which check-service-ports.py's --workspace resolution depends on:
      #   $GITHUB_WORKSPACE/
      #     docs/core-docs/                                     <- one of these three
      #     infra/inboxxhq-infra/services/                         is the caller; the other
      #     shared/platform-shared-go/platform/servicediscovery/   two are fetched
      #     ci-workflows/
      #     services/<service>/<deployable>/
      #     gateways/<deployable>/
      #
      # WHY THE CALLER'S TREE IS NEVER RE-FETCHED. Every tree here used to come from its default
      # branch, with the caller additionally placed at docs/core-docs. That is correct for
      # core-docs and useless for anyone else: an inboxxhq-infra pull request that half-migrates
      # a service would have been checked against main, so the lane would report the fleet as
      # consistent and the change that breaks it as fine. The migration's commits land in
      # inboxxhq-infra and platform-shared-go, so those are exactly the two repositories whose
      # own commit has to be the subject.
      - name: Resolve where the caller goes
        id: layout
        shell: bash
        env:
          CALLER_PATH: ${{ inputs.caller_path }}
          DOCS_PATH: ${{ inputs.docs_path }}
        run: |
          set -euo pipefail
          if [ -n "${DOCS_PATH}" ] && [ "${DOCS_PATH}" != "${CALLER_PATH}" ]; then
            if [ "${CALLER_PATH}" != "docs/core-docs" ]; then
              echo "::error::caller_path=${CALLER_PATH} and the deprecated docs_path=${DOCS_PATH}" \
                   "disagree. Set caller_path alone."
              exit 1
            fi
            caller="${DOCS_PATH}"
          else
            caller="${CALLER_PATH}"
          fi
          echo "caller=${caller}" >> "${GITHUB_OUTPUT}"
          for tree in docs/core-docs infra/inboxxhq-infra shared/platform-shared-go; do
            key="fetch_${tree##*/}"
            key="${key//-/_}"
            if [ "${tree}" = "${caller}" ]; then
              echo "${key}=false" >> "${GITHUB_OUTPUT}"
              echo "caller supplies ${tree}"
            else
              echo "${key}=true" >> "${GITHUB_OUTPUT}"
            fi
          done

      - name: Check out the calling repository
        uses: actions/checkout@v4
        with:
          path: ${{ steps.layout.outputs.caller }}

      - name: Check out ci-workflows (public)
        uses: actions/checkout@v4
        with:
          repository: coderaxis/ci-workflows
          ref: ${{ inputs.actions_ref }}
          path: ci-workflows

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --upgrade pip PyYAML

      - name: Mint a read token for the fleet
        id: token
        uses: coderaxis/ci-workflows/ci-app-token@v1
        with:
          scope: read
          owner: ${{ inputs.fleet_owner }}
          extra-owners: ${{ inputs.brand_owner }}
          configure-git: "true"

      # A GitHub App is installed per ACCOUNT, so `token` is an installation token for
      # fleet_owner and cannot see brand_owner's repositories. GitHub answers a private
      # repository it cannot see with 404, not 403, so using the primary token for the
      # manifests reported inboxxhq-infra as a repository that does not exist and skipped
      # every control that reads it -- the same shape as an assembly failure, and the reason
      # the workspace guard below refuses rather than passes an incomplete tree.
      - name: Select each repository's owner token
        id: tokens
        shell: bash
        env:
          DOCS_REPO: ${{ inputs.docs_repo }}
          INFRA_REPO: ${{ inputs.infra_repo }}
          SHARED_REPO: ${{ inputs.shared_repo }}
          PRIMARY_OWNER: ${{ inputs.fleet_owner }}
          PRIMARY_TOKEN: ${{ steps.token.outputs.token }}
          TOKENS_FILE: ${{ steps.token.outputs.tokens-file }}
        run: |
          set -euo pipefail

          # Case-insensitively: GitHub routes an owner case-insensitively, so the two
          # spellings that arrive from different inputs name one account while a plain JSON
          # key lookup would call them two.
          token_for() {
            local owner="${1}"
            if [ "${owner,,}" = "${PRIMARY_OWNER,,}" ]; then
              printf '%s' "${PRIMARY_TOKEN}"
              return 0
            fi
            if [ -z "${TOKENS_FILE}" ] || [ ! -f "${TOKENS_FILE}" ]; then
              return 1
            fi
            jq -re --arg o "${owner}" \
              'to_entries[] | select((.key | ascii_downcase) == ($o | ascii_downcase)) | .value' \
              "${TOKENS_FILE}"
          }

          select_token() {
            local name="${1}" repo="${2}" owner token
            owner="${repo%%/*}"
            token="$(token_for "${owner}")" || {
              echo "::error::no App installation token was minted for '${owner}', which owns" \
                   "${repo}. A token for another account cannot see it and GitHub answers 404" \
                   "rather than 403, so the checkout would report a repository that exists as" \
                   "missing. Name ${owner} in fleet_owner or brand_owner."
              exit 1
            }
            echo "::add-mask::${token}"
            printf '%s=%s\n' "${name}" "${token}" >> "${GITHUB_OUTPUT}"
            echo "  ${repo} -> ${owner}'s installation token"
          }

          select_token docs_token "${DOCS_REPO}"
          select_token infra_token "${INFRA_REPO}"
          select_token shared_token "${SHARED_REPO}"

      # Only catalog/ is fetched: SP-0005 reads each service's canonical_port and nothing else
      # in a large documentation tree.
      - name: Check out the service catalog
        if: steps.layout.outputs.fetch_core_docs == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.docs_repo }}
          token: ${{ steps.tokens.outputs.docs_token }}
          path: docs/core-docs
          sparse-checkout: catalog

      # Only services/ is fetched. The gate reads no Terraform, no monitoring and no releases,
      # and the infra working tree runs to gigabytes once providers are initialised.
      - name: Check out the infrastructure manifests
        if: steps.layout.outputs.fetch_inboxxhq_infra == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo }}
          token: ${{ steps.tokens.outputs.infra_token }}
          path: infra/inboxxhq-infra
          sparse-checkout: services

      - name: Check out the shared registry
        if: steps.layout.outputs.fetch_platform_shared_go == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.shared_repo }}
          token: ${{ steps.tokens.outputs.shared_token }}
          path: shared/platform-shared-go
          sparse-checkout: platform/servicediscovery

      - name: Plan the deployables from the service catalog
        id: plan
        shell: bash
        env:
          # Always the assembled location, never the caller_path input: the catalog is at
          # docs/core-docs whether the caller supplied it or it was fetched.
          DOCS_PATH: docs/core-docs
          FLEET_OWNER: ${{ inputs.fleet_owner }}
          BRAND_OWNER: ${{ inputs.brand_owner }}
        run: |
          set -euo pipefail

          # From the catalog at run time, never from a list written here. A list in this file
          # would be a second copy of the catalog, and a copy that stops matching makes the
          # gate scan less than it claims to - which looks exactly like finding nothing.
          python3 - "${DOCS_PATH}" <<'PY' > "${RUNNER_TEMP}/ports-plan.tsv"
          import sys
          from pathlib import Path

          import yaml

          catalog = Path(sys.argv[1]) / "catalog" / "services"
          rows = set()
          for entry in sorted(catalog.glob("*.yaml")):
              svc = yaml.safe_load(entry.read_text(encoding="utf-8")) or {}
              if (svc.get("runtime") or {}).get("language") != "go":
                  continue
              name = svc.get("name")
              repo = svc.get("deployable_repository") or {}
              # `resolution` marks a catalog entry whose repository is planned rather than
              # real; cloning one 404s, which would read as an outage rather than as the
              # catalog saying "not built yet".
              if repo.get("resolution", "resolved") != "resolved":
                  continue
              if not (repo.get("organization") and repo.get("name") and name):
                  continue
              # Gateways and BFFs sit at gateways/<repo>; everything else at
              # services/<service>/<repo>. check-service-ports.py globs both, and resolves a
              # repository to its service through service.contract.yaml rather than through
              # its directory name, so only the two shapes matter here.
              stem = str(name)
              dest = (f"gateways/{repo['name']}" if stem.endswith(("-gateway", "-bff"))
                      else f"services/{stem}/{repo['name']}")
              rows.add(f"{repo['organization']}/{repo['name']}\t{dest}")

          if not rows:
              raise SystemExit(
                  "::error::the catalog named no Go deployables, so the plan is empty and "
                  "SP-0004 and SP-0005 would report INDETERMINATE about an empty tree"
              )
          print("\n".join(sorted(rows)))
          PY

          planned="$(wc -l < "${RUNNER_TEMP}/ports-plan.tsv")"
          echo "planned=${planned}" >> "${GITHUB_OUTPUT}"
          echo "catalog named ${planned} deployable repositories"

          # A token is minted per account. An account the catalog names and the mint did not
          # cover fails every clone from it, and a hundred authentication errors do not say
          # which of them is the cause.
          unknown="$(cut -f1 "${RUNNER_TEMP}/ports-plan.tsv" | cut -d/ -f1 | sort -fu \
                     | grep -vixF -e "${FLEET_OWNER}" -e "${BRAND_OWNER}" || true)"
          if [ -n "${unknown}" ]; then
            echo "::error::the catalog names repositories under account(s) this job holds no" \
                 "token for: ${unknown//$'\n'/, }. Add them to brand_owner/fleet_owner."
            exit 1
          fi

      - name: Assemble the deployables
        shell: bash
        run: |
          set -euo pipefail

          # Shallow and tagless: the checker reads the working tree, never the history.
          cat > "${RUNNER_TEMP}/clone-repo" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          git clone --quiet --depth 1 --no-tags "https://github.com/${1}.git" "${2}"
          SH
          chmod +x "${RUNNER_TEMP}/clone-repo"

          # xargs returns 123 if any invocation failed, and `set -e` turns that into a failed
          # job - a partially assembled fleet must not reach the gate, because the gate reports
          # on what it was given and cannot tell a clean repository from an absent one.
          xargs -a "${RUNNER_TEMP}/ports-plan.tsv" -P 8 -L 1 "${RUNNER_TEMP}/clone-repo"

          # Checked per planned destination rather than by counting: placement is part of the
          # contract, and a repository cloned to the wrong path is invisible to the globs and
          # reads exactly like a repository with nothing to report.
          missing=0
          while IFS=$'\t' read -r slug dest; do
            if [ -d "${GITHUB_WORKSPACE}/${dest}" ]; then
              continue
            fi
            echo "::error::${slug} did not land at ${dest}"
            missing=1
          done < "${RUNNER_TEMP}/ports-plan.tsv"
          [ "${missing}" -eq 0 ] || { echo "::error::fleet incomplete; gate not run"; exit 1; }

      - name: Confirm the workspace assembled
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for d in docs/core-docs/catalog ci-workflows \
                   infra/inboxxhq-infra/services \
                   shared/platform-shared-go/platform/servicediscovery; do
            if [ -d "${GITHUB_WORKSPACE}/${d}" ]; then
              echo "  present  ${d}"
            else
              echo "  MISSING  ${d}"; missing=1
            fi
          done
          # A gate that runs against a half-assembled workspace reports findings about absence
          # rather than about the platform, and those read identically to real ones.
          [ "${missing}" -eq 0 ] || { echo "::error::workspace incomplete; gate not run"; exit 1; }

      - name: Control catalog and detector tests
        working-directory: ci-workflows
        run: python3 scripts/test_service_ports.py

      - name: Service ports (RFC-0007 §10)
        working-directory: ci-workflows
        run: |
          python3 scripts/check-service-ports.py \
            --workspace "${GITHUB_WORKSPACE}" \
            --fail-on "${{ inputs.fail_on }}" \
            --report "${RUNNER_TEMP}/service-ports.json"

      - name: Port report (summary)
        if: always()
        shell: bash
        run: |
          {
            echo '## RFC-0007 §10 service port report'
            echo '```'
            python3 ci-workflows/scripts/check-service-ports.py \
              --workspace "${GITHUB_WORKSPACE}" \
              --fail-on "${{ inputs.fail_on }}" || true
            cat <<'SUMMARY'
          ```
          _A service's ports are a property of where it runs: the RFC-0007 §4.1 constants in_
          _Kubernetes, its own numbers on a workstation. SP-0006 is DEFERRED and reports how_
          _much of the fleet has migrated; it is promoted to `active` by the post-procedure in_
          _`docs/core-docs/playbooks/service-port-migration.md`. SP-0007 is ADVISORY: the_
          _authoritative gates for it are `inboxxhq-infra scripts/check-service-addressing.py`_
          _and ARCH-0010 in `inboxxhq-architecture-check`._
          SUMMARY
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the port report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-ports-report
          path: ${{ runner.temp }}/service-ports.json
          if-no-files-found: ignore
