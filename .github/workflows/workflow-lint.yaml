name: Workflow Lint

# Reusable workflow — lints a repository's own GitHub Actions workflow definitions.
#
# WHY THIS EXISTS SEPARATELY FROM service-ci.yaml. service-ci.yaml already carries this step, and
# through it 97 of the fleet's 118 repositories with workflows are linted. The remaining ones are
# precisely the repositories whose lifecycle is not a service pipeline — the contract and shared
# SDK repos, the infra repo, the docs hub, the frontend repos — so they call no central CI at all
# and had no workflow linting of any kind. That split was not a policy: it was a side effect of
# which repositories happened to fit service-ci.yaml.
#
# The cost of it was measurable rather than theoretical. Scanned 2026-07-30: of 118 repositories,
# every one of the 11 carrying an actionlint finding was in the uncovered set, and all 97 covered
# by service-ci.yaml were clean. The gate worked wherever it existed; it simply did not exist
# everywhere.
#
# WHY A REUSABLE WORKFLOW AND NOT A COPIED JOB. A copied job is what the workflow-centralization
# catalog exists to prevent, and this one carries a version pin that has to be raised in exactly
# one place — see the digest note below. Callers add a JOB to their existing `ci.yaml` rather than
# a new lane file, so WFC-0006's allowlist does not have to be widened to accommodate this: an
# allowlist extended to fit whatever exists asserts nothing.
#
# Enforced by WFC-0007, which fails a repository that has workflows but neither calls
# service-ci.yaml nor this workflow. Policy SSOT: ADR-0081, ADR-0051.

on:
  workflow_call: {}

jobs:
  workflow-lint:
    name: Workflow definitions lint clean
    runs-on: ${{ github.repository_owner == 'InboxxHQ-CoderAxis' && 'inboxxhq-ci' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      # A lint that lints nothing cannot fail, and that is not a hypothetical here: the equivalent
      # step in this repository's own ci.yaml spent the entire `.yml` -> `.yaml` migration matching
      # zero files and reporting success. The count is therefore asserted rather than assumed.
      - name: At least one workflow file is actually linted
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/workflows/*.yaml .github/workflows/*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::the workflow lint matched no files, so it would report success without"
            echo "having checked anything. Either this repository has no workflows - in which case"
            echo "it should not be calling this workflow - or they are not where GitHub expects."
            exit 1
          fi
          echo "linting ${#files[@]} workflow file(s)"

      # Pinned by digest, and deliberately given no `files` glob.
      #
      # The pin: an unpinned linter fails on an upstream release rather than on a change in the
      # repository being checked, and stops a developer's local run from reproducing CI. Measured
      # on identical source, actionlint 1.7.7 with shellcheck 0.10.0 reports 18 findings in
      # inboxxhq-infra where 1.7.12 with shellcheck 0.11.0 reports 15. A digest rather than a tag,
      # because a tag can be re-pushed onto different content. Raising it is a deliberate act: bump
      # the pin, scan the fleet, fix what the new version finds, land them together. Keep this in
      # step with the digest in service-ci.yaml so the whole fleet is judged by one set of rules.
      #
      # The absent glob: supplying one is what caused the silent pass described above. With no
      # glob, actionlint discovers `.github/workflows` itself and covers both spellings, which
      # makes that failure structurally impossible rather than corrected after the fact.
      - name: Lint workflow definitions
        # Binary release, not the docker:// container action: the self-hosted pool
        # has no Docker daemon. Same actionlint 1.7.12 + shellcheck 0.11.0 the pinned
        # image carried, pinned by version + sha256 of each release tarball, per arch.
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256_AMD64: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ACTIONLINT_SHA256_ARM64: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256_X86_64: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          SHELLCHECK_SHA256_AARCH64: "12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  al_arch=amd64; al_sha="${ACTIONLINT_SHA256_AMD64}"; sc_arch=x86_64;  sc_sha="${SHELLCHECK_SHA256_X86_64}" ;;
            aarch64) al_arch=arm64; al_sha="${ACTIONLINT_SHA256_ARM64}"; sc_arch=aarch64; sc_sha="${SHELLCHECK_SHA256_AARCH64}" ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          bin="${RUNNER_TEMP}/lint-bin"; mkdir -p "${bin}"
          al="actionlint_${ACTIONLINT_VERSION}_linux_${al_arch}.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${al}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al}"
          echo "${al_sha}  ${RUNNER_TEMP}/${al}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${al}" -C "${bin}" actionlint
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.${sc_arch}.tar.xz"
          curl -sSfL -o "${RUNNER_TEMP}/${sc}" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc}"
          echo "${sc_sha}  ${RUNNER_TEMP}/${sc}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${sc}" -C "${bin}" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          PATH="${bin}:${PATH}" "${bin}/actionlint" -color
