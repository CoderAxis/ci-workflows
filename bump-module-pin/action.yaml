name: Bump a module pin and open a PR
description: >-
  Move one Go module pin in a target repository to a released version, prove the result builds
  and passes its suites, and open (and usually auto-merge) the pull request. Everything the bump
  needs is passed in, so this runs equally well inside the consumer repository or from the
  central release that is pushing the bump into it.

  This exists as a composite action rather than a reusable workflow because the central release
  mints a write token per target repository at runtime, and a step output cannot be fed into a
  reusable workflow's `uses:`. A composite action runs inside the job that minted the token, so
  it can be handed that token directly.

inputs:
  target-repository:
    description: "owner/name of the repository being bumped. Never inferred from the run context: when the central release pushes a bump, the run context is the RELEASING repository, and every gh call that defaulted to it would act on the wrong repo."
    required: true
  target-path:
    description: "Path the target repository is checked out at."
    required: true
  module:
    description: "Go module path being bumped."
    required: true
  version:
    description: "Released semver tag to move to."
    required: true
  short:
    description: "Short module name, used in the branch name and PR title."
    required: true
  base-branch:
    description: "Branch to open the pull request against."
    required: false
    default: main
  token:
    description: "Installation token with write access to target-repository."
    required: true
  service:
    description: "Catalog service the target belongs to, for the PR body."
    required: false
    default: ""
  repo-kind:
    description: "core / schema / deployable / shared-library, for the PR body."
    required: false
    default: ""
  required-modules:
    description: "JSON array of modules the target must pin directly, for the pin policy gate."
    required: false
    default: "[]"
  companions:
    description: >-
      Further `module@version` pins moved in the SAME change, whitespace-separated. A core and its
      -postgres adapter often only build together (the adapter implements the core's ports), so
      moving one alone fails the gates below for a reason that is not a defect. The cascade
      reconciler passes every lagging platform module of a consumer here; the release fan-out
      leaves it empty. The guard, branch and title still name `module`; every companion is
      gated, listed in the PR body and counted by the tier rule exactly like it.
    required: false
    default: ""

outputs:
  skipped:
    description: "true when the pin was already at or ahead of this version."
    value: ${{ steps.guard.outputs.skip }}
  pull-request-number:
    description: "Number of the pull request opened, empty when nothing changed."
    value: ${{ steps.cpr.outputs.pull-request-number }}

runs:
  using: composite
  steps:
    - name: Skip a stale or redundant bump
      id: guard
      shell: bash
      working-directory: ${{ inputs.target-path }}
      env:
        MODULE: ${{ inputs.module }}
        VERSION: ${{ inputs.version }}
        COMPANIONS: ${{ inputs.companions }}
      run: |
        set -euo pipefail
        pin_of() {
          awk -v m="$1" '
            $1 == "require" && $2 == "(" { inb = 1; next }
            inb && $1 == ")" { inb = 0; next }
            inb && $1 == m { print $2; exit }
            $1 == "require" && $2 == m { print $3; exit }
          ' go.mod || true
        }
        # Bumps can arrive out of order, and a release can be re-run deliberately. Without this,
        # a late bump for an older tag would open a PR that DOWNGRADES the pin.
        current="$(pin_of "${MODULE}")"
        echo "current=${current}" >> "${GITHUB_OUTPUT}"
        echo "skip=false" >> "${GITHUB_OUTPUT}"
        # "module from to" per line, primary first: the tier rule and the PR body read every move,
        # not only the one the branch is named after.
        {
          echo "moves<<MOVES_EOF"
          echo "${MODULE} ${current:-none} ${VERSION}"
          for c in ${COMPANIONS}; do
            cpin="$(pin_of "${c%@*}")"
            echo "${c%@*} ${cpin:-none} ${c##*@}"
          done
          echo "MOVES_EOF"
        } >> "${GITHUB_OUTPUT}"

        if [[ -z "${current}" ]]; then
          echo "::notice::${MODULE} is not yet a direct requirement; proceeding to add it"
          exit 0
        fi
        if [[ "${current}" == "${VERSION}" ]]; then
          echo "skip=true" >> "${GITHUB_OUTPUT}"
          echo "::notice::already at ${VERSION}; nothing to do"
          exit 0
        fi
        semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
        if [[ "${current}" =~ ${semver} ]]; then
          newest="$(printf '%s\n%s\n' "${current#v}" "${VERSION#v}" | sort -V | tail -1)"
          if [[ "${newest}" == "${current#v}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::${current} is already newer than ${VERSION}; refusing to downgrade"
          fi
        fi

    - uses: actions/setup-go@v5
      if: steps.guard.outputs.skip != 'true'
      with:
        go-version-file: ${{ inputs.target-path }}/go.mod
        cache: false

    - name: Mint module-read token
      id: modauth
      if: steps.guard.outputs.skip != 'true'
      uses: coderaxis/ci-workflows/ci-app-token@v1
      with:
        scope: read
        configure-git: "true"

    - name: Configure private module access
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        MOD_TOKEN: ${{ steps.modauth.outputs.token }}
      run: |
        set -euo pipefail
        [[ -n "${MOD_TOKEN}" ]] || { echo "::error::no module-read token minted"; exit 1; }
        git config --global url."https://x-access-token:${MOD_TOKEN}@github.com/".insteadOf "https://github.com/"

    - name: Bump the pin
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.target-path }}
      env:
        GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
        GONOSUMDB: github.com/coderaxis/*
        MODULE: ${{ inputs.module }}
        VERSION: ${{ inputs.version }}
        COMPANIONS: ${{ inputs.companions }}
      run: |
        set -euo pipefail
        # One `go get` for every move, so minimal version selection resolves them together: a
        # core and its adapter moved in two steps can fail the first for a reason the second fixes.
        # shellcheck disable=SC2086 # COMPANIONS is a whitespace-separated list by contract
        GOWORK=off go get "${MODULE}@${VERSION}" ${COMPANIONS}
        GOWORK=off go mod tidy
        GOWORK=off go build ./...

    # A module release can change the DTOs, operation registry or canonical common.v1 components a
    # consumer's spec is generated from, so the committed spec can be stale the moment the pin
    # moves. Each spec-publishing consumer owns its generator behind `make openapi-contract`: some
    # run a cmd in their own tree (org-bff, platform-bff, realtime-gateway, ai, platform-identity),
    # auth-service runs auth-core's. Running that target after the pin change regenerates the spec
    # from the graph now pinned, add-paths commits it, and the drift heals inside this PR instead
    # of surfacing later as a red main (OPENAPI_DRIFT_BLOCKING) or a deploy with a stale spec.
    #
    # This step used to `go run ${MODULE}/adapters/inbound/http/openapi/cmd/openapi-contract`. That
    # path exists only in auth-core and user-core, so for every other module - platform-shared-go
    # and platform-contracts-go included, which are the releases that move the canonical
    # components - the step no-oped behind its own notice and a pin-only PR skipped the spec.
    #
    # Tolerated failure, as before: a consumer whose generator is broken still gets its bump PR,
    # and the contract gates below and in its own CI still judge the committed spec.
    - name: Regenerate OpenAPI contract from the bumped module
      if: steps.guard.outputs.skip != 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.target-path }}
      env:
        GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
        GONOSUMDB: github.com/coderaxis/*
        MODULE: ${{ inputs.module }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # `openapi-contract:` exactly, so a Makefile carrying only `openapi-contract-check:` does
        # not match. GOWORK=off so the spec is a function of go.mod, which is what the PR commits.
        if [[ -f docs/openapi.json && -f Makefile ]] && grep -qE '^openapi-contract:' Makefile; then
          GOWORK=off make openapi-contract
          echo "contract regenerated against ${MODULE} ${VERSION}"
        else
          echo "::notice::no docs/openapi.json with an openapi-contract make target; the contract gate still applies"
        fi

    - name: Test against the new pin
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.target-path }}
      env:
        GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
        # A CI runner is a pod, so KUBERNETES_SERVICE_HOST is set and platform-shared-go's
        # envutil.IsDeployed() says "deployed"; a consumer's route tests then refuse to start
        # without SERVICE_TOKEN_SECRET (v1.56+). A test process is not a deployment: blank the
        # variable for the test command only, as service-ci.yaml does (95c5ea4). The first
        # fan-out from the pool (platform-contracts-go v0.61.0, 2026-09-06) failed every
        # consumer with a router test on exactly this.
        KUBERNETES_SERVICE_HOST: ""
      run: |
        set -euo pipefail
        # Contract and integration suites are excluded here and run as their own gates: they need
        # a database or a running dependency, which a bump PR has no business standing up.
        #
        # mapfile, not `go test $(...)`: an unquoted command substitution word-splits, so a
        # package path containing a space would be passed as two broken arguments.
        #
        # -timeout: `go test` kills a test binary at 10 minutes unless told otherwise, and on the
        # self-hosted pool on the dev Docker host (~2.7x slower per core, load ~40 on 18 cores)
        # that default, not the job's timeout-minutes, fired: ai-core v0.69.0's bump of
        # voice-ai-agent-service died with "panic: test timed out after 10m0s" in one package
        # (release run 43953296586, 2026-11-16). x3 of the default, as #75 did for module-release
        # and service-ci; this step and the contract gate's 30m each stay under the calling job's
        # 90 (module-release.yaml bump-consumers), so a hung test still fails here, by name.
        mapfile -t pkgs < <(GOWORK=off go list ./... | grep -Ev '/tests/(contracts|integration)')
        [[ ${#pkgs[@]} -eq 0 ]] || GOWORK=off go test "${pkgs[@]}" -count=1 -timeout 30m

    - name: Contract gate
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.target-path }}
      env:
        GOPRIVATE: github.com/coderaxis/*,github.com/inboxxhq-coderaxis/*
        # The same blanking as "Test against the new pin", and for the same reason: contract tests
        # build the consumer's router, and envutil.IsDeployed() reads the runner pod's
        # KUBERNETES_SERVICE_HOST as a deployment, so the router refuses to start without
        # SERVICE_TOKEN_SECRET. Only the unit step had it, so every consumer with a contract
        # router passed its units and then failed here (platform-shared-go v1.60.0 fan-out,
        # 2026-09-17: customer, order, product, payment, compliance and media services).
        # service-ci.yaml's "Contract tests when present" and openapi-contract.yaml carry it too.
        KUBERNETES_SERVICE_HOST: ""
      run: |
        set -euo pipefail
        # Imports the BUMPED module and validates the committed spec against it, so DTO or
        # operationId drift fails the PR before merge rather than after deploy.
        if [[ -d tests/contracts ]]; then
          # -timeout: as "Test against the new pin" (x3 of go test's 10-minute default).
          GOWORK=off go test ./tests/contracts/... -count=1 -timeout 30m
        fi

    - name: Check out the central checkers
      if: steps.guard.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        repository: coderaxis/ci-workflows
        ref: v1
        path: .bump-central
        # controls/ carries module-floors.yaml. Without it the floor check finds no floors
        # and reports a pass, which is the one outcome a version gate must never produce.
        sparse-checkout: |
          scripts
          controls

    - name: Platform module pin policy
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.target-path }}
      env:
        REQUIRED_MODULES: ${{ inputs.required-modules }}
        BASE: ${{ inputs.base-branch }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        # Trunk-based: the bump targets main, which IS the release branch, so the strict posture
        # applies and a pseudo-version cannot land.
        case "${BASE}" in
          main|prod) MODE=prod ;;
          preprod) MODE=preprod ;;
          staging) MODE=staging ;;
          *) MODE=dev ;;
        esac
        # The floor check reads controls/module-floors.yaml, and refuses to run rather than
        # report a pass it did not verify, so PyYAML has to be present rather than assumed.
        python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --upgrade PyYAML
        python3 "${WORKSPACE}/.bump-central/scripts/check_module_pins.py" --mode "${MODE}"

    - name: Drop the central checkout
      if: always()
      shell: bash
      run: rm -rf "${{ github.workspace }}/.bump-central"

    - name: Close superseded bump PRs for this module
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        # The minted target token, not github.token: when the central release pushes a bump the
        # run's own token has no rights on the target repository at all.
        GH_TOKEN: ${{ inputs.token }}
        TARGET: ${{ inputs.target-repository }}
        SHORT: ${{ inputs.short }}
        COMPANIONS: ${{ inputs.companions }}
        NEW_BRANCH: chore/bump-${{ inputs.short }}-${{ inputs.version }}
      run: |
        set -euo pipefail
        # Leaving them open produces a stack of PRs for the same module at different versions,
        # any of which could be merged out of order and downgrade the pin. A companion's own older
        # bump PRs are superseded too: this change moves it to its newest release.
        shorts="${SHORT}"
        for c in ${COMPANIONS}; do m="${c%@*}"; shorts="${shorts} ${m##*/}"; done
        for s in ${shorts}; do
          gh pr list --repo "${TARGET}" --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"chore/bump-${s}-v\")) | select(.headRefName != \"${NEW_BRANCH}\") | .number" \
          | while read -r pr; do
              echo "closing superseded #${pr}"
              gh pr close "${pr}" --repo "${TARGET}" --delete-branch \
                --comment "Superseded by ${NEW_BRANCH}." || true
            done
        done

    - name: Decide which paths the bump may commit
      id: paths
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.target-path }}
      run: |
        set -euo pipefail
        # docs/openapi.json is named only when the consumer actually has one. add-paths reaches
        # `git add`, which fails on a pathspec matching nothing, so listing it unconditionally
        # aborted the bump for every consumer that publishes no spec — schema and library repos,
        # which is most of the graph. The regeneration step above already tests for the file;
        # this makes the commit agree with it instead of assuming the deployable case.
        {
          echo "list<<PATHS_EOF"
          echo "go.mod"
          echo "go.sum"
          if [[ -f docs/openapi.json ]]; then echo "docs/openapi.json"; fi
          echo "PATHS_EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Open the bump PR
      id: cpr
      if: steps.guard.outputs.skip != 'true'
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.token }}
        path: ${{ inputs.target-path }}
        branch: chore/bump-${{ inputs.short }}-${{ inputs.version }}
        base: ${{ inputs.base-branch }}
        delete-branch: true
        # Explicit, because the default commits every change in the workspace. A bump may only
        # move the pin and the spec regenerated from it; anything else appearing in the diff
        # means a build step wrote into the tree and belongs in its own reviewed change.
        add-paths: ${{ steps.paths.outputs.list }}
        labels: |
          dependencies
          core-modules
        title: "chore(deps): bump ${{ inputs.short }} to ${{ inputs.version }}"
        commit-message: "chore(deps): bump ${{ inputs.short }} to ${{ inputs.version }}"
        body: |
          Automated bump from the central release cascade.

          | Field | Value |
          | --- | --- |
          | Module | `${{ inputs.module }}` |
          | From | `${{ steps.guard.outputs.current || 'not pinned' }}` |
          | To | `${{ inputs.version }}` |
          | Service | `${{ inputs.service }}` |
          | Repo kind | `${{ inputs.repo-kind }}` |

          Every module moved by this change (`module from to`):

          ```
          ${{ steps.guard.outputs.moves }}
          ```

          The pins build, the unit and contract suites pass against them, and the platform pin
          policy holds. Patch and minor bumps, 0.x minors included, auto-merge once required
          checks are green; only a move across a major version (v0 to v1 and up) is labelled for
          review instead.

    # Auto-merge is what makes this automation rather than a queue of PRs nobody notices. It is
    # `--auto`, so GitHub still waits for every required check: the merge happens because the
    # gates passed, not instead of them.
    #
    # A 0.x MINOR auto-merges like any minor. It used to count as major and wait for a person,
    # because under SemVer §4 a 0.x minor MAY break. But module-release maps BOTH `feat:` and a
    # breaking change on a 0.x module to the minor, and nearly every platform module is 0.x, so
    # that rule withheld every feature release from every consumer: by 2026-11-18, 86 bump PRs
    # sat open (the oldest from 2026-08-09) and all 44 deployables lagged at least one core, e.g.
    # 33 still on platform-contracts-go v0.83.0 against v0.146.0. The version number cannot say
    # whether THIS consumer is affected; the gates above can, and this PR exists only because
    # they passed: the consumer compiles against the new pins, its unit and contract suites pass,
    # and the pin policy holds. A breaking change that touches this consumer fails them, opens no
    # PR and turns the release run red, which is the loud failure a person must act on. One that
    # does not touch it lands on the first environment, and promotion still gates the rest.
    #
    # Withheld for review: a move across a MAJOR version (v0 to v1, or later majors). That is a
    # deliberate stability commitment by the module's owner, dispatched by hand, never a side
    # effect of a commit subject (see module-release's version rule).
    - name: Auto-merge when green, or flag a major bump for review
      if: steps.guard.outputs.skip != 'true' && steps.cpr.outputs.pull-request-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TARGET: ${{ inputs.target-repository }}
        MOVES: ${{ steps.guard.outputs.moves }}
        PR: ${{ steps.cpr.outputs.pull-request-number }}
      run: |
        set -euo pipefail
        # Quoted: `patch` and `major` are also real commands (SC2209).
        tier="patch"
        while read -r mod cur new; do
          [[ -n "${mod}" ]] || continue
          cv="${cur#v}"; rv="${new#v}"
          [[ "${cv}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${rv}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
          cmaj="${cv%%.*}"; rmaj="${rv%%.*}"
          cmin="$(cut -d. -f2 <<<"${cv}")"; rmin="$(cut -d. -f2 <<<"${rv}")"
          if [[ "${rmaj}" -gt "${cmaj}" ]]; then
            tier="major"; echo "::notice::${mod} ${cur} -> ${new} crosses a major version"
          elif [[ "${tier}" == "patch" && "${rmin}" -gt "${cmin}" ]]; then
            tier="minor"
          fi
        done <<<"${MOVES}"
        echo "::notice::bump tier=${tier}"

        if [[ "${tier}" == "major" ]]; then
          # The labels are the only durable signal that this PR is waiting on a person, so they
          # are created before they are applied and their failure is reported rather than
          # swallowed. Neither was true before: the labels existed in no target repository, so
          # `gh pr edit --add-label` failed in every one of them, `|| true` hid it, and the only
          # remaining trace was a warning in a release log that nobody reads because the run is
          # green. The v0.14.0 fan-out left 48 PRs withheld for review and not one of them said
          # so - which is the same silent skew this pipeline exists to prevent, one step later.
          for label in \
            "major-bump:b60205:Crosses a major version boundary (v0 to v1 and up)" \
            "needs-manual-review:d93f0b:Auto-merge withheld deliberately; a person has to decide"; do
            gh label create "${label%%:*}" --repo "${TARGET}" \
              --color "$(cut -d: -f2 <<<"${label}")" \
              --description "$(cut -d: -f3- <<<"${label}")" >/dev/null 2>&1 || true
          done
          gh pr edit "${PR}" --repo "${TARGET}" \
            --add-label major-bump --add-label needs-manual-review \
            || echo "::warning::could not label #${PR} in ${TARGET}; it is withheld for review " \
                    "and now says so nowhere but here"
          echo "::warning::major bump: auto-merge withheld, #${PR} needs review"
          exit 0
        fi
        gh pr merge "${PR}" --repo "${TARGET}" --squash --auto \
          || echo "::notice::auto-merge unavailable (branch protection may be off); #${PR} left open"
