# Frozen contract-classification debt, enforced by scripts/check-contract-classification.py.
#
# The invariant that script enforces is that a repository publishes docs/openapi.json if and
# only if its catalog entry declares interfaces.rest. Every service listed here breaks it in
# the same direction: it publishes an OpenAPI document while declaring no REST interface.
#
# That combination is not merely untidy. service-ci.yaml gates both the `contract` job and the
# `openapi-generator` job on has_rest, which is derived from the catalog - so for all thirteen of
# these repositories the published document is validated by nothing, regenerated by nothing and
# drift-checked by nothing. They were found by writing the gate, not by anyone reading them.
#
# Every entry needs a `disposition` saying which side of the invariant will be made true, and a
# `reason` recording the evidence for that choice. An entry with neither is rejected by the
# loader, because an exemption that does not say how it ends is a permanent one.
#
#   declare-rest  the service really does serve a public HTTP API; the catalog is wrong.
#                 Adding interfaces.rest switches ON the contract and generator jobs for that
#                 repo, so it is a remediation trigger and not a paperwork change - see the
#                 sequencing note below.
#   delete-spec   no published HTTP contract remains. Per ADR-0093 rules 5 and 6, health,
#                 metrics, readiness, service-info and webhook endpoints are operational
#                 surfaces, not an API contract, so a document describing only those is
#                 deleted rather than shrunk.
#
# SEQUENCING. The nine declare-rest entries were blocked on the OpenAPI generator pipeline: the
# shared tooling/openapi/lib/swagger.sh library existed on platform-shared-go's default branch
# but was absent from the v1.19.0 release every service pinned, so `scripts/swagger.sh` could not
# resolve it and declaring interfaces.rest would have turned on a generator job that cannot run.
# That block is CLEARED - the library ships in platform-shared-go v1.20.0 and all nine repos pin
# it. Three of the nine - voice-ai-agent-service, call-routing-service and payment-service - still
# carry specs describing far more routes than their sources annotate, so regenerating them will
# shrink the document sharply and that shrink has to be reviewed as a contract change, not
# absorbed as a drift fix.
#
# The four delete-spec entries have no such dependency and can be done immediately.

version: 1
domain: contract-classification

allow:
  # ── delete-spec: the document describes only operational endpoints ──────────────────────
  # No sequencing dependency. Each of these publishes a spec whose entire content is the
  # service-info root plus health probes, which ADR-0093 rule 5 says is not an API contract.

  - service: e2ee-service
    disposition: delete-spec
    reason: >-
      The spec is / plus the three health probes, and the source mounts the service-info
      root and a health endpoint. There is no API here to contract for; the service
      declares e2ee.v1 over gRPC.

  - service: message-dispatcher-service
    disposition: delete-spec
    reason: >-
      The spec is / plus the three health probes. The repo's own ADR-0001 already records
      that `r.GET("/", ...)` registers the service-info root, so the document has described
      nothing but operational surface since it was written.

  - service: edge-gateway
    disposition: delete-spec
    reason: >-
      The nine published paths are three health probes, /metrics, and five documentation
      endpoints - /api/docs, /api/docs-json, /api/docs-status, /api/docs-json/{service} and
      /openapi.json. There is no business API in the document at all. Two questions have to
      be settled while deleting it: whether edge-gateway is the ADR-0067 portal mirror and so
      legitimately serves documentation, or whether those five routes are the API-0001
      violation they look like on any other service. Either way the answer is not a published
      OpenAPI contract describing them.

  - service: chat-search-service
    disposition: delete-spec
    reason: >-
      The four published operations are the service-info root and the three health probes,
      the same shape as e2ee-service above. Its catalog entry declared interfaces.rest and
      nothing else, which made it look like the fleet's one genuinely HTTP-only service; it
      is not. It registers no gRPC server, consumes no topic, and no edge surface routes to
      it, so after the rest declaration goes it declares no business interface on any
      transport. That is worth knowing separately - this is a deployed scaffold - but it is
      not a reason to keep publishing a contract for four operational endpoints.

  # ── delete-spec: a real HTTP surface that ADR-0094 retires ──────────────────────────────
  # These nine differ from the entries above: each publishes a substantial, genuine business
  # API. They are listed because ADR-0094 decided HTTP contracts are owned by the two BFFs and
  # by webhook receivers only, and every browser request reaches these services through a BFF
  # over gRPC. That was verified per service against the edge gateway's own surface
  # configuration - the routing rules, not the service registry - and each of the nine is the
  # target of ZERO direct edge routes. The six services that DO still hold direct edge routes
  # (notification 6, authz 5, org 4, subscription 3, payment 2, announcement 1) are
  # deliberately absent: deleting their spec would remove the published contract for a route a
  # browser is calling today, so they wait on the route migration.
  #
  # The entry ends when the repository deletes docs/openapi.json. That is not a plain `rm`:
  # nineteen of these repositories embed the file with //go:embed, so removing it is a COMPILE
  # failure, and each also carries route-coverage tests, drift scripts, an operationId lock and
  # Makefile targets that have to go coherently in the same commit.
  #
  # STILL OWED, and not hidden: platform-contracts holds an OpenAPI bundle for each of these,
  # and build_interface_index.py derives the interface index from those bundles rather than
  # from the catalog. Until the bundles go, the index names an interface the catalog no longer
  # declares. That repository is held - it carries unpushed work and publishing it triggers a
  # multi-hour downstream fan-out - so the bundles are batched into one later change instead of
  # eleven separate ones.

  - service: chat-service
    disposition: delete-spec
    reason: >-
      Thirty-one operations, reached through org-bff and platform-bff over chat.v1.ChatService.
      No edge surface routes to it directly.

  - service: compliance-service
    disposition: delete-spec
    reason: >-
      Forty-three operations over compliance.v1.ComplianceService. No direct edge routes. Note
      its ADR-0009 and CHANGELOG both claim the runtime serves this spec via
      openapiroutes.RegisterFileWithOptions in internal/bootstrap/server.go - no such file and
      no such call exist, so that documentation is stale and should be corrected, not honoured.

  - service: configuration-service
    disposition: delete-spec
    reason: >-
      Seventeen operations over configuration.v1.ConfigurationService, no direct edge routes.
      Its scripts/swagger.sh is also destructive - seventeen committed operations against zero
      @Router annotations, because the handlers live in configuration-core across a module
      boundary swag cannot cross - so the generator would empty this document if anyone ran it.
      Dropping interfaces.rest switches the generator job off, which removes that footgun as a
      consequence rather than needing a separate repair.

  - service: customer-service
    disposition: delete-spec
    reason: >-
      Fourteen operations over customer.v1.CustomerService, no direct edge routes.

  - service: ledger-service
    disposition: delete-spec
    reason: >-
      Forty-five operations over ledger.v1.LedgerService. This one has been confirmed twice
      independently as BFF-only, and the contract registry shows it has never published a
      contract at all. Same destructive generator as configuration-service: forty-five
      committed operations, zero @Router annotations.

  - service: observability-service
    disposition: delete-spec
    reason: >-
      Nine operations over observability.v1.ObservabilityService, no direct edge routes.

  - service: order-service
    disposition: delete-spec
    reason: >-
      Thirty-six operations over order.v1.OrderService, no direct edge routes. Checkout reaches
      it through org-bff.

  - service: product-service
    disposition: delete-spec
    reason: >-
      Forty-six operations over product.v1.ProductService. The edge does route /products, but
      to subscription-service and payment-service, not here.

  - service: user-service
    disposition: delete-spec
    reason: >-
      Fifty-six operations over user.v1.UserService, no direct edge routes; profile reads reach
      it through platform-bff. Its docs/openapi.go embeds the spec, so deletion is a compile
      failure until that file goes with it.

  # ── declare-rest: a real HTTP surface the catalog fails to declare ──────────────────────
  # Blocked on the generator repair described above. Route counts are from the service's own
  # sources (deployable plus core), not from the spec, because the spec is the thing in doubt.

  - service: voice-ai-agent-service
    disposition: declare-rest
    reason: >-
      Sixteen mounted API routes and a 22-path spec, so the surface is real and substantial.
      Highest-risk of the nine: the sources carry no route annotations at all, so a
      regeneration produces a near-empty document. The spec must be reconciled against the
      mounted routes before interfaces.rest is declared.

  - service: platform-identity-service
    disposition: declare-rest
    reason: >-
      Twelve mounted routes (ten API, two operational) across platform-identity-core and the
      deployable, and a 14-path spec of which eleven paths are /internal. Worth deciding
      during remediation whether the internal half belongs in a published contract at all or
      should move to proto, per ADR-0093 rule 3.

  - service: payment-service
    disposition: declare-rest
    reason: >-
      Nine mounted API routes against a 12-operation spec, similarly under-annotated.
      Payment webhooks are the part most likely to remain HTTP permanently, since the
      provider chooses the transport.

  - service: device-service
    disposition: declare-rest
    reason: >-
      Eight mounted routes (seven API, one operational) and a 12-path spec. Declares
      device.v1 over gRPC as well, so the HTTP half needs a migration decision.

  - service: presence-service
    disposition: declare-rest
    reason: >-
      Seven mounted routes (six API, one operational) and a nine-path spec. Declares
      presence.v1 over gRPC as well.

  - service: chat-sync-service
    disposition: declare-rest
    reason: >-
      Six mounted API routes and an eight-path spec. The catalog declares no gRPC interface
      for this service at all, so HTTP is currently its only interface and the spec is the
      only contract it has.

  - service: realtime-gateway
    disposition: declare-rest
    reason: >-
      Two published paths, GET /ws/stats and POST /ws/ticket, and five mounted routes. The
      ticket endpoint is how a browser obtains credentials before opening a WebSocket, so it
      is a genuine browser-facing HTTP contract however small. Unlike the two BFFs this repo
      has no scripts/swagger.sh and no route annotations, so declaring interfaces.rest needs
      a generator decision first - either annotate and adopt the shared generator, or move it
      to the openapicontract engine that owns its own gate.
