# Gateway security baseline control catalogue (declarative policy-as-code).
#
# This is the single source of WHICH gateway security invariants every gateway repository must
# uphold, and their metadata: policy, rationale, remediation, severity, scope, applicability,
# ownership and lifecycle. The catalog defines POLICY ONLY - it never describes how detection is
# implemented. Each control's `detector` key binds it to an implementation in
# scripts/check-gateway-baseline.py, which may evolve WITHOUT any change to this catalog. This
# mirrors controls/api-contract.yaml, whose shape it follows deliberately: the GW family and the
# API family are the same kind of thing, a normative RFC section paired with an executable
# detector, and neither is duplicated into the governance control registry in core-docs.
#
# `applies_when` gates a control on a per-repo capability:
#   gateway       - evaluated for repositories that are gateways or BFFs.
#   grpc-service  - evaluated for repositories that expose a gRPC server.
#
# Detection is intentionally conservative. Where repository source cannot prove that a
# legitimate implementation is present or absent, the detector reports INDETERMINATE rather
# than turning uncertainty into a violation. That rule is not caution for its own sake: two
# controls in the sibling API family (API-0015 and API-0008) were each satisfiable only by
# writing redundant code, because the detector credited exactly one way of complying and so
# made "report absent what is present" the cheaper outcome. Every control below therefore names
# what it cannot see, and no control may be satisfied by an unused import, a duplicate
# interceptor, a dead configuration key or a transport call that nothing reaches.

version: 1
domain: gateway-baseline
policy_ssot: [ADR-0095, ADR-0096, RFC-0039]

controls:
  - id: GW-0001
    title: Internet-facing gateways load the shared security baseline
    owner: platform-architecture
    scope: source
    status: active
    severity: critical
    applies_when: gateway
    policy: >-
      An internet-facing gateway imports the platform-shared-go gateway baseline package and
      calls its loader. When source does not establish whether the gateway is internet-facing,
      the detector reports INDETERMINATE rather than requiring redundant local loading in an
      internal-only gateway.
    rationale: >-
      The platform's only complete gateway security configuration is five maps local to the edge
      gateway, while every other gateway carries zero or one configuration file, so a new gateway
      inherits nothing and the baseline is an accident of which deployable grew first.
      Inheritance has to be a property of the binary rather than of a copy someone remembered to
      make, which is why the evidence is an import AND a loader call: an import alone is a
      dependency, not an adoption, and crediting it would let a gateway satisfy a critical
      control with an unused line. This control asks only whether the shared baseline was
      adopted. Whether the gateway ALSO keeps a local copy is GW-0002's question, and an earlier
      revision that answered both here reported the same five files as violations of two controls
      at once while describing GW-0001's evidence as a symptom of shadowing rather than the
      absence of adoption it is named for.
    remediation: >-
      Import the shared gateway baseline package and call its loader during configuration
      assembly, then delete the repository-local copies of the baseline-owned files. If this
      gateway is internal-only and the control reports INDETERMINATE, that verdict is correct and
      needs no code: the residue belongs to review, and adding a second loader call to satisfy a
      scanner is not conforming evidence.
    detector: shared_baseline_loaded
    refs: [ADR-0096, RFC-0039]

  - id: GW-0002
    title: Gateways do not redefine baseline-owned policy
    owner: platform-architecture
    scope: source
    status: active
    severity: major
    applies_when: gateway
    policy: >-
      A gateway does not redefine the top-level auth, authz, headers, ratelimit or security maps
      in its global defaults layer. An override is permitted only when
      gateway-baseline-exceptions.yaml declares the key and a non-empty reason. Parsed YAML is
      inspected so comments and nested keys are not mistaken for policy definitions.
    rationale: >-
      Scope is the load-bearing decision in this control, and getting it wrong in either
      direction is costly. Reading every YAML file in the repository - the first implementation -
      reported 174 violations on the edge gateway, of which 159 were per-surface routing files
      and 10 were environment overlays. A control answerable only by writing 169 exception
      entries measures nothing, and it is the same defect shape as a control satisfiable only by
      redundant code. Two layers are therefore out of scope on the gateway's own documented
      design: config/surfaces/** is per-route policy, where a surface declaring auth not required
      for a signature-checked third-party webhook is a routing decision about one path rather
      than a redefinition of how the gateway authenticates; and config/environments/** is the
      override layer the gateway's loader itself sanctions. What remains in scope is the global
      defaults layer, including loose files directly under config/, so a shadowing map cannot
      escape by moving one directory up.
    remediation: >-
      Delete the local map and take the value from the shared baseline. Where a gateway genuinely
      needs to differ, add the key to gateway-baseline-exceptions.yaml with a reason that says why
      this gateway is not the general case - the reason is the reviewable artifact, so an entry
      whose reason restates the key is not an exception but a silencer.
    detector: no_local_policy_redefinition
    refs: [ADR-0096, RFC-0039]

  - id: GW-0003
    title: Gateways meet the shared baseline module floor
    owner: platform-architecture
    scope: manifest
    status: active
    severity: major
    applies_when: gateway
    policy: >-
      A gateway directly pins github.com/coderaxis/platform-shared-go at or above the
      gateway-baseline floor in controls/module-floors.yaml. An absent, replaced, pseudo-version
      or otherwise uncomparable pin is a violation rather than an assumed pass.
    rationale: >-
      Embedding the baseline makes the module version the record of which policy vintage a
      gateway inherited, and that record is only worth reading if something enforces a minimum.
      A floor rather than an exact pin is the existing platform position, argued in
      module-floors.yaml's own header: a floor states the vintage the fleet agreed on while
      leaving a repository free to move ahead, whereas an exact pin turns every shared-module
      release into a fleet-wide breaking change. An uncomparable pin fails rather than passes
      because the question this control asks - is this gateway at least as new as the agreed
      baseline - has no answer for a replace directive or a pseudo-version, and answering an
      unanswerable question with a pass is how a stale gateway becomes invisible.
    remediation: >-
      Bump github.com/coderaxis/platform-shared-go to the floor or above and rebuild. Do not
      lower the floor to match a lagging repository: the floor is the fleet's agreed vintage, and
      moving it to accommodate the oldest consumer inverts the control.
    detector: module_floor
    refs: [ADR-0096, RFC-0039]

  - id: GW-0004
    title: Protocol traffic terminates at its protocol gateway
    owner: platform-architecture
    scope: config
    status: active
    severity: critical
    applies_when: gateway
    policy: >-
      No surface routing rule marked websocket: true may name another gateway as its upstream.
      Gateway upstreams are established from service-registry classifications and gateway names;
      an unresolved dynamic upstream is INDETERMINATE rather than guessed.
    rationale: >-
      This is the control that would have caught the existing WebSocket tunnel, and it is written
      against a measured cost rather than a preference. Because the edge fronts a protocol it does
      not terminate, one connected client occupies two sockets, two goroutines and two buffered
      readers on the edge plus one socket on the terminating gateway, which makes concurrent
      connection count rather than request rate the sizing unit for the entire gateway tier. The
      rule is deliberately narrow: it decides declarative surface rules, because those are the
      artifact a reviewer and a detector can both read. A hand-rolled proxy outside the governed
      surface configuration is invisible here and is named as review's responsibility, since the
      alternative - inferring proxying from source - would reward adding a redundant surface rule
      to make custom code detectable.
    remediation: >-
      Terminate the protocol at its own gateway behind its own hostname and reduce the edge to
      minting a short-lived signed ticket that the terminating gateway validates on connect. Do
      not satisfy this control by removing the websocket marker from a rule that still proxies:
      the marker is how the tunnel is declared, and deleting it hides the surface instead of
      moving it.
    detector: protocol_gateway_proxy
    refs: [ADR-0095, RFC-0039]

  - id: GW-0005
    title: Long-lived connections have timeout and concurrency bounds
    owner: platform-architecture
    scope: source
    status: active
    severity: major
    applies_when: gateway
    policy: >-
      Every long-lived connection surface declares both an idle timeout and a maximum concurrent
      connection cap. A bidirectional io.Copy tunnel without a read deadline is a violation.
      Pooled HTTP transport MaxConnsPerHost is not credited for a hijacked connection. If a
      long-lived implementation is found but source cannot correlate its limits confidently, the
      detector reports INDETERMINATE.
    rationale: >-
      Both bounds are absent from the measured tunnel, and the reason they look present is
      exactly why this control refuses to credit them. The only cap in the proxy,
      MaxConnsPerHost, belongs to the pooled HTTP transport and has no effect on a hijacked
      connection, so a reader auditing the file finds a limit that does not apply to the path
      that needs one. Neither copy direction sets a read deadline, which means a peer that
      disappears without closing - a dropped NAT mapping, a lost radio - holds its sockets
      indefinitely; at scale that does not present as an error but as unexplained memory growth,
      the hardest class of failure to attribute. The control requires two bounds rather than one
      because they fail differently: a timeout reclaims a connection nobody is using, and a cap
      is what stops a healthy surge from exhausting file descriptors.
    remediation: >-
      Set a read or idle deadline on the connection and a maximum concurrent connection count on
      the terminating side, where the connection actually lives. The durations and the cap are
      capacity decisions owned by that gateway and this control does not prescribe them. A generic
      HTTP client timeout is not a substitute for an upgraded or hijacked connection.
    detector: bounded_long_lived_connections
    refs: [ADR-0095, RFC-0039]

  - id: GW-0006
    title: Authentication decisions use gRPC
    owner: platform-architecture
    scope: config
    status: active
    severity: critical
    # Gateways AND whichever repository declares the shared baseline, because this control
    # is about the CONTENT of the perimeter and the content moved. When edge-gateway
    # adopted the shared baseline and deleted its local policy files, this control went
    # from reporting two HTTP decision hops to reporting clean with nothing fixed: the
    # hops had moved to platform-shared-go, which satisfies neither `gateway` nor
    # `grpc-service` and so skipped all eight controls. Scoped to gateways alone, a
    # critical control is silenced by centralising the policy it inspects.
    applies_when: gateway-or-baseline-owner
    policy: >-
      Authentication validation and authorization checks use gRPC. A configured auth
      validate_endpoint or authz check_endpoint whose value is an HTTP URL or URL path is a
      violation. Unparseable or dynamically generated configuration is INDETERMINATE.
    rationale: >-
      The two most security-critical hops the platform makes are configured as HTTP paths while
      the gRPC capability for both already exists and is widely imported - 21 files import the
      authz protobuf package and 15 import the auth one. So this is not a migration that needs
      building but a configuration pointing away from what is already there, which is the kind of
      gap that survives review precisely because the code looks correct. It also matters more
      here than elsewhere: service-to-service communication on this platform is gRPC and HTTP is
      an edge concern, so an internal HTTP hop for an authentication decision is both a policy
      exception and the hop where an unauthenticated fallback would be most damaging.
    remediation: >-
      Point the auth validate and authz check configuration at the gRPC target and remove the
      HTTP fallback path rather than leaving it as a preferred-but-secondary route. A fallback
      that remains reachable is the transport this control is about, whichever path is tried
      first.
    detector: grpc_decision_hops
    refs: [ADR-0095, RFC-0039]

  - id: GW-0007
    title: gRPC services enforce authentication and authorization
    owner: platform-architecture
    scope: source
    status: active
    severity: critical
    applies_when: grpc-service
    policy: >-
      A service exposing gRPC enforces authentication and authorization in its server interceptor
      chain. The shared grpcx server runtime and shared gRPC server bootstrap are credited because
      they install both controls centrally; explicit unary and stream chains are also credited
      when both controls are visible. A custom server assembly whose interceptor behaviour cannot
      be established from repository source is INDETERMINATE.
    rationale: >-
      Where a service does not enforce for itself, the gateway is the only thing between a caller
      and the data, which is the whole of the defence-in-depth argument. Enforcement is required
      in the interceptor chain rather than per handler for two reasons: a per-handler rule makes
      repeating an authorization call in every method the cheapest route to a green verdict, and
      it still leaves the next RPC anyone adds exposed by default. The census taken by running
      this detector over all 123 repositories found 31 declaring a gRPC server, 24 provably
      enforcing both decisions, zero measured violations and seven INDETERMINATE. The seven are
      recorded as unresolved rather than as gaps because the detector could not see a server
      assembly, which is a different finding from a server assembled without enforcement: in some
      the assembly lives in a sibling core module this per-repository scan does not read, and in
      others the service contract advertises a gRPC port for a server the repository never
      registers.
    remediation: >-
      Install authentication and authorization in the server's unary AND stream interceptor
      chains, or adopt the shared gRPC server runtime that installs both. For an INDETERMINATE
      verdict, establish which case it is before writing code: if the assembly is in a sibling
      module the detector's reach is what needs widening, and if the contract declares a server
      that does not exist the contract is what needs correcting. Adding an interceptor to a
      service that already enforces somewhere the scan could not reach is not a fix.
    detector: grpc_interceptor_security
    refs: [ADR-0088, ADR-0089, RFC-0039]

  - id: GW-0008
    title: Gateway backend hops use TLS
    owner: platform-architecture
    scope: source
    status: active
    severity: major
    applies_when: gateway
    policy: >-
      Gateway-to-backend connections use TLS. A live-code net.Dial or net.DialTimeout call to a
      backend, upstream, service or target host is a violation. Commented examples are ignored,
      and a raw dial whose destination cannot be classified from source is INDETERMINATE rather
      than guessed.
    rationale: >-
      The measured WebSocket tunnel reaches its backend with a raw TCP dial, and the reason that
      is a defect rather than a limitation is that the platform already ships gRPC TLS
      credentials with certificate reload and a TLS 1.3 minimum. Encrypted internal transport is
      an existing capability, so a plaintext hop is an inconsistency between two paths in the
      same system rather than a feature nobody built yet. Comments are excluded explicitly
      because matching inside them has already produced false positives twice in the sibling API
      family, and a control that flags an example in a doc comment teaches people to delete
      documentation.
    remediation: >-
      Dial the backend through a TLS-aware constructor. If a hop genuinely must stay plaintext -
      a loopback or in-process destination, say - that is an INDETERMINATE the detector cannot
      settle and a reviewer should; a TLS dial added beside the plaintext one, which nothing
      reaches, is not evidence.
    detector: tls_backend_hops
    refs: [ADR-0088, RFC-0039]
