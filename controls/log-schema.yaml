# Log record schema - the machine-readable form of the log record contract.
#
# WHY THIS FILE EXISTS
# --------------------
# The platform previously stated its log schema only as a Markdown table, and that table had
# never matched a single emitted log line. It required `timestamp` and `message`; every service
# emitted `time` and `msg`, because that is what logrus.JSONFormatter writes by default. The
# shared conformance test asserted `line["msg"]`, so the test encoded the violation and passed.
# `org_id` was required by the same table, carried by reqcontext.Scope, and never stamped.
#
# None of that was a discipline failure. Prose cannot be diffed against an emitted line. This
# file is the diffable form: one registry, three consumers.
#
#   1. platform-shared-go/logging - mirrors this registry in schema.go; conformance_test.go
#      asserts EMITTED LINES against it, and check-log-schema.py asserts the mirror is faithful.
#   2. Grafana Alloy - derives its structured-metadata promotion allowlist from `loki: meta`.
#   3. docs governance (DOC-0025) - the allowlist of files permitted to state a logging rule.
#
# A field's PII class and Loki tier are properties OF THE FIELD, declared once here, rather
# than properties of whichever code path happens to emit it. That is the whole reason a
# registry beats a convention: a second emitter of `http_target` inherits `pii: mask` without
# anyone remembering to apply it.
#
# HUMAN SSOT
# ----------
# docs/core-docs/standards/observability/log-schema-standard.md is the normative document; this
# file is its machine-readable twin and MUST change in the same pull request. `version` below
# is the on-the-wire `schema_version` and MUST equal that document's `log_schema_version`
# frontmatter key. check-log-schema.py fails the build when they diverge.
#
# CHANGING THIS FILE
# ------------------
# Adding an optional field or an event_name value is additive and does not bump `version`.
# Renaming a field, removing one, narrowing a type, or moving a field between Loki tiers DOES
# bump it, and commits both shapes to being simultaneously ingestable for one full retention
# period - records already in Loki cannot be rewritten. See the standard, section 8.

version: 1
domain: observability
policy_ssot:
  - standards/observability/log-schema-standard.md
  - ADR-0101

# ---------------------------------------------------------------------------------------------
# Transport - properties of the byte stream, not of any one field.
# ---------------------------------------------------------------------------------------------
transport:
  encoding: json
  framing: single-line
  stream: stdout
  timestamp_format: RFC3339Nano
  timezone: UTC # emitted value MUST end in "Z"; asserted under a non-UTC TZ
  # text is interactive local use only. Deployment manifests MUST NOT set LOG_FORMAT=text.
  permitted_formats: [json, text]
  default_format: json
  default_level: info

# ---------------------------------------------------------------------------------------------
# Field registry.
#
#   presence: always | scoped | record | optional
#     always  - on every record without exception
#     scoped  - whenever the value is in scope; omitted otherwise
#     record  - only on records of a particular kind (see `records` below)
#     optional- emitter's choice
#
#   pii: none | mask | drop
#     none - emitted verbatim
#     mask - partially revealed (j***@acme.com, ***1234)
#     drop - key AND value removed from the record entirely
#
#   loki: label | meta | body
#     label - Loki index label; bounded, long-lived, set by the collector. Adding one is a
#             permanent change to storage shape and requires platform-sre review.
#     meta  - Loki structured metadata; filterable without a parser, bloom-accelerated,
#             outside the stream index. The home for high-cardinality join keys.
#     body  - present in the JSON line only.
#
#   owner: application | collector
#     A field has exactly one writer. Two writers means a conflict with no resolution rule.
# ---------------------------------------------------------------------------------------------
fields:
  # --- core envelope ---------------------------------------------------------------------
  - name: timestamp
    type: string
    presence: always
    pii: none
    loki: body
    owner: application
    notes: RFC 3339 nanosecond precision, UTC, always ends in Z.

  - name: level
    type: string
    presence: always
    pii: none
    loki: meta
    owner: application
    enum: [debug, info, warn, error]
    notes: >-
      Structured metadata rather than an index label: a label would split every service into
      four streams, quadrupling chunk count so that a query about all levels loads four times
      the chunks. Promoting the explicit value also makes Loki's detected_level exact rather
      than heuristic.

  - name: message
    type: string
    presence: always
    pii: none
    loki: body
    owner: application
    notes: >-
      Constant per call site. An interpolated message defeats line filters, defeats
      sum by (message), and is the commonest way an id reaches an undeclared field.

  - name: service
    type: string
    presence: always
    pii: none
    loki: body
    owner: application
    notes: >-
      MUST equal the service_name index label. One value in three places - SERVICE_NAME, the
      Kubernetes app.kubernetes.io/name label, and the catalog service id. Collapses to
      service.name on OTLP export.

  - name: schema_version
    type: integer
    presence: always
    pii: none
    loki: meta
    owner: application
    notes: Equals `version` at the top of this file.

  - name: service_version
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    notes: >-
      The build identity of the running process, on lifecycle records only. It is what makes
      service_started answer "which build is this" rather than merely "something restarted", and it
      is the join between a behaviour change and the deploy that caused it. Required on the
      lifecycle records for that reason: those two records carry no other payload, and a record
      kind whose whole content is the envelope is a name rather than a contract.

  - name: event_name
    type: string
    presence: record
    pii: none
    loki: meta
    owner: application
    notes: >-
      Names the kind of LOG RECORD, from the closed `records` vocabulary below. Distinct from
      event_type, which names a domain event. A publish line carries both.

  - name: logger
    type: string
    presence: optional
    pii: none
    loki: body
    owner: application
    notes: Emitting subsystem, e.g. outbox.relay.

  # --- correlation -----------------------------------------------------------------------
  - name: trace_id
    type: string
    presence: scoped
    pii: none
    loki: meta
    owner: application
    notes: 32 hex chars from the active OTel span. The Loki-to-Tempo join key.

  - name: span_id
    type: string
    presence: scoped
    pii: none
    loki: meta
    owner: application

  - name: correlation_id
    type: string
    presence: scoped
    pii: none
    loki: meta
    owner: application
    notes: The business thread, stable across a whole workflow.

  - name: request_id
    type: string
    presence: scoped
    pii: none
    loki: meta
    owner: application
    notes: Unique per inbound request hop.

  - name: causation_id
    type: string
    presence: scoped
    pii: none
    loki: body
    owner: application

  # --- tenant and actor ------------------------------------------------------------------
  - name: org_id
    type: string
    presence: scoped
    pii: none
    loki: meta
    owner: application
    notes: >-
      Structured metadata, never a label - tenant count is unbounded over the life of the
      platform, which is the same reason observability-standards forbids it as a metric label.

  - name: actor_type
    type: string
    presence: scoped
    pii: none
    loki: body
    owner: application
    enum: [user, service, system, api_key]

  - name: actor_id
    type: string
    presence: scoped
    pii: none
    loki: body
    owner: application
    notes: Opaque id. Never an email, phone, or display name.

  - name: user_id
    type: string
    presence: scoped
    pii: none
    loki: body
    owner: application

  # --- error -----------------------------------------------------------------------------
  - name: error
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    notes: The error message. Alert on error_code instead - a message is prose that gets reworded.

  - name: error_code
    type: string
    presence: optional
    pii: none
    loki: meta
    owner: application
    notes: Stable machine code from common.v1.ErrorCode.

  - name: error_kind
    type: string
    presence: optional
    pii: none
    loki: body
    owner: application

  - name: stack
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    notes: >-
      Panic records only, and deliberately never promoted. Loki enforces per-line structured
      metadata size limits and a stack trace is the one field large enough to breach them;
      promoting it would cause ingest rejection of exactly the records an incident needs.

  # --- http ------------------------------------------------------------------------------
  - name: http_method
    type: string
    presence: record
    pii: none
    loki: body
    owner: application

  - name: http_route
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    notes: >-
      Templated route only (/orders/{id}); empty string when the router did not match. Safe to
      aggregate on precisely because it can be empty rather than falling back to a raw path.

  - name: http_target
    type: string
    presence: record
    pii: mask
    loki: body
    owner: application
    notes: >-
      Concrete request path with the query string stripped. Split from http_route because one
      field that held the template on a match and the raw path on a miss meant two things, and
      put an unbounded PII-bearing value into the field dashboards group by - on 404s and
      scanner traffic, where raw paths are most hostile.

  - name: http_status_code
    type: integer
    presence: record
    pii: none
    loki: body
    owner: application

  - name: http_duration_ms
    type: float
    presence: record
    pii: none
    loki: body
    owner: application
    notes: >-
      Float. The prior integer truncation recorded every sub-millisecond request as 0, which is
      most cache hits and every health probe.

  - name: http_request_bytes
    type: integer
    presence: optional
    pii: none
    loki: body
    owner: application

  - name: http_response_bytes
    type: integer
    presence: optional
    pii: none
    loki: body
    owner: application

  - name: client_ip
    type: string
    presence: record
    pii: mask
    loki: body
    owner: application

  - name: user_agent
    type: string
    presence: record
    pii: none
    loki: body
    owner: application

  # --- rpc -------------------------------------------------------------------------------
  # Named for OpenTelemetry's `rpc.*` group, for the same reason the HTTP fields are named for
  # `http.*`: these collapse to the semconv attribute on OTLP export and a second name would have
  # to be translated somewhere.
  #
  # This group is new in the record-kind catalog and it replaces a shipped emitter that used the
  # key `event` and the value `grpc_request_completed` - neither of which this file declared, on
  # roughly 27 service roots.
  - name: rpc_method
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    notes: >-
      The fully-qualified method, /authz.v1.AuthzService/CheckPermission. Bounded by the generated
      service surface and safe to aggregate on, which is what makes it the gRPC counterpart of
      http_route rather than of http_target.

  - name: rpc_grpc_status_code
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    enum: [OK, Canceled, Unknown, InvalidArgument, DeadlineExceeded, NotFound, AlreadyExists,
           PermissionDenied, ResourceExhausted, FailedPrecondition, Aborted, OutOfRange,
           Unimplemented, Internal, Unavailable, DataLoss, Unauthenticated]
    notes: >-
      The canonical status name rather than its integer. gRPC's numeric codes are stable but nobody
      reads a dashboard that says 7. The casing is grpc-go's own `codes.Code.String()` output, which
      is Go camelCase and spells the second value `Canceled` with one L - the enum records what the
      emitter actually produces rather than a tidier spelling a query would then never match.

  - name: rpc_duration_ms
    type: float
    presence: record
    pii: none
    loki: body
    owner: application
    notes: >-
      Float, for the reason http_duration_ms is. The emitter this replaces used
      `time.Since(start).Milliseconds()`, the same integer truncation the HTTP path removed, and an
      in-cluster gRPC call is far more often sub-millisecond than an HTTP request is.

  - name: rpc_stream
    type: boolean
    presence: optional
    pii: none
    loki: body
    owner: application
    notes: True when the call was streaming. Absent means unary.

  # --- jobs ------------------------------------------------------------------------------
  - name: job_name
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    notes: Stable identifier of the schedule or worker, not a per-run id.

  - name: job_duration_ms
    type: float
    presence: record
    pii: none
    loki: body
    owner: application

  - name: job_outcome
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    enum: [success, failure]
    notes: >-
      Carried on job_completed rather than split into a separate job_failed record kind, which is
      the same shape as http_request_completed carrying http_status_code instead of there being an
      http_request_failed. One kind per lifecycle transition, outcome as a field: a dashboard that
      wants the failure rate divides two counts of one kind instead of joining two kinds.

  # --- security --------------------------------------------------------------------------
  # Authentication and session events. Before the catalog these were emitted by
  # platform-identity under the undeclared key `event`, which meant the platform's
  # highest-consequence records were the ones no query could reach at index speed.
  #
  # One record kind with a typed subject field, not one kind per occurrence. That is the same split
  # already made for messaging - event_published names the record, event_type names the domain
  # event - and it keeps the closed vocabulary small enough to enumerate while leaving room for a
  # thirteenth authentication event that is not an architectural change.
  - name: security_event_type
    type: string
    presence: record
    pii: none
    loki: meta
    owner: application
    notes: >-
      The specific occurrence, e.g. platform.token.reuse_detected. Promoted because "every token
      reuse across the fleet in the last hour" is the question this family exists to answer, and
      parsing every line first is the slow path.

      Deliberately un-enumerated here. The vocabulary belongs to the emitting service and
      platform-identity's is already fixed in three places - its service.contract.yaml, the
      platform_security_events table, and EVENT_REFERENCE.md. A fourth copy in this file would be a
      second spelling of the same twelve events, and the Loki query would stop matching the SQL one
      the first time they drifted. The values are verbatim what the row carries, so both sides of an
      investigation filter on one string.

  - name: security_outcome
    type: string
    presence: record
    pii: none
    loki: meta
    owner: application
    enum: [success, failure]
    notes: >-
      Promoted alongside security_event_type because the alert is almost always on the failure half
      of a type, and a filter that has to parse to find it reads the whole chunk.

  - name: security_reason
    type: string
    presence: optional
    pii: none
    loki: body
    owner: application
    notes: >-
      Why the outcome was what it was. Constant per call site like `message`: it is a classification
      such as `refresh token replayed after rotation`, never an interpolated string carrying an id.

  # --- messaging -------------------------------------------------------------------------
  - name: messaging_system
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    enum: [kafka, rabbitmq, outbox]

  - name: messaging_destination
    type: string
    presence: record
    pii: none
    loki: body
    owner: application

  - name: messaging_operation
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    enum: [publish, receive, process, dlq]

  - name: event_type
    type: string
    presence: record
    pii: none
    loki: meta
    owner: application
    notes: >-
      The DOMAIN event type (contact.created.v1). Promoted because "every log line touching this
      event type across all services" is a routine question during an event-flow incident, and
      parsing every line first is the slow path.

  - name: event_id
    type: string
    presence: record
    pii: none
    loki: body
    owner: application
    notes: UUIDv7, fresh per physical event row (ADR-0071).

  - name: idempotency_key
    type: string
    presence: optional
    pii: none
    loki: body
    owner: application
    notes: Deterministic UUIDv5 identifying the logical occurrence (ADR-0071).

  - name: aggregate_type
    type: string
    presence: optional
    pii: none
    loki: body
    owner: application

  - name: aggregate_id
    type: string
    presence: optional
    pii: none
    loki: body
    owner: application

  - name: partition
    type: integer
    presence: optional
    pii: none
    loki: body
    owner: application

  - name: offset
    type: integer
    presence: optional
    pii: none
    loki: body
    owner: application

  - name: delivery_attempt
    type: integer
    presence: optional
    pii: none
    loki: body
    owner: application
    notes: 1-based. Greater than 1 is the shape of a stuck consumer.

  # --- collector-owned -------------------------------------------------------------------
  # A service MUST NOT emit any of these. The process does not reliably know them (the Downward
  # API is per-manifest and silently absent when omitted), two writers means a conflict with no
  # resolution rule, and Alloy reads them from the Kubernetes API for free.
  - name: cluster
    type: string
    presence: always
    pii: none
    loki: label
    owner: collector

  - name: environment
    type: string
    presence: always
    pii: none
    loki: label
    owner: collector
    enum: [local, dev, staging, preprod, production]

  - name: namespace
    type: string
    presence: always
    pii: none
    loki: label
    owner: collector

  - name: service_name
    type: string
    presence: always
    pii: none
    loki: label
    owner: collector
    notes: From the Kubernetes app.kubernetes.io/name label. MUST equal the body `service` field.

  - name: container
    type: string
    presence: always
    pii: none
    loki: label
    owner: collector

  - name: pod
    type: string
    presence: always
    pii: none
    loki: meta
    owner: collector
    notes: >-
      Deliberately NOT an index label even though Loki's defaults still include it. Pod names
      change on every deploy, so a pod label multiplies stream count by the deploy rate and
      fragments a service's history into thousands of short streams. Grafana's guidance for new
      installations is to move k8s.pod.name out of index labels; this platform starts there.

  - name: node
    type: string
    presence: always
    pii: none
    loki: meta
    owner: collector

  - name: stream
    type: string
    presence: always
    pii: none
    loki: meta
    owner: collector
    enum: [stdout, stderr]
    notes: >-
      The container runtime's stdout/stderr split, which the CRI stage recovers from the log
      envelope. Two values, so it is bounded enough to be an index label and is deliberately not
      one: it would double the stream count for a distinction no routine query makes, because
      ADR-0101 puts every conforming record on stdout. Kept because that is exactly what makes it
      worth searching - a line on stderr is something writing around the logger, usually a runtime
      panic or the runtime itself, and `stream="stderr"` is the query that finds them.

# ---------------------------------------------------------------------------------------------
# Closed vocabulary for event_name. A closed set is what lets a dashboard enumerate record kinds
# instead of discovering them. Adding a value is additive and does not bump `version`.
#
# `event_name` IS THE ONLY RECORD-KIND DISCRIMINATOR. A record does not carry its kind under
# `event`, `kind`, `log_type` or any other key. This is stated because it was violated: an emitter
# on roughly 27 service roots wrote `event: grpc_request_completed`, and because `event` is not in
# the promotion allowlist below, the kind of the platform's second most numerous record was
# unreachable without a parser. check-log-record-kinds.py rule 1 now makes that a build failure.
# See Core ADR-0104.
#
# `constructor` names the Go type in platform-shared-go/logging that produces the record. It is not
# documentation: check-log-schema.py asserts the type exists and implements the closed Record
# interface, and check-log-record-kinds.py asserts the fleet reaches every kind through it. A kind
# with no constructor is a name, which is what nine of these were.
#
# `requires` is never empty. A kind whose only content is the envelope cannot support an alert, and
# five of these previously declared no fields at all - so `grpc_call_completed` was satisfied by a
# record that said nothing about which call, how long it took, or whether it succeeded.
# ---------------------------------------------------------------------------------------------
records:
  - name: http_request_completed
    emitted_by: shared access-log middleware
    constructor: HTTPRequestCompleted
    requires: [http_method, http_route, http_target, http_status_code, http_duration_ms, client_ip, user_agent]
  - name: http_request_panicked
    emitted_by: shared recovery middleware
    constructor: HTTPRequestPanicked
    requires: [http_method, http_route, stack]
  - name: grpc_call_completed
    emitted_by: shared gRPC interceptor
    constructor: GRPCCallCompleted
    requires: [rpc_method, rpc_grpc_status_code, rpc_duration_ms]
  - name: event_published
    emitted_by: outbox relay and producers
    constructor: EventPublishedRecord
    requires: [messaging_system, messaging_destination, messaging_operation, event_type, event_id]
  - name: event_consumed
    emitted_by: consumers
    constructor: EventConsumedRecord
    requires: [messaging_system, messaging_destination, messaging_operation, event_type, event_id]
  - name: event_dropped
    emitted_by: consumers, on DLQ routing
    constructor: EventDroppedRecord
    requires: [messaging_system, messaging_destination, event_type, error]
  - name: job_started
    emitted_by: scheduled and background jobs
    constructor: JobStarted
    requires: [job_name]
  - name: job_completed
    emitted_by: scheduled and background jobs
    constructor: JobCompleted
    requires: [job_name, job_duration_ms, job_outcome]
  - name: service_started
    emitted_by: bootstrap
    constructor: ServiceStarted
    requires: [service_version]
  - name: service_stopped
    emitted_by: graceful shutdown
    constructor: ServiceStopped
    requires: [service_version]
  # There is no deprecated_endpoint kind. ADR-0037 requires Deprecation and Sunset headers and a
  # log line per call to a deprecated route, and none of it was built: no middleware exists in the
  # shared module or in any service, and no Go file in the fleet sets either header. Declaring the
  # kind made this vocabulary claim an observation the platform cannot produce - which is the exact
  # defect ADR-0104 exists to remove. It returns in the change that builds the middleware.
  - name: security_event
    emitted_by: platform-identity authentication and session handling
    constructor: SecurityEvent
    requires: [security_event_type, security_outcome, client_ip]

# ---------------------------------------------------------------------------------------------
# Adoption ratchet, read by check-log-record-kinds.py.
#
# Everything above this line is a statement about the schema, and every check on it compares two
# descriptions of the schema to each other. This block is the only part of the file that makes a
# claim about the FLEET, and it exists because that was the missing half: for the life of schema
# v1 the vocabulary declared eleven kinds, two had emitters, and no build ever failed - because
# nothing in CI had ever looked at a service.
#
# `pending` is every kind the fleet does not emit yet. The list MAY ONLY SHRINK. A kind on it that
# gains a call site fails the build until it is removed, and a kind not on it that has no call site
# fails the build outright. That direction is deliberate: the failure mode being prevented is a
# vocabulary that grows faster than its emitters, so the ratchet makes adding a kind without
# adopting it a visible, dated debt rather than a silent one.
# ---------------------------------------------------------------------------------------------
adoption:
  # Every remaining entry is blocked on the same thing, and it is worth naming because it is an
  # ordering constraint rather than a backlog. These kinds are emitted by code in OTHER repositories
  # - the CDC relay in event-gateway-core, ten worker loops in the *-core modules, a dozen bespoke
  # Kafka consumers - and every one of those repositories reaches logging.Emit through a pinned
  # module version. The symbol does not exist in v1.31.2. So the emitters cannot be written until
  # platform-shared-go is released and each consumer is bumped, and this list is what holds that
  # window open honestly instead of letting a half-adopted vocabulary look finished.
  #
  # service_started and service_stopped came off the list by being wired into foundation.New and
  # foundation.Close, which every service already calls - one emitter for the whole fleet.
  #
  # event_consumed and event_dropped came off the same way, and for a reason worth recording: they
  # were blocked not by the release ordering above but by the shape of events.ConsumerLogger, which
  # took no context. The one component whose job is to carry correlation from a message header into
  # the work it triggers logged through an interface with nowhere to put it. Collapsing that
  # interface onto logging.Logger made both kinds emittable from the shared consumer, which is one
  # emitter for every service that consumes from Kafka through it.
  pending:
    - event_published
    - job_started
    - job_completed

  # Files permitted to use the bare key `event` in a map literal. `event` is banned as a log field
  # because it was the platform's second record-kind discriminator, unpromoted and undeclared; these
  # are the places where the identifier means something else entirely - a provider's webhook payload
  # field, a websocket frame type on the wire, a chat message's metadata, or a column in the audit
  # table. None of them reach a log line, and renaming them would change a contract with a consumer
  # that has nothing to do with logging.
  event_key_allowlist:
    - services/communication/inboxxhq-communication-service/internal/adapters/inbound/http/webhook_handler.go
    - services/voice-ai-agent/inboxxhq-voice-ai-agent-service/internal/adapters/inbound/http/voice_stream_bridge.go
    - gateways/inboxxhq-realtime-gateway/internal/adapters/inbound/ws/hub.go
    # Chat message metadata, sent to the chat service and rendered in a thread.
    - gateways/inboxxhq-voice-gateway/internal/adapters/inbound/http/webhook_handler.go
    - gateways/inboxxhq-voice-gateway/internal/adapters/inbound/http/call_handler.go
    # Audit detail persisted as a JSON column, not a log field.
    - services/org/org-core/application/commands/onboarding_commands.go
    - services/org/org-core/application/command/onboarding/register_org_usecase.go

# ---------------------------------------------------------------------------------------------
# Sole implementations.
#
# The access records - one per request, per call - are not written at call sites. They are written
# by middleware, and middleware is copied. Before this block the fleet held thirteen implementations
# of the gRPC access log: the shared one, which runs, and twelve per-service copies, which did not.
# All twelve were unreachable, every one of them had passing unit tests, and every one emitted a
# shape the catalogue does not describe - `method` instead of rpc_method, an integer millisecond
# that rounds a sub-millisecond in-cluster call to 0, a raw `path` and even a raw `query` where the
# schema requires the query string stripped.
#
# Dead code with passing tests is worse than dead code, because the tests are what make it look
# maintained. It is also how the duplicate comes back: the next author greps for
# UnaryLoggingInterceptor, finds the copy next door rather than the shared one, and follows it.
#
# So a record kind that is emitted by shared infrastructure has exactly one implementation, and this
# block names where. A function matching one of these shapes, declared outside its owner, fails the
# build - whether or not anything calls it.
# ---------------------------------------------------------------------------------------------
sole_implementations:
  emitters:
    - record: grpc_call_completed
      owner: shared/platform-shared-go/platform/grpccommon
      name_pattern: '\w*(LoggingInterceptor|AccessLogInterceptor)'

    - record: http_request_completed
      owner: shared/platform-shared-go/platform/ginmiddleware
      name_pattern: '\w*(AccessLog|RequestLog|LoggingMiddleware|LoggerMiddleware)\w*'

  # Genuine exceptions, by path. Empty by intent: every entry here is a second implementation of a
  # record the platform has agreed has one, so an addition is a design decision and should read like
  # one in review.
  allowlist: []

# ---------------------------------------------------------------------------------------------
# Redaction. Matched case-insensitively against the field key, recursively to `max_depth`, on
# every path into the logger including the shared middleware.
#
# `drop` is a distinct class from `mask` and it is new in schema v1. The standard has always
# said "do not log JWT payloads, secrets, or credentials at any log level" and nothing enforced
# it. Masking would not have been enough if it had: a masked token is still a credential
# fragment in a store with a long retention, and still an audit finding.
# ---------------------------------------------------------------------------------------------
redaction:
  max_depth: 4
  non_string_placeholder: "[redacted]"

  mask:
    email: [email, user_email, admin_email, customer_email, recipient]
    phone: [phone, phone_number, phone_numbers, phonenumber, from_phone, to_phone, msisdn]
    path: [http_target]
    ip: [client_ip]

  # Matched by shape as well as by name, because the list above was being overtaken. A survey of
  # the keys the fleet actually logs found customer_phone, org_phone, original_phone,
  # employee_phones, identity_phones and identity_emails all reaching Loki in the clear - none of
  # them exotic, and none of them ever going to be enumerated in time. An exact-match list is a
  # list of the leaks somebody already found.
  #
  # A suffix rule has to be wrong occasionally, so the two ways it is wrong are recorded here
  # rather than argued about per incident. A boolean under a matched key passes through unchanged
  # (has_phone, has_embedded_phone: blanking them deletes an answer to protect a secret that is
  # not there), a string is masked, and a composite this cannot see into is replaced wholesale.
  mask_suffix:
    email: [_email, _emails]
    phone: [_phone, _phones]

  # Keys that end in a masked suffix but do not hold the value. org_id_from_phone is an org id
  # looked up BY a number: masking it would cost a join without hiding anything. phone_sid and
  # phone_number_sid need no entry - they do not end in a masked suffix, so they never match.
  never_mask_suffix: [org_id_from_phone]

  # `name` is deliberately absent. On this platform the overwhelming majority of name-suffixed
  # keys are service_name, event_name, table_name, file_name; masking them would destroy non-PII
  # data on every line to catch a rare case. Person names belong under actor_name, which the
  # registry excludes outright - the correct handling of a display name is not to log it.
  never_mask: [name, service_name, event_name, table_name, file_name, field_name, column_name]

  drop:
    - password
    - passwd
    - secret
    - client_secret
    - token
    - access_token
    - refresh_token
    - id_token
    - jwt
    - api_key
    - apikey
    - authorization
    - cookie
    - set_cookie
    - private_key
    - session_id
    - otp
    - pin
    - card_number
    - cvv

# ---------------------------------------------------------------------------------------------
# Loki. Derived views of the `fields` registry above - never edited independently of it.
# ---------------------------------------------------------------------------------------------
loki:
  # Every distinct label-value combination is a stream, and Loki's default ceiling is 15 index
  # labels. Five bounded, long-lived labels that describe the ORIGIN of a record.
  # Storage floor for the tiering below. Structured metadata lives in chunk format V4, which Loki
  # uses only at schema v13 on the tsdb store. Below this floor the middle tier does not exist and
  # every high-cardinality join key has to be either an index label or body text. Recorded here so
  # a deployment that cannot meet it fails a check rather than silently getting a worse schema.
  requires:
    loki_version: ">=3.0.0"
    schema: v13
    store: tsdb
    allow_structured_metadata: true

  index_labels: [cluster, environment, namespace, service_name, container]

  # Closed allowlist. Loki enforces per-line structured-metadata size and count limits, so
  # promoting everything reintroduces at ingest exactly the cost the tiering exists to avoid.
  structured_metadata:
    from_log_line: [level, schema_version, event_name, event_type, trace_id, span_id, correlation_id,
                    request_id, org_id, error_code, security_event_type, security_outcome]

    # Collector-derived rather than read from the line. Each one arrives as a label by default --
    # from Kubernetes discovery for pod/node, from the CRI envelope for stream -- and each is
    # demoted here instead. `pod` is the reason this list exists: as a label it is one stream per
    # pod, replaced on every rollout.
    from_kubernetes: [pod, node, stream]

  ingest:
    # Reversal of the platform's earlier "do not parse JSON at ingest" position, safe only
    # because the schema and ADR-0101 together eliminated non-JSON lines - including the
    # startup-failure lines stdlib `log` used to write to stderr.
    parse_json: true
    # A malformed line during an incident is evidence. A pipeline that discards it to protect a
    # schema has inverted its purpose.
    drop_malformed: false
    # Promotion is a copy, not a move: the record stays self-describing when exported or replayed.
    keep_promoted_fields_in_body: true

# ---------------------------------------------------------------------------------------------
# DOC-0025 allowlist: the only files permitted to state a normative logging rule. Everything
# else - service-layout-standard, ARCH rule doc comments, every foundation.go, every
# docs/operations/LOGGING_REFERENCE.md - cites and does not restate.
#
# The failure this replaces was not a wrong rule. It was the same rule written in six places,
# two of which had drifted into being false.
# ---------------------------------------------------------------------------------------------
normative_homes:
  - docs/core-docs/standards/observability/log-schema-standard.md
  - docs/core-docs/adrs/ADR-0101-canonical-service-logger.md
  - docs/core-docs/adrs/ADR-0104-log-record-kind-catalogue.md
  - ci-workflows/controls/log-schema.yaml
