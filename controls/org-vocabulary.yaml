# Org-versus-tenant vocabulary control catalog (declarative policy-as-code).
#
# The policy this encodes: "Org" is the canonical scope term (org_id); "tenant" 
# is a synonym retained only in historical text and is being normalized to "org".
# This is documented in docs/core-docs/standards/architecture/data-scope-classification-standard.md
# but nothing enforced it until now - "tenant" kept reappearing in new code and docs.
#
# What this catalog is, and is not. It is the single source of WHICH vocabulary
# deviations are allowed, and WHICH exceptions are sanctioned with documented reasons. 
# It does not describe detection: each control's `detector` key binds it to an 
# implementation in scripts/check-org-vocabulary.py and that implementation may 
# evolve without a change here.
#
# Control IDs (ORG-NNNN) are STABLE and permanent. Never rename or recycle an
# ID: retire a control by setting `status`, change intent by adding a new ID.
#
# Schema (validated by the checker):
#   required per control: id, title, owner, scope, status, severity, stage,
#                         policy, rationale, remediation, detector, refs
#   severity: critical | major | minor
#   stage:    enforce | warn | observe
#             enforce -> a finding fails CI
#             warn    -> a finding is a ::warning:: and does not fail CI
#             observe -> counted in the summary only
#
# Harness exclusion note: the checker excludes its own checkout dynamically
# via REPO_ROOT (wherever scripts/check-org-vocabulary.py lives). That
# computed path is not listed in `scan.skip_dirs` here because a hardcoded
# name rots the moment the job is renamed. See excluded_paths() in the script.

version: 1
domain: org-vocabulary-policy
policy_ssot:
  - docs/core-docs/standards/architecture/data-scope-classification-standard.md

# ---------------------------------------------------------------------------
# Allowed exceptions: the declared deviations with documented reasons
# ---------------------------------------------------------------------------
# Every occurrence of "tenant" must be either fixed or explicitly declared here
# with a stated reason. Default is failure. This follows the same pattern as
# the UUID version policy gate: canonical choice required everywhere, deviation
# possible but never silent or accidental.
#
# Scope note: paths are matched against files relative to the CALLER's repo
# root, not this checkout. Exceptions that were meant to cover only this repo's
# own files (fixtures/, controls/, scripts/) are excluded here because the
# harness checkout is excluded by code (see above), and broad globs like
# "fixtures/**" or "**/log-schema.yaml" would instead punch holes in the guard
# for all 121 caller repositories.

exceptions:
  # ADR filenames and titles (immutable published records - applies to callers too)
  - path: "**/ADR-0020-multi-tenant-isolation.md"
    reason: "ADR filename is an immutable published record; the word 'tenant' is baked into the slug"

  # Architectural prose where "multi-tenancy" is the concept name, not the entity synonym.
  # "Multi-tenancy" (the SaaS isolation pattern) is distinct from "tenant" as a synonym
  # for "org". Callers legitimately document the former. Applies to both caller and our docs.
  - path: "docs/**/*.md"
    pattern: "multi-tenant|multi-tenancy"
    reason: >-
      Architectural documentation discussing multi-tenancy as a design pattern.
      The word combination 'multi-tenant/multi-tenancy' names a concept, not
      the org-scoped entity; no substitution exists.

  # Generated protobuf code (applies to callers): imported contracts may contain
  # legacy field names that cannot be changed unilaterally.
  - path: "**/*.pb.go"
    reason: "Generated code from protobuf definitions; field names are protocol contracts"

  # This repo's own policy file and test script. Only matched when scanning
  # ci-workflows itself (self-test / developer run); the harness exclusion
  # prevents these from being scanned when checking a caller's repo.
  - path: "**/org-vocabulary.yaml"
    reason: "Policy file that documents the 'tenant' vocabulary standard by name"
  - path: "scripts/check-org-vocabulary.py"
    reason: "The org vocabulary checker implementation and its documentation"
  - path: "scripts/test_org_vocabulary.py"
    reason: "Test file containing deliberate violations to test the guard"
  # A named fixture path rather than "fixtures/**". The broad glob would punch a
  # hole in the guard for any of the 121 callers that happens to have a
  # fixtures/ directory of its own; this one exists nowhere but here.
  - path: "fixtures/uuid-policy-violating/**"
    reason: "Deliberately-violating fixture for the UUID policy gate; its TenantSlugID is the subject of that test, not fleet code"

# ---------------------------------------------------------------------------
# Scan scope
# ---------------------------------------------------------------------------
scan:
  # Standard build-output and vendored directories; the harness checkout itself
  # is excluded dynamically in code (not by a name here - see note above).
  skip_dirs: [vendor, node_modules, testdata, .git, dist, build, .terraform]
  # Include test files - vocabulary should be consistent everywhere
  skip_test_files: false

controls:
  - id: ORG-0001
    title: Use "org" instead of "tenant" in all code and documentation
    owner: platform-architecture
    scope: source
    status: active
    severity: major
    # warn, not enforce, and not yet promotable. Measured 2026-08-12: 10 of 10
    # sampled repositories fail, core-docs alone citing ~578 lines - the true
    # count is the whole fleet, not the 15-25 repos first estimated. Enforcing a
    # gate every repository fails is how the stray-.sql outage happened; this one
    # would have been worse, because it was also wired into `artifact`'s needs and
    # so would have blocked deploys rather than only reporting.
    #
    # Promote to enforce only once a measured run reports zero findings fleet-wide.
    # Note that may never be reachable for `scope: source` as written: this control
    # flags prose as well as identifiers, and core-docs legitimately documents
    # "tenant" as the legacy synonym it is normalizing away - so the standard that
    # defines the rule is itself unfixable under it. Narrowing scope to identifiers
    # is the likelier route to enforcement than exempting hundreds of lines.
    stage: warn
    policy: >-
      All occurrences of "tenant" in code, comments, and documentation MUST be
      replaced with "org" unless explicitly listed in the exceptions section
      with a documented reason. This enforces the canonical vocabulary defined
      in the data scope classification standard.
    rationale: >-
      The platform has standardized on "org" as the canonical scope term, with
      "tenant" being a historical synonym that creates confusion and inconsistency.
      Without enforcement, "tenant" keeps reappearing in new code despite the
      documented standard, requiring manual correction. Machine enforcement
      ensures the convention is consistently followed across all repositories.
    remediation: >-
      Replace "tenant" with "org" in variable names, function names, comments,
      and documentation. If there is a legitimate reason to keep "tenant" in
      a specific location, add it to the exceptions list in this policy file
      with a clear reason.
    detector: tenant_usage_check
    refs: [docs/core-docs/standards/architecture/data-scope-classification-standard.md]

  - id: ORG-0002
    title: No identifier may be named after the legacy scope term
    owner: platform-architecture
    scope: identifiers
    status: active
    severity: major
    # warn, and the note above ORG-0001 explains why a second control exists at
    # all: ORG-0001 reads prose, so the standard that DEFINES "tenant" as legacy
    # violates it by describing what it deprecates, and no amount of exception
    # writing fixes that. This one reads declarations, so it has a reachable
    # zero - and the fleet is nearly at it.
    #
    # MEASURED 2026-08-12 by running this detector over all 120 repositories
    # that have an origin/main, against origin/main rather than the working
    # tree - because enforcement judges what was pushed, and a workstation
    # measurement flatters itself with local fixes nobody else can see.
    #
    #   12 findings, in 3 repositories:
    #     frontend-core           4  tenantBrandName   (TypeScript field)
    #     inboxxhq-web-workspace  4  tenantBrandName   (TypeScript field)
    #     core-docs               4  TENANT_OWNED, tenant_owned()  (Python)
    #   117 repositories: zero.
    #
    # Hand-written Go is at zero, remote included. `resolveTenant` became
    # `resolveOrg` in platform-bff and the authz seed step `tenant_role_bindings`
    # became `org_role_bindings`.
    #
    # ON THE UNPUSHED COMMITS, because the answer is not the expected one. The
    # identifier renames sitting unpushed in platform-bff, inboxxhq-authz-service
    # and authz-core-postgres do NOT block this control: all three already report
    # zero against origin/main. What remained on their remotes was
    # `"tenant_role_bindings"` as a STRING literal and as a comment, and this
    # control reads neither. They still matter to ORG-0001, which reads both.
    #
    # SO THE OBSTACLE IS NOT DELIVERY, IT IS THREE UNFIXED DECLARATIONS. To
    # promote: rename tenantBrandName -> orgBrandName in frontend-core and
    # inboxxhq-web-workspace, and TENANT_OWNED / tenant_owned() -> ORG_OWNED /
    # org_owned() in core-docs, then re-run the measurement above against
    # origin/main. Twelve call sites in three repositories; small enough that
    # `warn` here is a scheduling decision rather than an admission.
    #
    # DELIBERATE SCOPE LIMIT, recorded so its absence is not read as an
    # oversight: only the LEADING word is matched, so `resolveTenant` and
    # `crossTenant` do not fire. Widening to a trailing word was measured too -
    # it adds exactly one site fleet-wide, `crossTenant` in a billing test - and
    # it is the shape most likely to catch `isMultiTenant`, which names the
    # architectural pattern this catalog's exceptions already protect in prose.
    # Not worth widening an enforceable control to reach one local variable.
    stage: warn
    policy: >-
      No identifier - field, type, function, constant, variable, column, or
      configuration key - may take the legacy scope term as its leading word,
      in any of snake_case, lowerCamelCase, UpperCamelCase or
      SCREAMING_SNAKE_CASE. Prose, comments and string literals are out of
      scope here; ORG-0001 covers those.
    rationale: >-
      An identifier is a structural commitment in a way that a sentence is not.
      A field called TenantID appears in the wire contract, the database column,
      the log record and the client SDK, and every consumer of those inherits
      the vocabulary; a paragraph that mentions the word costs a reader one
      moment of ambiguity. Separating the two is what makes an enforceable rule
      possible: the identifier count has a reachable zero, and the prose count
      does not, because the standard defining the term as legacy must use it.
    remediation: >-
      Rename the identifier so its leading word is 'org' - tenant_id becomes
      org_id, TenantID becomes OrgID, tenantBrandName becomes orgBrandName. For
      a database column or a published contract field, rename behind a
      migration and a contract version rather than in place. Generated code is
      exempt where the generator's input is a protocol contract; fix the
      contract, not the output.
    detector: tenant_identifier_check
    refs: [docs/core-docs/standards/architecture/data-scope-classification-standard.md]
