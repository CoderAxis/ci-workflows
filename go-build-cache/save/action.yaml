name: Go build cache (save)
description: >-
  Trim the Go build cache to what this run used and save it, on a push to the default branch on a
  GitHub-hosted runner. Pair with go-build-cache/restore; see that action for the design.

# ONLY PUSHES TO THE DEFAULT BRANCH SAVE. A pull request reads the default branch's entries but
# never writes one. That keeps code that has not been reviewed out of every later run's cache,
# and keeps per-PR entries (each a gigabyte or more) from evicting the default branch's within
# GitHub's 10 GB per repository.
#
# NOTHING HERE FAILS A JOB. It runs after the lane's real work has passed, so every problem ends
# in "not saved" with a warning: the next run compiles more, which is the state before this
# action existed.

inputs:
  lane:
    description: "The same lane name given to go-build-cache/restore."
    required: true
  key:
    description: "go-build-cache/restore's `key` output."
    required: true

runs:
  using: composite
  steps:
    - name: Keep only what this run used
      id: trim
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        KEY: ${{ inputs.key }}
        ENVIRONMENT: ${{ runner.environment }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Room for the archive beside the directory while it is written, plus the runner's own.
        HEADROOM_BYTES: "2147483648"
      run: |
        set +e -uo pipefail
        gib() { awk -v b="$1" 'BEGIN { printf "%.2f GiB", b / 1073741824 }'; }
        out() { echo "$1" >> "${GITHUB_OUTPUT}"; }

        if [[ "${ENVIRONMENT}" != "github-hosted" ]]; then
          echo "self-hosted runner: GOCACHE is node-local here, nothing to save"; out save=false; exit 0
        fi
        if [[ "${EVENT}" != "push" || -z "${DEFAULT_BRANCH}" || "${REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
          echo "not a push to the default branch: this run reads the cache but does not write it"; out save=false; exit 0
        fi
        if [[ -z "${KEY}" ]]; then
          echo "::warning::no cache key from go-build-cache/restore; not saving"; out save=false; exit 0
        fi
        dir="$(go env GOCACHE 2>/dev/null)"
        marker="${RUNNER_TEMP}/go-build-cache-${LANE}.epoch"
        if [[ -z "${dir}" || ! -d "${dir}" || ! -f "${marker}" ]]; then
          echo "::warning::GOCACHE '${dir}' or the restore marker is missing; not saving"; out save=false; exit 0
        fi

        before="$(du -sb "${dir}" | cut -f1)"
        find "${dir}" -type f ! -newer "${marker}" -delete
        find "${dir}" -mindepth 1 -type d -empty -delete
        after="$(du -sb "${dir}" | cut -f1)"
        free="$(df -B1 --output=avail "${RUNNER_TEMP}" | tail -n 1 | tr -d ' ')"
        echo "GOCACHE ${dir}: $(gib "${before:-0}") before trimming, $(gib "${after:-0}") used by this run; $(gib "${free:-0}") free"

        if [[ "${after}" =~ ^[0-9]+$ && "${free}" =~ ^[0-9]+$ ]] && (( free >= after + HEADROOM_BYTES )); then
          out save=true
          out "dir=${dir}"
        else
          echo "::warning::not saving the Go build cache: $(gib "${after:-0}") with $(gib "${free:-0}") free. The lane result stands."
          out save=false
        fi

    - name: Save the Go build cache
      if: steps.trim.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.trim.outputs.dir }}
        key: ${{ inputs.key }}
