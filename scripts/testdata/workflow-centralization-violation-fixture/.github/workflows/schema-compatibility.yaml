# WFC-001 violation fixture: shares its filename with a published reusable workflow but implements
# the steps itself instead of calling it. This is the exact drift the control exists to catch — the
# repo keeps passing while the central version moves on, so it silently runs an older policy than
# the fleet believes it runs.
#
# Kept deliberately minimal: the point is the ABSENCE of a call to the central workflow, not
# whatever these steps do.
name: Schema Compatibility

on:
  pull_request: {}

jobs:
  schema-compatibility:
    runs-on: ubuntu-latest
    steps:
      - run: echo "bespoke local reimplementation of a centrally published workflow"
